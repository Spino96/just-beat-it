            <span><span class="mb-dot" style="background:var(--accent-3);"></span>Grassi <b id="rcGrassi">${fmt1(p.grassi)}g</b></span>
          </div>
          <p style="font-size:13px;color:var(--text-dim);font-weight:700;margin:0 0 16px;" id="rcKcal">${fmt1(p.kcal)} kcal totali</p>
          ${p.ricettaId?`<button class="btn small secondary" style="width:100%;margin-bottom:10px;" onclick="setRoute({name:'ricetta-editor', id:'${p.ricettaId}'})">✏️ Modifica ricetta e ingredienti</button>`:''}
          <button class="btn" style="margin-top:16px;" onclick="confermaAggiungiAlimento()">+ Aggiungi e cerca un altro</button>
          <button class="btn small secondary" style="width:100%;margin-top:10px;" onclick="ricercaAlimentoState.selezionato=null;renderCercaAlimento()">← Torna alla ricerca senza aggiungere</button>
        </div>`;
      return;
    }

    const g = s.grammi || 0;
    const fattore = g/100;
    const prot = fmt1(p.prot100*fattore);
    const carb = fmt1(p.carb100*fattore);
    // Kcal ricalcolate dai macro (kcalDaMacro), non dalla kcal dichiarata
    // dall'alimento: coerente col totale del giorno, che ora fa lo stesso.
    const kcal = fmt1(kcalDaMacro(p.prot100*fattore, p.carb100*fattore, p.grassi100*fattore, (p.polio100||0)*fattore));
    const grassi = fmt1(p.grassi100*fattore);
    const polioDet = fmt1((p.polio100||0)*fattore);
    view.innerHTML = `
      <div class="card">
        <h3 style="margin-top:0;">${p.nome}</h3>
        ${p.marca?`<p style="color:var(--text-dim);font-size:12.5px;margin:0 0 14px;">${p.marca}</p>`:''}
        <div class="field">
          <label>In quale pasto lo aggiungi?</label>
          <div class="chip-select">${pastoChipsHtml}</div>
        </div>
        <div class="field">
          <label>Fonte principale</label>
          <div class="chip-select">${fonteChipsHtml}</div>
        </div>
        <div class="field">
          <label>Quantità (grammi)</label>
          <input type="number" min="1" id="foodGrammiInput" value="${g}" oninput="aggiornaAnteprimaGrammi()">
        </div>
        <div class="meal-macro-mini" style="margin-bottom:16px;">
          <span><span class="mb-dot" style="background:var(--accent);"></span>Prot. <b id="fpProt">${prot}g</b></span>
          <span><span class="mb-dot" style="background:var(--accent-2);"></span>Carb. <b id="fpCarb">${carb}g</b></span>
          <span><span class="mb-dot" style="background:var(--accent-3);"></span>Grassi <b id="fpGrassi">${grassi}g</b></span>
        </div>
        <p class="field-hint" id="fpPolioLine" style="margin:-8px 0 12px;${(p.polio100||0)>0?'':'display:none;'}">di cui polialcoli: <b id="fpPolio">${polioDet}g</b> (2,6 kcal/g)</p>
        <p style="font-size:13px;color:var(--text-dim);font-weight:700;margin:0 0 16px;" id="fpKcalLine">${kcal} kcal totali per ${g}g</p>
        <button class="toggle-guide" onclick="toggleMicroSearch()">💧🧪 Vitamine, minerali e acqua ▾</button>
        <div class="guide-body" id="micro-search-box">${microGridHtmlDaOFF(p.micro100||{}, p.acqua100, fattore)}</div>
        <button class="btn" style="margin-top:16px;" onclick="confermaAggiungiAlimento()">+ Aggiungi e cerca un altro</button>
        <button class="btn small secondary" style="width:100%;margin-top:10px;" onclick="ricercaAlimentoState.selezionato=null;renderCercaAlimento()">← Torna alla ricerca senza aggiungere</button>
      </div>`;
    return;
  }

  let risultatiHtml = '';
  if(s.loading){
    risultatiHtml = spinnerHtml('Cerco...');
  } else if(s.errore){
    risultatiHtml = `<p class="empty"><span class="empty-icon">⚠️</span>${s.errore}</p>`;
  } else if(s.risultati.length){
    risultatiHtml = s.risultati.map((p,i)=>{
      const sottotitolo = p.marca ? p.marca : (p.fonte==='usda' ? 'USDA · nome in inglese' : '');
      const delay = Math.min(i*0.045, 0.34).toFixed(3);
      return `
      <div class="food-search-item food-result-anim" style="animation-delay:${delay}s" onclick="selezionaAlimentoRicerca(${i})">
        <div class="fsi-info">
          <div class="fsi-n">${p.nome}</div>
          ${sottotitolo?`<div class="fsi-brand">${sottotitolo}</div>`:''}
        </div>
        <div class="fsi-kcal">${p.kcal100} kcal<br><span style="color:var(--text-dim);font-weight:600;">/100g</span></div>
      </div>`;
    }).join('');
  } else if(s.query){
    risultatiHtml = `<p class="empty"><span class="empty-icon">🔍</span>Nessun risultato per "${s.query}". Prova con un nome più semplice o generico.</p>`;
  }

  // Alimenti salvati per riuso rapido: personalizzati + più usati di recente,
  // in un'unica lista (non più raggruppata per macro-categoria — sapere se
  // un alimento è "carboidrato" o "proteina" non è come si pensa a un cibo
  // già mangiato, e costringeva a cercare nel gruppo sbagliato). Personalizzati
  // prima perché più intenzionali, poi i recenti. Questa schermata si apre
  // proprio "mentre aggiungo" un alimento a un pasto specifico (da
  // "+ Aggiungi a [pasto]"), quindi qui è dove ha senso la scorciatoia.
  //
  // Non più una lista fissa sempre visibile (era un muro di testo appena
  // apri la ricerca): gli alimenti già salvati restano "in memoria" — si
  // aggiungono da soli quando li usi (registraAlimentoRecente) — ma si
  // vedono solo quando li cerchi per nome/marca/iniziali (vedi
  // alimentoCorrispondeRicerca), non prima. A riposo (query vuota) questa
  // sezione non compare affatto.
  const recenti = (profiloUtente && profiloUtente.alimentiRecenti) || [];
  const personalizzati = cache.alimentiPersonalizzati || [];
  const tuttiSalvati = [
    ...personalizzati.map((p,i)=> ({ p, tipo:'personalizzato', idx:i })),
    ...recenti.map((p,i)=> ({ p, tipo:'recente', idx:i })),
  ];
  const quickAddItems = s.query
    ? tuttiSalvati.filter(it => alimentoCorrispondeRicerca(it.p, s.query))
    : [];
  const quickAddRowsHtml = quickAddItems.map(it=>{
    const p = it.p, i = it.idx;
    const usiLabel = it.tipo==='recente' && p.usoCount>1 ? ` · usato ${p.usoCount}×` : '';
    const sottotitolo = it.tipo==='personalizzato' ? 'Personalizzato' : ((p.marca||'')+usiLabel);
    const clickFn = it.tipo==='personalizzato' ? `selezionaAlimentoPersonalizzato(${i})` : `selezionaAlimentoRecente(${i})`;
    const removeFn = it.tipo==='personalizzato' ? `eliminaAlimentoPersonalizzato('${p.id}')` : `rimuoviAlimentoRecente(${i})`;
    return `<div class="qa-row food-result-anim">
      <div class="qa-info" onclick="${clickFn}">
        <div class="qa-name">${p.nome}</div>
        ${sottotitolo?`<div class="qa-sub">${sottotitolo}</div>`:''}
      </div>
      <div class="qa-kcal" onclick="${clickFn}">${p.kcal100}<span class="u"> kcal/100g</span></div>
      <button class="qa-remove" onclick="event.stopPropagation();${removeFn}" aria-label="Rimuovi dagli alimenti più usati">✕</button>
    </div>`;
  }).join('');
  const quickAddHtml = quickAddItems.length ? `<div class="diet-info-card food-result-anim">
      <div class="dic-t"><span class="dic-t-badge">📌</span> Già segnato da te</div>
      <div class="dic-b" style="margin-bottom:4px;">Corrisponde a "${s.query}" tra i tuoi alimenti salvati: macro già pronti, senza ripescarli online.</div>
      ${quickAddRowsHtml}
    </div>` : '';

  // Ricette/piatti fissi: mostrate a parte dagli alimenti perché non si
  // pesano — un tocco le apre già pronte con i loro macro, senza chiedere
  // grammi (vedi selezionaRicettaPersonalizzata). A differenza degli
  // alimenti sopra, questa lista resta visibile anche a riposo (sono poche
  // per natura — piatti fissi che ti sei creato apposta — non un muro di
  // testo): quando si cerca qualcosa si filtra sul testo digitato, altrimenti
  // le mostra tutte.
  const ricette = s.query
    ? (cache.ricettePersonalizzate || []).filter(r => alimentoCorrispondeRicerca(r, s.query))
    : (cache.ricettePersonalizzate || []);
  const ricetteHtml = ricette.length ? `<div class="diet-info-card food-result-anim">
      <div class="dic-t"><span class="dic-t-badge">🍲</span> Le mie ricette</div>
      <div class="dic-b" style="margin-bottom:4px;">Piatti a porzione fissa: tocca per aggiungerli col loro totale di macro, senza inserire un peso.</div>
      ${ricette.map(r=>`<div class="qa-row">
        <div class="qa-info" onclick="selezionaRicettaPersonalizzata('${r.id}')">
          <div class="qa-name">${r.nome}</div>
          <div class="qa-sub">P ${fmt1(r.prot)}g · C ${fmt1(r.carb)}g · G ${fmt1(r.grassi)}g${(r.ingredienti&&r.ingredienti.length)?` · ${r.ingredienti.length} ingredienti`:''}</div>
        </div>
        <div class="qa-kcal" onclick="selezionaRicettaPersonalizzata('${r.id}')">${fmt1(r.kcal)}<span class="u"> kcal totali</span></div>
        <button class="qa-remove" style="color:var(--text-dim);" onclick="event.stopPropagation();setRoute({name:'ricetta-editor', id:'${r.id}'})" aria-label="Modifica ricetta e ingredienti">✏️</button>
        <button class="qa-remove" onclick="event.stopPropagation();eliminaRicettaPersonalizzata('${r.id}')" aria-label="Elimina ricetta">✕</button>
      </div>`).join('')}
    </div>` : '';

  // Alimenti già aggiunti in questa visita alla ricerca: permette di
  // aggiungerne più di uno allo stesso pasto (o a pasti diversi) senza
  // uscire e rientrare in "Cerca alimento" ogni volta — confermaAggiungiAlimento
  // salva e resta qui invece di tornare subito a Dieta.
  const sessionAggiunti = s.sessionAggiunti || [];
  const sessionAggiuntiHtml = sessionAggiunti.length ? `<div class="diet-info-card" style="border-left:3px solid var(--accent);">
      <div class="dic-t">✅ Aggiunti in questa sessione (${sessionAggiunti.length})</div>
      <div class="extra-food-list">${sessionAggiunti.map(a=>`
        <div class="extra-food-item">
          <div class="efi-info">
            <div class="efi-n">${a.nome}${a.marca?` <span class="efi-brand">· ${a.marca}</span>`:''}${a.isRicetta?' <span class="efi-brand">· 🍲 ricetta</span>':''}</div>
            <div class="efi-m">${a.isRicetta?'1 porzione':`${a.grammi}g`} · ${fmt1(a.kcal)} kcal · P ${fmt1(a.prot)}g · C ${fmt1(a.carb)}g · G ${fmt1(a.grassi)}g · ${DIETA_PIANO.pasti[a.pasto] ? DIETA_PIANO.pasti[a.pasto].nome : ''}</div>
          </div>
          <div class="efi-actions">
            ${btnModificaVoce(a, null, 'renderCercaAlimento')}
            <button class="efi-remove" onclick="rimuoviAlimentoDaSessioneRicerca('${a.id}')" aria-label="Rimuovi">✕</button>
          </div>
        </div>`).join('')}</div>
    </div>` : '';

  view.innerHTML = `
    <div class="food-hero">
      <div class="food-hero-top">
        <div class="food-hero-icon">🔍</div>
        <div>
          <div class="food-hero-title">Cerca un alimento</div>
          <div class="food-hero-sub">Digita un nome per iniziare</div>
        </div>
      </div>
      <div class="food-hero-searchbar">
        <span class="fhs-icon">🔎</span>
        <input type="text" id="foodSearchInput" aria-label="Cerca un alimento" placeholder="Es. yogurt greco, pasta, mela..." value="${s.query}" oninput="onFoodSearchInputChange(this.value)" onkeydown="if(event.key==='Enter')eseguiRicercaAlimento()">
      </div>
      <button class="food-hero-cta" onclick="eseguiRicercaAlimento()">Cerca</button>
    </div>
    ${quickAddHtml}
    ${ricetteHtml}
    ${risultatiHtml}
    ${sessionAggiuntiHtml}
    <button class="btn secondary" style="width:100%;margin-bottom:14px;" onclick="setRoute({name:'crea-alimento-custom'})">➕ Crea alimento o ricetta personalizzata</button>
    <button class="btn" style="width:100%;margin-top:4px;" onclick="terminaRicercaAlimento()">✓ Fatto, torna alla Dieta${sessionAggiunti.length?` (${sessionAggiunti.length} aggiunti)`:''}</button>
  `;
  const input = document.getElementById('foodSearchInput');
  if(input) setTimeout(()=>{ input.focus(); input.setSelectionRange(input.value.length, input.value.length); }, 50);
}

function terminaRicercaAlimento(){
  ricercaAlimentoState = { query:'', loading:false, risultati:[], errore:null, selezionato:null, grammi:100, pastoIdx:null, fonte:null, sessionAggiunti:[] };
  setRoute({name:'alimentazione'});
}

/* ============ RICERCA ALIMENTI: due fonti in parallelo ============
   1) Open Food Facts, tramite il motore di ricerca "search-a-licious"
      (quello usato dal sito ufficiale OFF dal 2024: tollerante a errori di
      battitura, ranking per rilevanza+popolarità). Se non risponde come
      previsto degrada da sola sul vecchio endpoint cgi/search.pl invece di
      perdere i risultati OFF, dato che qui non possiamo testare l'endpoint
      dal vivo — meglio degradare che rompersi.
   2) USDA FoodData Central, il database ufficiale statunitense: molto
      accurato per alimenti generici (frutta, verdura, carne) oltre che per
      prodotti confezionati USA. Capisce solo nomi in inglese, quindi aiuta
      soprattutto sulle ricerche generiche o quando OFF non basta.
   I risultati delle due fonti si sommano e vengono deduplicati per nome+marca. */
const USDA_API_KEY = 'DEMO_KEY'; // gratuita, senza approvazione: https://fdc.nal.usda.gov/api-key-signup.html — DEMO_KEY funziona ma ha un limite di 30 richieste/ora, una chiave personale no
const USDA_MICRO_MAP = {
  fibre:'Fiber, total dietary', vitA:'Vitamin A, RAE', vitC:'Vitamin C, total ascorbic acid',
  vitD:'Vitamin D (D2 + D3)', vitE:'Vitamin E (alpha-tocopherol)', vitB12:'Vitamin B-12',
  folati:'Folate, total', calcio:'Calcium, Ca', ferro:'Iron, Fe', magnesio:'Magnesium, Mg',
  potassio:'Potassium, K', zinco:'Zinc, Zn', sodio:'Sodium, Na'
};

/* fetch con timeout (8 s): una rete lenta o un server che non risponde non
   deve lasciare la ricerca alimenti in "caricamento" all'infinito. */
async function fetchConTimeout(url, ms){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), ms||8000);
  try{ return await fetch(url, { signal: ctrl.signal }); }
  finally{ clearTimeout(t); }
}

function mappaProdottiOFF(lista){
  return (lista||[])
    .filter(p=>p.product_name && p.nutriments && p.nutriments['energy-kcal_100g']!=null)
    .map(p=>{
      const { micro100, acqua100 } = estraiMicroOFF(p.nutriments);
      return {
        fonte:'off',
        nome: p.product_name,
        marca: p.brands ? p.brands.split(',')[0].trim() : '',
        kcal100: Math.round(p.nutriments['energy-kcal_100g']||0),
        prot100: Math.round((p.nutriments['proteins_100g']||0)*10)/10,
        carb100: Math.round((p.nutriments['carbohydrates_100g']||0)*10)/10,
        grassi100: Math.round((p.nutriments['fat_100g']||0)*10)/10,
        polio100: Math.round(Math.min(p.nutriments['polyols_100g']||0, p.nutriments['carbohydrates_100g']||0)*10)/10,
        zuccheri100: p.nutriments['sugars_100g']!=null ? Math.round(p.nutriments['sugars_100g']*10)/10 : null,
        micro100, acqua100
      };
    });
}

async function cercaSuOpenFoodFactsLegacy(query){
  const url = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=24&sort_by=unique_scans_n&fields=product_name,brands,nutriments`;
  const res = await fetchConTimeout(url);
  if(!res.ok) throw new Error('OFF legacy http '+res.status);
  const data = await res.json();
  return mappaProdottiOFF(data.products);
}

async function cercaSuOpenFoodFacts(query){
  try{
    const url = `https://search.openfoodfacts.org/search?q=${encodeURIComponent(query)}&page_size=24&fields=product_name,brands,nutriments&sort_by=-unique_scans_n`;
    const res = await fetchConTimeout(url);
    if(!res.ok) throw new Error('search-a-licious http '+res.status);
    const data = await res.json();
    const hits = data.hits || data.products;
    if(!Array.isArray(hits)) throw new Error('formato di risposta inatteso');
    return mappaProdottiOFF(hits);
  }catch(e){
    // Degrado silenzioso sul vecchio endpoint: se anche questo fallisce,
    // l'errore risale al chiamante (Promise.allSettled in eseguiRicercaAlimento).
    return cercaSuOpenFoodFactsLegacy(query);
  }
}

// "MELE,CRUDE,CON BUCCIA" (tipico di Foundation/SR Legacy, tutto maiuscolo)
// -> "Mele,Crude,Con Buccia": più leggibile, senza toccare le voci "Branded"
// che di solito arrivano già con la capitalizzazione corretta.
function titleCaseSeTuttoMaiuscolo(s){
  if(!s) return s;
  const lettere = s.replace(/[^A-Za-zÀ-ÖØ-öø-ÿ]/g,'');
  const maiuscole = s.replace(/[^A-ZÀ-Ö]/g,'');
  if(lettere.length>3 && maiuscole.length/lettere.length>0.8){
    return s.toLowerCase().replace(/(^|[\s,\/])([a-zà-ÿ])/g, (m,p1,p2)=>p1+p2.toUpperCase());
  }
  return s;
}

async function cercaSuUSDA(query){
  if(!USDA_API_KEY) return [];
  const url = `https://api.nal.usda.gov/fdc/v1/foods/search?api_key=${USDA_API_KEY}&query=${encodeURIComponent(query)}&pageSize=15&dataType=Foundation,SR%20Legacy,Branded`;
  const res = await fetchConTimeout(url);
  if(!res.ok) throw new Error('USDA http '+res.status);
  const data = await res.json();
  return (data.foods||[]).map(f=>{
    const trovaValore = (nome, unitaAttesa) => {
      const n = (f.foodNutrients||[]).find(x=> x.nutrientName===nome && (!unitaAttesa || x.unitName===unitaAttesa));
      return (n && n.value!=null) ? n.value : null;
    };
    const kcal100 = trovaValore('Energy','KCAL');
    if(kcal100==null) return null; // scarta voci senza kcal, come già facciamo per OFF
    const micro100 = {};
    Object.keys(USDA_MICRO_MAP).forEach(k=>{ micro100[k] = trovaValore(USDA_MICRO_MAP[k]); });
    return {
      fonte:'usda',
      nome: titleCaseSeTuttoMaiuscolo(f.description),
      marca: f.brandOwner || '',
      kcal100: Math.round(kcal100),
      prot100: Math.round((trovaValore('Protein')||0)*10)/10,
      carb100: Math.round((trovaValore('Carbohydrate, by difference')||0)*10)/10,
      grassi100: Math.round((trovaValore('Total lipid (fat)')||0)*10)/10,
      micro100, acqua100: trovaValore('Water')
    };
  }).filter(Boolean);
}

// Unisce i risultati delle due fonti evitando doppioni ovvi (stesso nome+marca).
function dedupRisultatiAlimenti(lista){
  const visti = new Set();
  return lista.filter(p=>{
    const chiave = (p.nome+'|'+(p.marca||'')).toLowerCase().trim();
    if(visti.has(chiave)) return false;
    visti.add(chiave);
    return true;
  });
}

// Un alimento già salvato (personalizzato, recente o ricetta) "corrisponde"
// alla ricerca se il testo digitato compare nel nome o nella marca, oppure
// se combacia con le iniziali delle parole del nome (es. "ppr" trova "Pane
// Pugliese Rustico") — così cercando qualcosa che hai già segnato lo trovi
// anche solo con un pezzo di nome o una sigla, non serve ricordare l'esatta
// dicitura.
function alimentoCorrispondeRicerca(item, query){
  const q = (query||'').toLowerCase().trim();
  if(!q) return false;
  const nome = (item.nome||'').toLowerCase();
  const marca = (item.marca||'').toLowerCase();
  if((nome+' '+marca).includes(q)) return true;
  const iniziali = nome.split(/\s+/).filter(Boolean).map(w=>w[0]).join('');
  return iniziali.includes(q);
}

// Se il campo viene svuotato del tutto (es. selezioni tutto e cancelli),
// azzera subito la ricerca invece di lasciare la schermata bloccata sui
// risultati (o sul "nessun risultato") di prima: era il bug per cui,
// cancellando il testo cercato, non si riusciva più a cercare altro.
function onFoodSearchInputChange(val){
  if(val.trim()!=='') return;
  if(!ricercaAlimentoState.query && !ricercaAlimentoState.risultati.length && !ricercaAlimentoState.errore) return;
  ricercaAlimentoState.query = '';
  ricercaAlimentoState.risultati = [];
  ricercaAlimentoState.errore = null;
  ricercaAlimentoState.loading = false;
  renderCercaAlimento();
}

async function eseguiRicercaAlimento(){
  const input = document.getElementById('foodSearchInput');
  const query = input ? input.value.trim() : '';
  if(!query){
    // Stessa situazione di onFoodSearchInputChange: campo vuoto e si preme
    // comunque "Cerca" o Invio, azzeriamo invece di non fare nulla.
    ricercaAlimentoState.query = '';
    ricercaAlimentoState.risultati = [];
    ricercaAlimentoState.errore = null;
    ricercaAlimentoState.loading = false;
    renderCercaAlimento();
    return;
  }
  ricercaAlimentoState.query = query;
  ricercaAlimentoState.loading = true;
  ricercaAlimentoState.errore = null;
  ricercaAlimentoState.risultati = [];
  renderCercaAlimento();

  const [off, usda] = await Promise.allSettled([
    cercaSuOpenFoodFacts(query),
    cercaSuUSDA(query)
  ]);

  if(off.status==='rejected' && usda.status==='rejected'){
    ricercaAlimentoState.errore = 'Ricerca non riuscita: controlla la connessione e riprova.';
  } else {
    const risultatiOFF = off.status==='fulfilled' ? off.value : [];
    const risultatiUSDA = usda.status==='fulfilled' ? usda.value : [];
    ricercaAlimentoState.risultati = dedupRisultatiAlimenti([...risultatiOFF, ...risultatiUSDA]).slice(0,40);
  }
  ricercaAlimentoState.loading = false;
  renderCercaAlimento();
}

/* Indovina in quale pasto della giornata si sta probabilmente per inserire
   l'alimento extra, in base all'ora attuale — così la domanda "che pasto è?"
   parte quasi sempre già sul valore giusto e basta confermare, invece di
   dover scegliere ogni volta da zero (come i pre-set orari di MyFitnessPal/
   Yazio). Resta comunque modificabile con un tap prima di salvare. */
function pastoSuggeritoOra(){
  const FASCE = [7.5, 10.5, 14, 16.5, 20.5]; // ora indicativa di colazione/spuntino mattina/pranzo/spuntino pomeridiano/cena (piano v6)
  const ora = new Date();
  const h = ora.getHours() + ora.getMinutes()/60;
  let best = 0, bestDist = Infinity;
  FASCE.forEach((r,i)=>{
    const d = Math.abs(h-r);
    if(d < bestDist){ bestDist = d; best = i; }
  });
  return best;
}

async function salvaAlimentoCustom(){
  const nome = document.getElementById('caNome').value.trim();
  const errBox = document.getElementById('caError');
  const btn = document.getElementById('salvaAlimentoCustomBtn');
  errBox.innerHTML = '';

  const prot = Number(document.getElementById('caProt').value);
  const carb = Number(document.getElementById('caCarb').value);
  const grassi = Number(document.getElementById('caGrassi').value);
  const fibreRaw = document.getElementById('caFibre').value;
  const fibre = fibreRaw ? Number(fibreRaw) : null;
  const zucRaw = document.getElementById('caZuc').value, polioRaw = document.getElementById('caPolio').value;
  const zuccheri = zucRaw ? Number(zucRaw) : null;
  const polio = polioRaw ? Number(polioRaw) : 0;

  if(!nome){ errBox.innerHTML = '<div class="error-banner">Dai un nome all\'alimento.</div>'; return; }
  if([prot,carb,grassi,polio].some(v=> isNaN(v) || v<0) || (zuccheri!=null && (isNaN(zuccheri) || zuccheri<0))){
    errBox.innerHTML = '<div class="error-banner">Controlla i valori numerici inseriti.</div>';
    return;
  }
  if(polio > carb || (zuccheri||0) + polio > carb + 0.05){
    errBox.innerHTML = '<div class="error-banner">Zuccheri e polialcoli sono "di cui" dei carboidrati: insieme non possono superarli.</div>';
    return;
  }
  if(!creaAlimentoFonte){
    errBox.innerHTML = '<div class="error-banner">Scegli la fonte principale (Carboidrati, Proteine o Grassi).</div>';
    return;
  }

  btn.disabled = true; btn.textContent = 'Salvataggio...';

  if(creaAlimentoTipo==='ricetta'){
    try{
      const payload = {
        nome,
        // Kcal ricalcolate dai macro (kcalDaMacro), coerenti col resto
        // dell'app: non si chiede un valore kcal separato da inserire.
        kcal: kcalDaMacro(prot, carb, grassi, polio),
        prot, carb, grassi, fibre, polio, zuccheri,
        fonte: creaAlimentoFonte, creato: new Date().toISOString()
      };
      const ref = await aggiungiDocRapido(userCollection('ricettePersonalizzate'), payload);
      cache.ricettePersonalizzate.push({ id: ref.id, ...payload });
      ricettaEd = null;
      // Appena salvata, si aprono gli ingredienti per completarla.
      setRoute({name:'ricetta-editor', id: ref.id});
    }catch(e){
      errBox.innerHTML = `<div class="error-banner">${e.message}</div>`;
      btn.disabled = false; btn.textContent = 'Salva';
    }
    return;
  }

  let kcal100, prot100, carb100, grassi100, fibre100, polio100, zuccheri100;
  if(creaAlimentoModalita==='porzione'){
    const peso = Number(document.getElementById('caPeso').value);
    if(isNaN(peso) || peso<=0){
      errBox.innerHTML = '<div class="error-banner">Inserisci il peso totale della porzione (in grammi).</div>';
      btn.disabled = false; btn.textContent = 'Salva';
      return;
    }
    const fattore = 100/peso;
    prot100 = Math.round(prot*fattore*10)/10;
    carb100 = Math.round(carb*fattore*10)/10;
    grassi100 = Math.round(grassi*fattore*10)/10;
    fibre100 = fibre!=null ? Math.round(fibre*fattore*10)/10 : null;
    polio100 = Math.round(polio*fattore*10)/10;
    zuccheri100 = zuccheri!=null ? Math.round(zuccheri*fattore*10)/10 : null;
  } else {
    prot100 = prot; carb100 = carb; grassi100 = grassi; fibre100 = fibre; polio100 = polio; zuccheri100 = zuccheri;
  }
  kcal100 = kcalDaMacro(prot100, carb100, grassi100, polio100);

  try{
    const payload = { nome, kcal100, prot100, carb100, grassi100, fibre100, polio100, zuccheri100, fonte: creaAlimentoFonte, creato: new Date().toISOString() };
    const ref = await aggiungiDocRapido(userCollection('alimentiPersonalizzati'), payload);
    cache.alimentiPersonalizzati.push({ id: ref.id, ...payload });
    setRoute({name:'cerca-alimento'});
  }catch(e){
    errBox.innerHTML = `<div class="error-banner">${e.message}</div>`;
    btn.disabled = false; btn.textContent = 'Salva';
  }
}

/* Totali di una ricetta a partire dagli ingredienti (grammi x valori per
   100g). Le kcal sono sempre derivate dai macro (kcalDaMacro). */
function totaliRicettaDaIngredienti(ingredienti){
  let prot=0, carb=0, grassi=0, polio=0;
  (ingredienti||[]).forEach(i=>{
    const f = (Number(i.grammi)||0)/100;
    prot += (Number(i.prot100)||0)*f;
    carb += (Number(i.carb100)||0)*f;
    grassi += (Number(i.grassi100)||0)*f;
    polio += (Number(i.polio100)||0)*f;
  });
  prot = Math.round(prot*10)/10; carb = Math.round(carb*10)/10; grassi = Math.round(grassi*10)/10; polio = Math.round(polio*10)/10;
  return { prot, carb, grassi, polio, kcal: kcalDaMacro(prot, carb, grassi, polio) };
}

// Cambio quantità di un ingrediente al momento di aggiungere la ricetta al
// diario (solo per questa volta: la ricetta salvata non cambia).
function aggiornaGrammiIngredienteRicetta(k, val){
  const p = ricercaAlimentoState.selezionato;
  if(!p || !p.ingredienti || !p.ingredienti[k]) return;
  p.ingredienti[k].grammi = Math.max(0, Number(val)||0);
  const t = totaliRicettaDaIngredienti(p.ingredienti);
  p.prot = t.prot; p.carb = t.carb; p.grassi = t.grassi; p.polio = t.polio; p.kcal = t.kcal;
  const set = (id,txt)=>{ const el=document.getElementById(id); if(el) el.textContent = txt; };
  set('rcProt', fmt1(t.prot)+'g'); set('rcCarb', fmt1(t.carb)+'g'); set('rcGrassi', fmt1(t.grassi)+'g');
  set('rcKcal', fmt1(t.kcal)+' kcal totali');
}

/* ============ EDITOR RICETTA (ingredienti) ============
   Una ricetta può avere una lista di ingredienti (nome, grammi, macro per
   100g): i totali si calcolano da lì. Senza ingredienti restano i totali
   fissi salvati (ricette create prima di questa funzione). */

function ricettaEdInit(id){
  if(ricettaEd && ricettaEd.id===id) return;
  const r = cache.ricettePersonalizzate.find(x=>x.id===id);
  if(!r){ ricettaEd = null; return; }
  ricettaEd = {
    id, nome: r.nome, fonte: r.fonte || null,
    ingredienti: (r.ingredienti||[]).map(x=>({...x})),
    fisso: { prot:r.prot||0, carb:r.carb||0, grassi:r.grassi||0, polio:r.polio||0, kcal:r.kcal||0 },
    query:'', loading:false, risultati:[], errore:null, manuale:false, salvando:false
  };
}

function ricettaEdTotali(){
  return ricettaEd.ingredienti.length ? totaliRicettaDaIngredienti(ricettaEd.ingredienti) : ricettaEd.fisso;
}

async function ricettaEdCerca(){
  const input=document.getElementById('reCerca');
  const q = input ? input.value.trim() : '';
  ricettaEd.query = q; ricettaEd.errore=null; ricettaEd.risultati=[];
  if(!q){ renderRicettaEditor(); return; }
  ricettaEd.loading = true; renderRicettaEditor();
  const [off, usda] = await Promise.allSettled([cercaSuOpenFoodFacts(q), cercaSuUSDA(q)]);
  if(!ricettaEd || ricettaEd.query!==q || route.name!=='ricetta-editor') return;
  if(off.status==='rejected' && usda.status==='rejected') ricettaEd.errore='Ricerca non riuscita: controlla la connessione e riprova.';
  else ricettaEd.risultati = dedupRisultatiAlimenti([...(off.status==='fulfilled'?off.value:[]), ...(usda.status==='fulfilled'?usda.value:[])]).slice(0,30);
  ricettaEd.loading=false; renderRicettaEditor();
}
async function salvaRicettaEditor(){
  const e = ricettaEd; if(!e) return;
  const errBox=document.getElementById('reError'), btn=document.getElementById('reSalva');
  const nome=(e.nome||'').trim();
  if(!nome){ errBox.innerHTML='<div class="error-banner">Dai un nome alla ricetta.</div>'; return; }
  const t = ricettaEdTotali();
  const upd = { nome, fonte: e.fonte || null, ingredienti: e.ingredienti, prot:t.prot, carb:t.carb, grassi:t.grassi, polio:t.polio||0, kcal: kcalDaMacro(t.prot,t.carb,t.grassi,t.polio||0) };
  btn.disabled=true; btn.textContent='Salvataggio...';
  try{
    await attendiScrittura(userCollection('ricettePersonalizzate').doc(e.id).update(upd));
    const r = cache.ricettePersonalizzate.find(x=>x.id===e.id);
    if(r) Object.assign(r, upd);
    ricettaEd = null;
    setRoute({name:'cerca-alimento'});
  }catch(err){
    errBox.innerHTML=`<div class="error-banner">${escHtml(err.message)}</div>`;
    btn.disabled=false; btn.textContent='Salva ricetta';
  }
}

// Logica condivisa fra la schermata di ricerca completa (Cerca alimento) e
// il foglio rapido "Aggiungi di nuovo" nella tab Extra: entrambi finiscono
// per chiamare questa, così il comportamento (somma kcal, segna il pasto
// fatto, ricorda l'alimento) resta identico indipendentemente da dove parte.
// Ritorna la voce salvata: confermaAggiungiAlimento la usa per tenere
// l'elenco di ciò che è stato aggiunto in questa visita alla ricerca.
function eseguiAggiungiAlimentoExtra(p, g, pastoIdx, fonte){
  const fonteFinale = fonte || p.fonte || suggerisciFonte(p);
  let voce;
  if(p.isRicetta){
    // Ricetta a porzione fissa: macro totali già pronti, nessun peso da
    // moltiplicare. Non ha un "per 100g" da conservare per ricalcoli futuri
    // (vedi ricalcolaVoceExtraPerGrammi: senza prot100/carb100/grassi100
    // resta comunque proporzionale ai macro salvati).
    voce = {
      id: 'extra-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),
      nome: p.nome,
      marca: '',
      grammi: null,
      isRicetta: true,
      ricettaId: p.ricettaId || null,
      ingredienti: (p.ingredienti||[]).map(x=>({...x})),
      kcal: p.kcal,
      prot: p.prot,
      carb: p.carb,
      grassi: p.grassi,
      polio: p.polio||0,
      pasto: pastoIdx,
      fonte: fonteFinale
    };
  } else {
    const fattore = g/100;
    const protV = round1(p.prot100*fattore);
    const carbV = round1(p.carb100*fattore);
    const grassiV = round1(p.grassi100*fattore);
    const polioV = round1((p.polio100||0)*fattore);
    voce = {
      id: 'extra-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),
      nome: p.nome,
      marca: p.marca,
      grammi: g,
      // Kcal ricalcolate dai macro (kcalDaMacro), non dalla kcal dichiarata
      // dall'alimento: così ogni voce, sommata, torna sempre esatta col totale
      // del giorno (vedi calcolaTotaliGiorno).
      kcal: kcalDaMacro(protV, carbV, grassiV, polioV),
      prot: protV,
      carb: carbV,
      grassi: grassiV,
      polio: polioV,
      // Valori per 100g dell'alimento originale: permettono di ricalcolare con
      // precisione i macro se in seguito si modifica la quantità (vedi
      // ricalcolaVoceExtraPerGrammi), senza perdere precisione a ogni modifica.
      prot100: p.prot100,
      carb100: p.carb100,
      grassi100: p.grassi100,
      polio100: p.polio100||0,
      pasto: pastoIdx,
      fonte: fonteFinale
    };
  }
  aggiungiAlimentoExtra(voce);
  // Aggiungere un alimento extra a un pasto conta come "aver fatto" quel
  // pasto: se non era già segnato lo spuntiamo qui, con lo stesso snapshot
  // (opzione del piano attualmente selezionata) che userebbe la spunta
  // manuale — coerente col diario storico. Se il pasto era già segnato non
  // tocchiamo lo snapshot esistente.
  segnaPastoFattoDaExtra(pastoIdx);
  // Le ricette hanno già la loro lista dedicata ("Le mie ricette"): non
  // entrano anche nel tracciamento frequenza di "Aggiungi di nuovo", che è
  // pensato per gli alimenti pesati singolarmente.
  if(!p.isRicetta) registraAlimentoRecente(p, fonteFinale);
  return voce;
}

// Salva l'alimento configurato ma NON esce da "Cerca alimento": resta qui,
// pronta per un'altra ricerca, così si possono aggiungere più cibi allo
// stesso pasto (o a pasti diversi) uno via l'altro invece di dover rientrare
// da capo ogni volta. Si esce esplicitamente con "Fatto, torna alla Dieta"
// (terminaRicercaAlimento).
function confermaAggiungiAlimento(){
  const p = ricercaAlimentoState.selezionato;
  const g = ricercaAlimentoState.grammi;
  // pastoIdx dovrebbe sempre avere un valore (suggerito in base all'ora quando
  // si seleziona l'alimento), ma per sicurezza degrada su "Colazione" invece
  // di bloccare il salvataggio se per qualche motivo manca.
  const pastoIdx = ricercaAlimentoState.pastoIdx!=null ? ricercaAlimentoState.pastoIdx : 0;
  const voce = eseguiAggiungiAlimentoExtra(p, g, pastoIdx, ricercaAlimentoState.fonte);
  if(!ricercaAlimentoState.sessionAggiunti) ricercaAlimentoState.sessionAggiunti = [];
  ricercaAlimentoState.sessionAggiunti.push(voce);
  hapticaLieve();
  ricercaAlimentoState.selezionato = null;
  ricercaAlimentoState.query = '';
  ricercaAlimentoState.risultati = [];
  renderCercaAlimento();
}

/* ============ AGGIUNGI DI NUOVO (foglio rapido dalla tab Extra) ============
   Stessa logica di "Cerca alimento" ma senza cambiare schermata: pensato per
   ri-aggiungere un alimento già usato (recente o personalizzato) in pochi
   secondi, senza dover ricercare o navigare altrove. */
let extraRapidoState = null; // { p, grammi, pastoIdx }

function apriAggiungiExtraRapido(origine, idx){
  const p = origine==='recente'
    ? (profiloUtente && profiloUtente.alimentiRecenti || [])[idx]
    : (cache.alimentiPersonalizzati || [])[idx];
  if(!p) return;
  extraRapidoState = { p, grammi:100, pastoIdx: pastoSuggeritoOra(), fonte: p.fonte || suggerisciFonte(p) };
  hapticaLieve();
  mostraAggiungiExtraRapidoOverlay();
}

function mostraAggiungiExtraRapidoOverlay(){
  const st = extraRapidoState;
  if(!st) return;
  const { p, grammi, pastoIdx, fonte } = st;
  const fattore = grammi/100;
  const prot = round1(p.prot100*fattore);
  const carb = round1(p.carb100*fattore);
  const grassi = round1(p.grassi100*fattore);
  const polio = round1((p.polio100||0)*fattore);
  const kcal = kcalDaMacro(prot, carb, grassi, polio);
  const pastoChipsHtml = DIETA_PIANO.pasti.map((pp,pi)=>
    `<div class="chip${pi===pastoIdx?' active':''}" onclick="sceglieCategoriaPastoExtraRapido(${pi})">${pp.icona} ${pp.nome}</div>`
  ).join('');
  const fonteChipsHtml = FONTE_OPZIONI.map(fo=>
    `<div class="chip${fo.key===fonte?' active':''}" onclick="sceglieFonteExtraRapido('${fo.key}')">${fo.icona} ${fo.label}</div>`
  ).join('');
  let overlay = document.getElementById('extraRapidoOverlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'extraRapidoOverlay';
    overlay.className = 'sheet-overlay';
    overlay.addEventListener('click', e=>{ if(e.target===overlay) chiudiAggiungiExtraRapido(); });
    document.body.appendChild(overlay);
  }
  overlay.innerHTML = `<div class="sheet-box" id="extraRapidoBox"><div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title">${p.nome}</div>
      <button class="sheet-close" onclick="chiudiAggiungiExtraRapido()" aria-label="Chiudi">✕</button>
    </div>
    ${p.marca ? `<p class="field-hint" style="margin:-8px 0 14px;">${p.marca}</p>` : ''}
    <div class="field"><label>In quale pasto lo aggiungi?</label><div class="chip-select">${pastoChipsHtml}</div></div>
    <div class="field"><label>Fonte principale</label><div class="chip-select">${fonteChipsHtml}</div></div>
    <div class="field"><label>Quantità (grammi)</label><input type="number" min="1" id="erGrammiInput" value="${grammi}" oninput="aggiornaAnteprimaGrammiRapido()"></div>
    <div class="meal-macro-mini" style="margin-bottom:14px;">
      <span><span class="mb-dot" style="background:var(--accent);"></span>Prot. <b id="erProt">${prot}g</b></span>
      <span><span class="mb-dot" style="background:var(--accent-2);"></span>Carb. <b id="erCarb">${carb}g</b></span>
      <span><span class="mb-dot" style="background:var(--accent-3);"></span>Grassi <b id="erGrassi">${grassi}g</b></span>
    </div>
    <p class="field-hint" id="erPolioLine" style="margin:-8px 0 12px;${(p.polio100||0)>0?'':'display:none;'}">di cui polialcoli: <b id="erPolio">${polio}g</b> (2,6 kcal/g)</p>
    <p style="font-size:13px;color:var(--text-dim);font-weight:700;margin:0 0 16px;" id="erKcalLine">${kcal} kcal totali per ${grammi}g</p>
    <button class="btn" onclick="confermaAggiungiExtraRapido()">Aggiungi a oggi</button>
  </div>`;
  attachSwipeDownToDismiss(overlay.querySelector('#extraRapidoBox'), chiudiAggiungiExtraRapido);
}

  const st = extraRapidoState;

function segnaPastoFattoDaExtra(pastoIdx){
  if(pastoIdx==null || pastoIdx<0 || pastoIdx>=DIETA_PIANO.pasti.length) return;
  if(cache.dietaLogOggi.pastiFatti[pastoIdx]) return; // già segnato (piano o extra precedente): non toccare nulla
  // Il pasto non era ancora segnato: l'alimento extra SOSTITUISCE l'opzione
  // del piano per questo pasto (non si somma ad essa). Segniamo "fatto" e
  // marchiamo pastiViaExtra così il calcolo di oggi (renderAlimentazione)
  // non aggiunge anche le kcal dell'opzione del piano — le kcal reali sono
  // già contate tramite l'alimento extra stesso.
  cache.dietaLogOggi.pastiFatti[pastoIdx] = true;
  if(!cache.dietaLogOggi.pastiViaExtra) cache.dietaLogOggi.pastiViaExtra = {};
  cache.dietaLogOggi.pastiViaExtra[pastoIdx] = true;
  if(!cache.dietaLogOggi.pastiSnapshot) cache.dietaLogOggi.pastiSnapshot = {};
  cache.dietaLogOggi.pastiSnapshot[pastoIdx] = { titolo:'Sostituito con alimento extra', kcal:0, prot:0, carb:0, grassi:0, viaExtra:true };
  salvaDietaLogOggi();
}

/* Scorciatoia per i cibi che si ripetono spesso: non tiene più solo gli
   ultimi aggiunti in ordine di recenza, ma conta quante volte ciascun
   alimento (per valore/100g, non per grammatura specifica) è stato
   aggiunto (usoCount). "Aggiungi di nuovo" mostra sempre prima i più
   usati, a parità i più recenti, fino a un massimo di 12 voci — quando se
   ne aggiunge una nuova oltre il limite, cade quella meno usata/recente. */
const MAX_ALIMENTI_RECENTI = 12;
function registraAlimentoRecente(p, fonte){
  if(!profiloUtente) return;
  const chiave = a => (a.nome+'|'+(a.marca||'')).toLowerCase();
  const chiaveNuova = chiave({ nome:p.nome, marca:p.marca||'' });
  let lista = (profiloUtente.alimentiRecenti || []).slice();
  const esistente = lista.find(a=> chiave(a)===chiaveNuova);
  const fonteFinale = fonte || p.fonte || suggerisciFonte(p);
  if(esistente){
    esistente.usoCount = (esistente.usoCount||1) + 1;
    esistente.ultimoUso = Date.now();
    // Aggiorna anche i valori nutrizionali con quelli appena usati, nel caso
    // la scheda del prodotto sia cambiata nel frattempo (es. su Open Food Facts).
    esistente.kcal100 = p.kcal100; esistente.prot100 = p.prot100; esistente.carb100 = p.carb100; esistente.grassi100 = p.grassi100; esistente.polio100 = p.polio100||0; esistente.zuccheri100 = p.zuccheri100!=null?p.zuccheri100:null;
    esistente.micro100 = p.micro100||{}; esistente.acqua100 = (p.acqua100!=null?p.acqua100:null);
    esistente.fonte = fonteFinale;
  } else {
    lista.push({ nome:p.nome, marca:p.marca||'', kcal100:p.kcal100, prot100:p.prot100, carb100:p.carb100, grassi100:p.grassi100, polio100:p.polio100||0, zuccheri100:(p.zuccheri100!=null?p.zuccheri100:null), micro100:p.micro100||{}, acqua100:(p.acqua100!=null?p.acqua100:null), fonte: fonteFinale, usoCount:1, ultimoUso: Date.now() });
  }
  lista.sort((a,b)=> (b.usoCount||1)-(a.usoCount||1) || (b.ultimoUso||0)-(a.ultimoUso||0));
  lista = lista.slice(0, MAX_ALIMENTI_RECENTI);
  profiloUtente.alimentiRecenti = lista;
  db.collection('users').doc(currentUid).set({ alimentiRecenti: lista }, { merge:true }).catch(()=>{});
}

function selezionaAlimentoRecente(i){
  const p = (profiloUtente && profiloUtente.alimentiRecenti || [])[i];
  if(!p) return;
  ricercaAlimentoState.selezionato = p;
  ricercaAlimentoState.grammi = 100;
  if(ricercaAlimentoState.pastoIdx==null) ricercaAlimentoState.pastoIdx = pastoSuggeritoOra();
  ricercaAlimentoState.fonte = p.fonte || suggerisciFonte(p);
  renderCercaAlimento();
}

/* Rimuove un alimento dalla lista "Aggiungi di nuovo" (i più usati), su
   richiesta esplicita: non tocca lo storico di ciò che è già stato
   registrato nei giorni passati, solo la scorciatoia per il futuro. */
async function rimuoviAlimentoRecente(i){
  if(!profiloUtente) return;
  const lista = (profiloUtente.alimentiRecenti || []).slice();
  const voce = lista[i];
  if(!voce) return;
  if(!(await mostraConferma(`Rimuovere "${voce.nome}" dagli alimenti più usati?`))) return;
  lista.splice(i,1);

// Stima % massa grassa col metodo US Navy: serve altezza+sesso dal profilo,
// vita+collo dalla rilevazione (fianchi in più per le donne). Torna null se
// manca anche un solo dato necessario: e' una stima indicativa per seguire
// il trend nel tempo, non un valore clinico preciso.
function stimaMassaGrassa(m){
  if(!profiloUtente || !profiloUtente.altezza || !profiloUtente.sesso) return null;
  if(m.vita==null || m.collo==null) return null;
  const altezza = profiloUtente.altezza;
  if(profiloUtente.sesso==='F'){
    if(m.fianchi==null) return null;
    const base = m.vita + m.fianchi - m.collo;
    if(base<=0) return null;
    const bf = 495/(1.29579 - 0.35004*Math.log10(base) + 0.22100*Math.log10(altezza)) - 450;
    return isFinite(bf) ? bf : null;
  }
  const base = m.vita - m.collo;
  if(base<=0) return null;
  const bf = 495/(1.0324 - 0.19077*Math.log10(base) + 0.15456*Math.log10(altezza)) - 450;
  return isFinite(bf) ? bf : null;
}

// Valore di una metrica misure per un punto dato: gestisce sia i campi diretti
// sia quelli "calcolati" (per ora solo bfStimata) in modo uniforme per i grafici.
function valoreMetricaMisura(key, m){
  if(key==='bfStimata') return stimaMassaGrassa(m);
  return (m[key]!=null && m[key]!=='') ? Number(m[key]) : null;
}

/* Segnala differenze Dx/Sx sopra una soglia (5% sulla media dei due lati) tra
   le coppie di misure già raccolte. E' solo un campanello d'allarme da tenere
   d'occhio nel tempo, non una diagnosi: piccole differenze di lato dominante
   sono normali, quello che conta è se la differenza cresce nel tempo. */
function rilevaAsimmetrie(m){
  const SOGLIA_PCT = 5;
  const coppie = [['braccioDx','braccioSx','Braccia'], ['cosciaDx','cosciaSx','Cosce']];
  const risultati = [];
  coppie.forEach(([dx,sx,label])=>{
    if(m[dx]==null || m[sx]==null) return;
    const media = (m[dx]+m[sx])/2;
    if(media<=0) return;
    const diff = m[dx]-m[sx];
    const pct = Math.abs(diff)/media*100;
    if(pct >= SOGLIA_PCT){
      risultati.push({ label, dx:m[dx], sx:m[sx], pct: Math.round(pct*10)/10, lato: diff>0?'destro':'sinistro' });
    }
  });
  return risultati;
}

// Ridimensiona/comprime l'immagine lato client cosi' il base64 resta ben sotto il limite di 1MB per documento Firestore
function resizeImage(file, maxSize, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if(width > height && width > maxSize){ height = height * (maxSize/width); width = maxSize; }
        else if(height > maxSize){ width = width * (maxSize/height); height = maxSize; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality || 0.7));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Come resizeImage, ma parte gia' da un data URL (usato per ricalcolare la
// miniatura in fase di modifica senza dover riscaricare/riconvertire un File).
function resizeDataUrl(dataUrl, maxSize, quality){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      let { width, height } = img;
      if(width > height && width > maxSize){ height = height * (maxSize/width); width = maxSize; }
      else if(height > maxSize){ width = width * (maxSize/height); height = maxSize; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', quality || 0.7));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

async function salvaMisura(){
  const data = document.getElementById('mData').value || new Date().toISOString().slice(0,10);
  const peso = document.getElementById('mPeso').value;
  const vita = document.getElementById('mVita').value;
  const petto = document.getElementById('mPetto').value;
  const fianchi = document.getElementById('mFianchi').value;
  const collo = document.getElementById('mCollo').value;
  const braccioDx = document.getElementById('mBraccioDx').value;
  const braccioSx = document.getElementById('mBraccioSx').value;
  const cosciaDx = document.getElementById('mCosciaDx').value;
  const cosciaSx = document.getElementById('mCosciaSx').value;
  const note = (document.getElementById('mNote').value || '').trim();
  // Ci sono due pulsanti di salvataggio (peso rapido in cima e misurazione
  // completa in fondo alla sezione a comparsa): li gestiamo entrambi qui,
  // qualunque sia stato quello cliccato, cosi' l'utente vede lo stato di
  // salvataggio sul pulsante giusto.
  const btns = [document.getElementById('saveMisuraBtnRapido'), document.getElementById('saveMisuraBtnCompleta')].filter(Boolean);
  const errBox = document.getElementById('misuraError');
  errBox.innerHTML = '';

  const RANGE_PLAUSIBILI = {
    'Peso':[peso,20,400], 'Vita':[vita,40,200], 'Petto':[petto,40,200], 'Fianchi':[fianchi,40,200],
    'Collo':[collo,20,60],
    'Braccio Dx':[braccioDx,10,80], 'Braccio Sx':[braccioSx,10,80],
    'Coscia Dx':[cosciaDx,20,100], 'Coscia Sx':[cosciaSx,20,100]
  };
  for(const label in RANGE_PLAUSIBILI){
    const [valore, min, max] = RANGE_PLAUSIBILI[label];
    if(valore!==''){
      const n = Number(valore);
      if(isNaN(n) || n < min || n > max){
        errBox.innerHTML = `<div class="error-banner">Il valore inserito per "${label}" non sembra plausibile (${min}–${max}). Controllalo prima di salvare.</div>`;
        return;
      }
    }
  }

  btns.forEach(b=>{ b.dataset.origText = b.textContent; b.disabled = true; b.textContent = 'Salvataggio...'; });
  try{
    // Le foto a piena qualita' vanno ognuna nel proprio documento (collezione
    // "misureFoto"), cosi' ognuna puo' restare ben leggibile senza rischiare
    // di sforare il limite di 1MB per documento Firestore mettendole tutte
    // insieme nella rilevazione. Sulla rilevazione teniamo solo una miniatura
    // piccola (fotoThumb) della prima foto disponibile, per l'anteprima nello storico.
    const slotOccupati = misuraFotoFiles
      .map((file,i)=> file ? {i, file} : null)
      .filter(Boolean);

    let fotoThumb = null;
    if(slotOccupati.length){
      fotoThumb = await resizeImage(slotOccupati[0].file, 160, 0.55);
    }

    const payload = {
      data,
      peso: peso ? Number(peso) : null,
      vita: vita ? Number(vita) : null,
      petto: petto ? Number(petto) : null,
      fianchi: fianchi ? Number(fianchi) : null,
      collo: collo ? Number(collo) : null,
      braccioDx: braccioDx ? Number(braccioDx) : null,
      braccioSx: braccioSx ? Number(braccioSx) : null,
      cosciaDx: cosciaDx ? Number(cosciaDx) : null,
      cosciaSx: cosciaSx ? Number(cosciaSx) : null,
      note,
      fotoThumb
    };
    const ref = await aggiungiDocRapido(userCollection('misure'), payload);

    // Ridimensionamento e upload delle foto in parallelo invece che una dopo
    // l'altra: con 4 foto il salvataggio dura circa un quarto.
    await Promise.all(slotOccupati.map(async ({i, file})=>{
      const fotoDataUrl = await resizeImage(file, 900, 0.72);
      await aggiungiDocRapido(userCollection('misureFoto'), { misuraId: ref.id, ordine: i, foto: fotoDataUrl });
    }));

    cache.misure.push({ id: ref.id, ...payload });
    cache.misure.sort((a,b)=> new Date(a.data)-new Date(b.data));
    setRoute({name:'storico-misure', justSaved:true});
  }catch(e){
    errBox.innerHTML = `<div class="error-banner">${e.message}</div>`;
    btns.forEach(b=>{ b.disabled = false; b.textContent = b.dataset.origText || 'Salva'; });
  }
}

async function eliminaMisura(id){
  if(!(await mostraConferma('Eliminare questa rilevazione?'))) return;
  try{
    const fotoSnap = await userCollection('misureFoto').where('misuraId','==',id).get();
    await attendiScrittura(Promise.all(fotoSnap.docs.map(d=> d.ref.delete())));
    await attendiScrittura(userCollection('misure').doc(id).delete());
    delete fotoMisuraCache[id];
    cache.misure = cache.misure.filter(m=>m.id!==id);
    setRoute({name:'storico-misure'});
  }catch(e){ alert('Errore: '+e.message); }
}

/* Cache in memoria delle foto a piena qualità per rilevazione. Prima ogni
   apertura di un dettaglio o ogni cambio data nel confronto riscaricava da
   Firestore ~1 MB di base64 per foto: ora si scarica una volta sola per
   sessione e le aperture successive sono istantanee. Va invalidata quando
   le foto di una rilevazione cambiano o la rilevazione viene eliminata. */
const fotoMisuraCache = {};

async function fotoDiMisure(ids){
  const mancanti = ids.filter(id=>!(id in fotoMisuraCache));
  if(mancanti.length){
    // "in" accetta al massimo 10 valori: qui sono sempre 1 o 2.
    const snap = await userCollection('misureFoto').where('misuraId','in',mancanti).get();
    mancanti.forEach(id=>{ fotoMisuraCache[id] = []; });
    snap.docs.forEach(d=>{ const f = d.data(); if(fotoMisuraCache[f.misuraId]) fotoMisuraCache[f.misuraId].push(f); });
    mancanti.forEach(id=>fotoMisuraCache[id].sort((a,b)=>(a.ordine||0)-(b.ordine||0)));
  }
  const out = {};
  ids.forEach(id=>{
    let foto = fotoMisuraCache[id];
    // Compatibilita' con rilevazioni salvate prima della collezione misureFoto.
    if(!foto.length){
      const m = cache.misure.find(x=>x.id===id);
      if(m && m.foto) foto = [{ordine:0, foto:m.foto}];
    }
    out[id] = foto;
  });
  return out;
}

}

/* ============ MODIFICA RILEVAZIONE PASSATA (valori + foto) ============
   Ogni slot foto puo' essere in 4 stati mentre si modifica:
   null           -> nessuna modifica (slot vuoto, resta vuoto)
   {tipo:'esistente', docId, foto}  -> foto gia' salvata, invariata
   {tipo:'nuova', file, previewUrl} -> nuova foto scelta (sostituisce o riempie lo slot)
   {tipo:'rimossa', docId}          -> l'utente ha tolto la foto esistente in quello slot
   `docId` puo' essere null per il campo legacy "foto" salvato prima che esistesse
   la sottocollezione misureFoto (rilevazioni molto vecchie). */
let misuraModificaFotoState = [null,null,null,null];

function renderMisuraModifica(){
  const m = cache.misure.find(x=>x.id===route.id);
  if(!m){ setRoute({name:'storico-misure'}); return; }
