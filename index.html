/* ============ EXPORT DATI ============ */
function csvEscape(v){
  if(v===null || v===undefined) return '';
  const s = String(v).replace(/"/g,'""');
  return /[",\n]/.test(s) ? `"${s}"` : s;
}

/* Cosa è stato mangiato in un giorno, voce per voce (per l'export CSV): pasti
   del piano segnati, alimenti/ricette aggiunti (con grammi e ingredienti) e
   integratori. Ordinati per pasto. */
function vociMangiateGiorno(g){
  const out = [];
  if(g.manualMacros){
    const m = g.manualMacros;
    out.push({ pasto:'', cosa:'Giorno inserito a mano (solo totali)', marca:'', qta:'', kcal:m.kcal||0, prot:m.prot||0, carb:m.carb||0, polio:0, grassi:m.grassi||0, tipo:'totali manuali', ingredienti:'' });
    return out;
  }
  const nomePasto = i=> (DIETA_PIANO.pasti[i] && DIETA_PIANO.pasti[i].nome) || '';
  const pastiFatti = g.pastiFatti || {}, snaps = g.pastiSnapshot || {};
  Object.keys(pastiFatti).map(Number).sort((a,b)=>a-b).forEach(i=>{
    if(!pastiFatti[i]) return;
    const sn = snaps[i];
    if(sn && sn.viaExtra) return; // sostituito da alimenti extra, elencati sotto
    out.push({ ord:i, pasto:nomePasto(i), cosa: sn ? sn.titolo : 'Pasto del piano (dettaglio non disponibile)', marca:'', qta:'',
      kcal: sn?sn.kcal:'', prot: sn?sn.prot:'', carb: sn?sn.carb:'', polio:'', grassi: sn?sn.grassi:'', tipo:'pasto del piano', ingredienti:'' });
  });
  (g.alimentiExtra||[]).forEach(a=>{
    const ingr = (a.isRicetta && a.ingredienti && a.ingredienti.length)
      ? a.ingredienti.map(x=> `${x.nome} ${x.grammi!=null?x.grammi+'g':''}`.trim()).join('; ') : '';
    out.push({ ord:(typeof a.pasto==='number'?a.pasto:99), pasto: typeof a.pasto==='number'?nomePasto(a.pasto):'', cosa:a.nome, marca:a.marca||'',
      qta: a.isRicetta ? '1 porzione' : (a.grammi!=null ? a.grammi+' g' : ''), kcal:a.kcal, prot:a.prot, carb:a.carb, polio:a.polio||0, grassi:a.grassi,
      tipo: a.isRicetta ? 'ricetta' : 'alimento', ingredienti: ingr });
  });
  out.sort((x,y)=> (x.ord??99)-(y.ord??99));
  return out;
}
function integratoriGiorno(g){
  return Object.keys(g.integratoriFatti||{}).filter(k=>g.integratoriFatti[k]);
}
function sintesiMangiatoGiorno(g){
  const v = vociMangiateGiorno(g);
  return v.map(x=> `${x.pasto?x.pasto+': ':''}${x.cosa}${x.qta?' ('+x.qta+')':''}`).join(' | ');
}

function esportaCSV(){
  const righe = [];
  righe.push('=== ALLENAMENTI ===');
  righe.push(['Data','Scheda','Esercizio','Serie','Peso (kg)','Rip','Completata','RPE','Note','Unilaterale','Peso DX (kg)','Rip DX','Tecnica','Dettaglio tecnica'].join(','));
  cache.sessioni.slice().sort((a,b)=> new Date(a.data)-new Date(b.data)).forEach(s=>{
    const data = new Date(s.data).toLocaleDateString('it-IT');
    s.esercizi.forEach(e=>{
      e.sets.forEach((set,i)=>{
        const rpeVal = set.rpe!=null ? set.rpe : (e.rpe||'');
        righe.push([data, csvEscape(s.schedaNome), csvEscape(e.nome), i+1, set.peso||'', csvEscape(set.rip||''), set.fatta?'si':'no', rpeVal, csvEscape(e.noteUtente||''), e.unilaterale?'si':'', set.pesoDx||'', csvEscape(set.ripDx||''), csvEscape(set.tecnica||''), csvEscape(set.tecnica==='drop' ? [set.pesoDrop?set.pesoDrop+'kg':'', set.ripDrop?'x'+set.ripDrop:''].join('') : set.tecnica==='restpause' ? (set.ripRP?'+'+set.ripRP+' rip':'') : set.tecnica==='parziali' ? (set.ripParz?'+'+set.ripParz+' parziali':'') : '')].join(','));
      });
    });
  });
  righe.push('');
  righe.push('=== DIETA (kcal e macro mangiati per giorno) ===');
  righe.push(['Data','Tipo giornata','Kcal','Proteine (g)','Carboidrati (g)','di cui polialcoli (g)','Grassi (g)','Acqua (ml)','Dettaglio parziale','Cosa ho mangiato','Integratori'].join(','));
  // Giorni salvati + oggi con i dati più recenti (anche se non ancora sincronizzati).
  const giorniDieta = cache.dietaLog.filter(d=>d.id!==todayKey());
  if(cache.dietaLogOggi) giorniDieta.push(Object.assign({ id: todayKey() }, cache.dietaLogOggi));
  giorniDieta.sort((a,b)=> a.id.localeCompare(b.id));
  giorniDieta.forEach(g=>{
    const t = calcolaTotaliGiorno(g);
    if(!t.kcalTot && !t.protTot && !t.carbTot && !t.grassiTot && !g.acquaMl) return;
    const parti = String(g.id).split('-');
    const data = parti.length===3 ? `${parti[2]}/${parti[1]}/${parti[0]}` : g.id;
    const tipo = typeof g.giornoAllenamento==='boolean' ? (g.giornoAllenamento ? 'pesi' : 'riposo') : '';
    righe.push([data, tipo, Math.round(t.kcalTot), fmt1(t.protTot), fmt1(t.carbTot), fmt1(t.polioTot||0), fmt1(t.grassiTot), g.acquaMl||0, t.dettagliNonDisponibili?'si':'', csvEscape(sintesiMangiatoGiorno(g)), csvEscape(integratoriGiorno(g).join('; '))].join(','));
  });
  righe.push('');
  righe.push('=== DIETA: COSA HO MANGIATO (alimento per alimento) ===');
  righe.push(['Data','Pasto','Cosa','Marca','Quantità','Kcal','Proteine (g)','Carboidrati (g)','di cui polialcoli (g)','Grassi (g)','Tipo','Ingredienti (ricette)'].join(','));
  giorniDieta.forEach(g=>{
    const parti = String(g.id).split('-');
    const data = parti.length===3 ? `${parti[2]}/${parti[1]}/${parti[0]}` : g.id;
    vociMangiateGiorno(g).forEach(v=>{
      righe.push([data, csvEscape(v.pasto), csvEscape(v.cosa), csvEscape(v.marca), csvEscape(v.qta), v.kcal===''?'':Math.round(v.kcal), v.prot===''?'':fmt1(v.prot), v.carb===''?'':fmt1(v.carb), v.polio===''?'':fmt1(v.polio), v.grassi===''?'':fmt1(v.grassi), csvEscape(v.tipo), csvEscape(v.ingredienti)].join(','));
    });
  });
  righe.push('');
  righe.push('=== CARDIO ===');
  righe.push(['Data','Attività','Durata (min)','Kcal stimate'].join(','));
  cache.cardioSessioni.slice().sort((a,b)=> new Date(a.data)-new Date(b.data)).forEach(s=>{
    const data = new Date(s.data).toLocaleDateString('it-IT');
    const att = CARDIO_ATTIVITA.find(a=>a.key===s.tipo);
    const label = att ? att.label : s.tipo;
    righe.push([data, csvEscape(label), Math.round((s.durataSec||0)/60), s.kcalStimate||0].join(','));
  });
  righe.push('');
  righe.push('=== MISURE ===');
  righe.push(['Data','Peso','Vita','Petto','Fianchi','Collo','Braccio Dx','Braccio Sx','Coscia Dx','Coscia Sx','% Massa grassa stimata','Note'].join(','));
  cache.misure.slice().sort((a,b)=> new Date(a.data)-new Date(b.data)).forEach(m=>{
    const bf = stimaMassaGrassa(m);
    righe.push([new Date(m.data).toLocaleDateString('it-IT'), m.peso||'', m.vita||'', m.petto||'', m.fianchi||'', m.collo||'', m.braccioDx||'', m.braccioSx||'', m.cosciaDx||'', m.cosciaSx||'', bf!=null?bf.toFixed(1):'', csvEscape(m.note||'')].join(','));
  });
  const csv = '﻿' + righe.join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `beat-yourself-dati-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// "Oggi"/"Ieri" al posto della data quando è recentissima, altrimenti il
// giorno della settimana esteso — più immediato da leggere a colpo d'occhio
// nelle liste di storico che una data sempre uguale nel formato.
function etichettaGiornoRelativa(data){
  const oggi = new Date(); oggi.setHours(0,0,0,0);
  const target = new Date(data); target.setHours(0,0,0,0);
  const diffGiorni = Math.round((oggi - target) / 86400000);
  if(diffGiorni===0) return 'Oggi';
  if(diffGiorni===1) return 'Ieri';
  return new Date(data).toLocaleDateString('it-IT',{weekday:'long', day:'numeric', month:'long'});
}

    html += `<button class="btn secondary" style="width:100%;margin:6px 0 14px;" onclick="mostraAltroStoricoMis()">Mostra altre (${misureTutte.length - storicoMisLimite})</button>`;
  }
  view.innerHTML = html;
  attachSwipeHandlers(view, eliminaMisura);
}

const METRICHE_ESERCIZIO = [
  {key:'pesoMax', label:'Peso max'},
  {key:'volume', label:'Volume totale'},
  {key:'rm', label:'1RM stimato'},
  {key:'rpeMedio', label:'RPE medio'}
];

/* Classificazione per gruppo muscolare basata sul nome dell'esercizio (non c'e'
   un campo dedicato nel catalogo schede). L'ordine conta: i pattern piu'
   specifici vanno controllati prima di quelli generici (es. "Leg Curl" deve
   finire in Gambe, non in Braccia solo perche' contiene "curl"). */
const GRUPPI_MUSCOLARI_PATTERN = [
  {gruppo:'Glutei', re:/hip thrust|glute/i},
  {gruppo:'Core', re:/plank|addom|crunch|\bcore\b/i},
  // Stacchi rumeni (RDL): femorali come muscolo principale (vedi guida.muscoli
  // "Femorali, glutei, bassa schiena in stabilizzazione") — stessa famiglia
  // di Leg Curl, quindi Gambe e non Glutei (riservato a hip thrust/glute
  // dove il gluteo è il motore primario).
  {gruppo:'Gambe', re:/leg press|leg curl|leg extension|squat|affond|quadricap|polpacc|calf|gamba|stacch|\brdl\b/i},
  // Pec Fly: fly/croci per pettorali. Push-up (anche sulle ginocchia): stessa
  // catena della Chest Press di cui è l'alternativa (guida.muscoli "Pettorali,
  // spalle anteriori e tricipiti").
  {gruppo:'Petto', re:/chest|petto|panca|croci|pec fly|push-?up/i},
  // Pulley: alternativa alla Row Machine, stesso lavoro dorsale (dorsali,
  // romboidi, trapezio). Hyperextension: lombari come muscolo principale
  // (guida.muscoli "Lombari, glutei, femorali") — è la bassa schiena, non le gambe.
  {gruppo:'Dorso', re:/lat machine|pulldown|rematore|\brow\b|trazioni|dorso|schiena|pulley|hyperextens|iperestensione/i},
  // Rear Delt (reverse fly): deltoide posteriore — una spalla, non un
  // pettorale, anche se il nome contiene "fly".
  {gruppo:'Spalle', re:/spalla|shoulder|military|alzate|arnold|rear delt|deltoid/i},
  {gruppo:'Braccia', re:/curl|bicip|tricip|push.?down|french|braccio/i}
];
function gruppoMuscolareEsercizio(nome){
  const match = GRUPPI_MUSCOLARI_PATTERN.find(p=>p.re.test(nome||''));
  return match ? match.gruppo : 'Altro';
}

/* Serie completate per gruppo muscolare negli ultimi `giorni` giorni: metrica
   di volume piu' robusta della tonnellata (peso x rip), perche' funziona
   anche per esercizi a corpo libero o a tempo (es. Plank) dove non c'e' un
   peso numerico. 10-20 serie/settimana per gruppo e' un range spesso citato
   come riferimento generale per l'ipertrofia, non una prescrizione personale. */
function volumeSettimanalePerGruppo(giorni){
  giorni = giorni || 7;
  const daData = new Date(); daData.setDate(daData.getDate()-giorni+1); daData.setHours(0,0,0,0);
  const conteggio = {};
  cache.sessioni.filter(s=> new Date(s.data) >= daData).forEach(s=>{
    (s.esercizi||[]).forEach(e=>{
      const setFatte = (e.sets||[]).filter(x=>x.fatta).length;
      if(setFatte>0){
        const gruppo = gruppoMuscolareEsercizio(e.nome);
        conteggio[gruppo] = (conteggio[gruppo]||0) + setFatte;
      }
    });
  });
  return conteggio;
}

function renderVolumeGruppiCard(){
  const conteggio = volumeSettimanalePerGruppo(7);
  const gruppi = Object.keys(conteggio).sort((a,b)=> conteggio[b]-conteggio[a]);
  if(!gruppi.length) return '';
  const righe = gruppi.map(g=>{
    const n = conteggio[g];
    const pct = Math.min(100, Math.round((n/20)*100));
    const etichetta = n<10 ? 'basso' : (n<=20 ? 'nel range comune' : 'alto');
    return `<div class="blocco-progress">
      <p class="bp-label">${g} · ${n} serie · ${etichetta}</p>
      <div class="bp-bar"><div class="bp-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
  return `<div class="card">
    <h3 style="margin-top:0;font-size:15px;">💪 Volume settimanale per gruppo</h3>
    <p class="field-hint" style="margin:0 0 14px;">Serie completate negli ultimi 7 giorni per gruppo muscolare. 10-20 serie/settimana per gruppo è un range spesso citato come riferimento generale per l'ipertrofia — non una prescrizione, solo un punto di partenza.</p>
    ${righe}
  </div>`;
}

function calcolaValoreEsercizio(sessione, nomeEsercizio, metrica){
  const e = sessione.esercizi.find(x=>x.nome===nomeEsercizio);
  if(!e) return null;
  if(metrica==='rpeMedio'){
    const rpes = (e.sets||[]).map(s=>s.rpe).filter(v=>v!=null && !isNaN(v));
    if(rpes.length) return rpes.reduce((a,b)=>a+b,0)/rpes.length;
    return (e.rpe!=null) ? e.rpe : null; // sessioni salvate prima dell'RPE per serie
  }
  const validi = [];
  (e.sets||[]).forEach(x=>{
    validi.push({peso:parseFloat(x.peso), rip:parseInt(x.rip)});
    if(x.pesoDx!=null && x.pesoDx!=='') validi.push({peso:parseFloat(x.pesoDx), rip:parseInt(x.ripDx)});
  });
  for(let i=validi.length-1;i>=0;i--){ const x=validi[i]; if(isNaN(x.peso) || isNaN(x.rip) || !(x.rip>0)) validi.splice(i,1); }
  if(!validi.length) return null;
  if(metrica==='pesoMax') return Math.max(...validi.map(x=>x.peso));
  if(metrica==='volume') return validi.reduce((sum,x)=> sum + x.peso*x.rip, 0);
  if(metrica==='rm') return Math.max(...validi.map(x=> x.peso*(1+x.rip/30)));
  return null;
}

function renderAderenzaCard(){
  const blocchiAttivi = schedeAssegnateUtente().filter(s=> blocchiIniziati[s.id]);
  if(!blocchiAttivi.length) return '';
  let html = `<div class="card"><h3 style="margin-top:0;font-size:15px;">🔥 Costanza</h3>`;
  const gruppiMostrati = new Set();
  blocchiAttivi.forEach(s=>{
    // Le schede con lo stesso `gruppo` (es. Blocco 2 Upper/Lower, alternate
    // A-B) sono in realtà un unico blocco: le sedute vanno conteggiate
    // insieme e il totale atteso è fisso (frequenza x durata, non prorata sui
    // giorni trascorsi), altrimenti alternando due schede da "3x/settimana
    // totali" il conto raddoppiava e non tornava mai al 100%.
    if(s.gruppo){
      if(gruppiMostrati.has(s.gruppo)) return;
      gruppiMostrati.add(s.gruppo);
      const prog = progressoBlocco(s.gruppo);
      if(!prog || !prog.seduteTarget) return;
      const membri = membriGruppo(s.gruppo);
      const tag = m => { const mm = m.nome.match(/\(([^)]+)\)/); return mm ? mm[1] : m.nome; };
      const base = membri[0].nome.split('—')[0].trim();
      const nomeGruppo = membri.length>1 ? `${base} (${membri.map(tag).join('/')})` : membri[0].nome;
      const fatte = prog.sedute;
      const attese = prog.seduteTarget;
      const pct = Math.min(100, Math.round((fatte/attese)*100));
      html += `<div class="blocco-progress">
        <p class="bp-label">${nomeGruppo} · ${fatte}/${attese} sedute</p>
        <div class="bp-bar"><div class="bp-fill" style="width:${pct}%"></div></div>
      </div>`;
      return;
    }
    const inizio = new Date(blocchiIniziati[s.id]);
    const oggi = new Date();
    const fineBlocco = s.durataSettimane ? new Date(new Date(inizio).setDate(inizio.getDate()+s.durataSettimane*7)) : null;
    const finePeriodo = (fineBlocco && fineBlocco < oggi) ? fineBlocco : oggi;
    const giorniTrascorsi = Math.max(1, Math.round((finePeriodo - inizio) / 86400000));
    const freqMatch = s.periodo && s.periodo.match(/(\d+)x\/settimana/);
    const freq = freqMatch ? Number(freqMatch[1]) : 3;
    const attese = Math.max(1, Math.round((giorniTrascorsi/7) * freq));
    const fatte = cache.sessioni.filter(sess=> sess.schedaId===s.id && new Date(sess.data) >= inizio).length;
    const pct = Math.min(100, Math.round((fatte/attese)*100));
    html += `<div class="blocco-progress">
      <p class="bp-label">${s.nome} · ${fatte}/${attese} sedute</p>
      <div class="bp-bar"><div class="bp-fill" style="width:${pct}%"></div></div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function renderRiepilogoSettimanale(){

  const sessioniSettimana = cache.sessioni.filter(s=> new Date(s.data) >= seiGiorniFa);

  const rpeValori = sessioniSettimana.flatMap(s=> (s.esercizi||[]).flatMap(e=> (e.sets||[]).map(x=>x.rpe))).filter(v=>v!=null && !isNaN(v));
  const rpeMedio = rpeValori.length ? (rpeValori.reduce((a,b)=>a+b,0)/rpeValori.length).toFixed(1) : null;

  let aderenzaTiles = '';

      ${aderenzaTiles}

// Media mobile su finestra di calendario (non su N punti): per ogni punto,
// media di tutti i valori con data entro gli ultimi `giorni` giorni da quel punto.
// Utile per il peso, che oscilla molto giorno su giorno per acqua/digestione.
function mediaMobileCalendario(punti, giorni){
  const ms = giorni * 86400000;
  return punti.map((p,i)=>{
    const finestra = punti.filter(q=> q.t <= p.t && (p.t - q.t) <= ms);
    const media = finestra.reduce((s,q)=>s+q.y,0) / finestra.length;
    return media;
  });
}

/* Chart.js pesa ~200 KB e serve solo in Statistiche: lo carichiamo alla prima
   apertura di quella schermata invece di bloccare l'avvio dell'app per tutti. */
let chartJsPromise = null;
function caricaChartJs(){
  if(window.Chart) return Promise.resolve();
  if(!chartJsPromise){
    chartJsPromise = new Promise((resolve, reject)=>{
      const sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js';
      sc.onload = ()=>resolve();
      sc.onerror = ()=>{ chartJsPromise = null; reject(new Error('Chart.js non caricato')); };
      document.head.appendChild(sc);
    });
  }
  return chartJsPromise;
}
function apriStatistiche(){
  if(window.Chart){ renderStatistiche(); return; }
  pageTitle.textContent = 'Statistiche';
  view.innerHTML = '<p class="empty"><span class="empty-icon">📊</span>Carico i grafici…</p>';
  caricaChartJs().then(()=>{ if(route.name==='statistiche') renderStatistiche(); })
    .catch(()=>{ if(route.name==='statistiche') view.innerHTML = '<p class="empty"><span class="empty-icon">📡</span>Non riesco a caricare i grafici: controlla la connessione e riapri Statistiche.</p>'; });
}

        const media = mediaMobileCalendario(points, 7);
        datasets.push({
          label: 'Media mobile 7gg', data: media.map(v=> Math.round(v*10)/10),
          borderColor:'#f5f7fa', backgroundColor:'transparent', borderDash:[6,4],
          tension:.3, fill:false, pointRadius:0, borderWidth:2
        });
      }
      window._misureChart = new Chart(ctx, {
        type:'line',
        data:{ labels, datasets },
        options:{ plugins:{legend:{labels:{color:'#eef0f3'}}}, scales:{
          x:{ticks:{color:'#9aa1ad'}, grid:{color:'#33384333'}},
          y:{ticks:{color:'#9aa1ad'}, grid:{color:'#33384333'}}
        }}
      });
    }

    chipWrap2.innerHTML = metricheDisponibili.map(mm=>`<div class="chip ${mm.key===selected2?'active':''}" data-k="${mm.key}">${mm.label}</div>`).join('');
    chipWrap2.querySelectorAll('.chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        chipWrap2.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
        chip.classList.add('active');
        drawMisuraChart(chip.dataset.k);
      });
    });
    if(selected2) drawMisuraChart(selected2);
  }
}

function renderProgressiDetail(){
  const s = cache.sessioni.find(x=>x.id===route.id);
  if(!s){ setRoute({name:'storico-allenamento'}); return; }
  pageTitle.textContent = s.schedaNome;
  const d = new Date(s.data);
  const num = v=>{ const n = parseFloat(v); return isNaN(n) ? null : n; };
  // Riepilogo della seduta
  let serieFatte = 0, serieTot = 0, volume = 0, rpeSomma = 0, rpeN = 0, tecniche = 0;
  s.esercizi.forEach(e=>{
    (e.sets||[]).forEach(set=>{
      serieTot++;
      if(set.fatta) serieFatte++;
      if(set.tecnica && !set.saltata) tecniche++;
      if(set.rpe!=null && !isNaN(set.rpe)){ rpeSomma += Number(set.rpe); rpeN++; }
      [[set.peso,set.rip],[set.pesoDx,set.ripDx]].forEach(([pk,rp])=>{
        const w = num(pk), r = parseInt(rp);
        if(w!=null && !isNaN(r) && r>0) volume += w*r;
      });
    });
  });
  const rpeMedio = rpeN ? (rpeSomma/rpeN) : null;
  const rpeCls = v => v==null ? '' : (v>=10 ? 'r10' : v>=9 ? 'r9' : v>=8 ? 'r8' : 'r7');
  const fmtVol = v => v>=1000 ? (Math.round(v/100)/10).toLocaleString('it-IT')+' t' : Math.round(v)+' kg';
  // Seduta precedente con lo stesso esercizio (per il confronto sul carico massimo)
  const precedenti = cache.sessioni.filter(x=>new Date(x.data) < d).sort((x,y)=>new Date(y.data)-new Date(x.data));
  const pesoMaxEs = ex => {
    const v = [];
    (ex.sets||[]).forEach(st=>{ const w=num(st.peso); if(w!=null && st.fatta) v.push(w); const w2=num(st.pesoDx); if(w2!=null && st.fatta) v.push(w2); });
    return v.length ? Math.max(...v) : null;
  };
  let html = '';
  if(route.justSaved) html += `<div class="success-banner">Modifiche salvate ✅</div>`;
  html += `<div class="sd-hero">
    <div class="sd-date">${d.toLocaleDateString('it-IT',{weekday:'long', day:'numeric', month:'long', year:'numeric'})} · ${d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}</div>
    <div class="sd-title">${escHtml(s.schedaNome)}</div>
    <div class="sd-stats">
      <div class="sd-stat"><b>${s.esercizi.length}</b><span>esercizi</span></div>
      <div class="sd-stat"><b>${serieFatte}<small>/${serieTot}</small></b><span>serie fatte</span></div>
      <div class="sd-stat"><b>${volume ? fmtVol(volume) : '—'}</b><span>volume</span></div>
      <div class="sd-stat"><b>${rpeMedio!=null ? (Math.round(rpeMedio*10)/10).toString().replace('.',',') : '—'}</b><span>RPE medio</span></div>
    </div>
    ${tecniche ? `<div class="sd-tag-row"><span class="sd-pill tec">⚡ ${tecniche} ${tecniche===1?'tecnica':'tecniche'} d'intensità</span></div>` : ''}
    ${s.dietaOggi ? `<div class="sd-diet">🍽️ Quel giorno hai mangiato <b>${s.dietaOggi.kcal} kcal</b> · P ${s.dietaOggi.prot}g · C ${s.dietaOggi.carb}g · G ${s.dietaOggi.grassi}g</div>` : ''}
  </div>`;

  s.esercizi.forEach((e,idx)=>{
    const sets = e.sets||[];
    const uni = !!e.unilaterale;
    const gruppo = gruppoMuscolareEsercizio(e.nome);
    const fatte = sets.filter(x=>x.fatta).length;
    // Serie "top": peso più alto tra quelle fatte
    let topIdx = -1, topW = -1;
    sets.forEach((st,i)=>{ const w=num(st.peso); if(st.fatta && w!=null && w>topW){ topW=w; topIdx=i; } });
    const pesoMax = pesoMaxEs(e);
    let confronto = '';
    for(const pr of precedenti){
      const ep = trovaEsInSessione(pr, e.nome);
      if(ep){
        const pm = pesoMaxEs(ep);
        if(pm!=null && pesoMax!=null){
          const diff = Math.round((pesoMax-pm)*100)/100;
          confronto = diff>0 ? `<span class="sd-delta up">▲ +${diff} kg vs ultima volta</span>`
                    : diff<0 ? `<span class="sd-delta down">▼ ${diff} kg vs ultima volta</span>`
                    : `<span class="sd-delta eq">= come l'ultima volta</span>`;
        }
        break;
      }
    }
    const haRpePerSerie = sets.some(x=>x.rpe!=null);
    html += `<div class="sd-ex">
      <div class="sd-ex-head">
        <div class="sd-ex-n">${idx+1}</div>
        <div class="sd-ex-info">
          <div class="sd-ex-name">${escHtml(e.nome)}</div>
          <div class="sd-ex-sub"><span class="sd-pill">${gruppo}</span>${uni?'<span class="sd-pill uni">↔ unilaterale</span>':''}<span class="sd-count">${fatte}/${sets.length} serie</span>${confronto}</div>
        </div>
      </div>
      <div class="sd-sets">`;
    sets.forEach((st,i)=>{
      if(st.saltata){
        html += `<div class="sd-set skip"><span class="sd-sn">${i+1}</span><span class="sd-skip">Serie saltata</span></div>`;
        return;
      }
      const vuota = !st.peso && !st.rip && !st.fatta;
      const isTop = i===topIdx && sets.filter(x=>x.fatta).length>1;
      const rpe = st.rpe!=null ? Number(st.rpe) : null;
      const lato = (lbl, peso, rip)=>`<div class="sd-side">${uni?`<small class="sd-lato">${lbl}</small>`:''}<span class="sd-w">${peso?peso:'—'}<small>kg</small></span><span class="sd-x">×</span><span class="sd-r">${rip?rip:'—'}</span></div>`;
      html += `<div class="sd-set${st.fatta?' done':''}${vuota?' empty':''}${isTop?' top':''}">
        <span class="sd-sn">${i+1}</span>
        <div class="sd-vals">${lato('SX', st.peso, st.rip)}${uni ? lato('DX', st.pesoDx, st.ripDx) : ''}</div>
        <div class="sd-end">
          ${isTop ? '<span class="sd-top" title="Carico più alto">🏆</span>' : ''}
          ${rpe!=null ? `<span class="sd-rpe ${rpeCls(rpe)}">RPE ${rpe}</span>` : ''}
          <span class="sd-ok">${st.fatta?'✓':''}</span>
        </div>
      </div>`;
      if(st.tecnica){
        const t = TECNICHE[st.tecnica];
        let det = '';
        if(st.tecnica==='drop') det = `${st.pesoDrop?st.pesoDrop+' kg':''}${st.ripDrop?` × ${st.ripDrop}`:''}`.trim();
        else if(st.tecnica==='restpause') det = st.ripRP ? `+${st.ripRP} rip dopo la pausa` : '';
        else if(st.tecnica==='parziali') det = st.ripParz ? `+${st.ripParz} parziali` : '';
        html += `<div class="sd-tec">⚡ ${t?t.label:st.tecnica}${det?` · <b>${det}</b>`:''}</div>`;
      }
    });
    html += `</div>`;
    if(!haRpePerSerie && e.rpe) html += `<div class="sd-note">RPE: <b>${e.rpe}</b></div>`;
    if(e.noteUtente) html += `<div class="sd-note">📝 ${escHtml(e.noteUtente)}</div>`;
    html += `</div>`;
  });
  html += `<div style="display:flex;gap:10px;margin-top:6px;">
    <button class="btn secondary" style="flex:1;" onclick="setRoute({name:'sessione-modifica', id:'${s.id}'})">✏️ Modifica</button>
    <button class="btn secondary" style="flex:1;" onclick="eliminaSessione('${s.id}')">Elimina</button>
  </div>`;
  view.innerHTML = html;
}

async function eliminaSessione(id){
  if(!(await mostraConferma('Eliminare questa seduta dallo storico?'))) return;
  try{
    await attendiScrittura(userCollection('sessioni').doc(id).delete());
    cache.sessioni = cache.sessioni.filter(s=>s.id!==id);
    setRoute({name:'storico-allenamento'});
  }catch(e){ alert('Errore: '+e.message); }
}

/* ============ MODIFICA SEDUTA PASSATA ============
   Riusa lo stile della riga di logging live (.set-row) ma opera su una copia
   di lavoro (modificaSessioneDraft) separata dal sessionDraft della seduta in
   corso, cosi' non si mescolano un allenamento attivo e una modifica storica. */
let modificaSessioneDraft = null;

function renderSessioneModifica(){
  const s = cache.sessioni.find(x=>x.id===route.id);
  if(!s){ setRoute({name:'storico-allenamento'}); return; }
  pageTitle.textContent = 'Modifica seduta';
  modificaSessioneDraft = JSON.parse(JSON.stringify(s));
  renderSessioneModificaHTML();
}

/* Ricostruisce l'HTML dalla modificaSessioneDraft corrente senza
   rigenerarla da cache.sessioni: usata per il re-render dopo "+ Aggiungi
   serie", altrimenti si perderebbero le modifiche non ancora salvate. */
function renderSessioneModificaHTML(){
  const s = modificaSessioneDraft;
  let html = `<div class="card">
    <div id="sessioneModError"></div>
    <div class="field"><label>Data</label><input type="date" id="smData" value="${new Date(s.data).toISOString().slice(0,10)}"></div>
  </div>`;
  modificaSessioneDraft.esercizi.forEach((e,ei)=>{
    html += `<div class="exercise-card" id="mexcard-${ei}">
      <h3>${e.nome}</h3>
      <div class="ex-tools">
        <button type="button" class="set-mini-btn" ${ei===0?'disabled':''} onclick="spostaEsercizioStorico(${ei},-1)">▲ Su</button>
        <button type="button" class="set-mini-btn" ${ei>=modificaSessioneDraft.esercizi.length-1?'disabled':''} onclick="spostaEsercizioStorico(${ei},1)">▼ Giù</button>
        <button type="button" class="set-mini-btn" onclick="apriAggiungiEsercizio(${ei},'storico')">➕ Aggiungi sotto</button>
        <button type="button" class="set-mini-btn" onclick="rimuoviEsercizioStorico(${ei})">🗑 Rimuovi</button>
      </div>
      <p class="rpe-legend">RPE per ogni serie: 6 = leggero · 8 = a 2 rip dal cedimento · 10 = cedimento totale</p>`;
    e.sets.forEach((set,si)=>{
      html += `<div class="set-row">
        <span>${si+1}</span>
        <input type="number" inputmode="decimal" min="0" max="500" placeholder="peso kg" value="${set.peso??''}" oninput="updateSetModifica(${ei},${si},'peso',this.value)">
        <input type="text" inputmode="numeric" pattern="[0-9]*" placeholder="rip / sec" value="${set.rip??''}" oninput="updateSetModifica(${ei},${si},'rip',this.value)">
        <select onchange="setRPESetModifica(${ei},${si},this.value)">
          <option value="">RPE</option>
          ${[6,7,8,9,10].map(v=>`<option value="${v}" ${Number(set.rpe)===v?'selected':''}>${v}</option>`).join('')}
        </select>
        <input type="checkbox" ${set.fatta?'checked':''} onchange="updateSetModifica(${ei},${si},'fatta',this.checked)">
      </div>`;
      if(e.unilaterale){
        html += `<div class="set-row">
          <span><small class="side-lbl">DX</small></span>
          <input type="number" inputmode="decimal" min="0" max="500" placeholder="peso kg DX" value="${set.pesoDx??''}" oninput="updateSetModifica(${ei},${si},'pesoDx',this.value)">
          <input type="text" inputmode="numeric" pattern="[0-9]*" placeholder="rip DX" value="${set.ripDx??''}" oninput="updateSetModifica(${ei},${si},'ripDx',this.value)">
          <span></span><span></span>
        </div>`;
      }
    });
    html += `<button type="button" class="btn small secondary add-set-btn" style="margin-top:10px;" onclick="aggiungiSetModifica(${ei})">+ Aggiungi serie</button>`;
    html += `<textarea class="note-user" placeholder="Le tue note su questo esercizio" oninput="updateNotaEsercizioModifica(${ei}, this.value)">${e.noteUtente||''}</textarea>`;
    html += `</div>`;
  });
  html += `<button type="button" class="btn secondary" style="width:100%;margin-bottom:10px;" onclick="apriAggiungiEsercizio(null,'storico')">➕ Aggiungi un esercizio</button>`;
  html += `<button class="btn" id="saveSessioneModBtn" onclick="salvaModificaSessione('${s.id}')">Salva modifiche</button>`;
  view.innerHTML = html;
}

function ridisegnaModifica(){
  const y = window.scrollY; renderSessioneModificaHTML(); window.scrollTo(0, y);
}
function inserisciEsercizioStorico(nome, serie, pos, base){
  modificaSessioneDraft.esercizi.splice(pos, 0, {
    nome, noteUtente:'', aggiunto:true, unilaterale: base ? unilateraleEsercizio(base) : false,
    sets: Array.from({length:serie}, ()=>({peso:'', rip:'', fatta:false, rpe:null}))
  });
  hapticaMedia(); ridisegnaModifica();
  setTimeout(()=>{ const el = document.getElementById('mexcard-'+pos); if(el) el.scrollIntoView({behavior:'smooth', block:'center'}); }, 60);
}
function spostaEsercizioStorico(ei, dir){
  const arr = modificaSessioneDraft.esercizi; const j = ei+dir;
  if(j<0 || j>=arr.length) return;
  const [x] = arr.splice(ei,1); arr.splice(j,0,x);
  hapticaLieve(); ridisegnaModifica();
  setTimeout(()=>{ const el = document.getElementById('mexcard-'+j); if(el) el.scrollIntoView({behavior:'smooth', block:'center'}); }, 60);
}
async function rimuoviEsercizioStorico(ei){
  const e = modificaSessioneDraft.esercizi[ei];
  if(!(await mostraConferma(`Togliere "${e.nome}" da questa seduta? Le sue serie verranno cancellate quando salvi.`))) return;
  modificaSessioneDraft.esercizi.splice(ei,1);
  ridisegnaModifica();
}
function aggiungiSetModifica(ei){
  modificaSessioneDraft.esercizi[ei].sets.push({peso:'', rip:'', fatta:false, rpe:null});
  const scrollY = window.scrollY;
  renderSessioneModificaHTML();
  window.scrollTo(0, scrollY);
}

function updateSetModifica(ei,si,field,val){
  modificaSessioneDraft.esercizi[ei].sets[si][field] = val;
}
function setRPESetModifica(ei,si,val){
  modificaSessioneDraft.esercizi[ei].sets[si].rpe = val ? Number(val) : null;
}
function updateNotaEsercizioModifica(ei,val){
  modificaSessioneDraft.esercizi[ei].noteUtente = val;
}

async function salvaModificaSessione(id){
  const data = document.getElementById('smData').value;
  const btn = document.getElementById('saveSessioneModBtn');
  const errBox = document.getElementById('sessioneModError');
  errBox.innerHTML = '';

  // Stessa soglia di plausibilita' usata al primo salvataggio della seduta dal vivo.
  for(const e of modificaSessioneDraft.esercizi){
    for(const set of e.sets){
      if(set.peso!=='' && set.peso!=null){
        const p = parseFloat(set.peso);
        if(isNaN(p) || p<0 || p>500){
          errBox.innerHTML = `<div class="error-banner">Il peso inserito per "${e.nome}" non sembra plausibile (0–500 kg). Controllalo prima di salvare.</div>`;
          return;
        }
        set.peso = p;
      }
    }
  }

  btn.disabled = true; btn.textContent = 'Salvataggio...';
  try{
    const payload = { data, esercizi: modificaSessioneDraft.esercizi };
    await attendiScrittura(userCollection('sessioni').doc(id).update(payload));
    const idx = cache.sessioni.findIndex(x=>x.id===id);
    if(idx>-1) cache.sessioni[idx] = { ...cache.sessioni[idx], ...payload };
    cache.sessioni.sort((a,b)=> new Date(a.data)-new Date(b.data));
    setRoute({name:'progressi-detail', id, justSaved:true});
  }catch(e){
    errBox.innerHTML = `<div class="error-banner">${e.message}</div>`;
    btn.disabled = false; btn.textContent = 'Salva modifiche';
  }
}

    <button class="btn secondary" style="width:100%;" id="salvaObiettiviCorpoBtn" onclick="salvaObiettiviCorpo()">Salva obiettivi corporei</button>
  </div>`;
}

async function salvaObiettiviCorpo(){
  const pesoRaw = document.getElementById('ocPeso').value;
  const vitaRaw = document.getElementById('ocVita').value;
  const errBox = document.getElementById('obiettiviCorpoError');
  const btn = document.getElementById('salvaObiettiviCorpoBtn');
  errBox.innerHTML = '';
  const pesoTarget = pesoRaw ? Number(pesoRaw) : null;
  const vitaTarget = vitaRaw ? Number(vitaRaw) : null;
  if((pesoRaw && (isNaN(pesoTarget) || pesoTarget<20 || pesoTarget>400)) || (vitaRaw && (isNaN(vitaTarget) || vitaTarget<40 || vitaTarget>200))){
    errBox.innerHTML = '<div class="error-banner">Controlla i valori inseriti.</div>';
    return;
  }
  const obiettiviCorpo = { pesoTarget, vitaTarget };
  btn.disabled = true; btn.textContent = 'Salvataggio...';
  try{
    await attendiScrittura(db.collection('users').doc(currentUid).set({ obiettiviCorpo }, { merge:true }));
    profiloUtente.obiettiviCorpo = obiettiviCorpo;
    btn.disabled = false; btn.textContent = 'Obiettivi salvati ✅';
    setTimeout(()=>{ if(document.getElementById('salvaObiettiviCorpoBtn')) { btn.textContent='Salva obiettivi corporei'; } }, 1800);
  }catch(e){
    errBox.innerHTML = `<div class="error-banner">${e.message}</div>`;
    btn.disabled = false; btn.textContent = 'Salva obiettivi corporei';
  }
}

// salvaObiettivi() rimossa: gli obiettivi nutrizionali sono impostati dal trainer, non modificabili in app.

async function salvaProfiloModifiche(){
  const nome = document.getElementById('pNome').value.trim();
  const cognome = document.getElementById('pCognome').value.trim();
  const eta = document.getElementById('pEta').value;
  const altezza = document.getElementById('pAltezza').value;
  const sesso = document.getElementById('pSesso').value || null;
  const attenzioni = document.getElementById('pAttenzioni').value.trim();
  const errBox = document.getElementById('profiloError');
  const btn = document.getElementById('salvaProfiloBtn');
  errBox.innerHTML = '';
  if(!nome || !cognome || !eta){
    errBox.innerHTML = '<div class="error-banner">Compila tutti i campi.</div>';
    return;
  }
  if(Number(eta) < 10 || Number(eta) > 100){
    errBox.innerHTML = '<div class="error-banner">Inserisci un\'età valida.</div>';
    return;
  }
  if(altezza && (Number(altezza) < 100 || Number(altezza) > 230)){
    errBox.innerHTML = '<div class="error-banner">L\'altezza inserita non sembra plausibile (100–230 cm).</div>';
    return;
  }
  btn.disabled = true; btn.textContent = 'Salvataggio...';
  try{
    const altezzaVal = altezza ? Number(altezza) : null;
    await attendiScrittura(db.collection('users').doc(currentUid).set({ nome, cognome, eta: Number(eta), altezza: altezzaVal, sesso, attenzioni }, { merge:true }));
    profiloUtente = { ...profiloUtente, nome, cognome, eta: Number(eta), altezza: altezzaVal, sesso, attenzioni };
    setRoute({name:'home'});
  }catch(e){
    errBox.innerHTML = `<div class="error-banner">${e.message}</div>`;
    btn.disabled = false; btn.textContent = 'Salva modifiche';
  }
}

function microPer100(nome){
  return MICRO_DB[nome] || MICRO_DB[MICRO_ALIAS[nome]] || null;
}

function calcolaMicroOpzione(opz){
  const tot = { acqua:0 };
  MICRO_DEF.forEach(m=> tot[m.key]=0);
  opz.alimenti.forEach(a=>{
    const profilo = microPer100(a.n);
    if(!profilo) return;
    const match = String(a.q).match(/^(\d+(?:[.,]\d+)?)/);
    const grammi = match ? parseFloat(match[1].replace(',','.')) : 0;
    const fattore = grammi/100;
    tot.acqua += (profilo.acqua||0)*fattore;
    MICRO_DEF.forEach(m=> tot[m.key] += (profilo[m.key]||0)*fattore);
  });
  return tot;
}

/* Estrazione micronutrienti dai risultati Open Food Facts. Nella loro API i
   nutrienti "traccia" (vitamine, minerali) nel campo *_100g sono normalizzati
   in grammi (es. vitamin-c_100g:0.00006 = 60mg), a differenza dei macro
   (proteine/carboidrati/grassi) che sono già in grammi diretti: per questo
   qui vanno moltiplicati per riportarli in mg/mcg leggibili. Copertura non
   garantita: essendo un database collaborativo, molti prodotti non hanno
   tutti questi campi compilati. */
const OFF_MICRO_MAP = {
  fibre:{off:'fiber', factor:1}, // già in grammi su OFF, a differenza dei micronutrienti "traccia" sotto
  vitA:{off:'vitamin-a', factor:1e6}, vitC:{off:'vitamin-c', factor:1e3}, vitD:{off:'vitamin-d', factor:1e6},
  vitE:{off:'vitamin-e', factor:1e3}, vitB12:{off:'vitamin-b12', factor:1e6}, folati:{off:'vitamin-b9', factor:1e6},
  calcio:{off:'calcium', factor:1e3}, ferro:{off:'iron', factor:1e3}, magnesio:{off:'magnesium', factor:1e3},
  potassio:{off:'potassium', factor:1e3}, zinco:{off:'zinc', factor:1e3}, sodio:{off:'sodium', factor:1e3}
};
function estraiMicroOFF(nutrimenti){
  nutrimenti = nutrimenti || {};
  const micro100 = {};
  Object.keys(OFF_MICRO_MAP).forEach(key=>{
    const cfg = OFF_MICRO_MAP[key];
    const raw = nutrimenti[cfg.off+'_100g'];
    micro100[key] = (raw!=null && !isNaN(raw)) ? raw*cfg.factor : null;
  });
  const acquaRaw = nutrimenti['water_100g'];
  const acqua100 = (acquaRaw!=null && !isNaN(acquaRaw)) ? acquaRaw : null;
  return { micro100, acqua100 };
}

/* Genera l'HTML della griglia micronutrienti scalata alla grammatura scelta,
   riusato sia per il prodotto cercato/scansionato sia per il piano fisso. */
function microGridHtmlDaOFF(micro100, acqua100, fattore){
  const righe = MICRO_DEF.map(m=>{
    const v100 = micro100[m.key];
    if(v100==null) return '';
    const v = v100*fattore;
    if(!(v>0)) return '';
    const vArr = v<10 ? Math.round(v*10)/10 : Math.round(v);
    return `<div class="micro-row"><span>${m.label}</span><b>${vArr} ${m.unit}</b></div>`;
  }).join('');
  const acquaLine = acqua100!=null
    ? `<p style="margin:0 0 10px;">💧 Acqua stimata: <b style="color:var(--text);">${Math.round(acqua100*fattore)} ml circa</b></p>`
    : `<p style="margin:0 0 10px;color:var(--text-dim);">💧 Dato acqua non disponibile per questo prodotto.</p>`;
  return `${acquaLine}<div class="micro-grid">${righe || '<p style="margin:0;">Nessun dato su vitamine/minerali per questo prodotto su Open Food Facts.</p>'}</div>
    <p class="field-hint" style="margin-top:12px;">Dati Open Food Facts, database collaborativo: la copertura di vitamine e minerali varia da prodotto a prodotto.</p>`;
}

function renderAlimentazione(){
  pageTitle.textContent = 'Dieta';

  // Il piano alimentare e l'integrazione qui sotto sono personali, costruiti
  // sui dati e sulle analisi di Antonio: seguono la stessa logica delle schede
  // di allenamento (schedeAssegnate === null → account storico di Antonio).
  // Ai nuovi profili non viene mostrato nulla finché il trainer non assegnerà
  // un piano dedicato a ciascuno di loro.
  const pianoPersonale = profiloUtente && profiloUtente.schedeAssegnate === null;
  if(!pianoPersonale){
    view.innerHTML = `<div class="card">
      <p class="empty" style="padding:10px 0;">Il tuo trainer non ti ha ancora assegnato un piano alimentare personale. Questa sezione si popolerà con la tua dieta e la tua integrazione quando saranno pronte.</p>
    </div>`;
    return;
  }

  // La prima volta che si apre Dieta in giornata, chiede se oggi ci si allena:
  // determina il target del giorno e se mostrare l'extra su colazione/pranzo.
  // Il rendering prosegue comunque (di default sui valori di riposo) mentre
  // si attende la risposta: impostaGiornoAllenamento ri-renderizza da sola.
  impostaGiornoAllenamento();

  const t = obiettiviAttivi(!!cache.dietaLogOggi.giornoAllenamento);

  const macroDef = [
    {key:'prot', label:'Proteine', color:'var(--accent)', icona:'🍗'},
    {key:'carb', label:'Carboidrati', color:'var(--accent-2)', icona:'🍞'},
    {key:'grassi', label:'Grassi', color:'var(--accent-3)', icona:'🥑'},
  ];

  // Macro/kcal acquisiti oggi: somma delle opzioni dei pasti che hai spuntato
  // come "seguiti", usando l'opzione al momento selezionata per ciascun pasto.
  // Un pasto segnato "fatto" tramite un alimento extra (pastiViaExtra) non
  // aggiunge qui le kcal dell'opzione del piano: l'extra la sostituisce, non
  // la integra, e le sue kcal sono già contate nel giro su alimentiExtra
  // subito sotto — altrimenti risulterebbero sommate due volte.
  const acquisito = { kcal:0, prot:0, carb:0, grassi:0, polio:0 };
  DIETA_PIANO.pasti.forEach((p,i)=>{
    if(cache.dietaLogOggi.pastiFatti[i] && !(cache.dietaLogOggi.pastiViaExtra && cache.dietaLogOggi.pastiViaExtra[i])){
      const opz = p.opzioni[dietaOpzioneSel[i] || 0];
      acquisito.prot += opz.prot;
      acquisito.carb += opz.carb;
      acquisito.grassi += opz.grassi;
    }
  });
  const alimentiExtra = cache.dietaLogOggi.alimentiExtra || [];
  alimentiExtra.forEach(a=>{
    acquisito.prot += a.prot;
    acquisito.carb += a.carb;
    acquisito.grassi += a.grassi;
    acquisito.polio += (a.polio||0);
  });
  // Kcal ricalcolate da 4×proteine + 4×carboidrati + 9×grassi (kcalDaMacro),
  // non sommate dalle kcal dichiarate di ciascun alimento: altrimenti, per
  // via di fibre/alcol/arrotondamenti, l'anello poteva mostrare "oltre"
  // anche quando il conto a mano sui macro tornava sotto il target.
  acquisito.kcal = kcalDaMacro(acquisito.prot, acquisito.carb, acquisito.grassi, acquisito.polio);

  const kcalPct = t.kcal ? Math.min(100, Math.round((acquisito.kcal/t.kcal)*100)) : 0;
  const kcalOver = acquisito.kcal > t.kcal;
  // Rosso vero (--danger) quando si sfora, non più l'arancione di --accent-2
  // (che è già usato altrove come colore "neutro" dei carboidrati): deve
  // saltare all'occhio subito, sia sull'anello che sul numero.
  const kcalColor = kcalOver ? 'var(--danger)' : 'var(--accent)';
  const kcalDiff = t.kcal - acquisito.kcal;
  const kcalDiffHtml = kcalDiff>=0
    ? `<span class="kr-diff">mancano ${fmt1(kcalDiff)} kcal</span>`
    : `<span class="kr-diff over">+${fmt1(Math.abs(kcalDiff))} kcal oltre</span>`;
  const RING_R = 52, RING_C = 2*Math.PI*RING_R;
  const ringOffset = RING_C * (1 - kcalPct/100);

  // Per ogni macro mostriamo anche quanto manca (o di quanto si è sforato)
  // rispetto all'obiettivo, non solo "preso / obiettivo": aiuta a regolarsi
  // durante la giornata senza dover fare il conto a mente. Tile e numero
  // diventano rossi (--danger) quando si supera l'obiettivo di quel macro.
  const macroBarsHtml = macroDef.map(m=>{
    const val = acquisito[m.key];
    const goal = t[m.key];
    const pct = goal ? Math.min(100, Math.round((val/goal)*100)) : 0;
    const over = val > goal;
    const diff = goal - val;
    const diffLabel = diff>=0 ? `-${fmt1(diff)}g` : `+${fmt1(Math.abs(diff))}g`;
    return `<div class="dz-mac${over?' over':''}" style="--mc:${m.color};">
      <div class="dz-mac-top"><span>${m.icona} ${m.label}</span><span><b>${fmt1(val)}</b>/${fmt1(goal)}g <em>${diffLabel}</em></span></div>
      <div class="dz-bar"><div class="dz-bar-fill" style="width:${pct}%;"></div></div>
    </div>`;
  }).join('');

  // Stessa checklist "a riga piatta" già usata per i pasti (.meal-row):
  // si spuntano subito col cerchietto, senza dover aprire ciascun
  // integratore prima. Il dettaglio (indicazioni d'uso, particolarità) si
  // apre in un bottom sheet toccando il resto della riga.
  const suppHtml = INTEGRAZIONE_PIANO.integratori.map((s,i)=>{
    const preso = !!cache.dietaLogOggi.integratoriFatti[s.nome];
    return `
    <div class="meal-row${preso?' done':''}">
      <button class="meal-check${preso?' checked':''}" onclick="event.stopPropagation();toggleIntegratoreFatto('${s.nome.replace(/'/g,"\\'")}')" aria-label="${preso?'Segna come non preso':'Segna come preso'}">${preso?'✓':''}</button>
      <div class="meal-row-main" onclick="apriDettaglioIntegratore(${i})">
        <div class="meal-row-icon">${s.icona}</div>
        <div class="meal-row-info">
          <div class="meal-row-name">${s.nome}</div>
          <div class="meal-row-opt">${s.dose}</div>
        </div>
        <div class="meal-row-chev">›</div>
      </div>
    </div>`;
  }).join('');

  const timingHtml = allenamentoFattoOggi()
    ? `<div class="note-box">💪 Ti sei allenato oggi: nelle prossime ore punta su un pasto con proteine e carboidrati per favorire il recupero.</div>`
    : '';

  // Target per pasto: non più una media fissa uguale tutti i giorni, ma
  // ricalibrata sul target giornaliero ATTIVO (riposo o allenamento) ogni
  // volta che il tipo di giorno cambia — vedi targetPastiCalibrati(). Così
  // la somma dei 5 target torna a coincidere esattamente col totale del
  // giorno, invece di restare fissa sulla media mentre solo il totale in
  // alto (t.kcal) cambiava.
  // Non più il target del pasto (poco utile pasto per pasto, il target che
  // conta resta quello giornaliero in cima alla Dieta): qui mostriamo invece
  // il totale effettivo di quello che è stato segnato in quel pasto, così
  // il numero riflette cosa hai davvero mangiato, non cosa "dovresti".
  const pastoCorrente = pastoSuggeritoOra();
  const vocaRiga = a=>`<div class="dz-voce">
      <div class="dz-voce-info">
        <div class="dz-voce-n">${escHtml(a.nome)}${a.marca?` <span>· ${escHtml(a.marca)}</span>`:''}${a.isRicetta?' <span>· 🍲</span>':''}</div>
        <div class="dz-voce-m">${a.isRicetta?'1 porz.':`${a.grammi}g`} · <b>${fmt1(a.kcal)}</b> kcal · P ${fmt1(a.prot)} · C ${fmt1(a.carb)} · G ${fmt1(a.grassi)}</div>
      </div>
      <div class="efi-actions">
        ${btnModificaVoce(a)}
        <button class="efi-remove" onclick="rimuoviAlimentoExtra('${a.id}')" aria-label="Rimuovi">✕</button>
      </div>
    </div>`;
  const pastiTargetHtml = DIETA_PIANO.pasti.map((p,pi)=>{
    const voci = alimentiExtra.filter(a=> a.pasto===pi);
    const subKcal = voci.reduce((s,a)=>s+a.kcal,0);
    const subProt = voci.reduce((s,a)=>s+a.prot,0);
    const subCarb = voci.reduce((s,a)=>s+a.carb,0);
    const subGrassi = voci.reduce((s,a)=>s+a.grassi,0);
    const chiuso = dietaPastiChiusi.has(pi) && voci.length>0;
    const ripetibile = !voci.length && ultimoPastoPassato(pi);
    return `<div class="dz-pasto${voci.length?' has':''}${pi===pastoCorrente&&!voci.length?' now':''}">
      <div class="dz-pasto-head">
        <div class="dz-pasto-main" onclick="${voci.length?`toggleDietaPasto(${pi})`:`apriRicercaPerPasto(${pi})`}">
          <span class="dz-pasto-ico">${p.icona}</span>
          <div class="dz-pasto-tit">
            <div class="dz-pasto-n">${p.nome}${voci.length?` <i class="dz-chev${chiuso?'':' open'}">›</i>`:''}</div>
            <div class="dz-pasto-s">${voci.length ? `<b>${fmt1(subKcal)} kcal</b> · P ${fmt1(subProt)} · C ${fmt1(subCarb)} · G ${fmt1(subGrassi)}` : p.orario}</div>
          </div>
        </div>
        <button class="dz-add" onclick="apriRicercaPerPasto(${pi})" aria-label="Aggiungi a ${p.nome}">+</button>
      </div>
      ${voci.length && !chiuso ? `<div class="dz-voci">${voci.map(vocaRiga).join('')}</div>` : ''}
      ${ripetibile ? `<button class="dz-repeat" onclick="ripetiPastoPassato(${pi})">↻ Ripeti come ${ripetibile.label} <span>${ripetibile.n} ${ripetibile.n===1?'voce':'voci'} · ${fmt1(ripetibile.kcal)} kcal</span></button>` : ''}
    </div>`;
  }).join('');

  // Le voci extra salvate senza un pasto (dati vecchi, prima che ogni extra
  // portasse con sé il pasto scelto al salvataggio) finiscono qui, nel
  // gruppo "Altro" mostrato in fondo a Segna pasto, invece di sparire o
  // rompere il rendering. Le voci con un pasto valido sono invece mostrate
  // direttamente dentro la card del pasto corrispondente (vedi pastiTargetHtml).
  const extraSenzaPasto = alimentiExtra.filter(a=> a.pasto==null || a.pasto<0 || a.pasto>=DIETA_PIANO.pasti.length);
  const extraSenzaPastoHtml = extraSenzaPasto.length ? `<div class="extra-food-group">
      <div class="efg-head"><span>❔ Altro</span><span>${fmt1(extraSenzaPasto.reduce((s,a)=>s+a.kcal,0))} kcal</span></div>
      <div class="extra-food-list">${extraSenzaPasto.map(a=>`
        <div class="extra-food-item">
          <div class="efi-info">
            <div class="efi-n">${a.nome}${a.marca?` <span class="efi-brand">· ${a.marca}</span>`:''}${a.isRicetta?' <span class="efi-brand">· 🍲 ricetta</span>':''}</div>
            <div class="efi-m">${a.isRicetta?'1 porzione':`${a.grammi}g`} · ${fmt1(a.kcal)} kcal · P ${fmt1(a.prot)}g · C ${fmt1(a.carb)}g · G ${fmt1(a.grassi)}g</div>
          </div>
          <div class="efi-actions">
            ${btnModificaVoce(a)}
            <button class="efi-remove" onclick="rimuoviAlimentoExtra('${a.id}')" aria-label="Rimuovi">✕</button>
          </div>
        </div>`).join('')}</div>
    </div>` : '';

  const segnaPastoTabHtml = `
    ${timingHtml}
    ${pastiTargetHtml}
    ${extraSenzaPastoHtml}
    <details class="dz-note">
      <summary>📝 Note pratiche</summary>
      <div class="dic-b">Grassi da condimento (olio EVO) sempre a crudo o a fine cottura. Verdura non pesata in modo ossessivo: 150-200g corrispondono a circa 1 piatto abbondante o 2 pugni chiusi. Alcol in eliminazione (circa 1 birra media a settimana, ~130 kcal) e pasto libero nel weekend restano gestiti come da nota generale del piano — non compresi nelle tabelle sopra.</div>
    </details>`;

  const integratoriTabHtml = `
    <div class="diet-summary" style="margin-bottom:12px;">
      <div class="tlt">Integrazione</div>
      <div class="supp-intro" style="margin-bottom:0;">${INTEGRAZIONE_PIANO.intro}</div>
    </div>

    ${suppHtml}

    <div class="diet-info-card warn">
      <div class="dic-t">⚠️ Integrazione e farmaci</div>
      <div class="dic-b">${INTEGRAZIONE_PIANO.noteImportanti}</div>
    </div>
    <div class="diet-info-card warn">
      <div class="dic-t">⚠️ Note importanti</div>
      <div class="dic-b">Questo piano non sostituisce una valutazione medica. Farmaci in corso (Lyrica, Zarelis) e ADHD sono stati considerati nel quadro generale ma non modificano direttamente il calcolo calorico. Dalle analisi del 12/09/2026: Vitamina B12 attiva ALTA (217,1 pmol/L, pattern ricorrente già visto il 29/06/24) e AST ALTA (45 U/L, ALT e GGT normali — possibile origine muscolare legata ai carichi in palestra, idealmente da verificare col medico anche con dosaggio CK). Vitamina D risultata sufficiente (32,9 ng/mL): nessuna integrazione necessaria per ora. In caso di sintomi digestivi persistenti o variazioni cliniche, consulta il medico curante.</div>
    </div>
    <div class="diet-info-card">
      <div class="dic-t">📅 Prossima rivalutazione</div>
      <div class="dic-b">Tra circa 4 settimane (fine Blocco 2): peso, vita, foto, feedback sull'allenamento (inclusa risposta al cardio) e follow-up col medico su B12/AST se effettuato. Da anticipare se emergono novità dal medico, fame eccessiva o cali di energia marcati, il peso si muove più velocemente del previsto dopo il cardio, o cambia in modo significativo la scheda di allenamento.</div>
    </div>`;

  const tabContentHtml = dietaTab==='integratori' ? integratoriTabHtml : segnaPastoTabHtml;

  const nIntegr = INTEGRAZIONE_PIANO.integratori.length;
  const nIntegrFatti = INTEGRAZIONE_PIANO.integratori.filter(x=>cache.dietaLogOggi.integratoriFatti[x.nome]).length;
  const acquaMl = cache.dietaLogOggi.acquaMl || 0;
  const acquaPct = Math.min(100, Math.round((acquaMl/(t.acquaMl||2500))*100));
  const giornoSet = cache.dietaLogOggi.giornoAllenamento!==null;
  const faseNome = pianoDietaAttivo().fase;

  view.innerHTML = `
    <div class="dz-summary">
      <div class="dz-sum-top">
        <div class="dz-ring">
          <svg viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="${RING_R}" class="kr-bg"></circle>
            <circle cx="60" cy="60" r="${RING_R}" class="kr-fill" style="stroke:${kcalColor};stroke-dasharray:${RING_C};stroke-dashoffset:${ringOffset};"></circle>
          </svg>
          <div class="dz-ring-c"><b style="color:${kcalColor};">${fmt1(acquisito.kcal)}</b><span>/ ${fmt1(t.kcal)}</span></div>
        </div>
        <div class="dz-sum-side">
          <div class="dz-kcal-line">${kcalOver ? `<span class="over">+${fmt1(Math.abs(kcalDiff))} kcal oltre</span>` : `<span>Mancano <b>${fmt1(kcalDiff)}</b> kcal</span>`}</div>
          ${giornoSet ? `<div class="dz-seg">
            <button class="${!cache.dietaLogOggi.giornoAllenamento?'on':''}" onclick="impostaGiornoDiretto(false)">🛋️ Riposo</button>
            <button class="${cache.dietaLogOggi.giornoAllenamento?'on':''}" onclick="impostaGiornoDiretto(true)">🏋️ Pesi</button>
          </div>` : ''}
        </div>
      </div>
      <div class="dz-macros">${macroBarsHtml}</div>
      <div class="dz-water">
        <span>💧 ${(acquaMl/1000).toFixed(2).replace('.',',')} L</span>
        <div class="dz-bar"><div class="dz-bar-fill" style="width:${acquaPct}%;--mc:var(--accent-2);"></div></div>
        <button onclick="aggiungiAcqua(-250)" ${acquaMl<=0?'disabled':''} aria-label="Togli 250 ml">−</button>
        <button onclick="aggiungiAcqua(250)" aria-label="Aggiungi 250 ml">+250</button>
      </div>
      <div class="dz-fase">${faseNome}</div>
    </div>

    ${renderBlocco3DietaAnteprima()}
    ${renderFasiDieta()}

    <div class="dz-tabs">
      <button class="${dietaTab==='segna-pasto'?'on':''}" onclick="setDietaTab('segna-pasto')">🍽️ Pasti</button>
      <button class="${dietaTab==='integratori'?'on':''}" onclick="setDietaTab('integratori')">💊 Integratori <i>${nIntegrFatti}/${nIntegr}</i></button>
      <button onclick="setRoute({name:'diario'})">📖 Diario</button>
    </div>

    ${tabContentHtml}
  `;
}

let dietaPastiChiusi = new Set();
function toggleDietaPasto(i){
  if(dietaPastiChiusi.has(i)) dietaPastiChiusi.delete(i); else dietaPastiChiusi.add(i);
  hapticaLieve();
  renderAlimentazione();
}

/* Ultimo giorno passato in cui il pasto pi ha delle voci: serve al tasto
   "Ripeti come ieri". Ritorna null se non c'è nulla da ripetere. */
function ultimoPastoPassato(pi){
  const oggiId = todayKey();
  const giorni = (cache.dietaLog||[]).filter(d=> d.id < oggiId ).slice().sort((a,b)=> a.id<b.id?1:-1);
  for(const g of giorni){
    const voci = (g.alimentiExtra||[]).filter(a=> a.pasto===pi);
    if(voci.length){
      const ieri = new Date(); ieri.setDate(ieri.getDate()-1);
      const label = g.id===chiaveGiorno(ieri) ? 'ieri' : new Date(g.id+'T12:00:00').toLocaleDateString('it-IT',{weekday:'long'});
      return { giorno:g, voci, label, n:voci.length, kcal:voci.reduce((s,a)=>s+a.kcal,0) };
    }
  }
  return null;
}
function chiaveGiorno(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function ripetiPastoPassato(pi){
  const r = ultimoPastoPassato(pi);
  if(!r) return;
  r.voci.forEach(v=>{
    const copia = JSON.parse(JSON.stringify(v));
    copia.id = 'extra-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
    copia.pasto = pi;
    aggiungiAlimentoExtra(copia);
  });
  segnaPastoFattoDaExtra(pi);
  hapticaMedia();
  renderAlimentazione();
}

function selectDietaOpzione(i, oi){

}

/* Apre il foglio a comparsa con le 5 opzioni del pasto i, per sceglierne una

    <label class="done-toggle" style="margin-top:14px;">

/* ============ DIARIO ALIMENTARE STORICO ============
   Ripercorre i giorni passati usando cache.dietaLog. Per i pasti segnati da
   quando esiste "pastiSnapshot" mostriamo anche titolo e kcal/macro reali;
   per quelli segnati prima (o se manca lo snapshot per qualsiasi motivo)
   contano comunque come "fatti" ma senza dettaglio nutrizionale nel totale. */
let diarioOpenSet = new Set();

function toggleDiarioGiorno(id){
  if(diarioOpenSet.has(id)) diarioOpenSet.delete(id); else diarioOpenSet.add(id);
  renderDiario();
}

/* ============ MODIFICA/ELIMINAZIONE VOCI DI GIORNI PASSATI ============
   A differenza di "oggi" (cache.dietaLogOggi), un giorno passato va letto e
   riscritto direttamente nell'oggetto corrispondente dentro cache.dietaLog:
   questo helper centralizza il salvataggio su Firestore + l'aggiornamento
   della cache, e tiene allineata anche cache.dietaLogOggi quando il giorno
   modificato è "oggi" (così la schermata Dieta resta coerente col Diario). */
function salvaGiornoDietaLog(giornoId, giorno){
  if(!currentUid) return;
  const { id, ...dati } = giorno;
  userCollection('dietaLog').doc(giornoId).set(dati, { merge:true }).catch(()=>{});
  if(giornoId === todayKey()){
    cache.dietaLogOggi.pastiFatti = giorno.pastiFatti || {};
    cache.dietaLogOggi.pastiViaExtra = giorno.pastiViaExtra || {};
    cache.dietaLogOggi.pastiSnapshot = giorno.pastiSnapshot || {};
    cache.dietaLogOggi.alimentiExtra = giorno.alimentiExtra || [];
  }
}

/* Elimina l'intero giorno dal diario (pasti, integratori, acqua, extra):
   usato dal cestino nell'intestazione della card giorno, non da quello sui
   singoli pasti/alimenti. Se il giorno eliminato è "oggi", azzeriamo anche
   cache.dietaLogOggi con la stessa forma di default usata in loadData(),
   così Dieta/Home restano coerenti senza bisogno di un reload. */
async function confermaEliminaGiornoIntero(giornoId){
  const g = cache.dietaLog.find(d=>d.id===giornoId);
  const msg = (g && g.manualMacros)
    ? 'Eliminare questo giorno dal diario? Il totale kcal/macro inserito manualmente verrà cancellato e non potrai recuperarlo.'
    : 'Eliminare questo giorno dal diario? Pasti, integratori, acqua ed extra registrati verranno cancellati e non potrai recuperarli.';
  if(!(await mostraConferma(msg))) return;
  cache.dietaLog = cache.dietaLog.filter(d=>d.id!==giornoId);
  if(currentUid) userCollection('dietaLog').doc(giornoId).delete().catch(()=>{});
  if(giornoId === todayKey()){
    cache.dietaLogOggi = {
      pastiFatti: {}, acquaMl: 0, integratoriFatti: {}, alimentiExtra: [],
      pastiSnapshot: {}, pastiViaExtra: {}, giornoAllenamento: null
    };
  }
  renderDiario();
}

async function confermaEliminaPastoGiorno(giornoId, i){
  if(!(await mostraConferma('Rimuovere questo pasto dal diario? Tornerà "non segnato" per quel giorno.'))) return;
  const g = cache.dietaLog.find(d=>d.id===giornoId);
  if(!g) return;
  if(g.pastiFatti) g.pastiFatti[i] = false;
  if(g.pastiViaExtra) delete g.pastiViaExtra[i];
  if(g.pastiSnapshot) delete g.pastiSnapshot[i];
  salvaGiornoDietaLog(giornoId, g);
  renderDiario();
}

async function confermaEliminaAlimentoExtraGiorno(giornoId, alimentoId){
  if(!(await mostraConferma('Rimuovere questo alimento dal diario?'))) return;
  const g = cache.dietaLog.find(d=>d.id===giornoId);
  if(!g) return;
  const rimosso = (g.alimentiExtra||[]).find(a=>a.id===alimentoId);
  g.alimentiExtra = (g.alimentiExtra||[]).filter(a=>a.id!==alimentoId);
  // Stessa logica usata per "oggi" in rimuoviAlimentoExtra(): se il pasto era
  // stato segnato fatto grazie a questo extra e non ne resta più nessuno su
  // quel pasto, togliamo anche la spunta al pasto.
  const pastoIdx = rimosso ? rimosso.pasto : null;
  if(pastoIdx!=null && pastoIdx>=0 && pastoIdx<DIETA_PIANO.pasti.length && g.pastiViaExtra && g.pastiViaExtra[pastoIdx]){
    const restanoExtraSulPasto = g.alimentiExtra.some(a=>a.pasto===pastoIdx);
    if(!restanoExtraSulPasto){
      if(g.pastiFatti) g.pastiFatti[pastoIdx] = false;
      delete g.pastiViaExtra[pastoIdx];
      if(g.pastiSnapshot) delete g.pastiSnapshot[pastoIdx];
    }
  }
  salvaGiornoDietaLog(giornoId, g);
  renderDiario();
}

/* Modifica quale opzione risulta mangiata in un pasto già segnato di un
   giorno passato: stesso bottom-sheet visivo del selettore di "oggi"
   (classi sheet-overlay/opt-card condivise), ma scritto sul giorno storico
   invece che su cache.dietaLogOggi. Non applicabile ai pasti sostituiti da
   un alimento extra: per quelli si modifica/elimina l'alimento stesso. */
let diarioModificaState = null; // {giornoId, pastoIdx}

function apriModificaPastoGiorno(giornoId, i){
  diarioModificaState = { giornoId, pastoIdx:i };
  mostraModificaPastoOverlay();
}

function mostraModificaPastoOverlay(){
  const { giornoId, pastoIdx } = diarioModificaState;
  const p = DIETA_PIANO.pasti[pastoIdx];
  const g = cache.dietaLog.find(d=>d.id===giornoId);
  const snapAttuale = g && g.pastiSnapshot ? g.pastiSnapshot[pastoIdx] : null;
  let overlay = document.getElementById('diarioModSheetOverlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'diarioModSheetOverlay';
    overlay.className = 'sheet-overlay';
    overlay.addEventListener('click', e=>{ if(e.target===overlay) chiudiModificaPastoGiorno(); });
    document.body.appendChild(overlay);
  }
  const cardsHtml = p.opzioni.map((o,oi)=>{
    const active = !!(snapAttuale && snapAttuale.titolo===o.titolo);
    return `<div class="opt-card${active?' active':''}">
      <div class="opt-card-top" onclick="sceglieOpzioneModificaGiorno(${oi})">
        <div class="opt-card-main">
          <div class="opt-card-title">${o.titolo}${active?' <span class="opt-card-badge">Registrato</span>':''}</div>
          <div class="opt-card-macros">
            <span><span class="mb-dot" style="background:var(--accent);"></span>P <b>${o.prot}g</b></span>
            <span><span class="mb-dot" style="background:var(--accent-2);"></span>C <b>${o.carb}g</b></span>
            <span><span class="mb-dot" style="background:var(--accent-3);"></span>G <b>${o.grassi}g</b></span>
          </div>
        </div>
        <div class="opt-card-kcal">${o.kcal}<span>kcal</span></div>
      </div>
    </div>`;
  }).join('');
  overlay.innerHTML = `<div class="sheet-box" id="diarioModSheetBox"><div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title">${p.icona} ${p.nome}</div>
      <button class="sheet-close" onclick="chiudiModificaPastoGiorno()" aria-label="Chiudi">✕</button>
    </div>
    <p class="field-hint" style="margin:-4px 0 14px;">Tocca l'opzione che hai effettivamente mangiato quel giorno.</p>
    <div class="opt-card-list">${cardsHtml}</div>
  </div>`;
  attachSwipeDownToDismiss(overlay.querySelector('#diarioModSheetBox'), chiudiModificaPastoGiorno);
}

function sceglieOpzioneModificaGiorno(oi){
  const { giornoId, pastoIdx } = diarioModificaState || {};
  const g = cache.dietaLog.find(d=>d.id===giornoId);
  if(!g){ chiudiModificaPastoGiorno(); return; }
  const opz = DIETA_PIANO.pasti[pastoIdx].opzioni[oi];
  if(!g.pastiFatti) g.pastiFatti = {};
  g.pastiFatti[pastoIdx] = true;
  if(g.pastiViaExtra) delete g.pastiViaExtra[pastoIdx]; // torna a un pasto "da piano"
  if(!g.pastiSnapshot) g.pastiSnapshot = {};
  g.pastiSnapshot[pastoIdx] = { titolo:opz.titolo, kcal:kcalDaMacro(opz.prot, opz.carb, opz.grassi), prot:opz.prot, carb:opz.carb, grassi:opz.grassi };
  salvaGiornoDietaLog(giornoId, g);
  chiudiModificaPastoGiorno();
  renderDiario();
}

function chiudiModificaPastoGiorno(){
  const overlay = document.getElementById('diarioModSheetOverlay');
  if(overlay) overlay.remove();
  diarioModificaState = null;
}

/* Calcola i totali kcal/macro di un giorno del diario. Se il giorno ha
   manualMacros (inserito a mano, es. importato da un'altra app invece che
   segnando i singoli pasti) quello è il totale, punto: non si somma anche
   a eventuali pasti/extra, che per un giorno "manuale" restano vuoti. */
function calcolaTotaliGiorno(g){
  // Il totale kcal di un giorno inserito a mano (apriGiornoManualeForm, per i
  // giorni tracciati altrove) resta quello scritto dall'utente: è un valore
  // esplicito, non ricavato dai singoli alimenti, quindi non va ricalcolato.
  if(g.manualMacros){
    const m = g.manualMacros;
    return { kcalTot:m.kcal||0, protTot:m.prot||0, carbTot:m.carb||0, grassiTot:m.grassi||0, dettagliNonDisponibili:false, manuale:true };
  }
  const pastiFatti = g.pastiFatti || {};
  const pastiSnapshot = g.pastiSnapshot || {};
  const alimentiExtra = g.alimentiExtra || [];
  let protTot = 0, carbTot = 0, grassiTot = 0, polioTot = 0, dettagliNonDisponibili = false;
  Object.keys(pastiFatti).forEach(i=>{
    if(!pastiFatti[i]) return;
    const snap = pastiSnapshot[i];
    if(snap){ protTot+=snap.prot; carbTot+=snap.carb; grassiTot+=snap.grassi; }
    else dettagliNonDisponibili = true;
  });
  alimentiExtra.forEach(a=>{ protTot+=a.prot; carbTot+=a.carb; grassiTot+=a.grassi; polioTot+=(a.polio||0); });
  // Kcal ricalcolate dai macro (vedi kcalDaMacro) invece di sommare le kcal
  // dichiarate di ciascun alimento: così il totale del giorno coincide
  // sempre col conto 4/4/9 fatto sui macro, anche per i giorni già loggati.
  const kcalTot = kcalDaMacro(protTot, carbTot, grassiTot, polioTot);
  return { kcalTot, protTot, carbTot, grassiTot, polioTot, dettagliNonDisponibili, manuale:false };
}

/* ============ GIORNO CON MACRO INSERITI A MANO ============
   Alternativa al segnare pasto per pasto: utile per un giorno tracciato con
   un'altra app/a mente, di cui si conosce solo il totale kcal/macro. Riusa
   lo stesso pattern a bottom-sheet di mostraModificaPastoOverlay(). Limitato
   a ieri e giorni precedenti: "oggi" resta gestito da Dieta/pastiFatti, che
   Home e la card Dieta leggono direttamente e non saprebbero interpretare
   un totale manuale. */
let giornoManualeState = null; // {mode:'new'|'edit', giornoId}

function chiaveIeri(){
  const d = new Date(); d.setDate(d.getDate()-1);
  const pad = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

function apriGiornoManualeForm(giornoId){
  const editing = !!giornoId;
  const g = editing ? cache.dietaLog.find(d=>d.id===giornoId) : null;
  giornoManualeState = { mode: editing?'edit':'new', giornoId: giornoId||null };
  let overlay = document.getElementById('giornoManualeOverlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'giornoManualeOverlay';
    overlay.className = 'sheet-overlay';
    overlay.addEventListener('click', e=>{ if(e.target===overlay) chiudiGiornoManualeForm(); });
    document.body.appendChild(overlay);
  }
  const ieriK = chiaveIeri();
  const dataVal = editing ? giornoId : ieriK;
  const m = (g && g.manualMacros) || {};
  overlay.innerHTML = `<div class="sheet-box" id="giornoManualeBox"><div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title">📥 ${editing?'Modifica giorno':'Aggiungi giorno'}</div>
      <button class="sheet-close" onclick="chiudiGiornoManualeForm()" aria-label="Chiudi">✕</button>
    </div>
    <p class="field-hint" style="margin:-4px 0 14px;">Inserisci il totale kcal e macro del giorno (es. tracciato con un'altra app), invece di segnare i singoli pasti. Sovrascrive eventuali pasti già segnati per quel giorno. Disponibile da ieri in poi.</p>
    <div id="gmError"></div>
    <div class="field"><label>Data</label><input type="date" id="gmData" max="${ieriK}" value="${dataVal}" ${editing?'disabled':''}></div>
    <div class="field"><label>Kcal totali</label><input type="number" min="0" id="gmKcal" value="${m.kcal??''}"></div>
    <div class="grid2">
      <div class="field"><label>Proteine (g)</label><input type="number" min="0" step="0.1" id="gmProt" value="${m.prot??''}"></div>
      <div class="field"><label>Carboidrati (g)</label><input type="number" min="0" step="0.1" id="gmCarb" value="${m.carb??''}"></div>
    </div>
    <div class="field"><label>Grassi (g)</label><input type="number" min="0" step="0.1" id="gmGrassi" value="${m.grassi??''}"></div>
    <button class="btn" style="margin-top:6px;" onclick="salvaGiornoManuale()">Salva</button>
  </div>`;
  attachSwipeDownToDismiss(overlay.querySelector('#giornoManualeBox'), chiudiGiornoManualeForm);
}

function chiudiGiornoManualeForm(){
  const overlay = document.getElementById('giornoManualeOverlay');
  if(overlay) overlay.remove();
  giornoManualeState = null;
}

async function salvaGiornoManuale(){
  const errBox = document.getElementById('gmError');
  errBox.innerHTML = '';
  const dataInput = document.getElementById('gmData');
  const giornoId = giornoManualeState.mode==='edit' ? giornoManualeState.giornoId : dataInput.value;
  const kcal = Number(document.getElementById('gmKcal').value);
  const prot = Number(document.getElementById('gmProt').value);
  const carb = Number(document.getElementById('gmCarb').value);
  const grassi = Number(document.getElementById('gmGrassi').value);

  if(!giornoId){ errBox.innerHTML = '<div class="error-banner">Seleziona una data.</div>'; return; }
  if(giornoId > chiaveIeri()){ errBox.innerHTML = '<div class="error-banner">Puoi inserire macro manuali solo da ieri in poi (per oggi usa Dieta).</div>'; return; }
  if(!kcal || kcal<=0){ errBox.innerHTML = '<div class="error-banner">Inserisci le kcal totali del giorno.</div>'; return; }
  if([prot,carb,grassi].some(v=>isNaN(v)||v<0)){ errBox.innerHTML = '<div class="error-banner">Compila proteine, carboidrati e grassi (anche 0).</div>'; return; }

  let g = cache.dietaLog.find(d=>d.id===giornoId);
  if(!g){
    g = { id:giornoId, pastiFatti:{}, acquaMl:0, integratoriFatti:{}, alimentiExtra:[], pastiSnapshot:{}, pastiViaExtra:{}, giornoAllenamento:null };
    cache.dietaLog.push(g);
  }
  g.manualMacros = { kcal, prot, carb, grassi };
  cache.dietaLog.sort((a,b)=> a.id.localeCompare(b.id));
  salvaGiornoDietaLog(giornoId, g);
  chiudiGiornoManualeForm();
  diarioOpenSet.delete(giornoId);
  renderDiario();
}

let diarioLimite = 21;
function mostraAltroDiario(){ diarioLimite += 21; const y=window.scrollY; renderDiario(); window.scrollTo(0,y); }

function renderDiario(){
  pageTitle.textContent = 'Diario';
  const pianoPersonale = profiloUtente && profiloUtente.schedeAssegnate === null;
  if(!pianoPersonale){
    view.innerHTML = `<p class="empty"><span class="empty-icon">⏳</span>Questa sezione si popolerà quando avrai un piano alimentare personale.</p>`;
    return;
  }
  const giorniTutti = cache.dietaLog.slice().sort((a,b)=> b.id.localeCompare(a.id));
  const giorni = giorniTutti.slice(0, diarioLimite);

  // Azione sempre visibile in cima, anche a diario vuoto: permette di
  // aggiungere un giorno passato inserendo solo il totale kcal/macro (utile
  // per recuperare giorni tracciati con un'altra app o a mente).
  const azioniHtml = `<div class="diet-quicklinks" style="margin-bottom:16px;">
    <div class="qlink" onclick="apriGiornoManualeForm()"><span class="qi">➕</span><span class="ql">Aggiungi giorno</span></div>
  </div>`;

  if(!giorni.length){
    view.innerHTML = azioniHtml + `<p class="empty"><span class="empty-icon">📖</span>Nessun giorno tracciato ancora.<br>Segna un pasto, un integratore o dell'acqua in Dieta, oppure aggiungi un giorno passato con le kcal totali.</p>`;
    return;
  }
  const oggiK = todayKey();

  const html = giorni.map(g=>{
    const open = diarioOpenSet.has(g.id);
    const integratoriFatti = g.integratoriFatti || {};
    const alimentiExtra = g.alimentiExtra || [];
    const { kcalTot, protTot, carbTot, grassiTot, dettagliNonDisponibili, manuale } = calcolaTotaliGiorno(g);

    const numPastiFatti = Object.values(g.pastiFatti||{}).filter(Boolean).length;
    const numIntegrFatti = Object.values(integratoriFatti).filter(Boolean).length;
    const dataLabel = g.id===oggiK ? 'Oggi' : new Date(g.id).toLocaleDateString('it-IT',{weekday:'long', day:'numeric', month:'long'});
    const tipoGiornoLabel = g.giornoAllenamento===true ? ' · 🏋️ allenamento' : g.giornoAllenamento===false ? ' · 🛋️ riposo' : '';

    const sottotitolo = manuale
      ? '📥 Inserito manualmente'
      : `${numPastiFatti}/${DIETA_PIANO.pasti.length} pasti · ${numIntegrFatti} integratori · ${((g.acquaMl||0)/1000).toFixed(1).replace('.',',')} L${tipoGiornoLabel}`;

    // Anteprima macro sempre visibile in testa alla card (non solo ad
    // aperta): risponde a "voglio vedere in anteprima le kcal e tutte le
    // macro" senza dover toccare la card per aprirla.
    const macroPreviewHtml = kcalTot>0 ? `<div class="mh-macro-preview">
      <span><span class="mb-dot" style="background:var(--accent);"></span>P <b>${fmt1(protTot)}g</b></span>
      <span><span class="mb-dot" style="background:var(--accent-2);"></span>C <b>${fmt1(carbTot)}g</b></span>
      <span><span class="mb-dot" style="background:var(--accent-3);"></span>G <b>${fmt1(grassiTot)}g</b></span>
    </div>` : '';

    let corpoHtml;
    if(manuale){
      corpoHtml = `<p class="diario-manuale-note">📥 Totale inserito manualmente per questo giorno (non pasto per pasto): quando apri la card vedi solo il riepilogo, perché non ci sono pasti singoli salvati.</p>
        <button class="btn small secondary" onclick="event.stopPropagation();apriGiornoManualeForm('${g.id}')">✏️ Modifica valori</button>`;
    } else {
      const pastiFatti = g.pastiFatti || {};
      const pastiSnapshot = g.pastiSnapshot || {};
      const pastiRighe = DIETA_PIANO.pasti.map((p,i)=>{
        if(!pastiFatti[i]) return '';
        const snap = pastiSnapshot[i];
        const viaExtraGiorno = !!(g.pastiViaExtra && g.pastiViaExtra[i]);
        // Un pasto "sostituito con alimento extra" ha kcal:0 nello snapshot per
        // costruzione (le kcal reali sono contate una sola volta, tra gli
        // alimenti extra qui sotto): mostriamo "vedi extra" invece di "0 kcal",
        // che sembrerebbe un errore.
        const valoreKcal = snap ? (viaExtraGiorno ? 'vedi extra ↓' : fmt1(kcalDaMacro(snap.prot, snap.carb, snap.grassi))+' kcal') : 'segnato';
        // Un pasto sostituito da un extra si modifica/elimina dall'alimento
        // extra stesso qui sotto, non da qui: qui offriamo solo l'eliminazione
        // (che rimette il pasto "non segnato"), non la scelta di un'opzione.
        const azioni = `<span class="diario-item-actions">
          ${!viaExtraGiorno ? `<button class="diario-mini-btn" onclick="event.stopPropagation();apriModificaPastoGiorno('${g.id}',${i})" title="Cambia opzione mangiata">✏️</button>` : ''}
          <button class="diario-mini-btn" onclick="event.stopPropagation();confermaEliminaPastoGiorno('${g.id}',${i})" title="Rimuovi dal diario">🗑️</button>
        </span>`;
        return `<div class="micro-row"><span>${p.icona} ${p.nome}${snap?` — ${snap.titolo}`:''}${azioni}</span><b>${valoreKcal}</b></div>`;
      }).join('');

      const integrRighe = INTEGRAZIONE_PIANO.integratori
        .filter(s=> integratoriFatti[s.nome])
        .map(s=>`<div class="micro-row"><span>${s.icona} ${s.nome}</span><b>✅</b></div>`).join('');

      const extraRighe = alimentiExtra.map(a=>`<div class="micro-row"><span>${a.nome}${a.marca?` · ${a.marca}`:''} (${a.isRicetta?'1 porzione':`${a.grammi}g`})<span class="diario-item-actions">${btnModificaVoce(a, g.id)}<button class="diario-mini-btn" onclick="event.stopPropagation();confermaEliminaAlimentoExtraGiorno('${g.id}','${a.id}')" title="Rimuovi dal diario">🗑️</button></span></span><b>${fmt1(a.kcal)} kcal</b></div>`).join('');

      corpoHtml = `${pastiRighe || '<p style="margin:0 0 8px;color:var(--text-dim);font-size:12.5px;">Nessun pasto segnato.</p>'}
        ${integrRighe}
        ${extraRighe}
        ${dettagliNonDisponibili ? '<p class="field-hint" style="margin-top:10px;">Alcuni pasti di questo giorno sono stati segnati prima che il diario registrasse i dettagli: contano come "fatti" ma senza kcal/macro nel totale qui sopra.</p>' : ''}`;
    }

    return `<div class="meal-card${open?' open':''}">
      <div class="meal-head" onclick="toggleDiarioGiorno('${g.id}')">
        <div class="icon">${manuale?'📥':'📅'}</div>
        <div class="mh-info">
          ${g.id===oggiK ? `<span class="turn-badge" style="margin-bottom:4px;">📍 Oggi</span>` : ''}
          <div class="mh-name">${dataLabel}</div>
          <div class="mh-time">${sottotitolo}</div>
          ${macroPreviewHtml}
        </div>
        <div class="mh-kcal">${fmt1(kcalTot)} kcal</div>
        <button class="diario-mini-btn diario-del-giorno" onclick="event.stopPropagation();confermaEliminaGiornoIntero('${g.id}')" title="Elimina l'intero giorno">🗑️</button>
        <div class="mh-chev">▾</div>
      </div>
      <div class="meal-body"><div class="meal-body-in">
        ${corpoHtml}
      </div></div>
    </div>`;
  }).join('');

  const altroHtml = giorniTutti.length > giorni.length
    ? `<button class="btn secondary" style="width:100%;margin:6px 0 14px;" onclick="mostraAltroDiario()">Mostra giorni precedenti (${giorniTutti.length - giorni.length})</button>` : '';
  view.innerHTML = azioniHtml + html + altroHtml;
}

/* ============ CERCA ALIMENTO (database Open Food Facts) ============
   Ricerca testuale per aggiungere alla giornata un alimento che non fa parte
   del piano fisso, con grammatura scelta liberamente. Nessuna chiave API:
   Open Food Facts è un database aperto e gratuito, pensato per essere
   interrogato direttamente dal browser. */
// sessionAggiunti: alimenti già salvati in questa visita a "Cerca alimento",
// per poterne aggiungere più di uno di seguito senza dover rientrare da capo
// nella schermata ogni volta (vedi confermaAggiungiAlimento).
let ricercaAlimentoState = { query:'', loading:false, risultati:[], errore:null, selezionato:null, grammi:100, pastoIdx:null, fonte:null, sessionAggiunti:[] };

          <div class="meal-macro-mini" style="margin-bottom:16px;">
