   esplicita, quindi per non rompergli l'esperienza vede tutto il catalogo.
   profiloUtente.schedeAssegnate === []    → profilo nuovo, nessuna scheda
   assegnata finché il trainer non gliene assegna una dal Pannello trainer. */
function schedeAssegnateUtente(){
  if(!profiloUtente) return SCHEDE;
  if(profiloUtente.schedeAssegnate === null) return SCHEDE;
  return SCHEDE.filter(s=>profiloUtente.schedeAssegnate.includes(s.id));
}

/* Obiettivi nutrizionali attivi: sempre quelli di DIETA_PIANO.target.riposo o
   .allenamento a seconda del parametro `allenamento`, più 2500ml di acqua
   (obiettivo idratazione confermato nel Fascicolo Cliente v4, 12/09/2026 —
   già raggiunto stabilmente, non serve alzarlo).
   Non esiste più un override modificabile dall'utente in Profilo: la dieta
   la aggiorna il trainer direttamente nel piano (DIETA_PIANO), così i target
   restano sempre coerenti col tipo di giorno invece di restare bloccati su
   un valore fisso.
   Dal momento in cui parte il Blocco 3 (blocco3Attivo(), vedi sopra), i
   target passano a DIETA_PIANO_BLOCCO3: le opzioni/alimenti dei pasti restano
   quelle del piano Blocco 2 (nessun nuovo piano pasto-per-pasto fornito),
   solo i totali giornalieri cambiano — targetPastiCalibrati() li ridistribuisce
   comunque in automatico sui pasti esistenti. */
function pianoDietaAttivo(){
  return blocco3Attivo() ? DIETA_PIANO_BLOCCO3 : DIETA_PIANO;
}
function obiettiviAttivi(allenamento){
  const piano = pianoDietaAttivo();
  const base = allenamento ? piano.target.allenamento : piano.target.riposo;
  return { kcal:base.kcal, prot:base.prot, carb:base.carb, grassi:base.grassi, acquaMl:2500 };
}

/* Arrotonda a un solo decimale, ma lo mostra solo se serve: un numero
   intero resta "25" invece di "25.0", mentre uno con resto diventa "25.4" —
   mai più di una cifra dopo la virgola. */
function fmt1(n){
  const v = Math.round((Number(n)||0)*10)/10;
  return Number.isInteger(v) ? String(v) : v.toFixed(1);
}
function round1(n){
  return Math.round((Number(n)||0)*10)/10;
}

/* Kcal ricalcolate sempre da 4×proteine + 4×carboidrati + 9×grassi, invece
   di sommare le kcal "dichiarate" di ciascun alimento (che quasi mai
   coincidono esattamente col conto sui macro, per via di fibre, alcol e
   arrotondamenti diversi da fonte a fonte) — su richiesta esplicita, così
   il numero mostrato coincide sempre col conto fatto a mano sui macro. */
const KCAL_POLIALCOLI = 2.6; // kcal per grammo di polialcoli (polioli)
/* Kcal da macro: 4 kcal/g proteine, 4 kcal/g carboidrati, 9 kcal/g grassi.
   I polialcoli sono "di cui" dei carboidrati: quella parte vale 2,6 kcal/g
   invece di 4 (quindi i carboidrati restano il totale e non si contano due volte). */
function kcalDaMacro(prot, carb, grassi, polio){
  const c = Number(carb)||0;
  const po = Math.min(Math.max(Number(polio)||0, 0), Math.max(c,0));
  return round1(4*(Number(prot)||0) + 4*(c-po) + KCAL_POLIALCOLI*po + 9*(Number(grassi)||0));
}

/* Ridistribuisce il target giornaliero attivo (che dipende dal tipo di
   giorno, riposo/allenamento) sui 5 pasti in proporzione al peso di
   ciascuno nel piano (la media delle sue opzioni, targetPastoMedia). Prima
   i target per pasto restavano fissi qualunque fosse il tipo di giorno,
   quindi la loro somma non coincideva col totale giornaliero attivo (che
   invece cambia tra riposo e allenamento) — qui si ricalcolano ogni volta
   che cambia il tipo di giorno, e l'ultimo pasto (Cena) assorbe l'arroton-
   damento così la somma torna a coincidere esattamente col target attivo. */
function targetPastiCalibrati(allenamento){
  const t = obiettiviAttivi(allenamento);
  const pesi = DIETA_PIANO.pasti.map(p => targetPastoMedia(p));
  const pesoTot = pesi.reduce((s,p)=>({
    kcal: s.kcal+p.kcal, prot: s.prot+p.prot, carb: s.carb+p.carb, grassi: s.grassi+p.grassi
  }), {kcal:0, prot:0, carb:0, grassi:0});
  const chiavi = ['kcal','prot','carb','grassi'];
  const risultati = pesi.map(()=>({}));
  chiavi.forEach(k=>{
    let cum = 0;
    pesi.forEach((p,i)=>{
      if(i < pesi.length-1){
        const quota = pesoTot[k] ? p[k]/pesoTot[k] : 1/pesi.length;
        const v = round1(t[k] * quota);
        risultati[i][k] = v;
        cum += v;
      } else {
        risultati[i][k] = round1(t[k] - cum);
      }
    });
  });
  return risultati;
}

/* Proiezione di quando (con il trend recente) si raggiungerà un obiettivo corporeo
   (peso o vita). Regressione lineare semplice sui punti delle ultime 6 settimane
   (o sugli ultimi due disponibili se la storia è più corta). */
function calcolaProiezioneObiettivo(key, target){
  const punti = cache.misure
    .map(m=>({ t: new Date(m.data).getTime(), y: (m[key]!=null && m[key]!=='') ? Number(m[key]) : null }))
    .filter(p=>p.y!=null)
    .sort((a,b)=>a.t-b.t);
  if(punti.length<2) return { stato:'pochi-dati' };

  const ultimo = punti[punti.length-1];
  const finestra = punti.filter(p=> (ultimo.t-p.t) <= 42*86400000);
  const usati = finestra.length>=2 ? finestra : punti.slice(-2);
  const n = usati.length;
  const meanT = usati.reduce((s,p)=>s+p.t,0)/n;
  const meanY = usati.reduce((s,p)=>s+p.y,0)/n;
  let num=0, den=0;
  usati.forEach(p=>{ num += (p.t-meanT)*(p.y-meanY); den += (p.t-meanT)*(p.t-meanT); });
  const slopePerMs = den===0 ? 0 : num/den;
  const distanza = target - ultimo.y;

  if(Math.abs(distanza) < 0.05) return { stato:'raggiunto', valore: ultimo.y };
  if(slopePerMs===0 || (distanza>0) !== (slopePerMs>0)) return { stato:'trend-opposto', valore: ultimo.y };

  const giorniStimati = distanza / (slopePerMs*86400000);
  if(!isFinite(giorniStimati) || giorniStimati > 365*2) return { stato:'trend-lento', valore: ultimo.y };

  return { stato:'proiezione', valore: ultimo.y, dataStimata: new Date(ultimo.t + giorniStimati*86400000) };
}

function renderObiettivoCorpoStatCard(){
  const oc = profiloUtente && profiloUtente.obiettiviCorpo;
  if(!oc || (!oc.pesoTarget && !oc.vitaTarget)) return '';
  const righe = [];
  [['peso','Peso','kg',oc.pesoTarget], ['vita','Vita','cm',oc.vitaTarget]].forEach(([key,label,unit,target])=>{
    if(!target) return;
    const r = calcolaProiezioneObiettivo(key, target);
    let testo;
    if(r.stato==='pochi-dati') testo = 'Servono almeno due rilevazioni con questo valore per stimare un trend.';
    else if(r.stato==='raggiunto') testo = 'Obiettivo raggiunto 🎉';
    else if(r.stato==='trend-opposto') testo = "Il trend recente va nella direzione opposta all'obiettivo: aggiornalo se non è più valido, o dai tempo al piano di fare effetto.";
    else if(r.stato==='trend-lento') testo = 'Il trend recente è troppo lento o piatto per stimare una data ragionevole.';
    else testo = `Di questo passo: <b style="color:var(--text);">${r.dataStimata.toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'})}</b>`;
    const attuale = r.valore!=null ? Math.round(r.valore*10)/10 : '—';
    righe.push(`<div style="margin-bottom:14px;">
      <div style="font-size:13px;font-weight:700;margin-bottom:4px;">${label}: ${attuale}${unit} → obiettivo ${target}${unit}</div>
      <p class="field-hint" style="margin:0;">${testo}</p>
    </div>`);
  });
  if(!righe.length) return '';
  return `<div class="card"><h3 style="margin-top:0;font-size:15px;">🎯 Obiettivi corporei</h3>${righe.join('')}</div>`;
}

function avatarHTML(profilo, size){
  size = size || 34;
  const fontIniziali = Math.round(size*0.4);
  const fontEmoji = Math.round(size*0.55);
  if(profilo && profilo.avatar && profilo.avatar.type==='foto' && profilo.avatar.value){
    return `<img src="${profilo.avatar.value}" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;border:1.5px solid var(--accent);">`;
  }
  if(profilo && profilo.avatar && profilo.avatar.type==='preset'){
    const p = AVATAR_PRESET.find(a=>a.id===profilo.avatar.value);
    if(p){
      return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:var(--panel-2);border:1.5px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:${fontEmoji}px;">${p.emoji}</div>`;

  const iniziali = profilo ? (((profilo.nome||'?')[0]||'?')+((profilo.cognome||'')[0]||'')).toUpperCase() : '?';

}

function infoEsercizio(schedaId, nome){
  const n = String(nome||'').trim().toLowerCase();
  if(INFO_ESERCIZI[schedaId+'|'+n]) return INFO_ESERCIZI[schedaId+'|'+n];
  const k = Object.keys(INFO_ESERCIZI).find(x=> x.split('|')[1]===n);
  return k ? INFO_ESERCIZI[k] : null;
}
/* Le tue regolazioni (sedile, schienale, ecc.) per esercizio: restano salvate sul profilo. */
let regolazioniMacchine = {};
let sezioniSchedaAperte = {};
let regSalvaTimer = null;
function salvaRegolazione(nome, i, val){
  const k = String(nome).trim().toLowerCase();
  const arr = regolazioniMacchine[k] || [];
  arr[i] = val; for(let j=0;j<arr.length;j++) if(arr[j]==null) arr[j]='';
  regolazioniMacchine[k] = arr;
  clearTimeout(regSalvaTimer);
  regSalvaTimer = setTimeout(()=>{
    attendiScrittura(db.collection('users').doc(currentUid).set({ regolazioniMacchine }, { mergeFields:['regolazioniMacchine'] })).catch(()=>{});
  }, 700);
}
function memSezioneScheda(chiave, aperta){ sezioniSchedaAperte[chiave] = !!aperta; }
function toggleSchedaEsercizio(ei){
  const el = document.getElementById('schedaes-'+ei); if(!el) return;
  const apri = !el.classList.contains('open');
  el.classList.toggle('open', apri);
  const nome = sessionDraft && schedaSessione().esercizi[ei] ? schedaSessione().esercizi[ei].nome : '';
  memSezioneScheda('__pannello|'+nome, apri);
  const b = document.getElementById('schedabtn-'+ei); if(b) b.setAttribute('aria-expanded', apri);
}
function apriChiudiTutteSezioni(ei, apri){
  const el = document.getElementById('schedaes-'+ei); if(!el) return;
  el.querySelectorAll('details').forEach(d=>{ d.open = apri; });
}

function schedaEsercizioHtml(ei, nome, info){
  const aperto = !!sezioniSchedaAperte['__pannello|'+nome];
  let h = `<button type="button" class="scheda-btn" id="schedabtn-${ei}" aria-expanded="${aperto}" onclick="toggleSchedaEsercizio(${ei})">
    <span>📖 Scheda dell'esercizio</span><span class="scheda-chev">▾</span></button>`;
  h += `<div class="scheda-es${aperto?' open':''}" id="schedaes-${ei}">
    <div class="scheda-tools"><button type="button" class="set-mini-btn" onclick="apriChiudiTutteSezioni(${ei},true)">Apri tutte</button>
    <button type="button" class="set-mini-btn" onclick="apriChiudiTutteSezioni(${ei},false)">Chiudi tutte</button></div>`;
  SEZIONI_SCHEDA.forEach(([k,titolo])=>{
    if(!info[k]) return;
    const chiave = nome+'|'+k;
    h += `<details class="scheda-sez"${sezioniSchedaAperte[chiave]?' open':''} ontoggle="memSezioneScheda(${JSON.stringify(chiave).replace(/"/g,'&quot;')}, this.open)">
      <summary>${titolo}</summary><div class="scheda-txt">${escHtml(info[k])}</div></details>`;

/* Alternative "salvate": una volta che scegli il nome di un esercizio
   alternativo (es. l'attrezzo era occupato), lo ricordiamo per quell'
   esercizio — mappa {nomeEsercizioOriginale: nomeAlternativaScelta} salvata
   sul profilo utente. Così le prossime volte basta un tap su "Usa
   alternativa" per riattivarla, senza doverla ridigitare ogni sessione. */
let alternativeSalvate = {};

function schedaScaduta(s){
  if(s.gruppo && BLOCCHI_CHIUSI.includes(s.gruppo)) return true;
  const inizio = blocchiIniziati[s.id];
  if(!inizio || !s.durataSettimane) return false;
  const fine = new Date(inizio);
  fine.setDate(fine.getDate() + s.durataSettimane*7);
  return new Date() > fine;
}

/* ============ ROTAZIONE A/B PER BLOCCHI MULTI-SCHEDA ============
   Alcuni blocchi (es. Blocco 2: Giorno A / Giorno B) sono modellati come più
   schede separate con lo stesso campo `gruppo`. Queste funzioni calcolano,
   in base allo storico reale delle sessioni fatte (non un calendario fisso),
   quale scheda del gruppo tocca alla prossima seduta e a che punto del
   blocco (settimana/sedute) si è arrivati. */

function membriGruppo(gruppo){
  if(!gruppo) return [];
  return schedeAssegnateUtente().filter(s=>s.gruppo===gruppo).sort((a,b)=>a.id.localeCompare(b.id));
}

function sessioniGruppo(gruppo){
  const membriIds = membriGruppo(gruppo).map(s=>s.id);
  if(!membriIds.length) return [];
  return cache.sessioni
    .filter(sx=>membriIds.includes(sx.schedaId))
    .sort((a,b)=> new Date(a.data) - new Date(b.data));
}

/* Ritorna l'id della scheda del gruppo che tocca alla prossima seduta,
   alternando in base a quale scheda è stata usata per ultima (A dopo B, B
   dopo A). Se il gruppo ha una sola scheda (o nessuno storico) non c'è
   alternanza da segnalare. */
function prossimaSchedaGruppo(gruppo){
  const membri = membriGruppo(gruppo);
  if(membri.length < 2) return null;
  const sessioni = sessioniGruppo(gruppo);
  if(!sessioni.length) return membri[0].id;
  const ultima = sessioni[sessioni.length-1];
  const idx = membri.findIndex(s=>s.id===ultima.schedaId);
  if(idx === -1) return membri[0].id;
  return membri[(idx+1) % membri.length].id;
}

/* Avanzamento del blocco (settimana attuale / sedute fatte), calcolato su
   tutte le schede del gruppo insieme: la data di inizio è la più vecchia tra
   quelle delle schede del gruppo già avviate. */
function progressoBlocco(gruppo){
  const membri = membriGruppo(gruppo);
  if(!membri.length) return null;
  const inizi = membri.map(s=>blocchiIniziati[s.id]).filter(Boolean).map(d=>new Date(d).getTime());
  if(!inizi.length) return null;
  const inizio = new Date(Math.min(...inizi));
  const durataSettimane = membri[0].durataSettimane || null;
  const frequenza = membri[0].frequenzaSettimanale || null;
  const settimaneTrascorse = Math.floor((new Date() - inizio) / (7*86400000));
  const settimanaAttuale = durataSettimane ? Math.min(settimaneTrascorse+1, durataSettimane) : settimaneTrascorse+1;
  const sedute = sessioniGruppo(gruppo).length;
  const seduteTarget = (durataSettimane && frequenza) ? durataSettimane*frequenza : null;
  return { settimanaAttuale, durataSettimane, sedute, seduteTarget };
}

/* Suggerimento di deload: non e' una prescrizione, solo un campanello
   d'allarme quando (a) il blocco va avanti da un po' di settimane e (b)
   nelle ultime due settimane l'RPE medio segnato e' rimasto alto — segno
   di fatica che si accumula piu' che di singole sedute dure isolate. */
function valutaDeload(scheda){
  const inizio = blocchiIniziati[scheda.id];
  if(!inizio) return null;
  const settimaneTrascorse = Math.floor((new Date() - new Date(inizio)) / (7*86400000));
  if(settimaneTrascorse < 5) return null;

  const dueSettimaneFa = new Date(); dueSettimaneFa.setDate(dueSettimaneFa.getDate()-14);
  const sessioniRecenti = cache.sessioni.filter(s=> s.schedaId===scheda.id && new Date(s.data) >= dueSettimaneFa);
  if(sessioniRecenti.length < 2) return null;

  const rpeValori = sessioniRecenti.flatMap(s=> (s.esercizi||[]).flatMap(e=> (e.sets||[]).map(x=>x.rpe))).filter(v=>v!=null && !isNaN(v));
  if(rpeValori.length < 4) return null;
  const rpeMedio = rpeValori.reduce((a,b)=>a+b,0)/rpeValori.length;

  if(rpeMedio >= 8.3 || settimaneTrascorse >= 8){
    return { settimaneTrascorse, rpeMedio: Math.round(rpeMedio*10)/10 };
  }
  return null;
}

/* Con la persistenza offline di Firestore il Promise di una scrittura si
   risolve solo quando il server conferma: senza rete resta in sospeso per
   sempre e i salvataggi (es. "Termina allenamento" in palestra col telefono
   senza segnale) sembravano bloccati su "Salvataggio...". Il dato è già nella
   cache locale e partirà da solo appena torna la connessione, quindi dopo
   pochi secondi si prosegue comunque; gli errori veri (permessi, ecc.) che
   arrivano prima restano segnalati come prima. */
/* Su iPhone, se il sistema chiude il database locale (IndexedDB) mentre l'app è
   aperta o in background, Firestore si ferma con "The client has already been
   terminated" e ogni salvataggio fallisce finché l'app non riparte. Qui lo si
   riconosce e si ricarica l'app (al massimo una volta ogni 30 secondi). */
function erroreClientTerminato(err){
  return !!(err && /terminated/i.test(String(err.message||err)));
}
function ripristinaConnessioneDati(){
  try{
    const ult = Number(sessionStorage.getItem('byRipristino')||0);
    if(Date.now()-ult < 30000) return;
    sessionStorage.setItem('byRipristino', String(Date.now()));
  }catch(e){}
  setTimeout(()=>location.reload(), 1200);
}
window.addEventListener('unhandledrejection', ev=>{ if(erroreClientTerminato(ev.reason)) ripristinaConnessioneDati(); });
function attendiScrittura(promise, ms){
  const p = Promise.resolve(promise);
  p.catch(err=>{ if(erroreClientTerminato(err)) ripristinaConnessioneDati(); }); // evita "unhandled rejection" se fallisce dopo il timeout
  return Promise.race([p, new Promise(res=>setTimeout(res, ms||2500))]);
}
/* Come collection.add(), ma restituisce subito il riferimento (id incluso)
   e attende la scrittura con attendiScrittura(). */
async function aggiungiDocRapido(coll, payload){
  const ref = coll.doc();
  await attendiScrittura(ref.set(payload));
  return ref;
}

async function checkProfilo(){

  // Normalizza il formato: versioni precedenti salvavano una singola stringa
  // per esercizio, ora è un array (più alternative possibili tra cui scegliere).
  const raw = data.alternativeSalvate || {};
  alternativeSalvate = {};
  Object.keys(raw).forEach(k=>{

  });

    profiloUtente = {
      nome:data.nome, cognome:data.cognome, eta:data.eta,
      altezza: data.altezza || null,

      obiettivi: data.obiettivi || null,

  document.getElementById('obCognome').value = data.cognome || '';
  document.getElementById('obEta').value = data.eta || '';
  document.getElementById('obAttenzioni').value = data.attenzioni || '';
  return false;
}

function mapAuthError(e){
  const code = e.code || '';
  if(code.includes('invalid-credential') || code.includes('wrong-password') || code.includes('user-not-found')) return 'Email o password non corrette.';
  if(code.includes('too-many-requests')) return 'Troppi tentativi, riprova tra poco.';
  if(code.includes('invalid-email')) return 'Email non valida.';
  if(code.includes('email-already-in-use')) return 'Esiste già un account con questa email. Prova ad accedere invece di registrarti.';
  if(code.includes('weak-password')) return 'Password troppo debole: usa almeno 6 caratteri.';
  return 'Errore: ' + (e.message || code);
}

function todayKey(){
  const d = new Date();
  const pad = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

    // pasto, dato che l'alimento extra la sostituisce, non la integra.

  };

/* Correzione una tantum (05/10/2026): la seduta di Torso Meccanico di oggi è
   stata salvata prima che il Pullover macchina entrasse in scheda. Aggiungiamo
   le 2 serie già fatte (30 kg x 12, RPE 9) subito dopo il Rematore. Si applica
   una sola volta: se l'esercizio c'è già, non fa nulla. */
async function applicaPulloverSessioneOggi(){
  try{
    const NOME = 'Pullover (macchina Panatta Super Pullover)';
    const oggi = new Date('2026-10-05T12:00:00').toDateString();
    const s = cache.sessioni.find(x=> new Date(x.data).toDateString()===oggi
      && /torso meccanico/i.test(x.schedaNome||'') && Array.isArray(x.esercizi));
    if(!s || s.esercizi.some(e=>e.nome===NOME)) return;
    const nuovo = { nome:NOME, usaAlternativa:false, noteUtente:'', sets:[
      {peso:30, rip:'12', fatta:true, rpe:9, saltata:false},
      {peso:30, rip:'12', fatta:true, rpe:9, saltata:false}
    ]};
    const idx = s.esercizi.findIndex(e=>/^Rematore/i.test(e.nome));
    s.esercizi.splice(idx>=0 ? idx+1 : s.esercizi.length, 0, nuovo);
    await attendiScrittura(userCollection('sessioni').doc(s.id).update({ esercizi: s.esercizi }));
  }catch(e){ console.warn('Correzione pullover non applicata', e); }
}

function toggleMealDone(i){
  const nuovoStato = !cache.dietaLogOggi.pastiFatti[i];
  if(nuovoStato) hapticaLieve();
  cache.dietaLogOggi.pastiFatti[i] = nuovoStato;
  // Toccare la spunta a mano vuol sempre dire "ho seguito l'opzione del
  // piano": azzera un eventuale pastiViaExtra lasciato da un alimento extra
  // precedente, così le kcal dell'opzione tornano a contare normalmente.
  if(!cache.dietaLogOggi.pastiViaExtra) cache.dietaLogOggi.pastiViaExtra = {};
  delete cache.dietaLogOggi.pastiViaExtra[i];
  // Salviamo anche un'istantanea dell'opzione scelta in quel momento, così il
  // diario storico può mostrare cosa hai mangiato davvero quel giorno, non
  // solo "pasto segnato sì/no".
  if(!cache.dietaLogOggi.pastiSnapshot) cache.dietaLogOggi.pastiSnapshot = {};
  if(nuovoStato){
    const p = DIETA_PIANO.pasti[i];
    const opz = p.opzioni[dietaOpzioneSel[i] || 0];
    cache.dietaLogOggi.pastiSnapshot[i] = { titolo:opz.titolo, kcal:kcalDaMacro(opz.prot, opz.carb, opz.grassi), prot:opz.prot, carb:opz.carb, grassi:opz.grassi };
  } else {
    delete cache.dietaLogOggi.pastiSnapshot[i];
  }
  salvaDietaLogOggi();
  renderAlimentazione();
}

function aggiungiAcqua(delta){
  cache.dietaLogOggi.acquaMl = Math.max(0, (cache.dietaLogOggi.acquaMl||0) + delta);
  salvaDietaLogOggi();
  // Il conteggio acqua ora vive solo in Home (non più in Dieta): ri-rendo
  // la schermata da cui è stato chiamato, invece di assumere sempre Dieta.
  if(route.name==='home') renderHome();
  else renderAlimentazione();
}

function toggleIntegratoreFatto(nome){

// Categoria nutrizionale principale di un alimento: la sceglie chi lo
// registra (voluto: più affidabile di un calcolo automatico quando un
// alimento è "misto"), con un suggerimento di partenza in base a quale
// macro pesa di più in kcal. Usata per raggruppare "Aggiungi di nuovo".
const FONTE_OPZIONI = [
  { key:'carbo',    label:'Carboidrati', icona:'🍞' },
  { key:'proteine', label:'Proteine',    icona:'🍗' },
  { key:'grassi',   label:'Grassi',      icona:'🥑' },
];
function suggerisciFonte(p){
  const kcalP = (p.prot100||0)*4, kcalC = (p.carb100||0)*4, kcalG = (p.grassi100||0)*9;
  const max = Math.max(kcalP, kcalC, kcalG);
  if(max<=0) return 'carbo';
  if(max===kcalG) return 'grassi';
  if(max===kcalP) return 'proteine';
  return 'carbo';
}

// Target di un pasto (solo numeri, niente nomi di piatti): media di
// kcal/macro tra le opzioni previste per quel pasto nel piano. Sostituisce
// la vecchia scelta "una tra 5 opzioni con piatti fissi" — qui è solo un
// riferimento su cosa centrare, poi si segna con "Segna pasto" cosa si è
// mangiato davvero.
function targetPastoMedia(p){
  const opz = p.opzioni || [];
  const n = opz.length || 1;
  const somma = opz.reduce((s,o)=>({
    kcal: s.kcal + (o.kcal||0),
    prot: s.prot + (o.prot||0),
    carb: s.carb + (o.carb||0),
    grassi: s.grassi + (o.grassi||0),
  }), { kcal:0, prot:0, carb:0, grassi:0 });
  return {
    kcal: Math.round(somma.kcal/n),
    prot: Math.round(somma.prot/n),
    carb: Math.round(somma.carb/n),
    grassi: Math.round(somma.grassi/n),
  };
}

/* Alimenti "extra" di oggi: cercati per nome (Open Food Facts) e aggiunti con
   una grammatura scelta, si sommano ai macro/kcal acquisiti del giorno oltre
   ai pasti del piano fisso. */
function aggiungiAlimentoExtra(voce){
  if(!cache.dietaLogOggi.alimentiExtra) cache.dietaLogOggi.alimentiExtra = [];
  cache.dietaLogOggi.alimentiExtra.push(voce);
  salvaDietaLogOggi();
}

/* Rimuove un alimento extra dal giorno corrente. Non ri-renderizza da sola:
   la chiama rimuoviAlimentoExtra (schermata Dieta) o
   rimuoviAlimentoDaSessioneRicerca (schermata Cerca alimento), ciascuna con
   il proprio render di destinazione. */
/* Ricalcola macro e kcal di una voce "alimento extra" già salvata dopo un
   cambio di quantità (grammi). Le voci salvate da quando esiste questa
   funzionalità portano con sé anche i valori per 100g dell'alimento
   originale (prot100/carb100/grassi100): li usiamo per un ricalcolo preciso
   anche dopo più modifiche successive. Le voci più vecchie, che non li
   hanno, si ricalcolano invece in proporzione ai macro già salvati rispetto
   ai grammi precedenti (un solo passaggio, ma sufficiente). Le kcal restano
   sempre derivate da 4/4/9 (kcalDaMacro), coerenti col resto dell'app. */
function ricalcolaVoceExtraPerGrammi(voce, nuoviGrammi){
  const haPer100 = voce.prot100!=null || voce.carb100!=null || voce.grassi100!=null;
  if(haPer100){
    const f = nuoviGrammi/100;
    voce.prot = round1((voce.prot100||0)*f);
    voce.carb = round1((voce.carb100||0)*f);
    voce.grassi = round1((voce.grassi100||0)*f);
    voce.polio = round1((voce.polio100||0)*f);
  } else {
    const vecchiGrammi = voce.grammi || nuoviGrammi || 1;
    const fattore = nuoviGrammi/vecchiGrammi;
    voce.prot = round1((voce.prot||0)*fattore);
    voce.carb = round1((voce.carb||0)*fattore);
    voce.grassi = round1((voce.grassi||0)*fattore);
    voce.polio = round1((voce.polio||0)*fattore);
  }
  voce.kcal = kcalDaMacro(voce.prot, voce.carb, voce.grassi, voce.polio);
  voce.grammi = nuoviGrammi;
}

/* Modifica la quantità (grammi) di un alimento extra già salvato in "oggi":
   usata sia dalla schermata Dieta sia dall'elenco "Aggiunti in questa
   sessione" di Cerca alimento — passando renderFn si sceglie quale schermata
   ridisegnare al termine, di default Dieta. */
async function modificaQuantitaAlimentoExtra(id, renderFn){
  const voce = (cache.dietaLogOggi.alimentiExtra||[]).find(a=>a.id===id);
  if(!voce) return;
  const nuoviGrammi = await mostraModificaGrammiOverlay(voce);
  if(nuoviGrammi==null) return;
  ricalcolaVoceExtraPerGrammi(voce, nuoviGrammi);
  salvaDietaLogOggi();
  (renderFn || renderAlimentazione)();
}

/* Stessa modifica quantità, ma su un giorno passato del diario invece che su
   "oggi". */
async function modificaQuantitaAlimentoExtraGiorno(giornoId, alimentoId){
  const g = cache.dietaLog.find(d=>d.id===giornoId);
  if(!g) return;
  const voce = (g.alimentiExtra||[]).find(a=>a.id===alimentoId);
  if(!voce) return;
  const nuoviGrammi = await mostraModificaGrammiOverlay(voce);
  if(nuoviGrammi==null) return;
  ricalcolaVoceExtraPerGrammi(voce, nuoviGrammi);
  salvaGiornoDietaLog(giornoId, g);
  renderDiario();
}

/* Ingredienti di una ricetta segnata in un pasto: quelli salvati sulla voce; per
   le voci più vecchie (senza ingredienti) si ripiega sulla ricetta salvata con lo
   stesso id o nome. Ritorna null se la ricetta non ha ingredienti modificabili. */
function ingredientiVoceRicetta(voce){
  if(voce.ingredienti && voce.ingredienti.length) return voce.ingredienti.map(x=>({...x}));
  const r = (cache.ricettePersonalizzate||[]).find(x=> (voce.ricettaId && x.id===voce.ricettaId) || x.nome===voce.nome);
  return (r && r.ingredienti && r.ingredienti.length) ? r.ingredienti.map(x=>({...x})) : null;
}
function btnModificaVoce(a, giornoId, renderFnName){
  if(!a.isRicetta){
    return giornoId
      ? `<button class="diario-mini-btn" onclick="event.stopPropagation();modificaQuantitaAlimentoExtraGiorno('${giornoId}','${a.id}')" title="Modifica quantità">✏️</button>`
      : `<button class="efi-edit" onclick="modificaQuantitaAlimentoExtra('${a.id}'${renderFnName?', '+renderFnName:''})" aria-label="Modifica quantità">✏️</button>`;
  }
  if(!ingredientiVoceRicetta(a)) return '';
  return giornoId
    ? `<button class="diario-mini-btn" onclick="event.stopPropagation();modificaIngredientiRicettaPasto('${a.id}','${giornoId}')" title="Modifica ingredienti">✏️</button>`
    : `<button class="efi-edit" onclick="modificaIngredientiRicettaPasto('${a.id}', null${renderFnName?', '+renderFnName:''})" aria-label="Modifica ingredienti">✏️</button>`;
}
function modificaIngredientiRicettaPasto(id, giornoId, renderFn){
  let voce, giorno = null;
  if(giornoId){
    giorno = cache.dietaLog.find(d=>d.id===giornoId);
    voce = giorno && (giorno.alimentiExtra||[]).find(a=>a.id===id);
  } else {
    voce = (cache.dietaLogOggi.alimentiExtra||[]).find(a=>a.id===id);
  }
  if(!voce) return;
  const ing = ingredientiVoceRicetta(voce);
  if(!ing) return;
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.id = 'ricPastoOverlay';
  const riga = (i,k)=>`<div class="rp-row">
      <div class="rp-n">${escHtml(i.nome)}${i.marca?` <span class="efi-brand">· ${escHtml(i.marca)}</span>`:''}<div class="rp-m" id="rpM${k}"></div></div>
      <input type="number" min="0" step="1" inputmode="decimal" value="${i.grammi}" aria-label="Grammi di ${escHtml(i.nome)}" data-k="${k}"><span class="rp-g">g</span>
    </div>`;
  overlay.innerHTML = `<div class="confirm-box" style="max-height:86vh;display:flex;flex-direction:column;">
    <p class="confirm-msg" style="margin-bottom:2px;">🍲 ${escHtml(voce.nome)}</p>
    <p class="field-hint" style="text-align:center;margin:0 0 10px;">Cambia le quantità solo per questo pasto: la ricetta salvata non cambia.</p>
    <div style="overflow:auto;flex:1;min-height:0;">${ing.map(riga).join('')}</div>
    <p style="font-size:13px;font-weight:800;text-align:center;margin:12px 0 4px;" id="rpTot"></p>
    <div class="confirm-actions"><button class="btn secondary" id="rpAnnulla">Annulla</button><button class="btn" id="rpSalva">Salva</button></div>
  </div>`;
  document.body.appendChild(overlay);
  const aggiorna = ()=>{
    ing.forEach((i,k)=>{
      const f=(Number(i.grammi)||0)/100, m=overlay.querySelector('#rpM'+k);
      if(m) m.textContent = `${fmt1(kcalDaMacro(i.prot100*f,i.carb100*f,i.grassi100*f,(i.polio100||0)*f))} kcal · P ${fmt1(i.prot100*f)} · C ${fmt1(i.carb100*f)} · G ${fmt1(i.grassi100*f)}`;
    });
    const t = totaliRicettaDaIngredienti(ing);
    overlay.querySelector('#rpTot').textContent = `Totale: ${fmt1(t.kcal)} kcal · P ${fmt1(t.prot)}g · C ${fmt1(t.carb)}g · G ${fmt1(t.grassi)}g`;
  };
  overlay.querySelectorAll('input[data-k]').forEach(inp=> inp.addEventListener('input',()=>{
    ing[Number(inp.dataset.k)].grammi = Math.max(0, Number(inp.value)||0);
    aggiorna();
  }));
  aggiorna();
  const chiudi = ()=> overlay.remove();
  overlay.querySelector('#rpAnnulla').onclick = chiudi;
  overlay.addEventListener('click', ev=>{ if(ev.target===overlay) chiudi(); });
  overlay.querySelector('#rpSalva').onclick = ()=>{
    const t = totaliRicettaDaIngredienti(ing);
    voce.ingredienti = ing;
    voce.prot = t.prot; voce.carb = t.carb; voce.grassi = t.grassi; voce.polio = t.polio||0;
    voce.kcal = kcalDaMacro(t.prot, t.carb, t.grassi, t.polio||0);
    chiudi(); hapticaLieve();
    if(giorno){ salvaGiornoDietaLog(giornoId, giorno); renderDiario(); }
    else { salvaDietaLogOggi(); (renderFn || renderAlimentazione)(); }
  };
}

function rimuoviAlimentoExtraCore(id){
  const rimosso = (cache.dietaLogOggi.alimentiExtra||[]).find(a=>a.id===id);
  cache.dietaLogOggi.alimentiExtra = (cache.dietaLogOggi.alimentiExtra||[]).filter(a=>a.id!==id);

  // Se il pasto rimosso era quello che aveva fatto scattare l'auto-segna-fatto
  // (pastiViaExtra) e dopo la rimozione non resta più nessun alimento extra
  // agganciato a quel pasto, togliamo la spunta: altrimenti il pasto
  // resterebbe segnato come fatto senza che ci sia più nulla a giustificarlo.
  const pastoIdx = rimosso ? rimosso.pasto : null;
  if(pastoIdx!=null && pastoIdx>=0 && pastoIdx<DIETA_PIANO.pasti.length &&
     cache.dietaLogOggi.pastiViaExtra && cache.dietaLogOggi.pastiViaExtra[pastoIdx]){
    const restanoExtraSulPasto = cache.dietaLogOggi.alimentiExtra.some(a=>a.pasto===pastoIdx);
    if(!restanoExtraSulPasto){
      cache.dietaLogOggi.pastiFatti[pastoIdx] = false;
      delete cache.dietaLogOggi.pastiViaExtra[pastoIdx];
      if(cache.dietaLogOggi.pastiSnapshot) delete cache.dietaLogOggi.pastiSnapshot[pastoIdx];
    }
  }

  salvaDietaLogOggi();
}

function rimuoviAlimentoExtra(id){
  rimuoviAlimentoExtraCore(id);
  renderAlimentazione();
}

function rimuoviAlimentoDaSessioneRicerca(id){
  rimuoviAlimentoExtraCore(id);
  if(ricercaAlimentoState) ricercaAlimentoState.sessionAggiunti = (ricercaAlimentoState.sessionAggiunti||[]).filter(a=>a.id!==id);
  renderCercaAlimento();
}

let ultimoScrollYHeader = 0;
// Header e scroll: elemento in cache e aggiornamento al massimo una volta per
// frame (requestAnimationFrame), invece di cercare <header> e toccare le
// classi a ogni singolo evento di scroll.
let scrollFramePendente = false;
function aggiornaHeaderScroll(){
  scrollFramePendente = false;
  const h = headerEl;
  if(!h) return;
  const y = window.scrollY;
  h.classList.toggle('scrolled', y > 4);
  const delta = y - ultimoScrollYHeader;
  // Sotto una soglia minima resta sempre visibile (evita che sparisca dopo
  // un pelo di scroll in cima alla pagina); oltre, si nasconde scendendo
  // verso il basso e riappare non appena si risale, anche di poco.
  if(y > 70 && delta > 4){
    h.classList.add('hidden-bar');
  } else if(delta < -4 || y <= 70){
    h.classList.remove('hidden-bar');
  }
  ultimoScrollYHeader = y;
}
window.addEventListener('scroll', ()=>{
  if(scrollFramePendente) return;
  scrollFramePendente = true;
  requestAnimationFrame(aggiornaHeaderScroll);
}, { passive:true });

/* Modale di conferma coerente con il tema (sostituisce il confirm() nativo
   del browser, che stona con lo stile dell'app). variant:'danger' per azioni
   distruttive (bottone rosso), 'accent' per conferme neutre (bottone verde). */
/* Trascina l'elemento verso il basso per "buttarlo via": gesture più naturale
   su mobile del solo tocco fuori dalla finestra. Sotto una certa soglia torna
   elasticamente al suo posto invece di chiudersi, così uno scroll accidentale
   non chiude nulla per sbaglio. */
function attachSwipeDownToDismiss(dragEl, onDismiss){
  if(!dragEl) return;
  let startY = 0, dragging = false;
  dragEl.addEventListener('pointerdown', e=>{
    startY = e.clientY; dragging = true;
    dragEl.style.transition = 'none';
  });
  dragEl.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dy = e.clientY - startY;
    if(dy>0){
      dragEl.style.transform = `translateY(${dy}px)`;
      dragEl.style.opacity = String(Math.max(0.35, 1 - dy/300));
    }
  });
  const fine = e=>{
    if(!dragging) return;
    dragging = false;
    const dy = (e.clientY!=null ? e.clientY : startY) - startY;
    dragEl.style.transition = 'transform .2s ease, opacity .2s ease';
    if(dy > 80){ onDismiss(); }
    else { dragEl.style.transform = 'translateY(0)'; dragEl.style.opacity = '1'; }
  };
  dragEl.addEventListener('pointerup', fine);
  dragEl.addEventListener('pointercancel', fine);
}

function mostraConferma(messaggio, variant){
  variant = variant || 'danger';
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.innerHTML = `
      <div class="confirm-box">
        <p class="confirm-msg">${messaggio}</p>
        <div class="confirm-actions">
          <button class="btn secondary" id="confirmCancelBtn">Annulla</button>
          <button class="btn ${variant==='danger'?'danger':''}" id="confirmOkBtn">Conferma</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const chiudi = esito => { overlay.remove(); resolve(esito); };
    overlay.querySelector('#confirmCancelBtn').onclick = ()=>chiudi(false);
    overlay.querySelector('#confirmOkBtn').onclick = ()=>{ hapticaMedia(); chiudi(true); };
    overlay.addEventListener('click', e=>{ if(e.target===overlay) chiudi(false); });
    attachSwipeDownToDismiss(overlay.querySelector('.confirm-box'), ()=>chiudi(false));
  });
}

function mostraModificaGrammiOverlay(alimento){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.innerHTML = `
      <div class="confirm-box">
        <p class="confirm-msg">Modifica quantità<br><span style="font-weight:600;color:var(--text-dim);font-size:12.5px;">${alimento.nome}${alimento.marca?` · ${alimento.marca}`:''}</span></p>
        <div class="field" style="margin-bottom:6px;">
          <label>Grammi</label>
          <input type="number" id="modGrammiInput" inputmode="decimal" min="1" step="1" value="${alimento.grammi}">

          <button class="btn" id="modGrammiOkBtn">Salva</button>
        </div>

/* ============ TRANSIZIONE "APRI/CHIUDI" STILE IOS ============
   Quando si tocca una card (categoria, voce di lista) la schermata successiva
   si ingrandisce a partire dal punto toccato; tornando indietro, la schermata
   si rimpicciolisce verso quello stesso punto prima di mostrare quella precedente. */
let pendingOrigin = null;
let navOriginStack = [];

view.addEventListener('click', function(e){
  const cat = e.target.closest('.home-cat, .home-square, .h-tile');
  if(cat){
    e.preventDefault();
    e.stopPropagation();
    const r = cat.getBoundingClientRect();
    const origin = { x: r.left + r.width/2, y: r.top + r.height/2 };
    const onclickAttr = cat.getAttribute('onclick');
    cat.classList.add('tapped');
    setTimeout(()=>{
      cat.classList.remove('tapped');
      pendingOrigin = origin;
      setTimeout(()=>{ if(pendingOrigin === origin) pendingOrigin = null; }, 50);
      if(onclickAttr){ try{ new Function(onclickAttr)(); }catch(err){} }
    }, 190);
    return;
  }
  const card = e.target.closest('.list-item');
  if(card && !card.classList.contains('locked')){
    const r = card.getBoundingClientRect();
    const origin = { x: r.left + r.width/2, y: r.top + r.height/2 };
    pendingOrigin = origin;
    setTimeout(()=>{ if(pendingOrigin === origin) pendingOrigin = null; }, 50);
  }
}, true);

/* ============ PULL-TO-REFRESH (solo in Home, da cima pagina) ============
   Utile ora che c'è la cache offline di Firestore: trascinando verso il basso
   dalla cima della Home si forza una risincronizzazione dei dati dal server. */
let ptrEl = null, ptrStartY = 0, ptrDragging = false;

function mostraPtrIndicator(dist){
  if(!ptrEl){
    ptrEl = document.createElement('div');
    ptrEl.className = 'ptr-indicator';
    ptrEl.innerHTML = `<div class="spinner"></div>`;
    document.body.appendChild(ptrEl);
  }
  ptrEl.style.top = (-50 + dist) + 'px';
}
function rimuoviPtrIndicator(){
  if(ptrEl){ ptrEl.remove(); ptrEl = null; }
}
async function eseguiPullToRefresh(){
  if(!ptrEl) mostraPtrIndicator(70);
  ptrEl.style.top = '12px';
  ptrEl.classList.add('loading');
  hapticaLieve();
  try{
    await loadData();
    if(route.name==='home') renderHome();
  }catch(e){}
  rimuoviPtrIndicator();
}

view.addEventListener('pointerdown', e=>{
  if(route.name!=='home' || window.scrollY>0) return;
  ptrStartY = e.clientY; ptrDragging = true;
});
view.addEventListener('pointermove', e=>{
  if(!ptrDragging) return;
  if(window.scrollY>0){ ptrDragging=false; rimuoviPtrIndicator(); return; }
  const dy = e.clientY - ptrStartY;
  if(dy<=0){ rimuoviPtrIndicator(); return; }
  mostraPtrIndicator(Math.min(90, dy*0.5));
});
const ptrFine = e=>{
  if(!ptrDragging) return;
  ptrDragging = false;
  const dy = (e.clientY!=null ? e.clientY : ptrStartY) - ptrStartY;
  if(dy > 100) eseguiPullToRefresh();
  else rimuoviPtrIndicator();
};
view.addEventListener('pointerup', ptrFine);
view.addEventListener('pointercancel', ptrFine);

/* Micro-feedback coerente: lo stesso glow al tap delle card home
   si estende ai bottoni principali (senza toccare la logica di
   navigazione/animazione sopra: qui aggiungiamo solo una classe
   temporanea per l'effetto visivo, l'onclick del bottone parte normalmente). */
document.body.addEventListener('click', function(e){
  const b = e.target.closest('.btn');
  if(b){
    b.classList.add('tap-glow');

}, true);

function setViewOrigin(origin){
  if(origin){
    const viewRect = view.getBoundingClientRect();
    view.style.transformOrigin = (origin.x - viewRect.left) + 'px ' + (origin.y - viewRect.top) + 'px';
  } else {
    view.style.transformOrigin = '50% 50%';
  }
}

function animateIn(origin){
  setViewOrigin(origin);
  view.classList.remove('view-anim-in','view-anim-out');
  void view.offsetWidth;
  view.classList.add('view-anim-in');
}

function animateOut(origin, callback){
  setViewOrigin(origin);
  view.classList.remove('view-anim-in','view-anim-out');
  void view.offsetWidth;
  view.classList.add('view-anim-out');
  setTimeout(callback, 230);
}

function setRoute(r){
  const isBack = BACK_MAP[route.name] === r.name;
  if(isBack){
    const origin = navOriginStack.pop() || null;
    animateOut(origin, ()=>{
      route = r;
      render();
      animateIn(null);
    });
  } else {
    const origin = pendingOrigin;
    pendingOrigin = null;
    navOriginStack.push(origin);
    route = r;
    render();
    animateIn(origin);
  }
}

/* ============ HOME ============ */
function promemoriaCostanza(){
  const blocchiAttivi = schedeAssegnateUtente().filter(s=> blocchiIniziati[s.id] && !schedaScaduta(s));
  if(!blocchiAttivi.length) return '';
  let peggiore = null;
  const gruppiVisti = new Set();
  blocchiAttivi.forEach(s=>{
    let ultima, nome, freq;
    if(s.gruppo){
      // Le schede con lo stesso `gruppo` (es. Blocco 2 Upper/Lower, alternate
      // A/B) sono un unico blocco: l'ultima seduta va guardata su ENTRAMBE
      // insieme, non sulla singola sotto-scheda — altrimenti un allenamento
      // fatto ieri su "Giorno A" non impedisce un falso allarme su "Giorno B"
      // anche se il blocco nel complesso è aggiornato (stessa logica già
      // usata in renderAderenzaCard per la card "Costanza").
      if(gruppiVisti.has(s.gruppo)) return;
      gruppiVisti.add(s.gruppo);
      const membri = membriGruppo(s.gruppo);
      const sessioniGr = sessioniGruppo(s.gruppo);
      ultima = sessioniGr.length
        ? new Date(sessioniGr[sessioniGr.length-1].data)
        : new Date(Math.min(...membri.map(m=>blocchiIniziati[m.id]).filter(Boolean).map(d=>new Date(d).getTime())));
      const tag = m => { const mm = m.nome.match(/\(([^)]+)\)/); return mm ? mm[1] : m.nome; };
      const base = membri[0].nome.split('—')[0].trim();
      nome = membri.length>1 ? `${base} (${membri.map(tag).join('/')})` : membri[0].nome;
      freq = membri[0].frequenzaSettimanale || null;
    } else {
      const sessioniScheda = cache.sessioni.filter(sess=>sess.schedaId===s.id);
      ultima = sessioniScheda.length
        ? new Date(Math.max(...sessioniScheda.map(x=> new Date(x.data).getTime())))
        : new Date(blocchiIniziati[s.id]);
      nome = s.nome;
      const freqMatch = s.periodo && s.periodo.match(/(\d+)x\/settimana/);
      freq = freqMatch ? Number(freqMatch[1]) : 3;
    }
    const giorni = Math.floor((new Date() - ultima) / 86400000);
    const soglia = Math.max(4, Math.ceil((7/(freq||3)) * 1.8));
    if(giorni >= soglia && (!peggiore || giorni > peggiore.giorni)){
      peggiore = { nome, giorni };
    }
  });
  if(!peggiore) return '';
  return `<div class="reminder-banner">⏰ Sono passati ${peggiore.giorni} giorni dal tuo ultimo allenamento (${peggiore.nome}). Quando puoi, rimettiti in moto 💪</div>`;
}

/* Pannello "oggi": i numeri chiave a colpo d'occhio in home, senza dover
   entrare in ogni sezione per saperli. */
/* Giorni consecutivi (a ritroso da oggi) in cui è stata registrata almeno
   un'attività nella dieta (pasto segnato, integratore preso, o acqua bevuta).
   Se oggi non hai ancora aperto l'app, non rompe lo streak: si parte da ieri. */
function calcolaStreakDieta(){
  const attivi = new Set(cache.dietaLog.filter(g=>{
    const pastiOk = Object.values(g.pastiFatti||{}).some(Boolean);
    const integrOk = Object.values(g.integratoriFatti||{}).some(Boolean);
    const acquaOk = (g.acquaMl||0) > 0;
    return pastiOk || integrOk || acquaOk;
  }).map(g=>g.id));
  if(!attivi.size) return 0;
  const pad = n=>String(n).padStart(2,'0');
  const chiave = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  let streak = 0;
  const cursor = new Date();
  if(!attivi.has(chiave(cursor))) cursor.setDate(cursor.getDate()-1);
  while(attivi.has(chiave(cursor))){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}

/* Settimane (lun-dom) consecutive e già concluse, a ritroso dalla scorsa,
   con almeno un allenamento registrato. */
function calcolaStreakSettimaneAllenamento(){
  if(!cache.sessioni.length) return 0;
  let streak = 0;
  const inizio = new Date();
  const giornoSett = (inizio.getDay()+6)%7; // 0=lunedì
  inizio.setDate(inizio.getDate()-giornoSett);
  inizio.setHours(0,0,0,0);
  inizio.setDate(inizio.getDate()-7); // la settimana corrente non è ancora conclusa, si parte dalla scorsa
  while(true){
    const fine = new Date(inizio); fine.setDate(fine.getDate()+7);
    const count = cache.sessioni.filter(s=>{ const d=new Date(s.data); return d>=inizio && d<fine; }).length;
    if(count>0){ streak++; inizio.setDate(inizio.getDate()-7); }
    else break;
  }
  return streak;
}

/* Quante sedute a settimana ci si aspetta in totale, sommando la frequenza
   di tutti i blocchi attivi al momento (blocchiIniziati e non scaduti). Le
   schede che condividono lo stesso `gruppo` (es. Blocco 2 Upper/Lower,
   alternate A/B) sono un unico blocco e contano una sola volta, come già
   fa renderAderenzaCard. Ritorna 0 se non c'è nessun blocco attivo o se la
   frequenza non è nota: in quel caso la Home mostra solo il numero fatto,
   senza "/m". */
function targetAllenamentiSettimana(){
  const blocchiAttivi = schedeAssegnateUtente().filter(s=> blocchiIniziati[s.id] && !schedaScaduta(s));
  let totale = 0;
  const gruppiContati = new Set();
  blocchiAttivi.forEach(s=>{
    if(s.gruppo){
      if(gruppiContati.has(s.gruppo)) return;
      gruppiContati.add(s.gruppo);
      const membri = membriGruppo(s.gruppo);
      const freq = membri[0] && membri[0].frequenzaSettimanale;
      if(freq) totale += freq;
      return;
    }
    if(s.frequenzaSettimanale){ totale += s.frequenzaSettimanale; return; }
    const freqMatch = s.periodo && s.periodo.match(/(\d+)x\/settimana/);
    if(freqMatch) totale += Number(freqMatch[1]);
  });
  return totale;
}

function renderOggiPanel(){
  if(!profiloUtente) return '';
  const pianoPersonale = profiloUtente.schedeAssegnate === null;

  // "Questa settimana" = calendario lun-dom in corso (non gli ultimi 7
  // giorni a scorrimento): così il numero coincide con quello che ci si
  // aspetta guardando un calendario, e torna a 0 ogni lunedì invece di
  // scendere gradualmente giorno per giorno.
  const inizioSettimana = new Date();
  const giornoSett = (inizioSettimana.getDay()+6)%7; // 0=lunedì
  inizioSettimana.setDate(inizioSettimana.getDate()-giornoSett);
  inizioSettimana.setHours(0,0,0,0);
  const allenamentiFattiSettimana = cache.sessioni.filter(s=> new Date(s.data) >= inizioSettimana).length;
  const allenamentiTargetSettimana = targetAllenamentiSettimana();
  const allenamentiSettimanaLabel = allenamentiTargetSettimana>0
    ? `${allenamentiFattiSettimana}/${allenamentiTargetSettimana}`
    : String(allenamentiFattiSettimana);

  // I due numeri principali diventano tile (grid), non righe di testo: più
  // leggibili a colpo d'occhio, stesso trattamento "readout" già usato per
  // l'anello kcal e il timer di recupero (vedi --mono/--disp in :root).
  const pctAllen = allenamentiTargetSettimana>0 ? Math.min(100, Math.round(allenamentiFattiSettimana/allenamentiTargetSettimana*100)) : 0;
  const statsTiles = [`<div class="oggi-stat"><div class="v">${allenamentiSettimanaLabel}</div><div class="l">Allenamenti completati<br>questa settimana</div><div class="os-bar"><i style="width:${pctAllen}%"></i></div></div>`];

  let pastoRow = '';
  if(pianoPersonale){
    const t = obiettiviAttivi(!!cache.dietaLogOggi.giornoAllenamento);
    // Stessa fonte di renderAlimentazione (calcolaTotaliGiorno): kcal
    // ricalcolate dai macro, non sommate dalle kcal dichiarate di ciascun
    // alimento, così il residuo qui e in Dieta sono sempre coerenti tra loro.
    const kcalOggi = calcolaTotaliGiorno(cache.dietaLogOggi).kcalTot;
    const residue = t.kcal - kcalOggi;
    const pctKcal = t.kcal>0 ? Math.min(100, Math.round(kcalOggi/t.kcal*100)) : 0;
    statsTiles.push(`<div class="oggi-stat"><div class="v">${fmt1(Math.abs(residue))}</div><div class="l">Kcal ${residue>=0?'restanti':'oltre il target'}<br>oggi</div><div class="os-bar"><i style="width:${pctKcal}%"></i></div></div>`);

    const idxProssimo = DIETA_PIANO.pasti.findIndex((p,i)=> !cache.dietaLogOggi.pastiFatti[i]);
    const prossimo = idxProssimo>=0 ? DIETA_PIANO.pasti[idxProssimo].nome : 'Tutto segnato ✅';
    pastoRow = `<div class="oggi-row"><span>🍽️ Prossimo da segnare</span><b>${prossimo}</b></div>`;
  }

  // Al posto della dicitura "N settimane di fila con allenamento", qui in Home
  // ora c'è il conteggio dell'acqua con un tasto rapido +250ml: è un dato che
  // si aggiorna più spesso durante la giornata, quindi più utile a colpo
  // d'occhio della streak. Rimane il target di obiettiviAttivi() (2500ml),
  // indipendente da pianoPersonale.
  const tAcqua = obiettiviAttivi(!!cache.dietaLogOggi.giornoAllenamento);
  const acquaMl = cache.dietaLogOggi.acquaMl || 0;
  const acquaL = (acquaMl/1000).toFixed(2).replace('.', ',');
  const acquaPct = Math.min(100, Math.round((acquaMl/tAcqua.acquaMl)*100));
  const acquaRow = `<div class="oggi-row oggi-water-row">
    <span>💧 Acqua oggi</span>
    <div class="oggi-water-ctrl">

/* ============ SESSIONE CARDIO ============
   A differenza della sessione pesi (avviaSessione), qui non c'è una scheda
   con esercizi: si sceglie solo l'attività, si avvia un cronometro e alla
   fine si stima quante kcal sono state bruciate dal tempo trascorso. Il
   cronometro è basato su un istante di inizio assoluto (startAt) più un
   accumulo del tempo passato in pausa, non su un contatore incrementato ad
   ogni tick — stesso principio robusto già usato per il timer di recupero
   (vedi startRestTimer): se il telefono va in stand-by, al ritorno il tempo
   trascorso si ricalcola comunque giusto da Date.now(). */
function pesoUtenteStimato(){
  const conPeso = cache.misure.filter(m=>m.peso!=null).slice().sort((a,b)=> new Date(b.data)-new Date(a.data));
  return conPeso.length ? conPeso[0].peso : 75; // stima ragionevole se non ci sono ancora misure salvate
}

function formatMMSS(ms){
  const totalSec = Math.max(0, Math.floor(ms/1000));
  const m = Math.floor(totalSec/60);
  const s = totalSec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

// kcal/min = MET × 3.5 × pesoKg / 200 (formula standard di stima da MET)
function kcalStimateCardio(tipoKey, ms){
  const att = CARDIO_ATTIVITA.find(a=>a.key===tipoKey);
  if(!att) return 0;
  const minuti = ms/60000;
  return (att.met * 3.5 * pesoUtenteStimato() / 200) * minuti;
}

function cardioSessioniUltimi7Giorni(){
  const settimanaFa = Date.now() - 7*24*60*60*1000;
  return cache.cardioSessioni.filter(s=> new Date(s.data).getTime() >= settimanaFa).length;
}
