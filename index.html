      <div class="field"><label>Vita (cm)</label><input type="number" step="0.5" id="mmVita" value="${m.vita??''}"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Petto (cm)</label><input type="number" step="0.5" id="mmPetto" value="${m.petto??''}"></div>
      <div class="field"><label>Fianchi (cm)</label><input type="number" step="0.5" id="mmFianchi" value="${m.fianchi??''}"></div>
    </div>
    <div class="field"><label>Collo (cm, facoltativo)</label><input type="number" step="0.5" id="mmCollo" value="${m.collo??''}"></div>
    <div class="grid2">
      <div class="field"><label>Braccio Dx (cm)</label><input type="number" step="0.5" id="mmBraccioDx" value="${m.braccioDx??''}"></div>
      <div class="field"><label>Braccio Sx (cm)</label><input type="number" step="0.5" id="mmBraccioSx" value="${m.braccioSx??''}"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Coscia Dx (cm)</label><input type="number" step="0.5" id="mmCosciaDx" value="${m.cosciaDx??''}"></div>
      <div class="field"><label>Coscia Sx (cm)</label><input type="number" step="0.5" id="mmCosciaSx" value="${m.cosciaSx??''}"></div>
    </div>
    <div class="field">
      <label>📝 Note</label>
      <textarea id="mmNote" rows="3" maxlength="500" style="width:100%;resize:vertical;font:inherit;">${escHtml(m.note||'')}</textarea>
    </div>
    <div class="field">
      <label>Foto progressi (fino a 4)</label>
      <p class="field-hint" style="margin-top:-2px;">Tocca una foto per sostituirla, la ✕ per rimuoverla, oppure aggiungi quelle mancanti.</p>
      <div class="photo-slots" id="mmPhotoSlots">${spinnerHtml('Carico le foto...')}</div>
    </div>
    <button class="btn" id="saveMisuraModBtn" onclick="salvaModificaMisura('${m.id}')">Salva modifiche</button>
  </div>`;

  caricaFotoMisuraModifica(m);
}

async function caricaFotoMisuraModifica(m){
  try{
    const snap = await userCollection('misureFoto').where('misuraId','==',m.id).get();
    if(route.name!=='misura-modifica' || route.id!==m.id) return;
    misuraModificaFotoState = [null,null,null,null];
    const esistenti = snap.docs.map(d=>({docId:d.id, ...d.data()}));
    esistenti.forEach(f=>{
      if(f.ordine>=0 && f.ordine<4) misuraModificaFotoState[f.ordine] = { tipo:'esistente', docId:f.docId, foto:f.foto };
    });
    // Compatibilita' con rilevazioni salvate prima della sottocollezione misureFoto.
    if(!esistenti.length && m.foto){
      misuraModificaFotoState[0] = { tipo:'esistente', docId:null, foto:m.foto };
    }
    renderMmPhotoSlots();
  }catch(e){
    const box = document.getElementById('mmPhotoSlots');
    if(box) box.innerHTML = `<div class="error-banner">Errore nel caricamento delle foto: ${e.message}</div>`;
  }
}

function renderMmPhotoSlots(){
  const box = document.getElementById('mmPhotoSlots');
  if(!box) return;
  box.innerHTML = FOTO_MISURA_LABELS.map((lbl,i)=>{
    const st = misuraModificaFotoState[i];
    const src = st && st.tipo!=='rimossa' ? (st.tipo==='nuova' ? st.previewUrl : st.foto) : null;
    return `<div class="photo-slot" id="mmSlot${i}">
      <input type="file" accept="image/*" capture="environment" id="mmFoto${i}" onchange="selezionaMmFotoSlot(${i})">
      ${src
        ? `<img class="photo-slot-preview" style="cursor:pointer;" src="${src}" onclick="document.getElementById('mmFoto${i}').click()">
           <span class="photo-slot-tag">${lbl}</span>
           <button type="button" class="photo-slot-remove" onclick="rimuoviMmFotoSlot(${i})">✕</button>`
        : `<div class="photo-slot-empty" onclick="document.getElementById('mmFoto${i}').click()">
             <span class="photo-slot-icon">📷</span><span>${lbl}</span>
           </div>`}
    </div>`;
  }).join('');
}

function selezionaMmFotoSlot(i){
  const input = document.getElementById('mmFoto' + i);
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    const st = misuraModificaFotoState[i];
    const docId = (st && st.docId) || null;
    misuraModificaFotoState[i] = { tipo:'nuova', docId, file, previewUrl: e.target.result };
    renderMmPhotoSlots();
  };
  reader.readAsDataURL(file);
}

function rimuoviMmFotoSlot(i){
  const st = misuraModificaFotoState[i];
  if(st && st.docId){
    misuraModificaFotoState[i] = { tipo:'rimossa', docId: st.docId };
  } else if(st && st.tipo==='esistente' && !st.docId){
    // era il campo legacy "foto" sulla misura stessa, non un documento a parte
    misuraModificaFotoState[i] = { tipo:'rimossa', docId: null };
  } else {
    misuraModificaFotoState[i] = null;
  }
  renderMmPhotoSlots();
}

async function salvaModificaMisura(id){
  const data = document.getElementById('mmData').value;
  const peso = document.getElementById('mmPeso').value;
  const vita = document.getElementById('mmVita').value;
  const petto = document.getElementById('mmPetto').value;
  const fianchi = document.getElementById('mmFianchi').value;
  const collo = document.getElementById('mmCollo').value;
  const braccioDx = document.getElementById('mmBraccioDx').value;
  const braccioSx = document.getElementById('mmBraccioSx').value;
  const cosciaDx = document.getElementById('mmCosciaDx').value;
  const cosciaSx = document.getElementById('mmCosciaSx').value;
  const note = (document.getElementById('mmNote').value || '').trim();
  const btn = document.getElementById('saveMisuraModBtn');
  const errBox = document.getElementById('misuraModError');
  errBox.innerHTML = '';

  const RANGE_PLAUSIBILI = {
    'Peso':[peso,20,400], 'Vita':[vita,40,200], 'Petto':[petto,40,200], 'Fianchi':[fianchi,40,200],
    'Collo':[collo,20,60],
    'Braccio Dx':[braccioDx,10,80], 'Braccio Sx':[braccioSx,10,80],
    'Coscia Dx':[cosciaDx,20,100], 'Coscia Sx':[cosciaSx,20,100]
  };
  for(const label in RANGE_PLAUSIBILI){
    const [valore, min, max] = RANGE_PLAUSIBILI[label];
    if(valore!==''){
      const n = Number(valore);
      if(isNaN(n) || n < min || n > max){
        errBox.innerHTML = `<div class="error-banner">Il valore inserito per "${label}" non sembra plausibile (${min}–${max}). Controllalo prima di salvare.</div>`;
        return;
      }
    }
  }

  btn.disabled = true; btn.textContent = 'Salvataggio...';
  try{
    let clearLegacyFoto = false;
    // Gli slot sono indipendenti: li elaboro in parallelo (resize + upload).
    await Promise.all([0,1,2,3].map(async i=>{
      const st = misuraModificaFotoState[i];
      if(!st) return;
      if(st.tipo==='rimossa'){
        if(st.docId) await attendiScrittura(userCollection('misureFoto').doc(st.docId).delete());
        else clearLegacyFoto = true;
      } else if(st.tipo==='nuova'){
        const fotoDataUrl = await resizeImage(st.file, 900, 0.72);
        if(st.docId){
          await attendiScrittura(userCollection('misureFoto').doc(st.docId).update({ foto: fotoDataUrl, ordine: i }));
        } else {
          await aggiungiDocRapido(userCollection('misureFoto'), { misuraId: id, ordine: i, foto: fotoDataUrl });
          clearLegacyFoto = true; // se sostituiva il vecchio campo legacy, va ripulito sulla misura
        }
      }
    }));
    delete fotoMisuraCache[id];

    // Ricalcola la miniatura dello storico sulla prima foto rimasta (se c'e').
    const fotoSnap = await userCollection('misureFoto').where('misuraId','==',id).get();
    const fotoRimaste = fotoSnap.docs.map(d=>d.data()).sort((a,b)=>(a.ordine||0)-(b.ordine||0));
    let fotoThumb = null;
    if(fotoRimaste.length){
      fotoThumb = await resizeDataUrl(fotoRimaste[0].foto, 160, 0.55);
    }

    const payload = {
      data,
      peso: peso ? Number(peso) : null,
      vita: vita ? Number(vita) : null,
      petto: petto ? Number(petto) : null,
      fianchi: fianchi ? Number(fianchi) : null,
      collo: collo ? Number(collo) : null,
      braccioDx: braccioDx ? Number(braccioDx) : null,
      braccioSx: braccioSx ? Number(braccioSx) : null,
      cosciaDx: cosciaDx ? Number(cosciaDx) : null,
      cosciaSx: cosciaSx ? Number(cosciaSx) : null,
      note,
      fotoThumb
    };
    if(clearLegacyFoto) payload.foto = firebase.firestore.FieldValue.delete();
    await attendiScrittura(userCollection('misure').doc(id).update(payload));

    const idx = cache.misure.findIndex(x=>x.id===id);
    if(idx>-1){
      const aggiornata = { ...cache.misure[idx], ...payload };
      if(clearLegacyFoto) delete aggiornata.foto;
      cache.misure[idx] = aggiornata;
    }
    cache.misure.sort((a,b)=> new Date(a.data)-new Date(b.data));
    setRoute({name:'misura-detail', id, justSaved:true});
  }catch(e){
    errBox.innerHTML = `<div class="error-banner">${e.message}</div>`;
    btn.disabled = false; btn.textContent = 'Salva modifiche';
  }
}

/* ============ CAROSELLO FOTO (swipe orizzontale) ============
   Componente riusato per la galleria del dettaglio misura: un pannello
   scorrevole a swipe con indicatori, invece di una griglia statica.
   Toccare la foto corrente apre comunque la vista a schermo intero. */
let caroselloFotoCorrente = [];
function apriLightboxCarosello(i){
  const f = caroselloFotoCorrente[i];
  if(f) apriLightbox(f.foto);
}
function renderCaroselloFoto(foto, idPrefix){
  // Le foto restano in memoria e la slide passa solo l'indice: prima il
  // base64 intero (centinaia di KB) veniva copiato dentro l'attributo onclick,
  // gonfiando il DOM e rallentando il rendering.
  caroselloFotoCorrente = foto;
  const slides = foto.map((f,i)=>{
    const label = FOTO_MISURA_LABELS[f.ordine] || '';
    return `<div class="carousel-slide" onclick="apriLightboxCarosello(${i})">
      <img src="${f.foto}">
      ${label ? `<span class="photo-grid-tag">${label}</span>` : ''}
    </div>`;
  }).join('');
  const dots = foto.length>1
    ? `<div class="carousel-dots" id="${idPrefix}-dots">${foto.map((_,i)=>`<span class="dot${i===0?' active':''}"></span>`).join('')}</div>`
    : '';
  return `<div class="carousel">
    <div class="carousel-track" id="${idPrefix}-track">${slides}</div>
    ${dots}
  </div>`;
}

function initCarosello(idPrefix, count){
  const track = document.getElementById(idPrefix+'-track');
  if(!track || count<=1) return;
  const dotsWrap = document.getElementById(idPrefix+'-dots');
  let index = 0, startX = 0, baseX = 0, dragging = false, swiped = false;
  const widthPx = () => track.parentElement.clientWidth;

  function goTo(i){
    index = Math.max(0, Math.min(count-1, i));
    track.style.transform = `translateX(-${index*widthPx()}px)`;
    if(dotsWrap) [...dotsWrap.children].forEach((d,di)=>d.classList.toggle('active', di===index));
  }
  track.addEventListener('pointerdown', e=>{
    dragging = true; swiped = false; startX = e.clientX; baseX = -index*widthPx();
    track.style.transition = 'none';
  });
  track.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dx = e.clientX - startX;
    if(Math.abs(dx) > 8) swiped = true;
    track.style.transform = `translateX(${baseX+dx}px)`;
  });
  const fine = e=>{
    if(!dragging) return;
    dragging = false;
    track.style.transition = 'transform .25s ease';
    const dx = (e.clientX!=null ? e.clientX : startX) - startX;
    if(dx < -40 && index<count-1) index++;
    else if(dx > 40 && index>0) index--;
    goTo(index);
  };
  track.addEventListener('pointerup', fine);
  track.addEventListener('pointercancel', fine);
  track.addEventListener('click', e=>{ if(swiped){ e.preventDefault(); e.stopImmediatePropagation(); swiped=false; } }, true);
  // Un solo listener 'resize' per carosello: prima ne veniva aggiunto uno
  // nuovo (mai rimosso) a ogni apertura di un dettaglio, accumulandosi.
  if(window._caroselloResize) window.removeEventListener('resize', window._caroselloResize);
  window._caroselloResize = ()=>{
    if(!document.body.contains(track)){
      window.removeEventListener('resize', window._caroselloResize);
      window._caroselloResize = null;
      return;
    }
    goTo(index);
  };
  window.addEventListener('resize', window._caroselloResize);
  goTo(0);
}

// Vista foto a schermo intero (tocca fuori dall'immagine per chiudere).
function apriLightbox(src){
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay lightbox-overlay';
  overlay.innerHTML = `<img src="${src}" class="lightbox-img">`;
  overlay.addEventListener('click', ()=> overlay.remove());
  document.body.appendChild(overlay);
  attachSwipeDownToDismiss(overlay.querySelector('.lightbox-img'), ()=>{ hapticaLieve(); overlay.remove(); });
}

// Punto di ingresso dalla schermata "Confronta foto": apre lo slider a
// schermo intero con entrambe le foto dell'angolazione corrente, o la
// lightbox singola se per quella data manca la foto della controparte.
function apriLightboxConfronto(){
  const { idA, idB, tab, fotoA, fotoB } = confrontaState;
  const fA = fotoA.find(f=>f.ordine===tab);
  const fB = fotoB.find(f=>f.ordine===tab);
  if(fA && fB){
    const mA = cache.misure.find(m=>m.id===idA);
    const mB = cache.misure.find(m=>m.id===idB);
    const fmt = d => new Date(d).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'});
    apriCompareSlider(fA.foto, fB.foto, mA?fmt(mA.data):'Prima', mB?fmt(mB.data):'Dopo');
  } else if(fA){
    apriLightbox(fA.foto);
  } else if(fB){
    apriLightbox(fB.foto);
  }
}

// Confronto a schermo intero con slider trascinabile: la foto "dopo" è
// ritagliata (non ridimensionata) da un divisore verticale che si sposta col
// dito, cosi' le due foto restano alla stessa scala mentre si confrontano —
// lo stesso pattern degli slider prima/dopo delle app di trasformazione fisica.
function apriCompareSlider(srcA, srcB, labelA, labelB){
  const overlay = document.createElement('div');
  overlay.className = 'compare-lightbox';
  overlay.innerHTML = `
    <button type="button" class="cl-close" aria-label="Chiudi">✕</button>
    <div class="cl-imgs" id="clImgs">
      <img src="${srcA}" class="cl-img cl-img-a" draggable="false" alt="${labelA}">
      <div class="cl-b-wrap" id="clBWrap" style="width:50%;">
        <img src="${srcB}" class="cl-img cl-img-b" draggable="false" alt="${labelB}">
      </div>
      <div class="cl-divider" id="clDivider" style="left:50%;"><div class="cl-handle">↔</div></div>
    </div>
    <div class="cl-labels">
      <span class="cl-label cl-label-a">${labelA}</span>
      <span class="cl-label cl-label-b">${labelB}</span>
    </div>
    <p class="cl-hint" id="clHint">↔ Trascina per confrontare</p>`;
  document.body.appendChild(overlay);

  const imgsEl = overlay.querySelector('#clImgs');
  const bWrap = overlay.querySelector('#clBWrap');
  const divider = overlay.querySelector('#clDivider');
  const imgB = overlay.querySelector('.cl-img-b');
  const elLabelA = overlay.querySelector('.cl-label-a');
  const elLabelB = overlay.querySelector('.cl-label-b');
  const hintEl = overlay.querySelector('#clHint');

  // L'immagine "dopo" ha larghezza fissa pari al contenitore: restringere il
  // wrapper che la contiene la ritaglia invece di scalarla, dando l'effetto
  // slider invece di uno schiacciamento dell'immagine.
  function fissaLarghezzaImgB(){
    imgB.style.width = imgsEl.getBoundingClientRect().width + 'px';
  }
  fissaLarghezzaImgB();
  window.addEventListener('resize', fissaLarghezzaImgB);

  // Quando lo slider è portato quasi/del tutto su un'estremo (si vede
  // sostanzialmente solo una delle due foto) evidenziamo la sua data e
  // affievoliamo l'altra, cosi' non ci si confonde su quale foto si sta
  // guardando quando sembra "una sola" a schermo intero.
  function aggiornaEtichette(pct){
    if(!elLabelA || !elLabelB) return;
    if(pct <= 2){
      elLabelA.classList.add('active'); elLabelA.classList.remove('dim');
      elLabelB.classList.remove('active'); elLabelB.classList.add('dim');
      if(hintEl) hintEl.textContent = `📍 ${labelA}`;
    } else if(pct >= 98){
      elLabelB.classList.add('active'); elLabelB.classList.remove('dim');
      elLabelA.classList.remove('active'); elLabelA.classList.add('dim');
      if(hintEl) hintEl.textContent = `📍 ${labelB}`;
    } else {
      elLabelA.classList.remove('active','dim');
      elLabelB.classList.remove('active','dim');
      if(hintEl) hintEl.textContent = '↔ Trascina per confrontare';
    }
  }

  function setPosizione(clientX){
    const rect = imgsEl.getBoundingClientRect();
    let pct = ((clientX - rect.left) / rect.width) * 100;
    pct = Math.max(0, Math.min(100, pct));
    bWrap.style.width = pct + '%';
    divider.style.left = pct + '%';
    aggiornaEtichette(pct);
  }
  aggiornaEtichette(50);

  let trascinando = false;
  const onDown = e=>{ trascinando = true; setPosizione(e.clientX); e.preventDefault(); };
  const onMove = e=>{ if(trascinando) setPosizione(e.clientX); };
  const onUp = ()=>{ trascinando = false; };
  imgsEl.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);

  const chiudi = ()=>{
    window.removeEventListener('resize', fissaLarghezzaImgB);
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    overlay.remove();
    hapticaLieve();
  };
  overlay.querySelector('.cl-close').addEventListener('click', chiudi);
}

/* ============ CONFRONTO FOTO PROGRESSI ============
   Affianca le foto di due rilevazioni diverse, stessa angolazione, per vedere
   i cambiamenti che il numero sulla bilancia da solo non racconta. */
let confrontaState = { idA:null, idB:null, tab:0, fotoA:[], fotoB:[] };

function haFotoMisura(m){ return !!(m && (m.fotoThumb || m.foto)); }

function renderConfrontaFoto(){
  pageTitle.textContent = 'Confronta misure';
  // Si possono confrontare TUTTE le rilevazioni, non solo quelle con foto:
  // le foto compaiono nel confronto solo se almeno una delle due date le ha.
  const tutte = cache.misure
    .slice()
    .sort((a,b)=> new Date(a.data)-new Date(b.data));

  if(tutte.length<2){
    view.innerHTML = `<p class="empty"><span class="empty-icon">📏</span>Servono almeno due rilevazioni per confrontarle.</p>`;
    return;
  }

  const idA = tutte[0].id;
  const idB = tutte[tutte.length-1].id;
  confrontaState = { idA, idB, tab:0, fotoA:[], fotoB:[] };

  const opzione = m => `<option value="${m.id}">${new Date(m.data).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}${m.peso?' · '+m.peso+'kg':''}${haFotoMisura(m)?' · 📸':''}</option>`;

  view.innerHTML = `<div class="card compare-head">
    <div class="compare-dates">
      <div class="field compare-field"><label>📅 Prima</label>
        <select id="compareSelA" onchange="cambiaConfronto()">${tutte.map(opzione).join('')}</select>
      </div>
      <button type="button" class="compare-swap-btn" onclick="scambiaConfronto()" aria-label="Inverti prima e dopo" title="Inverti">⇄</button>
      <div class="field compare-field"><label>📅 Dopo</label>
        <select id="compareSelB" onchange="cambiaConfronto()">${tutte.map(opzione).join('')}</select>
      </div>
    </div>
    <p class="compare-distanza" id="compareDistanza"></p>
  </div>
  <div id="compareDiff"></div>
  <div id="compareBody"></div>`;

  document.getElementById('compareSelA').value = idA;
  document.getElementById('compareSelB').value = idB;
  caricaConfronto(idA, idB);
}

function cambiaConfronto(){
  const idA = document.getElementById('compareSelA').value;
  const idB = document.getElementById('compareSelB').value;
  caricaConfronto(idA, idB);
}

// Inverte le due date selezionate (utile quando si vuole vedere il
// confronto "al contrario" senza dover riaprire le due tendine a mano).
function scambiaConfronto(){
  const selA = document.getElementById('compareSelA');
  const selB = document.getElementById('compareSelB');
  if(!selA || !selB) return;
  const tmp = selA.value;
  selA.value = selB.value;
  selB.value = tmp;
  hapticaLieve();
  cambiaConfronto();
}

// Testo "X giorni / settimane di distanza" mostrato sotto ai selettori data.
function aggiornaDistanzaConfronto(mA, mB){
  const el = document.getElementById('compareDistanza');
  if(!el || !mA || !mB) return;
  const giorni = Math.round(Math.abs(new Date(mB.data) - new Date(mA.data)) / 86400000);
  if(giorni===0){ el.textContent = 'Stessa data'; return; }
  if(giorni < 14){ el.textContent = `${giorni} giorn${giorni===1?'o':'i'} di distanza`; return; }
  const settimane = Math.round(giorni/7);
  el.textContent = `${settimane} settimane di distanza (${giorni} giorni)`;
}

async function caricaConfronto(idA, idB){
  confrontaState.idA = idA; confrontaState.idB = idB;
  const mA = cache.misure.find(m=>m.id===idA);
  const mB = cache.misure.find(m=>m.id===idB);
  // Le differenze di misure non dipendono dalle foto: si mostrano subito,
  // senza aspettare nessuna richiesta di rete.
  aggiornaDistanzaConfronto(mA, mB);
  renderCompareDiff();

  const body = document.getElementById('compareBody');
  if(!body) return;
  if(!haFotoMisura(mA) && !haFotoMisura(mB)){
    confrontaState.fotoA = []; confrontaState.fotoB = [];
    body.innerHTML = '';
    return;
  }
  body.innerHTML = spinnerHtml('Carico le foto...');
  try{
    const daCaricare = [haFotoMisura(mA)?idA:null, haFotoMisura(mB)?idB:null].filter(Boolean);
    const mappa = await fotoDiMisure([...new Set(daCaricare)]);
    // Se nel frattempo si è cambiata schermata o selezione, scarta il risultato.
    if(!document.getElementById('compareBody') || route.name!=='confronta-foto') return;
    if(confrontaState.idA!==idA || confrontaState.idB!==idB) return;

    const fotoA = mappa[idA] || [];
    const fotoB = mappa[idB] || [];
    confrontaState.fotoA = fotoA;
    confrontaState.fotoB = fotoB;

    const angoliDisponibili = FOTO_MISURA_LABELS.map((_,i)=>i).filter(i=> fotoA.some(f=>f.ordine===i) || fotoB.some(f=>f.ordine===i));
    confrontaState.tab = angoliDisponibili.length ? angoliDisponibili[0] : 0;

    renderComparePane();
  }catch(e){
    const b = document.getElementById('compareBody');
    if(b) b.innerHTML = `<div class="error-banner">Errore nel caricamento delle foto: ${e.message}</div>`;
  }
}

function selezionaTabConfronto(i){
  confrontaState.tab = i;
  renderComparePane();
}

const CAMPI_CONFRONTO_MISURE = [
  {key:'peso', label:'Peso', unit:'kg', icon:'⚖️'},
  {key:'vita', label:'Vita', unit:'cm', icon:'📏'},
  {key:'petto', label:'Petto', unit:'cm', icon:'📏'},
  {key:'fianchi', label:'Fianchi', unit:'cm', icon:'📏'},
  {key:'collo', label:'Collo', unit:'cm', icon:'📏'},
  {key:'braccioDx', label:'Braccio Dx', unit:'cm', icon:'💪'},
  {key:'braccioSx', label:'Braccio Sx', unit:'cm', icon:'💪'},
  {key:'cosciaDx', label:'Coscia Dx', unit:'cm', icon:'🦵'},
  {key:'cosciaSx', label:'Coscia Sx', unit:'cm', icon:'🦵'}
];

// Tabella delle differenze tra le due rilevazioni scelte. Un valore presente
// in una sola delle due date compare comunque (con "—" dall'altra parte),
// invece di sparire come prima.
function renderCompareDiff(){
  const el = document.getElementById('compareDiff');
  if(!el) return;
  const mA = cache.misure.find(m=>m.id===confrontaState.idA);
  const mB = cache.misure.find(m=>m.id===confrontaState.idB);
  if(!mA || !mB){ el.innerHTML = `<p class="empty">Rilevazione non trovata.</p>`; return; }
  const ha = (m,k)=> m[k]!=null && m[k]!=='';

  const righe = CAMPI_CONFRONTO_MISURE
    .filter(c=> ha(mA,c.key) || ha(mB,c.key))
    .map(c=>{
      const entrambi = ha(mA,c.key) && ha(mB,c.key);
      const vA = ha(mA,c.key) ? `${mA[c.key]}${c.unit}` : '—';
      const vB = ha(mB,c.key) ? `${mB[c.key]}${c.unit}` : '—';
      let testoDelta = 'n/d', direzione = '';
      if(entrambi){
        const delta = Math.round((mB[c.key]-mA[c.key])*10)/10;
        const segno = delta>0 ? '+' : '';
        direzione = delta>0 ? 'up' : (delta<0 ? 'down' : '');
        const freccia = delta>0 ? '▲' : (delta<0 ? '▼' : '＝');
        testoDelta = delta===0 ? 'invariato' : `${freccia} ${segno}${delta}${c.unit}`;
      }
      return `<div class="diff-row">
        <span class="diff-icon">${c.icon}</span>
        <span class="diff-label">${c.label}</span>
        <span class="diff-vals">${vA} → ${vB}</span>
        <span class="diff-delta ${direzione}">${testoDelta}</span>
      </div>`;
    }).join('');

  el.innerHTML = righe
    ? `<div class="card"><h3 style="margin-top:0;font-size:15px;">📈 Differenze</h3>${righe}</div>`
    : `<div class="card"><p class="field-hint" style="margin:0;">Nessun valore da confrontare tra queste due date.</p></div>`;
}

function renderComparePane(){
  const body = document.getElementById('compareBody');
  if(!body) return;
  const { idA, idB, tab, fotoA, fotoB } = confrontaState;
  const mA = cache.misure.find(m=>m.id===idA);
  const mB = cache.misure.find(m=>m.id===idB);
  if(!mA || !mB){ body.innerHTML = ''; return; }

  const angoliDisponibili = FOTO_MISURA_LABELS.map((_,i)=>i).filter(i=> fotoA.some(f=>f.ordine===i) || fotoB.some(f=>f.ordine===i));
  if(!angoliDisponibili.length){ body.innerHTML = ''; return; }
  const tabsHtml = `<div class="chip-select">${angoliDisponibili.map(i=>`<div class="chip ${i===tab?'active':''}" onclick="selezionaTabConfronto(${i})">${FOTO_MISURA_LABELS[i]}</div>`).join('')}</div>`;

  const fA = fotoA.find(f=>f.ordine===tab);
  const fB = fotoB.find(f=>f.ordine===tab);
  const puoIngrandire = !!(fA || fB);
  const paneHtml = `<div class="photo-grid" id="comparePhotoPane">
    <div class="photo-grid-item" ${fA?`onclick="apriLightboxConfronto()"`:''}>
      ${fA ? `<img src="${fA.foto}"><span class="photo-zoom-badge">🔍</span>` : `<div class="empty" style="padding:30px 6px;font-size:12px;">Nessuna foto</div>`}
      <span class="photo-grid-tag">${new Date(mA.data).toLocaleDateString('it-IT',{day:'numeric',month:'short'})}</span>
    </div>
    <div class="photo-grid-item" ${fB?`onclick="apriLightboxConfronto()"`:''}>
      ${fB ? `<img src="${fB.foto}"><span class="photo-zoom-badge">🔍</span>` : `<div class="empty" style="padding:30px 6px;font-size:12px;">Nessuna foto</div>`}
      <span class="photo-grid-tag">${new Date(mB.data).toLocaleDateString('it-IT',{day:'numeric',month:'short'})}</span>
    </div>
  </div>
  ${puoIngrandire ? `<p class="field-hint compare-zoom-hint">🔍 Tocca una foto per il confronto a schermo intero${(fA&&fB)?' con slider':''}</p>` : ''}`;

  body.innerHTML = `<div class="card"><h3 style="margin-top:0;font-size:15px;">📸 Foto</h3>${tabsHtml}${paneHtml}${angoliDisponibili.length>1?`<p class="field-hint" style="margin:10px 2px 0;text-align:center;">← scorri per cambiare angolazione →</p>`:''}</div>`;

  attachSwipeTabConfronto(angoliDisponibili, tab);
}

// Permette di scorrere tra le angolazioni disponibili nel confronto foto con
// uno swipe orizzontale sulla coppia di foto, oltre a toccare le chip sopra.
function attachSwipeTabConfronto(angoli, tabAttuale){
  const el = document.getElementById('comparePhotoPane');
  if(!el || angoli.length<2) return;
  let startX = 0, dragging = false;
  el.addEventListener('pointerdown', e=>{ startX = e.clientX; dragging = true; });
  const fine = e=>{
    if(!dragging) return;
    dragging = false;
    const dx = (e.clientX!=null ? e.clientX : startX) - startX;
    if(Math.abs(dx) < 40) return;
    const pos = angoli.indexOf(tabAttuale);
    if(dx < 0 && pos < angoli.length-1) selezionaTabConfronto(angoli[pos+1]);
    else if(dx > 0 && pos > 0) selezionaTabConfronto(angoli[pos-1]);
  };
  el.addEventListener('pointerup', fine);
  el.addEventListener('pointercancel', fine);
}

/* ============ AVVIO ============ */
async function boot(){
  // Le tre richieste del primo avvio (catalogo schede, profilo, dati
  // dieta/allenamenti/misure) non dipendono l'una dall'altra: prima
  // partivano in fila (tre round-trip di rete uno dopo l'altro), qui
  // partono tutte insieme, così l'attesa totale è quella della più lenta
  // delle tre invece della somma di tutte e tre — il guadagno più grande
  // sul tempo di caricamento percepito all'apertura dell'app.
  loadDataInVolo = loadData();
  const [, profiloCompleto] = await Promise.all([
    caricaCatalogoSchede(),
    checkProfilo(),
    loadDataInVolo
  ]);
  if(!profiloCompleto){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'none';
    document.getElementById('onboardingScreen').style.display = 'block';
    return;
  }
  await avviaApp();
}

async function avviaApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('onboardingScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  richiediPermessoNotifiche();
  view.innerHTML = '<div class="spinner-wrap">Caricamento dati...</div>';
  try{
    // Se boot() ha già avviato loadData() in parallelo (caso normale di
    // login), aspettiamo quella stessa chiamata invece di farne una
    // seconda da zero. Nei percorsi di creazione account (registrati()/
    // salvaProfilo(), chiamati prima che boot() esista per quell'utente)
    // loadDataInVolo è ancora vuoto, quindi partiamo da zero come prima.
    await (loadDataInVolo || loadData());
    loadDataInVolo = null;
    applicaPulloverSessioneOggi(); // senza attendere: non deve mai bloccare l'avvio
    // A schermata già pronta, scarica i grafici in background: Statistiche si apre subito.
    setTimeout(()=>{ (window.requestIdleCallback||setTimeout)(()=>{ caricaChartJs().catch(()=>{}); }); }, 4000);
    // Chiesto qui, prima della Home, così vale per tutta la sessione di oggi
    // (statistiche di Home e target di Dieta inclusi) e non solo aprendo Dieta.
    const pianoPersonale = profiloUtente && profiloUtente.schedeAssegnate === null;
    if(pianoPersonale && cache.dietaLogOggi.giornoAllenamento === null){
      await chiediEImpostaGiornoAllenamento();
    }
    const riprendi = await controllaSessioneInCorso();
    goHome();
    if(riprendi) setRoute({name:'sessione'});
  }catch(e){
    view.innerHTML = `<div class="error-banner">Errore nel caricamento dei dati: ${e.message}</div>`;
  }
}

/* ============ LOGIN TEMPORANEAMENTE DISATTIVATO ============
   Per riattivare il login: rimetti LOGIN_ENABLED a true.
   Il codice di autenticazione sopra resta invariato, viene solo bypassato qui sotto. */
const LOGIN_ENABLED = true;
const DEV_UID = 'dev-local-user';

if(LOGIN_ENABLED){
  auth.onAuthStateChanged(user=>{
    if(registrazioneInCorso) return; // durante la registrazione ci pensa già registrati() a gestire il flusso
    if(user){
      currentUid = user.uid;
      boot();
    } else {
      currentUid = null;
      profiloUtente = null;
      document.getElementById('loginScreen').style.display = 'block';
      document.getElementById('registerScreen').style.display = 'none';
      document.getElementById('onboardingScreen').style.display = 'none';
      document.getElementById('app').style.display = 'none';
      const btn = document.getElementById('loginBtn');
      btn.disabled = false; btn.textContent = 'Accedi';
    }
  });

  document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  document.getElementById('regPass').addEventListener('keydown', e=>{ if(e.key==='Enter') registrati(); });
} else {
  document.getElementById('loginScreen').style.display = 'none';
  const logoutBtn = document.querySelector('.logout-btn');
  if(logoutBtn) logoutBtn.style.display = 'none';
  currentUid = DEV_UID;
  boot();
}

/* ============ PWA: registrazione service worker ============
   Permette di installare l'app sul telefono e di riaprirla anche con poco
   o nessun segnale in palestra (l'app shell viene servita dalla cache). */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js', { updateViaCache:'none' }).then(reg=>{ try{ reg.update(); }catch(e){} }).catch(()=>{});
    controllaNuovaVersione();
  });
}

/* Aggiornamento automatico: il service worker serve l'app dalla cache, quindi
   dopo un nuovo push il telefono può restare sulla versione vecchia. All'avvio
   si legge index.html dal server (senza cache): se l'identificativo di versione
   è diverso, si svuotano cache e service worker e si ricarica una sola volta. */
const BUILD_ID = '2026-11-12-legcurl-v24';
async function controllaNuovaVersione(){
  try{
    if(!navigator.onLine) return;
    const ctrl = new AbortController(); const to = setTimeout(()=>ctrl.abort(), 8000);
    const r = await fetch('index.html?v='+Date.now(), { cache:'no-store', signal: ctrl.signal }).finally(()=>clearTimeout(to));
    if(!r || !r.ok) return;
    const txt = await r.text();
    const m = txt.match(/const BUILD_ID = '([^']+)'/);
    if(!m || m[1]===BUILD_ID) return;
    if(sessionStorage.getItem('byReload')===m[1]) return;
    sessionStorage.setItem('byReload', m[1]);
    if(typeof sessionDraft!=='undefined' && sessionDraft) return; // non interrompere un allenamento in corso
    if('caches' in window){ const ks = await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }
    const regs = await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map(g=>g.unregister()));
    location.reload();
  }catch(e){}
}
