<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beat Yourself</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
<meta name="theme-color" content="#0b0d11">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<style>
  :root{
    --bg:#08090c;
    --panel:#111319;
    --panel-2:#191c24;
    --border:#1c2029;
    --text:#f5f7fa;
    --text-dim:#949cb2;
    --accent:#39ff94;
    --accent-2:#ff9d4d;
    --accent-3:#8b6bff;
    --danger:#ff5470;
    --radius:22px;
    --radius-sm:18px;
    --shadow-card:0 4px 16px -10px rgba(0,0,0,.6);
    --shadow-btn:0 0 20px -4px #39ff9466;
  }
  *{box-sizing:border-box;}
  html{-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:560px;margin:0 auto;padding:0 0 70px;min-height:100vh;}
  header{
    position:sticky;top:0;z-index:10;
    background:transparent;
    backdrop-filter:none;-webkit-backdrop-filter:none;
    border-bottom:1px solid transparent;
    padding:20px 18px 12px;
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
    transition:background-color .25s ease, backdrop-filter .25s ease, border-color .25s ease;
  }
  header.scrolled{
    background:rgba(8,9,12,.93);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom-color:var(--border);
  }
  .header-side{display:flex;align-items:center;gap:12px;}
  .header-side.right{justify-content:flex-end;}
  header h1{
    font-size:19px;margin:0;font-weight:800;letter-spacing:-.2px;
    text-align:center;white-space:nowrap;
    background:linear-gradient(90deg,var(--text) 25%,var(--accent) 110%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .back-btn{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    width:42px;height:42px;border-radius:50%;font-size:19px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .brand-mark{width:34px;height:34px;flex-shrink:0;display:block;}
  .back-btn:active{transform:scale(.92);}
  .avatar-btn{
    background:none;border:none;padding:0;cursor:pointer;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s ease;
  }
  .avatar-btn:active{transform:scale(.92);}
  main{padding:8px 18px 30px;transform-origin:50% 50%;}
  @keyframes viewGrowIn{
    from{ transform:scale(.4); opacity:0; }
    to{ transform:scale(1); opacity:1; }
  }
  @keyframes viewShrinkOut{
    from{ transform:scale(1); opacity:1; }
    to{ transform:scale(.4); opacity:0; }
  }
  .view-anim-in{ animation:viewGrowIn .32s cubic-bezier(.22,.9,.32,1); }
  .view-anim-out{ animation:viewShrinkOut .22s cubic-bezier(.4,0,.7,1) forwards; }
  .card{
    background:var(--panel);border:1px solid var(--border);
    box-shadow:var(--shadow-card);
    border-radius:var(--radius);padding:20px;margin-bottom:16px;
  }
  .home-cat{
    display:flex;align-items:center;gap:16px;position:relative;
    padding:18px 20px;margin-bottom:12px;border-radius:var(--radius);
    background:var(--panel);border:1px solid var(--border);
    box-shadow:var(--shadow-card);
    cursor:pointer;transition:transform .15s ease, box-shadow .22s ease, background .22s ease, border-color .22s ease;
  }
  .home-cat:active{transform:scale(.97);}
  .home-cat.tapped{
    transform:scale(.97);
    border-color:var(--accent);
    background:radial-gradient(circle at 50% 50%, #39ff9433 0%, var(--panel) 72%);
    box-shadow:0 0 0 1.5px var(--accent), 0 0 34px 6px #39ff9466, inset 0 0 26px -6px #39ff9455;
  }
  .home-cat .icon{
    width:52px;height:52px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:25px;
    background:var(--panel-2);border:1.5px solid var(--accent);
    box-shadow:0 0 16px -5px #39ff94aa;
  }
  .home-cat .label{font-size:17.5px;font-weight:800;letter-spacing:-.1px;}
  .home-cat .sub{font-size:13px;color:var(--text-dim);margin-top:3px;font-weight:600;}
  .profile-link{font-size:12.5px;color:var(--text-dim);font-weight:700;margin:0 0 16px;}
  .profile-link span{cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
  .app-credit{
    text-align:center;font-size:12px;color:var(--text-dim);font-weight:600;
    margin:26px 0 10px;letter-spacing:.2px;
  }
  .app-credit span{
    color:var(--accent);font-weight:800;
    text-shadow:0 0 12px #39ff9466;
  }
  .home-squares{display:flex;gap:12px;margin-bottom:12px;}
  .home-square{
    flex:1;padding:20px 10px;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);
    box-shadow:var(--shadow-card);cursor:pointer;transition:transform .15s ease, box-shadow .22s ease, background .22s ease, border-color .22s ease;
  }
  .home-square:active{transform:scale(.97);}
  .home-square.tapped{
    transform:scale(.97);
    border-color:var(--accent);
    background:radial-gradient(circle at 50% 50%, #39ff9433 0%, var(--panel) 72%);
    box-shadow:0 0 0 1.5px var(--accent), 0 0 30px 5px #39ff9466, inset 0 0 22px -6px #39ff9455;
  }
  .home-square .icon{
    width:46px;height:46px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:21px;
    background:var(--panel-2);border:1.5px solid var(--accent);
    box-shadow:0 0 14px -5px #39ff94aa;
  }
  .home-square .label{font-size:14px;font-weight:800;letter-spacing:-.1px;}
  .list-item{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);
    box-shadow:var(--shadow-card);
    padding:16px 18px;margin-bottom:10px;cursor:pointer;
    border-left:3px solid var(--accent);
  }
  .list-item:active{opacity:.8;}
  .list-item h3{margin:0 0 4px;font-size:16px;font-weight:700;}
  .list-item p{margin:0;font-size:12.5px;color:var(--text-dim);font-weight:600;}
  .list-item .scheda-desc{margin-top:8px;font-size:12.5px;line-height:1.55;color:var(--text-dim);font-weight:500;}
  .list-item.passato{border-left-color:var(--text-dim);opacity:.65;}
  .list-item.locked{border-left-color:var(--text-dim);opacity:.5;cursor:default;}
  .section-label{
    font-size:12px;text-transform:uppercase;letter-spacing:.6px;
    color:var(--text-dim);font-weight:800;margin:20px 2px 10px;
  }
  .swipe-hint{font-size:12.5px;color:var(--text-dim);text-align:center;margin:0 0 12px;font-weight:600;}
  .swipe-row{position:relative;border-radius:var(--radius-sm);margin-bottom:10px;overflow:hidden;}
  .swipe-row .list-item{margin-bottom:0;position:relative;z-index:1;touch-action:pan-y;will-change:transform;}
  .swipe-delete{
    position:absolute;top:0;right:0;bottom:0;width:84px;z-index:0;
    background:linear-gradient(135deg,var(--danger),#c92548);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;
  }
  .pill{
    display:inline-block;font-size:11.5px;font-weight:800;padding:4px 11px;border-radius:20px;
    background:#39ff9422;
    color:var(--accent);margin-right:6px;letter-spacing:.2px;
    border:1px solid #39ff9440;
  }
  .btn{
    background:linear-gradient(135deg,var(--accent),#1fae63);color:#04140d;border:none;border-radius:18px;
    padding:15px 18px;font-size:15px;font-weight:800;cursor:pointer;width:100%;
    box-shadow:var(--shadow-btn);transition:transform .1s ease;
  }
  .btn:active{transform:scale(.98);}
  .btn.secondary{background:var(--panel-2);color:var(--text);box-shadow:none;border:1px solid var(--border);}
  .btn.small{width:auto;padding:9px 16px;font-size:13.5px;}
  .btn.tap-glow{animation:btnGlow .26s ease;}
  @keyframes btnGlow{
    0%{box-shadow:0 0 0 2px var(--accent), 0 0 26px 6px #39ff9466;}
    100%{box-shadow:var(--shadow-btn);}
  }
  .btn.secondary.tap-glow{animation:btnGlowSecondary .26s ease;}
  @keyframes btnGlowSecondary{
    0%{box-shadow:0 0 0 2px var(--accent), 0 0 20px 5px #39ff9440;}
    100%{box-shadow:none;}
  }
  .btn.danger.tap-glow{animation:btnGlowDanger .26s ease;}
  @keyframes btnGlowDanger{
    0%{box-shadow:0 0 0 2px var(--danger), 0 0 26px 6px #ff547066;}
    100%{box-shadow:0 10px 24px -8px #ff547055;}
  }
  .alt-tag{
    display:inline-block;font-size:10px;font-weight:800;color:var(--accent-2);
    background:#ff9d4d22;padding:3px 8px;border-radius:20px;vertical-align:middle;
    text-transform:uppercase;letter-spacing:.3px;margin-left:4px;
  }
  .btn.danger{background:linear-gradient(135deg,var(--danger),#c92548);color:#fff;box-shadow:0 10px 24px -8px #ff547055;}
  .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
  .exercise-card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow-card);
    padding:18px;margin-bottom:14px;border-top:3px solid var(--accent);
  }
  .exercise-card h3{margin:0 0 3px;font-size:16.5px;font-weight:800;}
  .ex-meta{font-size:12.5px;color:var(--text-dim);margin-bottom:12px;font-weight:700;}
  .ex-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .ex-head .ex-head-info{flex:1;min-width:0;}
  .ex-head .ex-head-info h3{margin:0 0 3px;}
  .ex-thumb{
    width:60px;height:60px;flex-shrink:0;border-radius:14px;
    background:#f4f4f4;border:1px solid var(--border);overflow:hidden;
  }
  .ex-thumb img{width:100%;height:100%;object-fit:contain;display:block;}
  .ex-attrib{font-size:10.5px;color:var(--text-dim);text-align:center;margin:6px 0 18px;font-weight:600;}
  .ex-attrib a{color:var(--text-dim);}
  .set-row{
    display:grid;grid-template-columns:22px 1fr 1fr 54px 30px;gap:6px;align-items:center;
    margin-bottom:8px;
  }
  .set-row span{font-size:13px;color:var(--text-dim);font-weight:700;}
  .set-row input[type=number], .set-row input[type=text]{
    width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:10px 9px;font-size:14.5px;font-weight:600;
  }
  .set-row input[type=number]:focus, .set-row input[type=text]:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  .set-row input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);}
  .set-row select{
    width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:9px 2px;font-size:12.5px;font-weight:700;text-align:center;
  }
  .set-row select:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  .rpe-legend{font-size:11px;color:var(--text-dim);font-weight:600;margin:2px 0 10px;line-height:1.5;}
  .note-user{
    width:100%;font-family:inherit;resize:vertical;min-height:46px;
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    border-radius:12px;padding:11px 13px;font-size:13px;font-weight:500;margin-top:10px;
  }
  .note-user:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  .note-user::placeholder{color:var(--text-dim);}
  .exercise-card.locked-ex{opacity:.55;}
  .lock-banner{
    display:flex;align-items:center;gap:8px;padding:14px;margin-top:4px;
    background:var(--panel-2);border-radius:12px;color:var(--text-dim);font-size:12.5px;font-weight:700;
  }
  .note-box{
    font-size:13px;color:var(--text-dim);background:var(--panel-2);
    border-radius:12px;padding:12px 14px;margin-top:10px;line-height:1.55;font-weight:500;
  }
  .toggle-guide{
    background:none;border:none;color:var(--accent);font-size:13px;
    padding:8px 0 0;cursor:pointer;font-weight:800;
  }
  .guide-body{display:none;margin-top:10px;font-size:13.5px;line-height:1.6;color:var(--text-dim);}
  .guide-body.open{display:block;}
  .guide-body b{color:var(--text);}
  .progress-tip{
    background:#39ff941a;border:1px solid #39ff9440;color:var(--accent);
    font-size:12.5px;font-weight:600;padding:10px 12px;border-radius:12px;
    margin-top:10px;line-height:1.5;
  }
  .oggi-panel{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow-card);padding:16px 18px;margin-bottom:14px;
  }
  .oggi-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:8px 0;font-size:13px;font-weight:700;border-bottom:1px solid var(--border);
  }
  .oggi-row:last-child{border-bottom:none;}
  .oggi-row span{color:var(--text-dim);}
  .oggi-row b{color:var(--text);font-size:14px;}
  .reminder-banner{
    background:#ff9d4d1a;border:1px solid #ff9d4d40;color:var(--accent-2);
    font-size:12.5px;font-weight:600;padding:12px 14px;border-radius:14px;
    margin-bottom:14px;line-height:1.5;
  }
  .rpe-row{margin-top:14px;}
  .rpe-label{font-size:12px;color:var(--text-dim);font-weight:700;margin:0 0 8px;line-height:1.4;}
  .rpe-chips .chip{padding:7px 14px;font-size:12.5px;}
  .warm-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:11px 0;border-bottom:1px solid var(--border);
  }
  .warm-item:last-child{border-bottom:none;}
  .warm-item .l{font-size:14.5px;font-weight:600;}
  .warm-item .r{font-size:12.5px;color:var(--text-dim);font-weight:600;}
  .timer-bar{
    position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border-top:1px solid var(--border);
    box-shadow:0 -10px 30px -10px rgba(0,0,0,.7);
    padding:14px 18px 16px;
    max-width:560px;margin:0 auto;
    overflow:hidden;
  }
  .timer-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .timer-adj{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    width:50px;height:50px;border-radius:50%;font-size:13px;font-weight:800;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:transform .12s ease;
  }
  .timer-adj:active{transform:scale(.9);}
  .timer-ring-wrap{position:relative;width:104px;height:104px;flex-shrink:0;}
  .timer-ring{width:100%;height:100%;transform:rotate(-90deg);}
  .timer-ring-bg{fill:none;stroke:#ffffff14;stroke-width:8;}
  .timer-ring-fill{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
  .timer-ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .timer-ring-center .lbl{font-size:11.5px;color:var(--text-dim);font-weight:700;margin-bottom:1px;}
  .timer-ring-center .t{
    font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.15;
    background:linear-gradient(90deg,var(--accent),#1fae63);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .timer-actions{display:flex;gap:10px;margin-top:12px;}
  .timer-actions .btn{flex:1;}
  .video-link{
    color:var(--accent);font-size:13px;font-weight:800;text-decoration:none;
    padding:8px 0 0;display:inline-flex;align-items:center;gap:4px;
  }
  .video-link:active{opacity:.7;}
  input, textarea{font-family:inherit;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;font-weight:700;letter-spacing:.1px;}
  .field input, .field textarea{
    width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    border-radius:12px;padding:12px 13px;font-size:14.5px;font-weight:500;
  }
  .field input:focus, .field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  .field-hint{font-size:12px;color:var(--text-dim);margin:5px 2px 0;line-height:1.45;font-weight:500;}
  .avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:280px;margin:0 auto;}
  .avatar-choice{
    aspect-ratio:1;border-radius:50%;background:var(--panel-2);border:1px solid var(--border);
    font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease;
  }
  .avatar-choice:active{transform:scale(.92);}
  .avatar-choice.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent), 0 0 16px -4px var(--accent);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .empty{text-align:center;color:var(--text-dim);font-size:13.5px;padding:34px 10px;font-weight:600;line-height:1.6;}
  .empty-icon{display:block;font-size:34px;margin-bottom:10px;opacity:.85;}
  .photo-thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;}
  canvas.chart-canvas{max-width:100%;}
  .chip-select{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{
    padding:9px 15px;border-radius:20px;background:var(--panel-2);color:var(--text-dim);
    font-size:12.5px;font-weight:700;cursor:pointer;border:1px solid var(--border);
  }
  .chip.active{background:var(--accent);color:#04140d;border-color:transparent;box-shadow:0 0 16px -5px #39ff9488;}

  /* ===== DIETA ===== */
  .diet-summary{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow-card);padding:20px;margin-bottom:16px;
  }
  .diet-summary .tlt{font-size:15px;font-weight:800;margin-bottom:2px;}
  .diet-summary .tsb{font-size:12px;color:var(--text-dim);font-weight:600;line-height:1.5;margin-bottom:16px;}
  .diet-kcal-hero{
    display:flex;align-items:baseline;gap:8px;justify-content:center;
    padding:14px 0 16px;margin-bottom:14px;border-bottom:1px solid var(--border);
  }
  .diet-kcal-hero .n{
    font-size:36px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;
    background:linear-gradient(90deg,var(--accent),#1fae63);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .diet-kcal-hero .u{font-size:14px;color:var(--text-dim);font-weight:700;}
  .macro-chip-row{display:flex;gap:10px;}
  .macro-chip{
    flex:1;text-align:center;padding:14px 8px;border-radius:16px;
    background:var(--panel-2);border:1px solid var(--border);
  }
  .macro-chip .mc-dot{width:9px;height:9px;border-radius:50%;margin:0 auto 8px;}
  .macro-chip .mc-n{font-size:16.5px;font-weight:900;color:var(--text);line-height:1;}
  .macro-chip .mc-l{font-size:10.5px;color:var(--text-dim);font-weight:700;margin-top:5px;text-transform:uppercase;letter-spacing:.3px;}
  .kcal-ring-wrap{position:relative;width:150px;height:150px;margin:6px auto 20px;}
  .kcal-ring{width:100%;height:100%;transform:rotate(-90deg);}
  .kr-bg{fill:none;stroke:#ffffff14;stroke-width:10;}
  .kr-fill{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .6s ease, stroke .3s ease;}
  .kr-center{
    position:absolute;inset:0;display:flex;flex-direction:column;

/* ============ NOTIFICHE PUSH (promemoria pasti/integratori/idratazione) ============
   Richiede una chiave VAPID generata nella console Firebase del progetto:
   Impostazioni progetto → Cloud Messaging → Certificati web push → Genera coppia
   di chiavi. Finché questa costante resta vuota, il pulsante "Attiva notifiche"
   in Profilo mostra un avviso invece di provare ad attivarle. */
const VAPID_KEY = '';

function messagingSupportata(){
  return !!(firebase.messaging && firebase.messaging.isSupported && firebase.messaging.isSupported() && 'Notification' in window);
}

async function attivaNotifichePush(){
  const stato = document.getElementById('notificheStato');
  if(!VAPID_KEY){
    if(stato) stato.innerHTML = `<div class="error-banner">Manca ancora la chiave VAPID nel codice (va generata nella console Firebase e incollata in VAPID_KEY). Finché non c'è, le notifiche non possono attivarsi.</div>`;
    return;
  }
  if(!messagingSupportata()){
    if(stato) stato.innerHTML = `<div class="error-banner">Il tuo browser non supporta le notifiche push, o l'app non è installata sulla schermata Home (richiesto su iPhone).</div>`;
    return;
  }
  try{
    const permesso = await Notification.requestPermission();
    if(permesso !== 'granted'){
      if(stato) stato.innerHTML = `<div class="error-banner">Permesso non concesso. Puoi riattivarlo dalle impostazioni di notifica del browser/telefono.</div>`;
      return;
    }
    const messaging = firebase.messaging();
    const token = await messaging.getToken({ vapidKey: VAPID_KEY });
    if(!token) throw new Error('Nessun token ottenuto');
    await db.collection('users').doc(currentUid).set({ fcmToken: token }, { merge:true });
    if(profiloUtente) profiloUtente.fcmToken = token;
    if(stato) stato.innerHTML = `<div class="success-banner" style="margin:0;padding:14px;">Notifiche attivate ✅</div>`;
  }catch(e){
    if(stato) stato.innerHTML = `<div class="error-banner">Non sono riuscito ad attivare le notifiche: ${e.message}</div>`;
  }
}

/* Le notifiche in primo piano (app aperta) non vengono mostrate in automatico
   dal sistema come quelle in background: le intercettiamo e le mostriamo noi. */

    firebase.messaging().onMessage(payload=>{
      const titolo = (payload.notification && payload.notification.title) || 'Beat Yourself';
      const corpo = (payload.notification && payload.notification.body) || '';
      if(Notification.permission==='granted') new Notification(titolo, { body: corpo, icon:'icon-192.png' });
    });
  }catch(e){}
}

/* Catalogo schede reale, caricato da Firestore (collection "schede").
   Al primissimo avvio in assoluto, se la collection è vuota, viene popolata
   con SCHEDE_DEFAULT: da quel momento in poi le schede vivono su Firestore,
   non più hardcoded qui, cosi' un trainer puo' modificarle/assegnarle per utente. */
let SCHEDE = [];

async function caricaCatalogoSchede(){
  try{
    const snap = await db.collection('schede').get();
    if(snap.empty){
      const batch = db.batch();
      SCHEDE_DEFAULT.forEach(s=>{
        const ref = db.collection('schede').doc(s.id);
        batch.set(ref, s);
      });
      await batch.commit();
      SCHEDE = SCHEDE_DEFAULT.slice();
    } else {
      SCHEDE = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    }
  }catch(e){
    // Se Firestore non è raggiungibile (es. offline in palestra) usa il catalogo di default in memoria
    SCHEDE = SCHEDE_DEFAULT.slice();
  }
}

/* Ritorna le schede assegnate al profilo corrente.
   profiloUtente.schedeAssegnate === null  → account storico (creato prima di
   questa funzionalità, es. Antonio): non ha mai avuto un'assegnazione
   esplicita, quindi per non rompergli l'esperienza vede tutto il catalogo.
   profiloUtente.schedeAssegnate === []    → profilo nuovo, nessuna scheda
   assegnata finché il trainer non gliene assegna una dal Pannello trainer. */
function schedeAssegnateUtente(){
  if(!profiloUtente) return SCHEDE;
  if(profiloUtente.schedeAssegnate === null) return SCHEDE;
  return SCHEDE.filter(s=>profiloUtente.schedeAssegnate.includes(s.id));
}

/* Obiettivi nutrizionali attivi: quelli personalizzati dall'utente in Profilo
   se presenti, altrimenti quelli di default del piano (DIETA_PIANO.target)
   più 2750ml di acqua. Così se il trainer aggiorna i target col tempo, basta
   modificarli in Profilo senza dover toccare il codice. */
function obiettiviAttivi(){
  const def = { kcal:DIETA_PIANO.target.kcal, prot:DIETA_PIANO.target.prot, carb:DIETA_PIANO.target.carb, grassi:DIETA_PIANO.target.grassi, acquaMl:2750 };
  if(profiloUtente && profiloUtente.obiettivi) return { ...def, ...profiloUtente.obiettivi };
  return def;
}

/* Controlla se esiste gia' un profilo (nome/cognome/eta) per l'utente loggato.
   Ritorna true se completo, false se manca (e in quel caso mostra il form di onboarding). */
async function checkProfilo(){
  const snap = await db.collection('users').doc(currentUid).get();
  const data = snap.exists ? snap.data() : {};
  blocchiIniziati = data.blocchiIniziati || {};
  if(data.nome && data.cognome && data.eta){
    profiloUtente = {
      nome:data.nome, cognome:data.cognome, eta:data.eta,
      attenzioni: data.attenzioni || '',
      schedeAssegnate: ('schedeAssegnate' in data) ? data.schedeAssegnate : null,
      isTrainer: data.isTrainer === true,
      avatar: data.avatar || null,
      fcmToken: data.fcmToken || null,
      alimentiRecenti: data.alimentiRecenti || [],
      obiettivi: data.obiettivi || null
    };
    return true;
  }
  document.getElementById('obNome').value = data.nome || '';
  document.getElementById('obCognome').value = data.cognome || '';
  document.getElementById('obEta').value = data.eta || '';
  document.getElementById('obAttenzioni').value = data.attenzioni || '';

async function salvaProfilo(){
  const nome = document.getElementById('obNome').value.trim();
  const cognome = document.getElementById('obCognome').value.trim();

  const attenzioni = document.getElementById('obAttenzioni').value.trim();

  const btn = document.getElementById('onboardingBtn');
  errBox.innerHTML = '';
  if(!nome || !cognome || !eta){
    errBox.innerHTML = '<div class="error-banner">Compila tutti i campi obbligatori.</div>';
    return;
  }
  if(Number(eta) < 10 || Number(eta) > 100){
    errBox.innerHTML = '<div class="error-banner">Inserisci un\'età valida.</div>';
    return;
  }
  btn.disabled = true; btn.textContent = 'Salvataggio...';
  try{
    const existing = await db.collection('users').doc(currentUid).get();
    const existingData = existing.exists ? existing.data() : {};
    const payload = { nome, cognome, eta: Number(eta), attenzioni };
    // Nessuna scheda assegnata di default: se il profilo non ne ha mai avuta
    // una esplicita, resta vuoto finché il trainer non assegna qualcosa.
    if(!('schedeAssegnate' in existingData)){
      payload.schedeAssegnate = [];
    }
    await db.collection('users').doc(currentUid).set(payload, { merge:true });
    profiloUtente = {
      nome, cognome, eta: Number(eta), attenzioni,
      schedeAssegnate: ('schedeAssegnate' in existingData) ? existingData.schedeAssegnate : [],
      isTrainer: existingData.isTrainer === true,

    await avviaApp();
  }catch(e){

  }
  btn.disabled = true; btn.textContent = 'Accesso...';
  try{
    await auth.signInWithEmailAndPassword(email, password);
    // onAuthStateChanged si occupa del resto
  }catch(e){

  }

function mapAuthError(e){
  const code = e.code || '';
  if(code.includes('invalid-credential') || code.includes('wrong-password') || code.includes('user-not-found')) return 'Email o password non corrette.';
  if(code.includes('too-many-requests')) return 'Troppi tentativi, riprova tra poco.';
  if(code.includes('invalid-email')) return 'Email non valida.';
  if(code.includes('email-already-in-use')) return 'Esiste già un account con questa email. Prova ad accedere invece di registrarti.';
  if(code.includes('weak-password')) return 'Password troppo debole: usa almeno 6 caratteri.';
  return 'Errore: ' + (e.message || code);
}

function todayKey(){
  const d = new Date();
  const pad = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

async function loadData(){
  const [sessioniSnap, misureSnap, dietaLogSnap] = await Promise.all([
    userCollection('sessioni').orderBy('data','asc').get(),
    userCollection('misure').orderBy('data','asc').get(),
    userCollection('dietaLog').get().catch(()=>({docs:[]}))
  ]);
  cache.sessioni = sessioniSnap.docs.map(d => ({ id:d.id, ...d.data() }));
  cache.misure = misureSnap.docs.map(d => ({ id:d.id, ...d.data() }));
  cache.dietaLog = dietaLogSnap.docs
    .map(d => ({ id:d.id, ...d.data() }))
    .sort((a,b)=> a.id.localeCompare(b.id));
  const oggi = cache.dietaLog.find(d=>d.id===todayKey());
  cache.dietaLogOggi = {
    pastiFatti: (oggi && oggi.pastiFatti) || {},
    acquaMl: (oggi && oggi.acquaMl) || 0,
    integratoriFatti: (oggi && oggi.integratoriFatti) || {},
    alimentiExtra: (oggi && oggi.alimentiExtra) || [],
    pastiSnapshot: (oggi && oggi.pastiSnapshot) || {}
  };
}

function salvaDietaLogOggi(){
  if(!currentUid) return;
  const key = todayKey();
  userCollection('dietaLog').doc(key).set(cache.dietaLogOggi, { merge:true }).catch(()=>{});
  const idx = cache.dietaLog.findIndex(d=>d.id===key);
  const entry = { id:key, ...cache.dietaLogOggi };
  if(idx>=0) cache.dietaLog[idx] = entry; else cache.dietaLog.push(entry);
}

function toggleMealDone(i){
  const nuovoStato = !cache.dietaLogOggi.pastiFatti[i];
  cache.dietaLogOggi.pastiFatti[i] = nuovoStato;
  // Salviamo anche un'istantanea dell'opzione scelta in quel momento, così il
  // diario storico può mostrare cosa hai mangiato davvero quel giorno, non
  // solo "pasto segnato sì/no".
  if(!cache.dietaLogOggi.pastiSnapshot) cache.dietaLogOggi.pastiSnapshot = {};
  if(nuovoStato){
    const p = DIETA_PIANO.pasti[i];
    const opz = p.opzioni[dietaOpzioneSel[i] || 0];
    cache.dietaLogOggi.pastiSnapshot[i] = { titolo:opz.titolo, kcal:opz.kcal, prot:opz.prot, carb:opz.carb, grassi:opz.grassi };
  } else {
    delete cache.dietaLogOggi.pastiSnapshot[i];
  }
  salvaDietaLogOggi();
  renderAlimentazione();
}

function aggiungiAcqua(delta){
  cache.dietaLogOggi.acquaMl = Math.max(0, (cache.dietaLogOggi.acquaMl||0) + delta);
  salvaDietaLogOggi();
  renderAlimentazione();
}

function toggleIntegratoreFatto(nome){
  cache.dietaLogOggi.integratoriFatti[nome] = !cache.dietaLogOggi.integratoriFatti[nome];
  salvaDietaLogOggi();
  renderAlimentazione();
}

/* Alimenti "extra" di oggi: cercati per nome (Open Food Facts) e aggiunti con
   una grammatura scelta, si sommano ai macro/kcal acquisiti del giorno oltre

function aggiungiAlimentoExtra(voce){
  if(!cache.dietaLogOggi.alimentiExtra) cache.dietaLogOggi.alimentiExtra = [];
  cache.dietaLogOggi.alimentiExtra.push(voce);
  salvaDietaLogOggi();
}

function rimuoviAlimentoExtra(id){
  cache.dietaLogOggi.alimentiExtra = (cache.dietaLogOggi.alimentiExtra||[]).filter(a=>a.id!==id);
  salvaDietaLogOggi();
  renderAlimentazione();
}

/* Modale di conferma coerente con il tema (sostituisce il confirm() nativo
   del browser, che stona con lo stile dell'app). variant:'danger' per azioni
   distruttive (bottone rosso), 'accent' per conferme neutre (bottone verde). */
function mostraConferma(messaggio, variant){
  variant = variant || 'danger';
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.innerHTML = `
      <div class="confirm-box">
        <p class="confirm-msg">${messaggio}</p>
        <div class="confirm-actions">
          <button class="btn secondary" id="confirmCancelBtn">Annulla</button>
          <button class="btn ${variant==='danger'?'danger':''}" id="confirmOkBtn">Conferma</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const chiudi = esito => { overlay.remove(); resolve(esito); };
    overlay.querySelector('#confirmCancelBtn').onclick = ()=>chiudi(false);
    overlay.querySelector('#confirmOkBtn').onclick = ()=>chiudi(true);
    overlay.addEventListener('click', e=>{ if(e.target===overlay) chiudi(false); });
  });
}

/* ============ TRANSIZIONE "APRI/CHIUDI" STILE IOS ============
   Quando si tocca una card (categoria, voce di lista) la schermata successiva
   si ingrandisce a partire dal punto toccato; tornando indietro, la schermata
   si rimpicciolisce verso quello stesso punto prima di mostrare quella precedente. */
let pendingOrigin = null;
let navOriginStack = [];

view.addEventListener('click', function(e){
  const cat = e.target.closest('.home-cat, .home-square');
  if(cat){
    e.preventDefault();
    e.stopPropagation();
    const r = cat.getBoundingClientRect();
    const origin = { x: r.left + r.width/2, y: r.top + r.height/2 };
    const onclickAttr = cat.getAttribute('onclick');
    cat.classList.add('tapped');
    setTimeout(()=>{
      cat.classList.remove('tapped');
      pendingOrigin = origin;
      setTimeout(()=>{ if(pendingOrigin === origin) pendingOrigin = null; }, 50);
      if(onclickAttr){ try{ new Function(onclickAttr)(); }catch(err){} }
    }, 190);
    return;
  }
  const card = e.target.closest('.list-item');
  if(card && !card.classList.contains('locked')){
    const r = card.getBoundingClientRect();
    const origin = { x: r.left + r.width/2, y: r.top + r.height/2 };
    pendingOrigin = origin;
    setTimeout(()=>{ if(pendingOrigin === origin) pendingOrigin = null; }, 50);
  }
}, true);

/* Micro-feedback coerente: lo stesso glow al tap delle card home
   si estende ai bottoni principali (senza toccare la logica di
   navigazione/animazione sopra: qui aggiungiamo solo una classe
   temporanea per l'effetto visivo, l'onclick del bottone parte normalmente). */
document.body.addEventListener('click', function(e){
  const b = e.target.closest('.btn');
  if(b){
    b.classList.add('tap-glow');
    setTimeout(()=>b.classList.remove('tap-glow'), 260);
  }
}, true);

function setViewOrigin(origin){
  if(origin){
    const viewRect = view.getBoundingClientRect();
    view.style.transformOrigin = (origin.x - viewRect.left) + 'px ' + (origin.y - viewRect.top) + 'px';
  } else {
    view.style.transformOrigin = '50% 50%';
  }
}

function animateIn(origin){
  setViewOrigin(origin);
  view.classList.remove('view-anim-in','view-anim-out');
  void view.offsetWidth;
  view.classList.add('view-anim-in');
}

function animateOut(origin, callback){
  setViewOrigin(origin);
  view.classList.remove('view-anim-in','view-anim-out');
  void view.offsetWidth;
  view.classList.add('view-anim-out');
  setTimeout(callback, 230);
}

function setRoute(r){
  const isBack = BACK_MAP[route.name] === r.name;
  if(isBack){
    const origin = navOriginStack.pop() || null;
    animateOut(origin, ()=>{
      route = r;
      render();
      animateIn(null);
    });
  } else {
    const origin = pendingOrigin;
    pendingOrigin = null;
    navOriginStack.push(origin);
    route = r;
    render();
    animateIn(origin);
  }
}

function promemoriaCostanza(){
  const blocchiAttivi = schedeAssegnateUtente().filter(s=> blocchiIniziati[s.id] && !schedaScaduta(s));
  if(!blocchiAttivi.length) return '';
  let peggiore = null;
  blocchiAttivi.forEach(s=>{
    const sessioniScheda = cache.sessioni.filter(sess=>sess.schedaId===s.id);
    const ultima = sessioniScheda.length
      ? new Date(Math.max(...sessioniScheda.map(x=> new Date(x.data).getTime())))
      : new Date(blocchiIniziati[s.id]);
    const giorni = Math.floor((new Date() - ultima) / 86400000);
    const freqMatch = s.periodo && s.periodo.match(/(\d+)x\/settimana/);
    const freq = freqMatch ? Number(freqMatch[1]) : 3;
    const soglia = Math.max(4, Math.ceil((7/freq) * 1.8));
    if(giorni >= soglia && (!peggiore || giorni > peggiore.giorni)){
      peggiore = { nome: s.nome, giorni };
    }
  });
  if(!peggiore) return '';
  return `<div class="reminder-banner">⏰ Sono passati ${peggiore.giorni} giorni dal tuo ultimo allenamento (${peggiore.nome}). Quando puoi, rimettiti in moto 💪</div>`;
}

/* Pannello "oggi": i numeri chiave a colpo d'occhio in home, senza dover
   entrare in ogni sezione per saperli. */
/* Giorni consecutivi (a ritroso da oggi) in cui è stata registrata almeno
   un'attività nella dieta (pasto segnato, integratore preso, o acqua bevuta).
   Se oggi non hai ancora aperto l'app, non rompe lo streak: si parte da ieri. */
function calcolaStreakDieta(){
  const attivi = new Set(cache.dietaLog.filter(g=>{
    const pastiOk = Object.values(g.pastiFatti||{}).some(Boolean);
    const integrOk = Object.values(g.integratoriFatti||{}).some(Boolean);
    const acquaOk = (g.acquaMl||0) > 0;
    return pastiOk || integrOk || acquaOk;
  }).map(g=>g.id));
  if(!attivi.size) return 0;
  const pad = n=>String(n).padStart(2,'0');
  const chiave = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  let streak = 0;
  const cursor = new Date();
  if(!attivi.has(chiave(cursor))) cursor.setDate(cursor.getDate()-1);
  while(attivi.has(chiave(cursor))){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}

/* Settimane (lun-dom) consecutive e già concluse, a ritroso dalla scorsa,
   con almeno un allenamento registrato. */
function calcolaStreakSettimaneAllenamento(){
  if(!cache.sessioni.length) return 0;
  let streak = 0;
  const inizio = new Date();
  const giornoSett = (inizio.getDay()+6)%7; // 0=lunedì
  inizio.setDate(inizio.getDate()-giornoSett);
  inizio.setHours(0,0,0,0);
  inizio.setDate(inizio.getDate()-7); // la settimana corrente non è ancora conclusa, si parte dalla scorsa
  while(true){
    const fine = new Date(inizio); fine.setDate(fine.getDate()+7);
    const count = cache.sessioni.filter(s=>{ const d=new Date(s.data); return d>=inizio && d<fine; }).length;
    if(count>0){ streak++; inizio.setDate(inizio.getDate()-7); }
    else break;
  }
  return streak;
}

function renderOggiPanel(){
  if(!profiloUtente) return '';
  const pianoPersonale = profiloUtente.schedeAssegnate === null;

  const seiGiorniFa = new Date(); seiGiorniFa.setDate(seiGiorniFa.getDate()-6); seiGiorniFa.setHours(0,0,0,0);
  const sessioniSettimana = cache.sessioni.filter(s=> new Date(s.data) >= seiGiorniFa).length;

  let kcalRow = '', pastoRow = '';
  if(pianoPersonale){
    const t = obiettiviAttivi();
    let kcalOggi = 0;
    DIETA_PIANO.pasti.forEach((p,i)=>{
      if(cache.dietaLogOggi.pastiFatti[i]){
        kcalOggi += p.opzioni[dietaOpzioneSel[i] || 0].kcal;
      }
    });
    (cache.dietaLogOggi.alimentiExtra||[]).forEach(a=> kcalOggi += a.kcal);
    const residue = t.kcal - kcalOggi;
    kcalRow = `<div class="oggi-row"><span>🔥 Kcal ${residue>=0?'restanti':'oltre il target'} oggi</span><b>${Math.abs(residue)}</b></div>`;

    const idxProssimo = DIETA_PIANO.pasti.findIndex((p,i)=> !cache.dietaLogOggi.pastiFatti[i]);
    const prossimo = idxProssimo>=0 ? DIETA_PIANO.pasti[idxProssimo].nome : 'Tutto segnato ✅';
    pastoRow = `<div class="oggi-row"><span>🍽️ Prossimo da segnare</span><b>${prossimo}</b></div>`;
  }

  const streakDieta = pianoPersonale ? calcolaStreakDieta() : 0;
  const streakSettimane = calcolaStreakSettimaneAllenamento();
  let streakRow = '';
  if(streakSettimane>0) streakRow += `<div class="oggi-row"><span>🔥 Settimane di fila con allenamento</span><b>${streakSettimane}</b></div>`;
  if(streakDieta>1) streakRow += `<div class="oggi-row"><span>🔥 Giorni di fila con dieta tracciata</span><b>${streakDieta}</b></div>`;

  return `<div class="oggi-panel">
    <div class="oggi-row"><span>🏋️ Allenamenti questa settimana</span><b>${sessioniSettimana}</b></div>
    ${kcalRow}
    ${pastoRow}
    ${streakRow}
  </div>`;
}

function avviaSessione(schedaId){
  const scheda = SCHEDE.find(s=>s.id===schedaId);
  if(!blocchiIniziati[schedaId]){
    blocchiIniziati[schedaId] = new Date().toISOString();
    db.collection('users').doc(currentUid).set({ blocchiIniziati }, { merge:true }).catch(()=>{});
  }
  sessionDraft = {
    schedaId,
    schedaNome: scheda.nome,
    iniziata: new Date().toISOString(),
    warmDone: scheda.riscaldamento.map(()=>false),
    esercizi: scheda.esercizi.map(e=>({
      nome: e.nome,
      usaAlternativa: false,
      noteUtente: '',
      sets: Array.from({length:e.serieTarget}, ()=>({peso:'', rip:'', fatta:false, rpe:null}))
    }))
  };
  setRoute({name:'sessione'});
}

function toggleAlternativa(ei){
  const scheda = SCHEDE.find(s=>s.id===sessionDraft.schedaId);
  const e = scheda.esercizi[ei];
  const draft = sessionDraft.esercizi[ei];
  if(!e.alternativa || e.alternativa==='—') return;
  draft.usaAlternativa = !draft.usaAlternativa;
  draft.nome = draft.usaAlternativa ? e.alternativa : e.nome;
  renderSessione();
}

function esercizioCompletato(ei){
  const ex = sessionDraft.esercizi[ei];
  return !!ex && ex.sets.length>0 && ex.sets.every(s=>s.fatta && s.rpe!=null);
}

function refreshLocks(){
  const nuovi = sessionDraft.esercizi.map((_,i)=> i>0 && !esercizioCompletato(i-1));
  const precedenti = sessionDraft._locks || [];
  const cambiati = nuovi.length !== precedenti.length || nuovi.some((v,i)=>v!==precedenti[i]);
  sessionDraft._locks = nuovi;
  if(cambiati) renderSessione();
}

function updateNotaEsercizio(ei, val){
  sessionDraft.esercizi[ei].noteUtente = val;
}

function setRPESet(ei, si, val){
  sessionDraft.esercizi[ei].sets[si].rpe = val ? Number(val) : null;
  refreshLocks();
}

/* ============ SUGGERIMENTO PROGRESSIONE CARICO ============
   Se nelle ultime 2 sedute sono state completate tutte le ripetizioni/durata
   richieste, suggerisce di aumentare leggermente il carico (o la durata per
   esercizi a tempo come il plank). Solo un suggerimento: la decisione resta
   sempre dell'utente. */
function parseRipTarget(str){
  if(!str) return null;
  const isTime = str.includes('"');
  const nums = str.replace(/"/g,'').split('-').map(n=>parseInt(n)).filter(n=>!isNaN(n));
  if(!nums.length) return null;
  return { max: Math.max(...nums), isTime };
}

function suggerimentoProgressione(nomeEsercizio, ripTargetStr){
  const target = parseRipTarget(ripTargetStr);
  if(!target) return null;
  const ultime = cache.sessioni
    .slice().sort((a,b)=> new Date(b.data)-new Date(a.data))
    .map(s=> s.esercizi.find(e=>e.nome===nomeEsercizio))
    .filter(Boolean)
    .slice(0,2);
  if(ultime.length < 2) return null;

  const entrambeOk = ultime.every(es=>
    es.sets.length>0 && es.sets.every(set=>{
      const rip = parseInt(set.rip);
      return set.fatta && !isNaN(rip) && rip >= target.max;
    })
  );
  const entrambeFallite = ultime.every(es=>
    es.sets.length>0 && es.sets.some(set=>{
      const rip = parseInt(set.rip);
      return !set.fatta || isNaN(rip) || rip < target.max;
    })
  );

  if(entrambeOk){
    // Auto-regolazione: se hai completato le rip ma con RPE già molto alto,
    // meglio consolidare il carico un'altra seduta prima di alzarlo ancora.
    const tuttiRpe = ultime.flatMap(es=> es.sets.map(s=>s.rpe)).filter(v=>v!=null && !isNaN(v));
    const rpeMedio = tuttiRpe.length ? tuttiRpe.reduce((a,b)=>a+b,0)/tuttiRpe.length : null;
    if(rpeMedio!=null && rpeMedio>=9){
      return `Nelle ultime 2 sedute hai completato ${target.isTime?'tutta la durata richiesta':'tutte le ripetizioni richieste'}, ma con un RPE medio alto (${rpeMedio.toFixed(1)}/10): meglio mantenere questo carico un'altra seduta prima di aumentare.`;
    }
    return target.isTime
      ? 'Nelle ultime 2 sedute hai completato tutta la durata richiesta: prova ad aumentare di qualche secondo.'
      : 'Nelle ultime 2 sedute hai completato tutte le ripetizioni richieste: prova ad aumentare il peso di circa 2.5 kg.';
  }

  if(entrambeFallite){
    return target.isTime
      ? "Nelle ultime 2 sedute non hai completato la durata richiesta: valuta di scendere leggermente d'intensità o di recuperare un po' di più tra le serie."
      : 'Nelle ultime 2 sedute non hai completato le ripetizioni richieste: valuta di scendere leggermente di peso per tornare a muoverti con buona tecnica.';
  }

  return null;
}

let restState = null;

const REST_RING_CIRC = 2 * Math.PI * 52;

function startRestTimer(seconds){
  clearRestTimer();
  restState = { remaining: seconds, total: seconds, paused: false };
  const bar = document.createElement('div');
  bar.className = 'timer-bar';
  bar.id = 'restBar';
  bar.innerHTML = `
    <div class="timer-row">
      <button class="timer-adj" onclick="adjustRest(-15)">−15"</button>
      <div class="timer-ring-wrap">
        <svg class="timer-ring" viewBox="0 0 120 120">
          <circle class="timer-ring-bg" cx="60" cy="60" r="52"></circle>
          <circle class="timer-ring-fill" id="restRingFill" cx="60" cy="60" r="52"
            stroke-dasharray="${REST_RING_CIRC}" stroke-dashoffset="0"></circle>
        </svg>
        <div class="timer-ring-center">
          <div class="lbl">Recupero</div>
          <div class="t" id="restT">${seconds}"</div>
        </div>
      </div>
      <button class="timer-adj" onclick="adjustRest(15)">+15"</button>
    </div>
    <div class="timer-actions">
      <button class="btn small secondary" id="restPauseBtn" onclick="togglePauseRest()">⏸ Pausa</button>
      <button class="btn small secondary" onclick="clearRestTimer()">Salta</button>
    </div>`;
  document.body.appendChild(bar);
  updateRestDisplay();
  restTimerHandle = setInterval(()=>{
    if(!restState || restState.paused) return;
    restState.remaining--;
    if(restState.remaining<=0){
      updateRestDisplay();
      const t = document.getElementById('restT');
      if(t) t.textContent = "Via! 💪";
      timerFinishedFeedback();
      clearInterval(restTimerHandle);
      setTimeout(clearRestTimer, 2000);
      return;
    }
    updateRestDisplay();
  },1000);
}

function updateRestDisplay(){
  if(!restState) return;
  const t = document.getElementById('restT');
  const ring = document.getElementById('restRingFill');
  if(t) t.textContent = restState.remaining>0 ? restState.remaining+'"' : 'Via! 💪';
  if(ring){
    const pct = restState.total>0 ? Math.max(0, Math.min(1, restState.remaining/restState.total)) : 0;
    ring.style.strokeDashoffset = String(REST_RING_CIRC * (1 - pct));
  }
}

function timerFinishedFeedback(){
  beep();
  if(navigator.vibrate){
    try{ navigator.vibrate([200,100,200,100,300]); }catch(e){}
  }
  if(window.Notification && Notification.permission === 'granted'){
    try{ new Notification('Recupero terminato 💪', { body:'Riparti con la prossima serie.' }); }catch(e){}
  }
}

function richiediPermessoNotifiche(){
  if(window.Notification && Notification.permission === 'default'){
    Notification.requestPermission().catch(()=>{});
  }
}

function adjustRest(delta){
  if(!restState) return;
  restState.remaining = Math.max(0, restState.remaining + delta);
  if(restState.remaining > restState.total) restState.total = restState.remaining;
  updateRestDisplay();
}

function togglePauseRest(){
  if(!restState) return;
  restState.paused = !restState.paused;
  const btn = document.getElementById('restPauseBtn');
  if(btn) btn.textContent = restState.paused ? '▶ Riprendi' : '⏸ Pausa';
}

function clearRestTimer(){
  if(restTimerHandle){ clearInterval(restTimerHandle); restTimerHandle=null; }
  restState = null;
  const bar = document.getElementById('restBar');
  if(bar) bar.remove();
}

function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880;
    g.gain.value = 0.15;
    o.start();
    setTimeout(()=>{o.stop(); ctx.close();}, 350);
  }catch(e){}
}

/* ============ SWIPE PER ELIMINARE (scorrimento verso sinistra) ============ */
function attachSwipeHandlers(container, deleteFn){
  const MAX = 84;
  container.querySelectorAll('.swipe-row').forEach(row=>{
    const card = row.querySelector('.list-item');
    const delBtn = row.querySelector('.swipe-delete');
    if(!card || !delBtn) return;
    row.dataset.x = '0';
    let startX=0, startY=0, baseX=0, dragging=false, swiped=false, axis=null;

    card.addEventListener('pointerdown', e=>{
      startX = e.clientX; startY = e.clientY;
      baseX = parseFloat(row.dataset.x || '0');
      dragging = true; axis = null; swiped = false;
      card.style.transition = 'none';
    });
    card.addEventListener('pointermove', e=>{
      if(!dragging) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if(axis===null){
        if(Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      }
      if(axis!=='x') return;
      const x = Math.max(-MAX, Math.min(0, baseX + dx));
      card.style.transform = `translateX(${x}px)`;
      row.dataset.x = String(x);
      if(Math.abs(dx) > 8) swiped = true;
    });
    function endDrag(){
      if(!dragging) return;
      dragging = false;
      card.style.transition = 'transform .2s ease';
      const x = parseFloat(row.dataset.x || '0');
      if(x < -MAX/2){
        card.style.transform = `translateX(-${MAX}px)`; row.dataset.x = String(-MAX);
      } else {
        card.style.transform = 'translateX(0)'; row.dataset.x = '0';
      }
    }
    card.addEventListener('pointerup', endDrag);
    card.addEventListener('pointercancel', endDrag);
    card.addEventListener('click', e=>{
      if(swiped){ e.preventDefault(); e.stopImmediatePropagation(); swiped=false; return; }
      const name = card.dataset.routeName;
      if(name){ const id = card.dataset.routeId; setRoute(id ? {name, id} : {name}); }
    });
    delBtn.addEventListener('click', ()=> deleteFn(row.dataset.id));
  });
}

function csvEscape(v){
  if(v===null || v===undefined) return '';
  const s = String(v).replace(/"/g,'""');
  return /[",\n]/.test(s) ? `"${s}"` : s;
}

function esportaCSV(){
  const righe = [];
  righe.push('=== ALLENAMENTI ===');
  righe.push(['Data','Scheda','Esercizio','Serie','Peso (kg)','Rip','Completata','RPE','Note'].join(','));
  cache.sessioni.slice().sort((a,b)=> new Date(a.data)-new Date(b.data)).forEach(s=>{
    const data = new Date(s.data).toLocaleDateString('it-IT');
    s.esercizi.forEach(e=>{
      e.sets.forEach((set,i)=>{
        const rpeVal = set.rpe!=null ? set.rpe : (e.rpe||'');
        righe.push([data, csvEscape(s.schedaNome), csvEscape(e.nome), i+1, set.peso||'', csvEscape(set.rip||''), set.fatta?'si':'no', rpeVal, csvEscape(e.noteUtente||'')].join(','));
      });
    });
  });
  righe.push('');
  righe.push('=== MISURE ===');
  righe.push(['Data','Peso','Vita','Petto','Fianchi','Braccio Dx','Braccio Sx','Coscia Dx','Coscia Sx'].join(','));
  cache.misure.slice().sort((a,b)=> new Date(a.data)-new Date(b.data)).forEach(m=>{
    righe.push([new Date(m.data).toLocaleDateString('it-IT'), m.peso||'', m.vita||'', m.petto||'', m.fianchi||'', m.braccioDx||'', m.braccioSx||'', m.cosciaDx||'', m.cosciaSx||''].join(','));
  });
  const csv = '﻿' + righe.join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `beat-yourself-dati-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

const METRICHE_ESERCIZIO = [
  {key:'pesoMax', label:'Peso max'},
  {key:'volume', label:'Volume totale'},
  {key:'rm', label:'1RM stimato'},
  {key:'rpeMedio', label:'RPE medio'}
];

function calcolaValoreEsercizio(sessione, nomeEsercizio, metrica){
  const e = sessione.esercizi.find(x=>x.nome===nomeEsercizio);
  if(!e) return null;
  if(metrica==='rpeMedio'){
    const rpes = (e.sets||[]).map(s=>s.rpe).filter(v=>v!=null && !isNaN(v));
    if(rpes.length) return rpes.reduce((a,b)=>a+b,0)/rpes.length;
    return (e.rpe!=null) ? e.rpe : null; // sessioni salvate prima dell'RPE per serie
  }
  const validi = e.sets
    .map(x=>({peso:parseFloat(x.peso), rip:parseInt(x.rip)}))
    .filter(x=>!isNaN(x.peso) && !isNaN(x.rip) && x.rip>0);
  if(!validi.length) return null;
  if(metrica==='pesoMax') return Math.max(...validi.map(x=>x.peso));
  if(metrica==='volume') return validi.reduce((sum,x)=> sum + x.peso*x.rip, 0);
  if(metrica==='rm') return Math.max(...validi.map(x=> x.peso*(1+x.rip/30)));
  return null;
}

function renderAderenzaCard(){
  const blocchiAttivi = schedeAssegnateUtente().filter(s=> blocchiIniziati[s.id]);
  if(!blocchiAttivi.length) return '';
  let html = `<div class="card"><h3 style="margin-top:0;font-size:15px;">Costanza</h3>`;
  blocchiAttivi.forEach(s=>{
    const inizio = new Date(blocchiIniziati[s.id]);
    const oggi = new Date();
    const fineBlocco = s.durataSettimane ? new Date(new Date(inizio).setDate(inizio.getDate()+s.durataSettimane*7)) : null;
    const finePeriodo = (fineBlocco && fineBlocco < oggi) ? fineBlocco : oggi;
    const giorniTrascorsi = Math.max(1, Math.round((finePeriodo - inizio) / 86400000));
    const freqMatch = s.periodo && s.periodo.match(/(\d+)x\/settimana/);
    const freq = freqMatch ? Number(freqMatch[1]) : 3;
    const attese = Math.max(1, Math.round((giorniTrascorsi/7) * freq));
    const fatte = cache.sessioni.filter(sess=> sess.schedaId===s.id && new Date(sess.data) >= inizio).length;
    const pct = Math.min(100, Math.round((fatte/attese)*100));
    html += `<div style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px;">
        <span>${s.nome}</span><span>${fatte}/${attese} sedute</span>
      </div>
      <div style="height:8px;border-radius:5px;background:var(--panel-2);overflow:hidden;">
        <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--accent),#1fae63);"></div>
      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

  const sessioniSettimana = cache.sessioni.filter(s=> new Date(s.data) >= seiGiorniFa);

  const rpeValori = sessioniSettimana.flatMap(s=> (s.esercizi||[]).flatMap(e=> (e.sets||[]).map(x=>x.rpe))).filter(v=>v!=null && !isNaN(v));
  const rpeMedio = rpeValori.length ? (rpeValori.reduce((a,b)=>a+b,0)/rpeValori.length).toFixed(1) : null;

  let aderenzaHtml = '';
  if(pianoPersonale){
    const giorniLog = cache.dietaLog.filter(d=> new Date(d.id) >= seiGiorniFa);
    const numPasti = DIETA_PIANO.pasti.length;
    const numIntegratori = INTEGRAZIONE_PIANO.integratori.length;
    if(giorniLog.length){
      const pastiPctTot = giorniLog.reduce((sum,g)=> sum + (Object.values(g.pastiFatti||{}).filter(Boolean).length/numPasti)*100, 0);
      const integrPctTot = giorniLog.reduce((sum,g)=> sum + (Object.values(g.integratoriFatti||{}).filter(Boolean).length/numIntegratori)*100, 0);

  return `<div class="card">
    <h3 style="margin-top:0;font-size:15px;">Ultimi 7 giorni</h3>
    <div class="week-stat"><span>Allenamenti fatti</span><b>${sessioniSettimana.length}</b></div>

        .filter(m=>m[key]!=null && m[key]!=='')
        .map(m=>({
          x: new Date(m.data).toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'}),
          y: Number(m[key])
        }));
      const ctx = document.getElementById('misureChart');
      if(window._misureChart) window._misureChart.destroy();
      if(points.length===0){
        ctx.getContext('2d').clearRect(0,0,ctx.width,ctx.height);
        return;
      }
      window._misureChart = new Chart(ctx, {
        type:'line',
        data:{ labels: points.map(p=>p.x), datasets:[{
          label: `${metrica.label} (${metrica.unit})`, data: points.map(p=>p.y),
          borderColor: metrica.color, backgroundColor: metrica.color+'33', tension:.3, fill:true, pointRadius:4
        }]},
        options:{ plugins:{legend:{labels:{color:'#eef0f3'}}}, scales:{
          x:{ticks:{color:'#9aa1ad'}, grid:{color:'#33384333'}},
          y:{ticks:{color:'#9aa1ad'}, grid:{color:'#33384333'}}
        }}
      });
    }

    chipWrap2.innerHTML = metricheDisponibili.map(mm=>`<div class="chip ${mm.key===selected2?'active':''}" data-k="${mm.key}">${mm.label}</div>`).join('');
    chipWrap2.querySelectorAll('.chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        chipWrap2.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
        chip.classList.add('active');
        drawMisuraChart(chip.dataset.k);
      });
    });
    if(selected2) drawMisuraChart(selected2);
  }

  if(haveAderenza){
    const numPasti = DIETA_PIANO.pasti.length;
    const numIntegratori = INTEGRAZIONE_PIANO.integratori.length;
    const punti = cache.dietaLog.slice(-30).map(g=>({
      data: new Date(g.id).toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'}),
      pasti: Math.round((Object.values(g.pastiFatti||{}).filter(Boolean).length/numPasti)*100),
      integr: Math.round((Object.values(g.integratoriFatti||{}).filter(Boolean).length/numIntegratori)*100)
    }));
    const ctx = document.getElementById('aderenzaChart');
    if(window._aderenzaChart) window._aderenzaChart.destroy();
    if(ctx && punti.length){
      window._aderenzaChart = new Chart(ctx, {
        type:'line',
        data:{ labels: punti.map(p=>p.data), datasets:[
          { label:'Pasti seguiti %', data: punti.map(p=>p.pasti), borderColor:'#39ff94', backgroundColor:'#39ff9433', tension:.3, fill:true, pointRadius:3 },
          { label:'Integratori presi %', data: punti.map(p=>p.integr), borderColor:'#2ac7ff', backgroundColor:'#2ac7ff33', tension:.3, fill:true, pointRadius:3 }
        ]},
        options:{ plugins:{legend:{labels:{color:'#eef0f3'}}}, scales:{
          x:{ticks:{color:'#9aa1ad'}, grid:{color:'#33384333'}},
          y:{ticks:{color:'#9aa1ad'}, grid:{color:'#33384333'}, min:0, max:100}
        }}
      });
    }
  }
}

function renderProgressiDetail(){
  const s = cache.sessioni.find(x=>x.id===route.id);
  pageTitle.textContent = s.schedaNome;
  const d = new Date(s.data);
  let html = `<p style="color:var(--text-dim);font-size:13px;">${d.toLocaleDateString('it-IT',{weekday:'long', day:'numeric', month:'long', year:'numeric'})}</p>`;
  s.esercizi.forEach(e=>{
    html += `<div class="exercise-card"><h3>${e.nome}</h3>`;
    const haRpePerSerie = (e.sets||[]).some(s=>s.rpe!=null);
    e.sets.forEach((set,i)=>{
      html += `<div style="display:flex;gap:10px;font-size:13.5px;padding:5px 0;color:var(--text-dim);">
        <span style="width:20px;">${i+1}</span>
        <span style="flex:1;">${set.peso ? set.peso+' kg' : '—'}</span>
        <span style="flex:1;">${set.rip ? set.rip+' rip' : '—'}</span>
        <span style="width:50px;text-align:right;">${set.rpe!=null ? 'RPE '+set.rpe : '—'}</span>
        <span>${set.fatta?'✅':'—'}</span>
      </div>`;
    });
    if(!haRpePerSerie && e.rpe){
      html += `<p style="margin:8px 0 0;font-size:12.5px;color:var(--text-dim);">RPE: <b style="color:var(--text);">${e.rpe}</b></p>`;
    }
    if(e.noteUtente){
      html += `<p style="margin:8px 0 0;font-size:12.5px;color:var(--text-dim);"><b style="color:var(--text);">Note:</b> ${e.noteUtente}</p>`;
    }
    html += `</div>`;
  });
  html += `<button class="btn secondary" onclick="eliminaSessione('${s.id}')">Elimina questa seduta</button>`;
  view.innerHTML = html;
}

async function eliminaSessione(id){
  if(!(await mostraConferma('Eliminare questa seduta dallo storico?'))) return;
  try{
    await userCollection('sessioni').doc(id).delete();
    cache.sessioni = cache.sessioni.filter(s=>s.id!==id);
    setRoute({name:'storico-allenamento'});
  }catch(e){ alert('Errore: '+e.message); }
}

async function salvaObiettivi(){
  const kcal = Number(document.getElementById('oKcal').value);
  const prot = Number(document.getElementById('oProt').value);
  const carb = Number(document.getElementById('oCarb').value);
  const grassi = Number(document.getElementById('oGrassi').value);
  const acquaL = Number(document.getElementById('oAcqua').value);
  const errBox = document.getElementById('obiettiviError');
  const btn = document.getElementById('salvaObiettiviBtn');
  errBox.innerHTML = '';
  if([kcal,prot,carb,grassi,acquaL].some(v=> isNaN(v) || v<0)){
    errBox.innerHTML = '<div class="error-banner">Controlla i valori inseriti.</div>';
    return;
  }
  const obiettivi = { kcal, prot, carb, grassi, acquaMl: Math.round(acquaL*1000) };
  btn.disabled = true; btn.textContent = 'Salvataggio...';
  try{
    await db.collection('users').doc(currentUid).set({ obiettivi }, { merge:true });
    profiloUtente.obiettivi = obiettivi;
    btn.disabled = false; btn.textContent = 'Obiettivi salvati ✅';
    setTimeout(()=>{ if(document.getElementById('salvaObiettiviBtn')) { btn.textContent='Salva obiettivi'; } }, 1800);
  }catch(e){
    errBox.innerHTML = `<div class="error-banner">${e.message}</div>`;
    btn.disabled = false; btn.textContent = 'Salva obiettivi';
  }
}

async function salvaProfiloModifiche(){
  const nome = document.getElementById('pNome').value.trim();
  const cognome = document.getElementById('pCognome').value.trim();
  const eta = document.getElementById('pEta').value;
  const attenzioni = document.getElementById('pAttenzioni').value.trim();
  const errBox = document.getElementById('profiloError');
  const btn = document.getElementById('salvaProfiloBtn');
  errBox.innerHTML = '';
  if(!nome || !cognome || !eta){
    errBox.innerHTML = '<div class="error-banner">Compila tutti i campi.</div>';
    return;
  }
  if(Number(eta) < 10 || Number(eta) > 100){
    errBox.innerHTML = '<div class="error-banner">Inserisci un\'età valida.</div>';
    return;
  }
  btn.disabled = true; btn.textContent = 'Salvataggio...';
  try{
    await db.collection('users').doc(currentUid).set({ nome, cognome, eta: Number(eta), attenzioni }, { merge:true });
    profiloUtente = { ...profiloUtente, nome, cognome, eta: Number(eta), attenzioni };
    setRoute({name:'home'});
  }catch(e){
    errBox.innerHTML = `<div class="error-banner">${e.message}</div>`;
    btn.disabled = false; btn.textContent = 'Salva modifiche';
  }
}

/* ============ PANNELLO TRAINER (visibile solo se isTrainer:true sul profilo) ============ */
function renderTrainerPanel(){
  pageTitle.textContent = 'Pannello trainer';
  if(!profiloUtente || !profiloUtente.isTrainer){
    view.innerHTML = `<p class="empty">Accesso riservato al trainer.</p>`;
    return;
  }
  view.innerHTML = `<div class="spinner-wrap">Caricamento utenti...</div>`;
  db.collection('users').get().then(snap=>{
    const utenti = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    if(!utenti.length){
      view.innerHTML = `<p class="empty">Nessun utente trovato.</p>`;
      return;
    }
    let html = `<p class="note-box" style="margin-top:0;">Tocca una scheda per assegnarla o rimuoverla dall'utente.</p>`;
    utenti.forEach(u=>{
      const assegnate = u.schedeAssegnate || [];
      html += `<div class="card">
        <h3 style="margin:0 0 4px;font-size:15px;">${u.nome||'—'} ${u.cognome||''}</h3>
        <p style="margin:0 0 10px;font-size:11.5px;color:var(--text-dim);word-break:break-all;">${u.id}</p>
        <div class="chip-select">
          ${SCHEDE.map(s=>`<div class="chip ${assegnate.includes(s.id)?'active':''}" onclick="toggleAssegnazione('${u.id}','${s.id}',this)">${s.nome}</div>`).join('')}
        </div>
      </div>`;
    });
    view.innerHTML = html;
  }).catch(e=>{
    view.innerHTML = `<div class="error-banner">Impossibile caricare gli utenti: ${e.message}</div>`;
  });
}

function toggleAssegnazione(uid, schedaId, chipEl){
  const ref = db.collection('users').doc(uid);
  const attivo = chipEl.classList.contains('active');
  const op = attivo ? firebase.firestore.FieldValue.arrayRemove(schedaId) : firebase.firestore.FieldValue.arrayUnion(schedaId);
  chipEl.style.opacity = '.5';
  ref.set({ schedeAssegnate: op }, { merge:true }).then(()=>{
    chipEl.classList.toggle('active');
    chipEl.style.opacity = '1';
  }).catch(e=>{
    chipEl.style.opacity = '1';
    alert('Errore: '+e.message);
  });
}

const MICRO_ALIAS = {
  "Fiocchi d'avena (da frullare in farina)": "Fiocchi d'avena",
  'Uovo': 'Uova',
  'Verdura mista (insalata/pomodoro)': 'Verdura mista',
};

function microPer100(nome){
  return MICRO_DB[nome] || MICRO_DB[MICRO_ALIAS[nome]] || null;
}

function calcolaMicroOpzione(opz){
  const tot = { acqua:0 };
  MICRO_DEF.forEach(m=> tot[m.key]=0);
  opz.alimenti.forEach(a=>{
    const profilo = microPer100(a.n);
    if(!profilo) return;
    const match = String(a.q).match(/^(\d+(?:[.,]\d+)?)/);
    const grammi = match ? parseFloat(match[1].replace(',','.')) : 0;
    const fattore = grammi/100;
    tot.acqua += (profilo.acqua||0)*fattore;
    MICRO_DEF.forEach(m=> tot[m.key] += (profilo[m.key]||0)*fattore);
  });
  return tot;
}

/* Estrazione micronutrienti dai risultati Open Food Facts. Nella loro API i
   nutrienti "traccia" (vitamine, minerali) nel campo *_100g sono normalizzati
   in grammi (es. vitamin-c_100g:0.00006 = 60mg), a differenza dei macro
   (proteine/carboidrati/grassi) che sono già in grammi diretti: per questo
   qui vanno moltiplicati per riportarli in mg/mcg leggibili. Copertura non
   garantita: essendo un database collaborativo, molti prodotti non hanno
   tutti questi campi compilati. */
const OFF_MICRO_MAP = {
  vitA:{off:'vitamin-a', factor:1e6}, vitC:{off:'vitamin-c', factor:1e3}, vitD:{off:'vitamin-d', factor:1e6},
  vitE:{off:'vitamin-e', factor:1e3}, vitB12:{off:'vitamin-b12', factor:1e6}, folati:{off:'vitamin-b9', factor:1e6},
  calcio:{off:'calcium', factor:1e3}, ferro:{off:'iron', factor:1e3}, magnesio:{off:'magnesium', factor:1e3},
  potassio:{off:'potassium', factor:1e3}, zinco:{off:'zinc', factor:1e3}, sodio:{off:'sodium', factor:1e3}
};
function estraiMicroOFF(nutrimenti){
  nutrimenti = nutrimenti || {};
  const micro100 = {};
  Object.keys(OFF_MICRO_MAP).forEach(key=>{
    const cfg = OFF_MICRO_MAP[key];
    const raw = nutrimenti[cfg.off+'_100g'];
    micro100[key] = (raw!=null && !isNaN(raw)) ? raw*cfg.factor : null;
  });
  const acquaRaw = nutrimenti['water_100g'];
  const acqua100 = (acquaRaw!=null && !isNaN(acquaRaw)) ? acquaRaw : null;
  return { micro100, acqua100 };
}

/* Genera l'HTML della griglia micronutrienti scalata alla grammatura scelta,
   riusato sia per il prodotto cercato/scansionato sia per il piano fisso. */
function microGridHtmlDaOFF(micro100, acqua100, fattore){
  const righe = MICRO_DEF.map(m=>{
    const v100 = micro100[m.key];
    if(v100==null) return '';
    const v = v100*fattore;
    if(!(v>0)) return '';
    const vArr = v<10 ? Math.round(v*10)/10 : Math.round(v);
    return `<div class="micro-row"><span>${m.label}</span><b>${vArr} ${m.unit}</b></div>`;
  }).join('');
  const acquaLine = acqua100!=null
    ? `<p style="margin:0 0 10px;">💧 Acqua stimata: <b style="color:var(--text);">${Math.round(acqua100*fattore)} ml circa</b></p>`
    : `<p style="margin:0 0 10px;color:var(--text-dim);">💧 Dato acqua non disponibile per questo prodotto.</p>`;
  return `${acquaLine}<div class="micro-grid">${righe || '<p style="margin:0;">Nessun dato su vitamine/minerali per questo prodotto su Open Food Facts.</p>'}</div>
    <p class="field-hint" style="margin-top:12px;">Dati Open Food Facts, database collaborativo: la copertura di vitamine e minerali varia da prodotto a prodotto.</p>`;
}
