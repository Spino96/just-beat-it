<style>
  :root{
    --bg:#0b0d11;
    --panel:#181c24;
    --panel-2:#222733;
    --border:#3a415280;
    --text:#f7f9fc;
    --text-dim:#aab2c2;
    --accent:#4ef0c8;
    --accent-2:#ff7a45;
    --accent-3:#8b6bff;
    --danger:#ff5470;
    --radius:18px;
    --radius-sm:12px;
    --shadow-card:0 10px 28px -14px rgba(0,0,0,.7);
    --shadow-btn:0 10px 24px -8px #4ef0c855;
  }
  *{box-sizing:border-box;}
  html{-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(circle at 12% -10%, #1c3d3440 0%, transparent 42%),
      radial-gradient(circle at 100% 0%, #3a234f40 0%, transparent 48%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:560px;margin:0 auto;padding:0 0 70px;min-height:100vh;}
  header{
    position:sticky;top:0;z-index:10;
    background:transparent;
    padding:20px 18px 12px;
    display:flex;align-items:center;gap:12px;
  }
  header h1{
    font-size:19px;margin:0;font-weight:800;flex:1;letter-spacing:-.2px;
    background:linear-gradient(90deg,var(--text) 25%,var(--accent) 110%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand-mark{width:34px;height:34px;flex-shrink:0;display:block;}
  .back-btn{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    width:36px;height:36px;border-radius:11px;font-size:17px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .back-btn:active{transform:scale(.92);}
  .logout-btn{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);
    font-size:12.5px;font-weight:800;cursor:pointer;
    display:flex;align-items:center;gap:6px;
    padding:8px 14px;border-radius:20px;
    transition:transform .15s ease, background .15s ease, color .15s ease, border-color .15s ease;
  }
  .logout-btn:hover{
    background:var(--panel-2);color:var(--danger);border-color:#ff547080;
  }
  .logout-btn:active{transform:scale(.93);}
  main{padding:8px 18px 30px;}
  .card{
    background:var(--panel);border:1px solid var(--border);
    box-shadow:var(--shadow-card);
    border-radius:var(--radius);padding:20px;margin-bottom:16px;
  }
  .home-cat{
    display:flex;align-items:center;gap:16px;
    padding:20px;margin-bottom:14px;border-radius:var(--radius);
    background:var(--panel);border:1px solid var(--border);
    box-shadow:var(--shadow-card);
    cursor:pointer;transition:transform .15s ease;
  }
  .home-cat:active{transform:scale(.97);}
  .home-cat .icon{
    width:52px;height:52px;border-radius:16px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:24px;
    background:linear-gradient(135deg,var(--accent),var(--accent-3));
    box-shadow:0 8px 18px -6px #4ef0c855;
  }
  .home-cat .label{font-size:17.5px;font-weight:800;letter-spacing:-.1px;}
  .home-cat .sub{font-size:13px;color:var(--text-dim);margin-top:3px;font-weight:600;}
  .list-item{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);
    box-shadow:var(--shadow-card);
    padding:16px 18px;margin-bottom:10px;cursor:pointer;
    border-left:3px solid var(--accent);
  }
  .list-item:active{opacity:.8;}
  .list-item h3{margin:0 0 4px;font-size:16px;font-weight:700;}
  .list-item p{margin:0;font-size:12.5px;color:var(--text-dim);font-weight:600;}
  .pill{
    display:inline-block;font-size:11.5px;font-weight:800;padding:4px 11px;border-radius:20px;
    background:linear-gradient(135deg,#4ef0c833,#8b6bff33);
    color:var(--accent);margin-right:6px;letter-spacing:.2px;
    border:1px solid #4ef0c840;
  }
  .btn{
    background:linear-gradient(135deg,var(--accent),#38d6b0);color:#04120d;border:none;border-radius:14px;
    padding:15px 18px;font-size:15px;font-weight:800;cursor:pointer;width:100%;
    box-shadow:var(--shadow-btn);transition:transform .1s ease;
  }
  .btn:active{transform:scale(.98);}
  .btn.secondary{background:var(--panel-2);color:var(--text);box-shadow:none;border:1px solid var(--border);}
  .btn.small{width:auto;padding:9px 16px;font-size:13.5px;}
  .btn.danger{background:linear-gradient(135deg,var(--danger),#c92548);color:#fff;box-shadow:0 10px 24px -8px #ff547055;}
  .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
  .exercise-card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow-card);
    padding:18px;margin-bottom:14px;border-top:3px solid var(--accent-2);
  }
  .exercise-card h3{margin:0 0 3px;font-size:16.5px;font-weight:800;}
  .ex-meta{font-size:12.5px;color:var(--text-dim);margin-bottom:12px;font-weight:700;}
  .set-row{
    display:grid;grid-template-columns:28px 1fr 1fr 34px;gap:8px;align-items:center;
    margin-bottom:8px;
  }
  .set-row span{font-size:13px;color:var(--text-dim);font-weight:700;}
  .set-row input[type=number], .set-row input[type=text]{
    width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:10px 9px;font-size:14.5px;font-weight:600;
  }
  .set-row input[type=number]:focus, .set-row input[type=text]:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  .set-row input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);}
  .note-box{
    font-size:13px;color:var(--text-dim);background:var(--panel-2);
    border-radius:12px;padding:12px 14px;margin-top:10px;line-height:1.55;font-weight:500;
  }
  .toggle-guide{
    background:none;border:none;color:var(--accent);font-size:13px;
    padding:8px 0 0;cursor:pointer;font-weight:800;
  }
  .guide-body{display:none;margin-top:10px;font-size:13.5px;line-height:1.6;color:var(--text-dim);}
  .guide-body.open{display:block;}
  .guide-body b{color:var(--text);}
  .warm-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:11px 0;border-bottom:1px solid var(--border);
  }
  .warm-item:last-child{border-bottom:none;}
  .warm-item .l{font-size:14.5px;font-weight:600;}
  .warm-item .r{font-size:12.5px;color:var(--text-dim);font-weight:600;}
  .timer-bar{
    position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border-top:1px solid var(--border);
    box-shadow:0 -10px 30px -10px rgba(0,0,0,.7);
    padding:14px 18px 16px;
    max-width:560px;margin:0 auto;
    overflow:hidden;
  }
  .timer-progress{position:relative;top:-14px;left:-18px;width:calc(100% + 36px);height:4px;background:#ffffff12;}
  .timer-progress-fill{height:100%;width:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width 1s linear;}
  .timer-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:-6px;}
  .timer-adj{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    width:50px;height:50px;border-radius:15px;font-size:13px;font-weight:800;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:transform .12s ease;
  }
  .timer-adj:active{transform:scale(.9);}
  .timer-center{flex:1;text-align:center;}
  .timer-center .lbl{font-size:12.5px;color:var(--text-dim);font-weight:700;margin-bottom:1px;}
  .timer-center .t{
    font-size:32px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.15;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .timer-actions{display:flex;gap:10px;margin-top:12px;}
  .timer-actions .btn{flex:1;}
  .video-link{
    color:var(--accent-2);font-size:13px;font-weight:800;text-decoration:none;
    padding:8px 0 0;display:inline-flex;align-items:center;gap:4px;
  }
  .video-link:active{opacity:.7;}
  input, textarea{font-family:inherit;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;font-weight:700;letter-spacing:.1px;}
  .field input, .field textarea{
    width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    border-radius:12px;padding:12px 13px;font-size:14.5px;font-weight:500;
  }
  .field input:focus, .field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .empty{text-align:center;color:var(--text-dim);font-size:13.5px;padding:34px 10px;font-weight:600;}
  .photo-thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;}
  canvas.chart-canvas{max-width:100%;}
  .chip-select{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{
    padding:9px 15px;border-radius:20px;background:var(--panel-2);color:var(--text-dim);
    font-size:12.5px;font-weight:700;cursor:pointer;border:1px solid var(--border);
  }
  .chip.active{background:linear-gradient(135deg,var(--accent),#38d6b0);color:#04120d;border-color:transparent;box-shadow:0 6px 16px -6px #4ef0c866;}
  .success-banner{
    background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#04120d;
    padding:22px;border-radius:var(--radius);text-align:center;font-weight:800;margin-bottom:16px;
    box-shadow:var(--shadow-btn);font-size:15px;
  }
  .error-banner{
    background:linear-gradient(135deg,var(--danger),#c92548);color:#fff;padding:13px 16px;border-radius:12px;
    font-size:13.5px;margin-bottom:12px;font-weight:700;
  }
  #loginScreen, #onboardingScreen{
    max-width:380px;margin:14vh auto 0;padding:0 24px;text-align:center;
  }
  #loginScreen h1, #onboardingScreen h1{font-size:26px;margin-bottom:8px;font-weight:900;letter-spacing:-.3px;}
  #loginScreen p, #onboardingScreen p{color:var(--text-dim);font-size:14px;margin-bottom:26px;font-weight:600;}
  #loginScreen .card, #onboardingScreen .card{text-align:left;}
  .spinner-wrap{display:flex;justify-content:center;padding:70px 0;color:var(--text-dim);font-size:14px;font-weight:600;}
</style>
</head>
<body>

<div id="loginScreen">
  <h1>🏋️ Just Beat It</h1>
  <p>Accedi con il tuo profilo per vedere la scheda e i tuoi progressi.</p>
  <div class="card">
    <div id="loginError"></div>
    <div class="field"><label>Email</label><input type="email" id="loginUser" autocomplete="username"></div>
    <div class="field"><label>Password</label><input type="password" id="loginPass" autocomplete="current-password"></div>
    <button class="btn" id="loginBtn" onclick="doLogin()">Accedi</button>
  </div>
</div>

<div id="onboardingScreen" style="display:none;">
  <h1>🏋️ Just Beat It</h1>
  <p>Prima di iniziare, dicci qualcosa su di te.</p>
  <div class="card">
    <div id="onboardingError"></div>
    <div class="field"><label>Nome</label><input type="text" id="obNome" autocomplete="given-name"></div>
    <div class="field"><label>Cognome</label><input type="text" id="obCognome" autocomplete="family-name"></div>
    <div class="field"><label>Età</label><input type="number" id="obEta" min="10" max="100"></div>
    <button class="btn" id="onboardingBtn" onclick="salvaProfilo()">Continua</button>
  </div>
</div>

<div id="app" style="display:none;">
  <header>
    <svg class="brand-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="brandBg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1c2029"/>
          <stop offset="100%" stop-color="#07080b"/>
        </linearGradient>
        <linearGradient id="brandFlame" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff7a45"/>
          <stop offset="100%" stop-color="#8b6bff"/>
        </linearGradient>
      </defs>
      <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#brandBg)" stroke="#3a415280"/>
      <path d="M32 10 C42 24 47 34 41 44 C37 51 27 51 23 44 C17 34 22 24 32 10 Z" fill="url(#brandFlame)"/>
      <path d="M18 34 H26 L30 20 L36 46 L40 30 H50" fill="none" stroke="#07080b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <button class="back-btn" id="backBtn" style="visibility:hidden">‹</button>
    <h1 id="pageTitle">Just Beat It</h1>
    <button class="logout-btn" onclick="logout()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      Esci
    </button>
  </header>
  <main id="view"></main>
</div>

const cache = { sessioni: [], misure: [] };

let profiloUtente = null;

function userCollection(name){
  return db.collection('users').doc(currentUid).collection(name);
}

/* Controlla se esiste gia' un profilo (nome/cognome/eta) per l'utente loggato.
   Ritorna true se completo, false se manca (e in quel caso mostra il form di onboarding). */
async function checkProfilo(){
  const snap = await db.collection('users').doc(currentUid).get();
  const data = snap.exists ? snap.data() : {};
  if(data.nome && data.cognome && data.eta){
    profiloUtente = { nome:data.nome, cognome:data.cognome, eta:data.eta };
    return true;
  }
  document.getElementById('obNome').value = data.nome || '';
  document.getElementById('obCognome').value = data.cognome || '';
  document.getElementById('obEta').value = data.eta || '';
  return false;
}

async function salvaProfilo(){
  const nome = document.getElementById('obNome').value.trim();
  const cognome = document.getElementById('obCognome').value.trim();
  const eta = document.getElementById('obEta').value;
  const errBox = document.getElementById('onboardingError');
  const btn = document.getElementById('onboardingBtn');
  errBox.innerHTML = '';
  if(!nome || !cognome || !eta){
    errBox.innerHTML = '<div class="error-banner">Compila tutti i campi.</div>';
    return;
  }
  btn.disabled = true; btn.textContent = 'Salvataggio...';
  try{
    await db.collection('users').doc(currentUid).set({ nome, cognome, eta: Number(eta) }, { merge:true });
    profiloUtente = { nome, cognome, eta: Number(eta) };
    document.getElementById('onboardingScreen').style.display = 'none';
    await avviaApp();
  }catch(e){
    errBox.innerHTML = `<div class="error-banner">${e.message}</div>`;
    btn.disabled = false; btn.textContent = 'Continua';
  }
}

async function doLogin(){
  const email = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const errBox = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  errBox.innerHTML = '';
  if(!email || !password){
    errBox.innerHTML = '<div class="error-banner">Inserisci email e password.</div>';
    return;
  }
  btn.disabled = true; btn.textContent = 'Accesso...';
  try{
    await auth.signInWithEmailAndPassword(email, password);
    // onAuthStateChanged si occupa del resto
  }catch(e){
    errBox.innerHTML = `<div class="error-banner">${mapAuthError(e)}</div>`;
    btn.disabled = false; btn.textContent = 'Accedi';
  }
}

function mapAuthError(e){
  const code = e.code || '';
  if(code.includes('invalid-credential') || code.includes('wrong-password') || code.includes('user-not-found')) return 'Email o password non corrette.';
  if(code.includes('too-many-requests')) return 'Troppi tentativi, riprova tra poco.';
  if(code.includes('invalid-email')) return 'Email non valida.';
  return 'Errore di accesso: ' + (e.message || code);
}

function logout(){
  auth.signOut();
}

async function loadData(){
  const [sessioniSnap, misureSnap] = await Promise.all([
    userCollection('sessioni').orderBy('data','asc').get(),
    userCollection('misure').orderBy('data','asc').get()
  ]);
  cache.sessioni = sessioniSnap.docs.map(d => ({ id:d.id, ...d.data() }));
  cache.misure = misureSnap.docs.map(d => ({ id:d.id, ...d.data() }));
}

function toggleWarm(i){ sessionDraft.warmDone[i] = !sessionDraft.warmDone[i]; }

function toggleGuide(ei){
  document.getElementById('guide-'+ei).classList.toggle('open');
}

function updateSet(ei,si,field,val){
  sessionDraft.esercizi[ei].sets[si][field] = val;
}

function markSetDone(ei,si,recupero,checked){
  sessionDraft.esercizi[ei].sets[si].fatta = checked;
  if(checked){ startRestTimer(recupero); }
}

let restState = null;

function startRestTimer(seconds){
  clearRestTimer();
  restState = { remaining: seconds, total: seconds, paused: false };
  const bar = document.createElement('div');
  bar.className = 'timer-bar';
  bar.id = 'restBar';
  bar.innerHTML = `
    <div class="timer-progress"><div class="timer-progress-fill" id="restFill"></div></div>
    <div class="timer-row">
      <button class="timer-adj" onclick="adjustRest(-15)">−15"</button>
      <div class="timer-center">
        <div class="lbl">Recupero</div>
        <div class="t" id="restT">${seconds}"</div>
      </div>
      <button class="timer-adj" onclick="adjustRest(15)">+15"</button>
    </div>
    <div class="timer-actions">
      <button class="btn small secondary" id="restPauseBtn" onclick="togglePauseRest()">⏸ Pausa</button>
      <button class="btn small secondary" onclick="clearRestTimer()">Salta</button>
    </div>`;
  document.body.appendChild(bar);
  updateRestDisplay();
  restTimerHandle = setInterval(()=>{
    if(!restState || restState.paused) return;
    restState.remaining--;
    if(restState.remaining<=0){
      updateRestDisplay();
      const t = document.getElementById('restT');
      if(t) t.textContent = "Via! 💪";
      beep();
      clearInterval(restTimerHandle);
      setTimeout(clearRestTimer, 2000);
      return;
    }
    updateRestDisplay();
  },1000);
}

function updateRestDisplay(){
  if(!restState) return;
  const t = document.getElementById('restT');
  const fill = document.getElementById('restFill');
  if(t) t.textContent = restState.remaining>0 ? restState.remaining+'"' : 'Via! 💪';
  if(fill){
    const pct = restState.total>0 ? Math.max(0, Math.min(100, (restState.remaining/restState.total)*100)) : 0;
    fill.style.width = pct+'%';
  }
}

function adjustRest(delta){
  if(!restState) return;
  restState.remaining = Math.max(0, restState.remaining + delta);
  if(restState.remaining > restState.total) restState.total = restState.remaining;
  updateRestDisplay();
}

function togglePauseRest(){
  if(!restState) return;
  restState.paused = !restState.paused;
  const btn = document.getElementById('restPauseBtn');
  if(btn) btn.textContent = restState.paused ? '▶ Riprendi' : '⏸ Pausa';
}

function clearRestTimer(){
  if(restTimerHandle){ clearInterval(restTimerHandle); restTimerHandle=null; }
  restState = null;
  const bar = document.getElementById('restBar');
  if(bar) bar.remove();
}

function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880;
    g.gain.value = 0.15;
    o.start();
    setTimeout(()=>{o.stop(); ctx.close();}, 350);
  }catch(e){}
}

async function terminaSessione(){
  if(!confirm('Salvare questo allenamento in Progressi?')) return;
  const btn = document.getElementById('finishBtn');
  btn.disabled = true; btn.textContent = 'Salvataggio...';
  try{
    const payload = {
      schedaId: sessionDraft.schedaId,
      schedaNome: sessionDraft.schedaNome,
      data: new Date().toISOString(),
      esercizi: sessionDraft.esercizi
    };
    const ref = await userCollection('sessioni').add(payload);
    cache.sessioni.push({ id: ref.id, ...payload });
    sessionDraft = null;
    setRoute({name:'storico-allenamento', justSaved:true});
  }catch(e){
    alert('Errore nel salvataggio: '+e.message);
    btn.disabled = false; btn.textContent = 'Termina e salva allenamento';
  }
}

/* ============ STATISTICHE ============ */
function renderStatistiche(){
  pageTitle.textContent = 'Statistiche';
  const haveSessioni = cache.sessioni.length>0;
  const haveMisureStats = cache.misure.length>0;

  if(!haveSessioni && !haveMisureStats){
    view.innerHTML = `<p class="empty">Non ci sono ancora dati sufficienti. Completa un allenamento o registra una misura per vedere le statistiche qui.</p>`;
    return;
  }

  let html = '';
  if(haveSessioni){
    html += `<div class="card"><h3 style="margin-top:0;font-size:15px;">Carichi esercizi</h3>
      <div class="chip-select" id="exChips"></div>
      <canvas class="chart-canvas" id="progChart" height="180"></canvas>
    </div>`;
  }
  if(haveMisureStats){
    html += `<div class="card"><h3 style="margin-top:0;font-size:15px;">Misure corporee</h3>
      <div class="chip-select" id="misureChips"></div>
      <canvas class="chart-canvas" id="misureChart" height="180"></canvas>
    </div>`;
  }
  view.innerHTML = html;

  if(haveSessioni){
    const exNames = [...new Set(cache.sessioni.flatMap(s=>s.esercizi.map(e=>e.nome)))];
    const chipWrap = document.getElementById('exChips');
    let selected = exNames[0];
    function drawChart(name){
      const points = cache.sessioni
        .filter(s=>s.esercizi.some(e=>e.nome===name))
        .map(s=>{
          const e = s.esercizi.find(e=>e.nome===name);
          const pesi = e.sets.map(x=>parseFloat(x.peso)).filter(v=>!isNaN(v));
          const maxPeso = pesi.length ? Math.max(...pesi) : null;
          return {data: new Date(s.data).toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'}), peso: maxPeso};
        })
        .filter(p=>p.peso!==null);
      const ctx = document.getElementById('progChart');
      if(window._chart) window._chart.destroy();
      if(points.length===0){
        ctx.getContext('2d').clearRect(0,0,ctx.width,ctx.height);
        return;
      }
      window._chart = new Chart(ctx, {
        type:'line',
        data:{ labels: points.map(p=>p.data), datasets:[{
          label: name+' (kg max)', data: points.map(p=>p.peso),
          borderColor:'#5ee6c8', backgroundColor:'#5ee6c833', tension:.3, fill:true, pointRadius:4
        }]},
        options:{ plugins:{legend:{labels:{color:'#eef0f3'}}}, scales:{
          x:{ticks:{color:'#9aa1ad'}, grid:{color:'#33384333'}},
          y:{ticks:{color:'#9aa1ad'}, grid:{color:'#33384333'}}
        }}
      });
    }
    chipWrap.innerHTML = exNames.map(n=>`<div class="chip ${n===selected?'active':''}" data-n="${n}">${n}</div>`).join('');
    chipWrap.querySelectorAll('.chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        chipWrap.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
        chip.classList.add('active');
        drawChart(chip.dataset.n);
      });
    });
    if(selected) drawChart(selected);
  }

  if(haveMisureStats){
    const chipWrap2 = document.getElementById('misureChips');
    const metricheDisponibili = MISURE_METRICHE.filter(mm => cache.misure.some(m=>m[mm.key]!=null && m[mm.key]!==''));
    let selected2 = metricheDisponibili[0] ? metricheDisponibili[0].key : null;

    function drawMisuraChart(key){
      const metrica = MISURE_METRICHE.find(mm=>mm.key===key);
      const points = cache.misure
        .filter(m=>m[key]!=null && m[key]!=='')
        .map(m=>({
          x: new Date(m.data).toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'}),
          y: Number(m[key])
        }));
      const ctx = document.getElementById('misureChart');
      if(window._misureChart) window._misureChart.destroy();
      if(points.length===0){
        ctx.getContext('2d').clearRect(0,0,ctx.width,ctx.height);
        return;
      }
      window._misureChart = new Chart(ctx, {
        type:'line',
        data:{ labels: points.map(p=>p.x), datasets:[{
          label: `${metrica.label} (${metrica.unit})`, data: points.map(p=>p.y),
          borderColor: metrica.color, backgroundColor: metrica.color+'33', tension:.3, fill:true, pointRadius:4
        }]},
        options:{ plugins:{legend:{labels:{color:'#eef0f3'}}}, scales:{
          x:{ticks:{color:'#9aa1ad'}, grid:{color:'#33384333'}},
          y:{ticks:{color:'#9aa1ad'}, grid:{color:'#33384333'}}
        }}
      });
    }

    chipWrap2.innerHTML = metricheDisponibili.map(mm=>`<div class="chip ${mm.key===selected2?'active':''}" data-k="${mm.key}">${mm.label}</div>`).join('');
    chipWrap2.querySelectorAll('.chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        chipWrap2.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
        chip.classList.add('active');
        drawMisuraChart(chip.dataset.k);
      });
    });
    if(selected2) drawMisuraChart(selected2);
  }
}

// Ridimensiona/comprime l'immagine lato client cosi' il base64 resta ben sotto il limite di 1MB per documento Firestore
function resizeImage(file, maxSize){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if(width > height && width > maxSize){ height = height * (maxSize/width); width = maxSize; }
        else if(height > maxSize){ width = width * (maxSize/height); height = maxSize; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function salvaMisura(){
  const data = document.getElementById('mData').value || new Date().toISOString().slice(0,10);
  const peso = document.getElementById('mPeso').value;
  const vita = document.getElementById('mVita').value;
  const petto = document.getElementById('mPetto').value;
  const fianchi = document.getElementById('mFianchi').value;
  const braccioDx = document.getElementById('mBraccioDx').value;
  const braccioSx = document.getElementById('mBraccioSx').value;
  const cosciaDx = document.getElementById('mCosciaDx').value;
  const cosciaSx = document.getElementById('mCosciaSx').value;
  const fotoInput = document.getElementById('mFoto');
  const btn = document.getElementById('saveMisuraBtn');
  const errBox = document.getElementById('misuraError');

  btn.disabled = true; btn.textContent = 'Salvataggio...';
  try{
    let fotoDataUrl = null;
    if(fotoInput.files && fotoInput.files[0]){
      fotoDataUrl = await resizeImage(fotoInput.files[0], 700);
    }
    const payload = {
      data,
      peso: peso ? Number(peso) : null,
      vita: vita ? Number(vita) : null,
      petto: petto ? Number(petto) : null,
      fianchi: fianchi ? Number(fianchi) : null,
      braccioDx: braccioDx ? Number(braccioDx) : null,
      braccioSx: braccioSx ? Number(braccioSx) : null,
      cosciaDx: cosciaDx ? Number(cosciaDx) : null,
      cosciaSx: cosciaSx ? Number(cosciaSx) : null,
      foto: fotoDataUrl
    };
    const ref = await userCollection('misure').add(payload);
    cache.misure.push({ id: ref.id, ...payload });
    cache.misure.sort((a,b)=> new Date(a.data)-new Date(b.data));
    setRoute({name:'storico-misure', justSaved:true});
  }catch(e){
    errBox.innerHTML = `<div class="error-banner">${e.message}</div>`;
    btn.disabled = false; btn.textContent = 'Salva rilevazione';
  }
}

  try{

    cache.misure = cache.misure.filter(m=>m.id!==id);

}

async function boot(){
  const profiloCompleto = await checkProfilo();
  if(!profiloCompleto){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'none';
    document.getElementById('onboardingScreen').style.display = 'block';
    return;
  }
  await avviaApp();
}

async function avviaApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('onboardingScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  view.innerHTML = '<div class="spinner-wrap">Caricamento dati...</div>';
  try{
    await loadData();
    goHome();
  }catch(e){
    view.innerHTML = `<div class="error-banner">Errore nel caricamento dei dati: ${e.message}</div>`;
  }
}

/* ============ LOGIN TEMPORANEAMENTE DISATTIVATO ============
   Per riattivare il login: rimetti LOGIN_ENABLED a true.
   Il codice di autenticazione sopra resta invariato, viene solo bypassato qui sotto. */
const LOGIN_ENABLED = true;
const DEV_UID = 'dev-local-user';

if(LOGIN_ENABLED){
  auth.onAuthStateChanged(user=>{
    if(user){
      currentUid = user.uid;
      boot();
    } else {
      currentUid = null;
      profiloUtente = null;
      document.getElementById('loginScreen').style.display = 'block';
      document.getElementById('onboardingScreen').style.display = 'none';
      document.getElementById('app').style.display = 'none';
      const btn = document.getElementById('loginBtn');
      btn.disabled = false; btn.textContent = 'Accedi';
    }
  });

  document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
} else {
  document.getElementById('loginScreen').style.display = 'none';
  const logoutBtn = document.querySelector('.logout-btn');
  if(logoutBtn) logoutBtn.style.display = 'none';
  currentUid = DEV_UID;
  boot();
}
