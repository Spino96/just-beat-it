<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beat Yourself</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
<meta name="theme-color" content="#0b0d11">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<style>
  :root{
    --bg:#08090c;
    --panel:#111319;
    --panel-2:#191c24;
    --border:#1c2029;
    --text:#f5f7fa;
    --text-dim:#949cb2;
    --accent:#39ff94;
    --accent-2:#ff9d4d;
    --accent-3:#8b6bff;
    --danger:#ff5470;
    --radius:22px;
    --radius-sm:18px;
    --shadow-card:0 4px 16px -10px rgba(0,0,0,.6);
    --shadow-btn:0 0 20px -4px #39ff9466;
  }
  *{box-sizing:border-box;}
  html{-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:560px;margin:0 auto;padding:0 0 70px;min-height:100vh;}
  header{
    position:sticky;top:0;z-index:10;
    background:transparent;
    backdrop-filter:none;-webkit-backdrop-filter:none;
    border-bottom:1px solid transparent;
    padding:20px 18px 12px;
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
    transition:background-color .25s ease, backdrop-filter .25s ease, border-color .25s ease;
  }
  header.scrolled{
    background:rgba(8,9,12,.93);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom-color:var(--border);
  }
  .header-side{display:flex;align-items:center;gap:12px;}
  .header-side.right{justify-content:flex-end;}
  header h1{
    font-size:19px;margin:0;font-weight:800;letter-spacing:-.2px;
    text-align:center;white-space:nowrap;
    background:linear-gradient(90deg,var(--text) 25%,var(--accent) 110%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .back-btn{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    width:42px;height:42px;border-radius:50%;font-size:19px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .brand-mark{width:34px;height:34px;flex-shrink:0;display:block;}
  .back-btn:active{transform:scale(.92);}
  .avatar-btn{
    background:none;border:none;padding:0;cursor:pointer;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s ease;
  }
  .avatar-btn:active{transform:scale(.92);}
  main{padding:8px 18px 30px;transform-origin:50% 50%;}
  @keyframes viewGrowIn{
    from{ transform:scale(.4); opacity:0; }
    to{ transform:scale(1); opacity:1; }
  }
  @keyframes viewShrinkOut{
    from{ transform:scale(1); opacity:1; }
    to{ transform:scale(.4); opacity:0; }
  }
  .view-anim-in{ animation:viewGrowIn .32s cubic-bezier(.22,.9,.32,1); }
  .view-anim-out{ animation:viewShrinkOut .22s cubic-bezier(.4,0,.7,1) forwards; }
  .card{
    background:var(--panel);border:1px solid var(--border);
    box-shadow:var(--shadow-card);
    border-radius:var(--radius);padding:20px;margin-bottom:16px;
  }
  .home-cat{
    display:flex;align-items:center;gap:16px;position:relative;
    padding:18px 20px;margin-bottom:12px;border-radius:var(--radius);
    background:var(--panel);border:1px solid var(--border);
    box-shadow:var(--shadow-card);
    cursor:pointer;transition:transform .15s ease, box-shadow .22s ease, background .22s ease, border-color .22s ease;
  }
  .home-cat:active{transform:scale(.97);}
  .home-cat.tapped{
    transform:scale(.97);
    border-color:var(--accent);
    background:radial-gradient(circle at 50% 50%, #39ff9433 0%, var(--panel) 72%);
    box-shadow:0 0 0 1.5px var(--accent), 0 0 34px 6px #39ff9466, inset 0 0 26px -6px #39ff9455;
  }
  .home-cat .icon{
    width:52px;height:52px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:25px;
    background:var(--panel-2);border:1.5px solid var(--accent);
    box-shadow:0 0 16px -5px #39ff94aa;
  }
  .home-cat .label{font-size:17.5px;font-weight:800;letter-spacing:-.1px;}
  .home-cat .sub{font-size:13px;color:var(--text-dim);margin-top:3px;font-weight:600;}
  .profile-link{font-size:12.5px;color:var(--text-dim);font-weight:700;margin:0 0 16px;}
  .profile-link span{cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
  .app-credit{
    text-align:center;font-size:12px;color:var(--text-dim);font-weight:600;
    margin:26px 0 10px;letter-spacing:.2px;
  }
  .app-credit span{
    color:var(--accent);font-weight:800;
    text-shadow:0 0 12px #39ff9466;
  }
  .home-squares{display:flex;gap:12px;margin-bottom:12px;}
  .home-square{
    flex:1;padding:20px 10px;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);
    box-shadow:var(--shadow-card);cursor:pointer;transition:transform .15s ease, box-shadow .22s ease, background .22s ease, border-color .22s ease;
  }
  .home-square:active{transform:scale(.97);}
  .home-square.tapped{
    transform:scale(.97);
    border-color:var(--accent);
    background:radial-gradient(circle at 50% 50%, #39ff9433 0%, var(--panel) 72%);
    box-shadow:0 0 0 1.5px var(--accent), 0 0 30px 5px #39ff9466, inset 0 0 22px -6px #39ff9455;
  }
  .home-square .icon{
    width:46px;height:46px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:21px;
    background:var(--panel-2);border:1.5px solid var(--accent);
    box-shadow:0 0 14px -5px #39ff94aa;
  }
  .home-square .label{font-size:14px;font-weight:800;letter-spacing:-.1px;}
  .list-item{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);
    box-shadow:var(--shadow-card);
    padding:16px 18px;margin-bottom:10px;cursor:pointer;
    border-left:3px solid var(--accent);
  }
  .list-item:active{opacity:.8;}
  .list-item h3{margin:0 0 4px;font-size:16px;font-weight:700;}
  .list-item p{margin:0;font-size:12.5px;color:var(--text-dim);font-weight:600;}
  .list-item .scheda-desc{margin-top:8px;font-size:12.5px;line-height:1.55;color:var(--text-dim);font-weight:500;}
  .list-item.passato{border-left-color:var(--text-dim);opacity:.65;}
  .list-item.locked{border-left-color:var(--text-dim);opacity:.5;cursor:default;}
  .section-label{
    font-size:12px;text-transform:uppercase;letter-spacing:.6px;
    color:var(--text-dim);font-weight:800;margin:20px 2px 10px;
  }
  .swipe-hint{font-size:12.5px;color:var(--text-dim);text-align:center;margin:0 0 12px;font-weight:600;}
  .swipe-row{position:relative;border-radius:var(--radius-sm);margin-bottom:10px;overflow:hidden;}
  .swipe-row .list-item{margin-bottom:0;position:relative;z-index:1;touch-action:pan-y;will-change:transform;}
  .swipe-delete{
    position:absolute;top:0;right:0;bottom:0;width:84px;z-index:0;
    background:linear-gradient(135deg,var(--danger),#c92548);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;
  }
  .pill{
    display:inline-block;font-size:11.5px;font-weight:800;padding:4px 11px;border-radius:20px;
    background:#39ff9422;
    color:var(--accent);margin-right:6px;letter-spacing:.2px;
    border:1px solid #39ff9440;
  }
  .btn{
    background:linear-gradient(135deg,var(--accent),#1fae63);color:#04140d;border:none;border-radius:18px;
    padding:15px 18px;font-size:15px;font-weight:800;cursor:pointer;width:100%;
    box-shadow:var(--shadow-btn);transition:transform .1s ease;
  }
  .btn:active{transform:scale(.98);}
  .btn.secondary{background:var(--panel-2);color:var(--text);box-shadow:none;border:1px solid var(--border);}
  .btn.small{width:auto;padding:9px 16px;font-size:13.5px;}
  .btn.tap-glow{animation:btnGlow .26s ease;}
  @keyframes btnGlow{
    0%{box-shadow:0 0 0 2px var(--accent), 0 0 26px 6px #39ff9466;}
    100%{box-shadow:var(--shadow-btn);}
  }
  .btn.secondary.tap-glow{animation:btnGlowSecondary .26s ease;}
  @keyframes btnGlowSecondary{
    0%{box-shadow:0 0 0 2px var(--accent), 0 0 20px 5px #39ff9440;}
    100%{box-shadow:none;}
  }
  .btn.danger.tap-glow{animation:btnGlowDanger .26s ease;}
  @keyframes btnGlowDanger{
    0%{box-shadow:0 0 0 2px var(--danger), 0 0 26px 6px #ff547066;}
    100%{box-shadow:0 10px 24px -8px #ff547055;}
  }
  .alt-tag{
    display:inline-block;font-size:10px;font-weight:800;color:var(--accent-2);
    background:#ff9d4d22;padding:3px 8px;border-radius:20px;vertical-align:middle;
    text-transform:uppercase;letter-spacing:.3px;margin-left:4px;
  }
  .btn.danger{background:linear-gradient(135deg,var(--danger),#c92548);color:#fff;box-shadow:0 10px 24px -8px #ff547055;}
  .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
  .exercise-card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow-card);
    padding:18px;margin-bottom:14px;border-top:3px solid var(--accent);
  }
  .exercise-card h3{margin:0 0 3px;font-size:16.5px;font-weight:800;}
  .ex-meta{font-size:12.5px;color:var(--text-dim);margin-bottom:12px;font-weight:700;}
  .ex-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .ex-head .ex-head-info{flex:1;min-width:0;}
  .ex-head .ex-head-info h3{margin:0 0 3px;}
  .ex-thumb{
    width:60px;height:60px;flex-shrink:0;border-radius:14px;
    background:#f4f4f4;border:1px solid var(--border);overflow:hidden;
  }
  .ex-thumb img{width:100%;height:100%;object-fit:contain;display:block;}
  .ex-attrib{font-size:10.5px;color:var(--text-dim);text-align:center;margin:6px 0 18px;font-weight:600;}
  .ex-attrib a{color:var(--text-dim);}
  .set-row{
    display:grid;grid-template-columns:22px 1fr 1fr 54px 30px;gap:6px;align-items:center;
    margin-bottom:8px;
  }
  .set-row span{font-size:13px;color:var(--text-dim);font-weight:700;}
  .set-row input[type=number], .set-row input[type=text]{
    width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:10px 9px;font-size:14.5px;font-weight:600;
  }
  .set-row input[type=number]:focus, .set-row input[type=text]:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  .set-row input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);}
  .set-row select{
    width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:9px 2px;font-size:12.5px;font-weight:700;text-align:center;
  }
  .set-row select:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  .rpe-legend{font-size:11px;color:var(--text-dim);font-weight:600;margin:2px 0 10px;line-height:1.5;}
  .note-user{
    width:100%;font-family:inherit;resize:vertical;min-height:46px;
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    border-radius:12px;padding:11px 13px;font-size:13px;font-weight:500;margin-top:10px;
  }
  .note-user:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  .note-user::placeholder{color:var(--text-dim);}
  .exercise-card.locked-ex{opacity:.55;}
  .lock-banner{
    display:flex;align-items:center;gap:8px;padding:14px;margin-top:4px;
    background:var(--panel-2);border-radius:12px;color:var(--text-dim);font-size:12.5px;font-weight:700;
  }
  .note-box{
    font-size:13px;color:var(--text-dim);background:var(--panel-2);
    border-radius:12px;padding:12px 14px;margin-top:10px;line-height:1.55;font-weight:500;
  }
  .toggle-guide{
    background:none;border:none;color:var(--accent);font-size:13px;
    padding:8px 0 0;cursor:pointer;font-weight:800;
  }
  .guide-body{display:none;margin-top:10px;font-size:13.5px;line-height:1.6;color:var(--text-dim);}
  .guide-body.open{display:block;}
  .guide-body b{color:var(--text);}
  .progress-tip{
    background:#39ff941a;border:1px solid #39ff9440;color:var(--accent);
    font-size:12.5px;font-weight:600;padding:10px 12px;border-radius:12px;
    margin-top:10px;line-height:1.5;
  }
  .oggi-panel{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow-card);padding:16px 18px;margin-bottom:14px;
  }
  .oggi-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:8px 0;font-size:13px;font-weight:700;border-bottom:1px solid var(--border);
  }
  .oggi-row:last-child{border-bottom:none;}
  .oggi-row span{color:var(--text-dim);}
  .oggi-row b{color:var(--text);font-size:14px;}
  .reminder-banner{
    background:#ff9d4d1a;border:1px solid #ff9d4d40;color:var(--accent-2);
    font-size:12.5px;font-weight:600;padding:12px 14px;border-radius:14px;
    margin-bottom:14px;line-height:1.5;
  }
  .rpe-row{margin-top:14px;}
  .rpe-label{font-size:12px;color:var(--text-dim);font-weight:700;margin:0 0 8px;line-height:1.4;}
  .rpe-chips .chip{padding:7px 14px;font-size:12.5px;}
  .warm-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:11px 0;border-bottom:1px solid var(--border);
  }
  .warm-item:last-child{border-bottom:none;}
  .warm-item .l{font-size:14.5px;font-weight:600;}
  .warm-item .r{font-size:12.5px;color:var(--text-dim);font-weight:600;}
  .timer-bar{
    position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border-top:1px solid var(--border);
    box-shadow:0 -10px 30px -10px rgba(0,0,0,.7);
    padding:14px 18px 16px;
    max-width:560px;margin:0 auto;
    overflow:hidden;
  }
  .timer-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .timer-adj{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    width:50px;height:50px;border-radius:50%;font-size:13px;font-weight:800;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:transform .12s ease;
  }
  .timer-adj:active{transform:scale(.9);}
  .timer-ring-wrap{position:relative;width:104px;height:104px;flex-shrink:0;}
  .timer-ring{width:100%;height:100%;transform:rotate(-90deg);}
  .timer-ring-bg{fill:none;stroke:#ffffff14;stroke-width:8;}
  .timer-ring-fill{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
  .timer-ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .timer-ring-center .lbl{font-size:11.5px;color:var(--text-dim);font-weight:700;margin-bottom:1px;}
  .timer-ring-center .t{
    font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.15;
    background:linear-gradient(90deg,var(--accent),#1fae63);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .timer-actions{display:flex;gap:10px;margin-top:12px;}
  .timer-actions .btn{flex:1;}
  .video-link{
    color:var(--accent);font-size:13px;font-weight:800;text-decoration:none;
    padding:8px 0 0;display:inline-flex;align-items:center;gap:4px;
  }
  .video-link:active{opacity:.7;}
  input, textarea{font-family:inherit;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;font-weight:700;letter-spacing:.1px;}
  .field input, .field textarea{
    width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    border-radius:12px;padding:12px 13px;font-size:14.5px;font-weight:500;
  }
  .field input:focus, .field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  .field-readonly{
    width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    border-radius:12px;padding:12px 13px;font-size:14.5px;font-weight:700;box-sizing:border-box;opacity:.85;
  }
  .field-hint{font-size:12px;color:var(--text-dim);margin:5px 2px 0;line-height:1.45;font-weight:500;}
  .obn-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
  .obn-row:last-of-type{border-bottom:none;}
  .obn-label{font-size:13px;font-weight:700;color:var(--text);flex:0 0 auto;}
  .obn-vals{display:flex;gap:16px;}
  .obn-val{display:flex;flex-direction:column;align-items:flex-end;font-size:14.5px;font-weight:800;color:var(--text);min-width:56px;}
  .obn-tag{font-size:10px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.3px;margin-bottom:1px;}
  .obn-tag-a{color:var(--accent);}
  .avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:280px;margin:0 auto;}
  .avatar-choice{
    aspect-ratio:1;border-radius:50%;background:var(--panel-2);border:1px solid var(--border);
    font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease;
  }
  .avatar-choice:active{transform:scale(.92);}
  .avatar-choice.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent), 0 0 16px -4px var(--accent);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .empty{text-align:center;color:var(--text-dim);font-size:13.5px;padding:34px 10px;font-weight:600;line-height:1.6;}
  .empty-icon{display:block;font-size:34px;margin-bottom:10px;opacity:.85;}
  .photo-thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;}
  .photo-slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .photo-slot{position:relative;aspect-ratio:3/4;border-radius:var(--radius-sm);overflow:hidden;background:var(--panel-2);border:1px solid var(--border);}
  .photo-slot input[type=file]{position:absolute;inset:0;opacity:0;pointer-events:none;}
  .photo-slot-empty{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    color:var(--text-dim);font-size:12.5px;font-weight:700;cursor:pointer;
    border:1.5px dashed var(--border);border-radius:var(--radius-sm);margin:2px;
  }
  .photo-slot-icon{font-size:22px;}
  .photo-slot-preview{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-slot-tag{
    position:absolute;left:6px;bottom:6px;background:#00000099;color:var(--text);
    font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;
  }
  .photo-slot-remove{
    position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:none;
    background:#00000099;color:var(--text);font-size:13px;font-weight:800;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .photo-grid-item{position:relative;aspect-ratio:3/4;border-radius:var(--radius-sm);overflow:hidden;cursor:pointer;background:var(--panel-2);}
  .photo-grid-item img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-grid-tag{
    position:absolute;left:6px;bottom:6px;background:#00000099;color:var(--text);
    font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;
  }
  .lightbox-overlay{padding:16px;}
  .lightbox-img{max-width:100%;max-height:100%;border-radius:14px;object-fit:contain;touch-action:pan-x;}
  .carousel{position:relative;overflow:hidden;border-radius:var(--radius-sm);aspect-ratio:3/4;background:var(--panel-2);}
  .carousel-track{display:flex;height:100%;width:100%;touch-action:pan-y;}
  .carousel-slide{position:relative;flex:0 0 100%;height:100%;cursor:pointer;}
  .carousel-slide img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
  .carousel-dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:6px;}
  .carousel-dots .dot{width:6px;height:6px;border-radius:50%;background:#ffffff55;transition:all .2s ease;}
  .carousel-dots .dot.active{background:#fff;width:16px;border-radius:4px;}
  canvas.chart-canvas{max-width:100%;}
  .chip-select{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{
    padding:9px 15px;border-radius:20px;background:var(--panel-2);color:var(--text-dim);
    font-size:12.5px;font-weight:700;cursor:pointer;border:1px solid var(--border);
  }
  .chip.active{background:var(--accent);color:#04140d;border-color:transparent;box-shadow:0 0 16px -5px #39ff9488;}

  /* ===== DIETA: checklist compatta dei pasti (sostituisce le vecchie card
     sempre-espanse) — vedi mealsHtml/apriSelettoreOpzione in JS ===== */
  .meal-row{
    display:flex;align-items:center;gap:10px;
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow-card);margin-bottom:10px;padding:8px 14px 8px 8px;
  }
  .meal-check{
    flex-shrink:0;width:26px;height:26px;border-radius:50%;
    border:1.5px solid var(--border);background:var(--panel-2);color:#04140d;
    font-size:13px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .15s ease,border-color .15s ease,transform .15s ease;
  }
  .meal-check.checked{background:var(--accent);border-color:var(--accent);box-shadow:0 0 12px -4px #39ff9488;}
  .meal-check:active{transform:scale(.9);}
  .meal-row-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;cursor:pointer;}
  .meal-row-icon{
    width:38px;height:38px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:17px;
    background:var(--panel-2);border:1.5px solid var(--accent);box-shadow:0 0 12px -5px #39ff94aa;
  }
  .meal-row-info{flex:1;min-width:0;}
  .meal-row-name{font-size:14px;font-weight:800;display:flex;align-items:baseline;gap:6px;}
  .meal-row-time{font-size:11px;color:var(--text-dim);font-weight:600;}
  .meal-row-opt{font-size:12px;color:var(--text-dim);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .meal-row-extra{font-size:11px;}
  .meal-row-kcal{font-size:13px;font-weight:900;color:var(--accent);white-space:nowrap;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;}
  .meal-row-kcal span{font-size:9.5px;color:var(--text-dim);font-weight:700;text-transform:uppercase;}
  .meal-row-chev{color:var(--text-dim);font-size:17px;flex-shrink:0;}
  .meal-row.done{opacity:.7;}
  .meal-row.done .meal-row-name{text-decoration:line-through;text-decoration-color:var(--text-dim);}

  /* ===== DIETA ===== */
  .diet-summary{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow-card);padding:20px;margin-bottom:16px;
  }
  .diet-summary .tlt{font-size:15px;font-weight:800;margin-bottom:2px;}
  .diet-summary .tsb{font-size:12px;color:var(--text-dim);font-weight:600;line-height:1.5;margin-bottom:16px;}
  .diet-kcal-hero{
    display:flex;align-items:baseline;gap:8px;justify-content:center;
    padding:14px 0 16px;margin-bottom:14px;border-bottom:1px solid var(--border);
  }
  .diet-kcal-hero .n{
    font-size:36px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;
    background:linear-gradient(90deg,var(--accent),#1fae63);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .diet-kcal-hero .u{font-size:14px;color:var(--text-dim);font-weight:700;}
  .macro-chip-row{display:flex;gap:10px;}
  .macro-chip{
    flex:1;text-align:center;padding:14px 8px;border-radius:16px;
    background:var(--panel-2);border:1px solid var(--border);
  }
  .macro-chip .mc-dot{width:9px;height:9px;border-radius:50%;margin:0 auto 8px;}
  .macro-chip .mc-n{font-size:16.5px;font-weight:900;color:var(--text);line-height:1;}
  .macro-chip .mc-l{font-size:10.5px;color:var(--text-dim);font-weight:700;margin-top:5px;text-transform:uppercase;letter-spacing:.3px;}
  .kcal-ring-wrap{position:relative;width:150px;height:150px;margin:6px auto 20px;}
  .kcal-ring{width:100%;height:100%;transform:rotate(-90deg);}
  .kr-bg{fill:none;stroke:#ffffff14;stroke-width:10;}
  .kr-fill{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .6s ease, stroke .3s ease;}
  .kr-center{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
  }
  .kr-n{font-size:27px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;transition:color .3s ease;}
  .kr-u{font-size:11px;color:var(--text-dim);font-weight:700;margin-top:6px;}
  .macro-bars{margin-top:4px;}
  .macro-bar-row{margin-bottom:14px;}
  .macro-bar-row:last-child{margin-bottom:0;}
  .mbr-top{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--text-dim);margin-bottom:7px;}
  .mbr-top span:first-child{color:var(--text);}
  .mbr-track{height:9px;border-radius:20px;background:#ffffff10;overflow:hidden;}
  .mbr-fill{height:100%;border-radius:20px;transition:width .6s ease;}
  .meal-card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow-card);margin-bottom:12px;overflow:hidden;
  }
  .meal-head{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;}
  .meal-head .icon{
    width:44px;height:44px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:20px;
    background:var(--panel-2);border:1.5px solid var(--accent);box-shadow:0 0 14px -5px #39ff94aa;
  }
  .meal-head .mh-info{flex:1;min-width:0;}
  .meal-head .mh-name{font-size:15px;font-weight:800;}
  .meal-head .mh-time{font-size:12px;color:var(--text-dim);font-weight:600;margin-top:1px;}
  .meal-head .mh-kcal{font-size:14.5px;font-weight:900;color:var(--accent);white-space:nowrap;}
  .meal-head .mh-chev{color:var(--text-dim);font-size:13px;margin-left:2px;transition:transform .25s ease;flex-shrink:0;}
  .meal-card.open .mh-chev{transform:rotate(180deg);}
  .meal-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
  .meal-card.open .meal-body{max-height:2000px;}
  .meal-body-in{padding:0 18px 18px;}
  .meal-macro-mini{display:flex;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
  .meal-macro-mini span{font-size:11.5px;font-weight:700;color:var(--text-dim);display:flex;align-items:center;gap:5px;}
  .meal-macro-mini span b{color:var(--text);font-weight:800;}
  .meal-macro-mini .mb-dot{width:8px;height:8px;border-radius:50%;}
  .food-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .food-table th{text-align:left;color:var(--text-dim);font-weight:700;font-size:11px;padding:0 6px 8px;text-transform:uppercase;letter-spacing:.3px;}
  .food-table td{padding:8px 6px;border-top:1px solid var(--border);color:var(--text);font-weight:600;}
  .food-table td.qty{color:var(--text-dim);font-weight:600;}
  .food-table th:not(:first-child),.food-table td:not(:first-child){text-align:right;}
  .meal-prep{font-size:12.5px;color:var(--text-dim);line-height:1.6;margin-top:12px;font-weight:600;}
  .meal-prep b{color:var(--text);}
  .meal-body-in .chip-select{margin-bottom:12px;}
  .meal-body-in .chip{padding:7px 13px;font-size:11.5px;}
  .diet-info-card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);
    box-shadow:var(--shadow-card);padding:16px 18px;margin-bottom:12px;
  }
  .diet-info-card .dic-t{font-size:13.5px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:7px;}
  .diet-info-card .dic-b{font-size:12.5px;color:var(--text-dim);line-height:1.65;font-weight:600;}
  .diet-info-card.warn{border-color:#ff547055;}
  .diet-info-card.warn .dic-t{color:var(--danger);}
  .supp-intro{font-size:12.5px;color:var(--text-dim);line-height:1.6;margin:2px 0 16px;font-weight:600;}
  .extra-food-group{margin-bottom:16px;}
  .extra-food-group:last-of-type{margin-bottom:2px;}
  .efg-head{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:12px;font-weight:800;color:var(--text-dim);text-transform:uppercase;letter-spacing:.3px;
    margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--border);
  }
  .efg-head span:last-child{color:var(--accent);font-weight:800;}
  .extra-food-list{margin-bottom:12px;}
  .extra-food-item{
    display:flex;align-items:center;gap:10px;padding:10px 0;
    border-bottom:1px solid var(--border);
  }
  .extra-food-list .extra-food-item:last-child{border-bottom:none;}
  .efi-info{flex:1;min-width:0;}
  .efi-n{font-size:13.5px;font-weight:700;color:var(--text);}
  .efi-brand{color:var(--text-dim);font-weight:600;}
  .efi-m{font-size:11.5px;color:var(--text-dim);font-weight:600;margin-top:3px;}
  .efi-remove{
    flex-shrink:0;width:28px;height:28px;border-radius:50%;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text-dim);font-size:13px;cursor:pointer;
  }
  .food-search-item{
    display:flex;align-items:center;gap:12px;padding:14px 16px;
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);
    margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow-card);
  }
  .food-search-item:active{transform:scale(.98);}
  .fsi-info{flex:1;min-width:0;}
  .fsi-n{font-size:14px;font-weight:700;color:var(--text);}
  .fsi-brand{font-size:11.5px;color:var(--text-dim);font-weight:600;margin-top:2px;}
  .fsi-kcal{font-size:12.5px;color:var(--accent);font-weight:800;white-space:nowrap;}
  .barcode-reader{
    width:100%;min-height:260px;border-radius:16px;overflow:hidden;background:#000;
  }
  .barcode-reader video{width:100%;display:block;border-radius:16px;}
  .barcode-reader img{display:none;}
  .tab-bar{
    display:flex;gap:6px;background:var(--panel-2);border:1px solid var(--border);
    padding:5px;border-radius:16px;margin-bottom:16px;
  }
  .tab-btn{
    flex:1;text-align:center;padding:10px 6px;border-radius:12px;
    font-size:12.5px;font-weight:800;color:var(--text-dim);cursor:pointer;
    transition:background .2s ease,color .2s ease;white-space:nowrap;
  }
  .tab-btn.active{background:var(--accent);color:#04140d;box-shadow:0 6px 16px -6px #39ff9466;}
  .confirm-overlay{
    position:fixed;inset:0;background:#00000099;backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:999;padding:24px;
    animation:confirmFadeIn .18s ease;
  }
  @keyframes confirmFadeIn{ from{opacity:0;} to{opacity:1;} }
  .confirm-box{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow-card);padding:22px;max-width:340px;width:100%;
    animation:confirmPopIn .18s ease;
  }
  @keyframes confirmPopIn{ from{transform:scale(.94);opacity:0;} to{transform:scale(1);opacity:1;} }
  .confirm-msg{font-size:14px;font-weight:600;color:var(--text);line-height:1.55;margin:0 0 20px;}
  .confirm-actions{display:flex;gap:10px;}
  .confirm-actions .btn{flex:1;}
  /* ===== Foglio a comparsa "scegli opzione" (selettore pasto in Dieta) ===== */
  .sheet-overlay{
    position:fixed;inset:0;background:#00000099;backdrop-filter:blur(3px);
    display:flex;align-items:flex-end;justify-content:center;z-index:999;
    animation:confirmFadeIn .18s ease;
  }
  .sheet-box{
    background:var(--panel);border:1px solid var(--border);border-bottom:none;
    border-radius:22px 22px 0 0;box-shadow:var(--shadow-card);
    width:100%;max-width:560px;max-height:86vh;overflow-y:auto;
    padding:8px 18px 26px;animation:sheetSlideUp .22s ease;
  }
  @keyframes sheetSlideUp{ from{transform:translateY(30px);opacity:.4;} to{transform:translateY(0);opacity:1;} }
  .sheet-handle{width:38px;height:4px;border-radius:3px;background:var(--border);margin:2px auto 14px;}
  .sheet-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px;}
  .sheet-title{font-size:16px;font-weight:900;}
  .sheet-close{
    flex-shrink:0;width:30px;height:30px;border-radius:50%;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text-dim);font-size:13px;cursor:pointer;
  }
  .opt-card-list{display:flex;flex-direction:column;gap:10px;}
  .opt-card{
    background:var(--panel-2);border:1.5px solid var(--border);border-radius:16px;
    padding:14px 16px;transition:border-color .15s ease;
  }
  .opt-card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
  .opt-card-top{display:flex;align-items:center;gap:12px;cursor:pointer;}
  .opt-card-main{flex:1;min-width:0;}
  .opt-card-title{font-size:14px;font-weight:800;line-height:1.4;}
  .opt-card-badge{
    display:inline-block;font-size:10px;font-weight:800;color:#04140d;background:var(--accent);
    border-radius:8px;padding:2px 7px;margin-left:4px;vertical-align:middle;text-transform:uppercase;
  }
  .opt-card-macros{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap;}
  .opt-card-macros span{font-size:11px;font-weight:700;color:var(--text-dim);display:flex;align-items:center;gap:4px;}
  .opt-card-macros span b{color:var(--text);font-weight:800;}
  .opt-card-kcal{font-size:15px;font-weight:900;color:var(--accent);white-space:nowrap;flex-shrink:0;text-align:right;line-height:1.15;}
  .opt-card-kcal span{display:block;font-size:9.5px;color:var(--text-dim);font-weight:700;text-transform:uppercase;}
  .spinner{
    width:32px;height:32px;border-radius:50%;margin:0 auto 14px;
    border:3px solid #ffffff1a;border-top-color:var(--accent);
    animation:spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading-block{text-align:center;padding:34px 10px;color:var(--text-dim);font-size:13px;font-weight:600;}
  .ptr-indicator{
    position:fixed;top:-50px;left:50%;margin-left:-19px;z-index:60;
    width:38px;height:38px;border-radius:50%;
    background:var(--panel);border:1px solid var(--border);box-shadow:var(--shadow-card);
    display:flex;align-items:center;justify-content:center;
  }
  .ptr-indicator .spinner{ margin:0;width:18px;height:18px;border-width:2.5px;animation:none; }
  .ptr-indicator.loading .spinner{ animation:spin .7s linear infinite; }
  .micro-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;}
  .micro-row{
    display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:600;
    color:var(--text-dim);padding:6px 0;border-bottom:1px solid var(--border);
  }
  .micro-row b{color:var(--text);font-weight:800;white-space:nowrap;}
  .spinner-inline{
    display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:middle;margin-right:7px;
    border:2px solid #ffffff22;border-top-color:var(--accent);
    animation:spin .7s linear infinite;
  }
  .done-tick{font-size:12px;vertical-align:middle;}
  .done-toggle{
    display:flex;align-items:center;gap:9px;margin-top:14px;padding-top:12px;
    border-top:1px solid var(--border);font-size:12.5px;color:var(--text-dim);font-weight:700;cursor:pointer;
  }
  .done-toggle input{width:19px;height:19px;accent-color:var(--accent);flex-shrink:0;}
  .water-row{display:flex;align-items:center;gap:10px;}
  .water-bar{flex:1;height:10px;border-radius:20px;background:#ffffff10;overflow:hidden;}
  .water-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,#2ac7ff,#5be0ff);transition:width .5s ease;}
  .water-val{font-size:13px;font-weight:800;color:var(--text);white-space:nowrap;}
  .water-btns{display:flex;gap:10px;margin-top:12px;}
  .water-btns .btn{flex:1;}
  .week-stat{
    display:flex;align-items:center;justify-content:space-between;
    padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;
  }
  .week-stat:last-child{border-bottom:none;}
  .week-stat span{color:var(--text-dim);}
  .week-stat b{color:var(--text);font-size:14px;}
  .success-banner{
    background:linear-gradient(135deg,var(--accent),#1fae63);color:#04140d;
    padding:22px;border-radius:var(--radius);text-align:center;font-weight:800;margin-bottom:16px;
    box-shadow:var(--shadow-btn);font-size:15px;
  }
  .error-banner{
    background:linear-gradient(135deg,var(--danger),#c92548);color:#fff;padding:13px 16px;border-radius:12px;
    font-size:13.5px;margin-bottom:12px;font-weight:700;
  }
  #loginScreen, #registerScreen, #onboardingScreen{
    max-width:380px;margin:10vh auto 0;padding:0 24px;text-align:center;
  }
  #loginScreen h1, #registerScreen h1, #onboardingScreen h1{font-size:26px;margin-bottom:8px;font-weight:900;letter-spacing:-.3px;}
  #loginScreen p, #registerScreen p, #onboardingScreen p{color:var(--text-dim);font-size:14px;margin-bottom:26px;font-weight:600;}
  #loginScreen .card, #registerScreen .card, #onboardingScreen .card{text-align:left;}
  .auth-switch{font-size:13px;color:var(--text-dim);font-weight:600;text-align:center;margin-top:18px;}
  .auth-switch span{color:var(--accent);font-weight:800;cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
  .spinner-wrap{display:flex;justify-content:center;padding:70px 0;color:var(--text-dim);font-size:14px;font-weight:600;}

  @media print{
    header, .timer-bar, .btn, .swipe-delete, .profile-link, .swipe-hint{ display:none !important; }
    body{ background:#fff; color:#000; }
    .card, .list-item, .exercise-card, .home-cat, .home-square{
      box-shadow:none !important; border:1px solid #ccc !important; background:#fff !important; color:#000 !important;
    }
    .list-item p, .ex-meta, .note-box, .note-user, .field-hint{ color:#333 !important; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }

  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>

<div id="loginScreen">
  <h1>🏋️ Beat Yourself</h1>
  <p>Accedi con il tuo profilo per vedere la scheda e i tuoi progressi.</p>
  <div class="card">
    <div id="loginError"></div>
    <div class="field"><label>Email</label><input type="email" id="loginUser" autocomplete="username"></div>
    <div class="field"><label>Password</label><input type="password" id="loginPass" autocomplete="current-password"></div>
    <button class="btn" id="loginBtn" onclick="doLogin()">Accedi</button>
  </div>
  <p class="auth-switch">Non sei registrato? <span onclick="mostraRegistrazione()">Registrati</span></p>
</div>

<div id="registerScreen" style="display:none;">
  <h1>🏋️ Beat Yourself</h1>
  <p>Crea il tuo profilo per iniziare ad allenarti.</p>
  <div class="card">
    <div id="registerError"></div>
    <div class="field"><label>Nome</label><input type="text" id="regNome" autocomplete="given-name"></div>
    <div class="field"><label>Cognome</label><input type="text" id="regCognome" autocomplete="family-name"></div>
    <div class="field"><label>Email</label><input type="email" id="regEmail" autocomplete="email"></div>
    <div class="field"><label>Età</label><input type="number" id="regEta" min="10" max="100"></div>
    <div class="field"><label>Password</label><input type="password" id="regPass" autocomplete="new-password" placeholder="Almeno 6 caratteri"></div>
    <button class="btn" id="registerBtn" onclick="registrati()">Crea profilo</button>
  </div>
  <p class="auth-switch">Hai già un account? <span onclick="mostraLogin()">Accedi</span></p>
</div>

/* Persistenza offline: le letture vengono servite dalla cache locale (IndexedDB)
   quando manca rete, e le scritture (es. segnare una serie o un pasto in palestra
   con poco segnale) vengono messe in coda e sincronizzate da sole appena torna
   la connessione, invece di fallire silenziosamente. synchronizeTabs:true evita
   l'errore "failed-precondition" se l'app è aperta in più schede/finestre. */
db.enablePersistence({ synchronizeTabs: true }).catch(err=>{
  if(err.code === 'failed-precondition'){
    console.warn('Persistenza offline non attivata (altre schede aperte in conflitto).');
  } else if(err.code === 'unimplemented'){
    console.warn('Persistenza offline non supportata da questo browser.');
  }
});

/* ============ NOTIFICHE PUSH (promemoria pasti/integratori/idratazione) ============
   Richiede una chiave VAPID generata nella console Firebase del progetto:
   Impostazioni progetto → Cloud Messaging → Certificati web push → Genera coppia
   di chiavi. Finché questa costante resta vuota, il pulsante "Attiva notifiche"
   in Profilo mostra un avviso invece di provare ad attivarle. */
const VAPID_KEY = '';

function messagingSupportata(){
  return !!(firebase.messaging && firebase.messaging.isSupported && firebase.messaging.isSupported() && 'Notification' in window);
}

async function attivaNotifichePush(){
  const stato = document.getElementById('notificheStato');
  if(!VAPID_KEY){
    if(stato) stato.innerHTML = `<div class="error-banner">Manca ancora la chiave VAPID nel codice (va generata nella console Firebase e incollata in VAPID_KEY). Finché non c'è, le notifiche non possono attivarsi.</div>`;
    return;
  }
  if(!messagingSupportata()){
    if(stato) stato.innerHTML = `<div class="error-banner">Il tuo browser non supporta le notifiche push, o l'app non è installata sulla schermata Home (richiesto su iPhone).</div>`;
    return;
  }
  try{
    const permesso = await Notification.requestPermission();
    if(permesso !== 'granted'){
      if(stato) stato.innerHTML = `<div class="error-banner">Permesso non concesso. Puoi riattivarlo dalle impostazioni di notifica del browser/telefono.</div>`;
      return;
    }
    const messaging = firebase.messaging();
    const token = await messaging.getToken({ vapidKey: VAPID_KEY });
    if(!token) throw new Error('Nessun token ottenuto');
    await db.collection('users').doc(currentUid).set({ fcmToken: token }, { merge:true });
    if(profiloUtente) profiloUtente.fcmToken = token;
    if(stato) stato.innerHTML = `<div class="success-banner" style="margin:0;padding:14px;">Notifiche attivate ✅</div>`;
  }catch(e){
    if(stato) stato.innerHTML = `<div class="error-banner">Non sono riuscito ad attivare le notifiche: ${e.message}</div>`;
  }
}

/* Le notifiche in primo piano (app aperta) non vengono mostrate in automatico
   dal sistema come quelle in background: le intercettiamo e le mostriamo noi. */

    firebase.messaging().onMessage(payload=>{
      const titolo = (payload.notification && payload.notification.title) || 'Beat Yourself';
      const corpo = (payload.notification && payload.notification.body) || '';
      if(Notification.permission==='granted') new Notification(titolo, { body: corpo, icon:'icon-192.png' });
    });
  }catch(e){}
}

/* Catalogo schede reale, caricato da Firestore (collection "schede").
   Al primissimo avvio in assoluto, se la collection è vuota, viene popolata
   con SCHEDE_DEFAULT: da quel momento in poi le schede vivono su Firestore,
   non più hardcoded qui, cosi' un trainer puo' modificarle/assegnarle per utente. */
let SCHEDE = [];

async function caricaCatalogoSchede(){
  try{
    const snap = await db.collection('schede').get();
    if(snap.empty){
      const batch = db.batch();
      SCHEDE_DEFAULT.forEach(s=>{
        const ref = db.collection('schede').doc(s.id);
        batch.set(ref, s);
      });
      await batch.commit();
      SCHEDE = SCHEDE_DEFAULT.slice();
    } else {
      SCHEDE = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    }
  }catch(e){
    // Se Firestore non è raggiungibile (es. offline in palestra) usa il catalogo di default in memoria
    SCHEDE = SCHEDE_DEFAULT.slice();
  }
}

/* Ritorna le schede assegnate al profilo corrente.
   profiloUtente.schedeAssegnate === null  → account storico (creato prima di
   questa funzionalità, es. Antonio): non ha mai avuto un'assegnazione
   esplicita, quindi per non rompergli l'esperienza vede tutto il catalogo.
   profiloUtente.schedeAssegnate === []    → profilo nuovo, nessuna scheda
   assegnata finché il trainer non gliene assegna una dal Pannello trainer. */
function schedeAssegnateUtente(){
  if(!profiloUtente) return SCHEDE;
  if(profiloUtente.schedeAssegnate === null) return SCHEDE;
  return SCHEDE.filter(s=>profiloUtente.schedeAssegnate.includes(s.id));
}

/* Obiettivi nutrizionali attivi: sempre quelli di DIETA_PIANO.target.riposo o
   .allenamento a seconda del parametro `allenamento`, più 2750ml di acqua.
   Non esiste più un override modificabile dall'utente in Profilo: la dieta
   la aggiorna il trainer direttamente nel piano (DIETA_PIANO), così i target
   restano sempre coerenti col tipo di giorno invece di restare bloccati su
   un valore fisso. */
function obiettiviAttivi(allenamento){
  const base = allenamento ? DIETA_PIANO.target.allenamento : DIETA_PIANO.target.riposo;
  return { kcal:base.kcal, prot:base.prot, carb:base.carb, grassi:base.grassi, acquaMl:2750 };
}

/* Proiezione di quando (con il trend recente) si raggiungerà un obiettivo corporeo
   (peso o vita). Regressione lineare semplice sui punti delle ultime 6 settimane
   (o sugli ultimi due disponibili se la storia è più corta). */
function calcolaProiezioneObiettivo(key, target){
  const punti = cache.misure
    .map(m=>({ t: new Date(m.data).getTime(), y: (m[key]!=null && m[key]!=='') ? Number(m[key]) : null }))
    .filter(p=>p.y!=null)
    .sort((a,b)=>a.t-b.t);
  if(punti.length<2) return { stato:'pochi-dati' };

  const ultimo = punti[punti.length-1];
  const finestra = punti.filter(p=> (ultimo.t-p.t) <= 42*86400000);
  const usati = finestra.length>=2 ? finestra : punti.slice(-2);
  const n = usati.length;
  const meanT = usati.reduce((s,p)=>s+p.t,0)/n;
  const meanY = usati.reduce((s,p)=>s+p.y,0)/n;
  let num=0, den=0;
  usati.forEach(p=>{ num += (p.t-meanT)*(p.y-meanY); den += (p.t-meanT)*(p.t-meanT); });
  const slopePerMs = den===0 ? 0 : num/den;
  const distanza = target - ultimo.y;

  if(Math.abs(distanza) < 0.05) return { stato:'raggiunto', valore: ultimo.y };
  if(slopePerMs===0 || (distanza>0) !== (slopePerMs>0)) return { stato:'trend-opposto', valore: ultimo.y };

  const giorniStimati = distanza / (slopePerMs*86400000);
  if(!isFinite(giorniStimati) || giorniStimati > 365*2) return { stato:'trend-lento', valore: ultimo.y };

  return { stato:'proiezione', valore: ultimo.y, dataStimata: new Date(ultimo.t + giorniStimati*86400000) };
}

function renderObiettivoCorpoStatCard(){
  const oc = profiloUtente && profiloUtente.obiettiviCorpo;
  if(!oc || (!oc.pesoTarget && !oc.vitaTarget)) return '';
  const righe = [];
  [['peso','Peso','kg',oc.pesoTarget], ['vita','Vita','cm',oc.vitaTarget]].forEach(([key,label,unit,target])=>{
    if(!target) return;
    const r = calcolaProiezioneObiettivo(key, target);
    let testo;
    if(r.stato==='pochi-dati') testo = 'Servono almeno due rilevazioni con questo valore per stimare un trend.';
    else if(r.stato==='raggiunto') testo = 'Obiettivo raggiunto 🎉';
    else if(r.stato==='trend-opposto') testo = "Il trend recente va nella direzione opposta all'obiettivo: aggiornalo se non è più valido, o dai tempo al piano di fare effetto.";
    else if(r.stato==='trend-lento') testo = 'Il trend recente è troppo lento o piatto per stimare una data ragionevole.';
    else testo = `Di questo passo: <b style="color:var(--text);">${r.dataStimata.toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'})}</b>`;
    const attuale = r.valore!=null ? Math.round(r.valore*10)/10 : '—';
    righe.push(`<div style="margin-bottom:14px;">
      <div style="font-size:13px;font-weight:700;margin-bottom:4px;">${label}: ${attuale}${unit} → obiettivo ${target}${unit}</div>
      <p class="field-hint" style="margin:0;">${testo}</p>
    </div>`);
  });
  if(!righe.length) return '';
  return `<div class="card"><h3 style="margin-top:0;font-size:15px;">🎯 Obiettivi corporei</h3>${righe.join('')}</div>`;
}

function schedaScaduta(s){
  const inizio = blocchiIniziati[s.id];
  if(!inizio || !s.durataSettimane) return false;
  const fine = new Date(inizio);
  fine.setDate(fine.getDate() + s.durataSettimane*7);
  return new Date() > fine;
}

/* Suggerimento di deload: non e' una prescrizione, solo un campanello
   d'allarme quando (a) il blocco va avanti da un po' di settimane e (b)
   nelle ultime due settimane l'RPE medio segnato e' rimasto alto — segno
   di fatica che si accumula piu' che di singole sedute dure isolate. */
function valutaDeload(scheda){
  const inizio = blocchiIniziati[scheda.id];
  if(!inizio) return null;
  const settimaneTrascorse = Math.floor((new Date() - new Date(inizio)) / (7*86400000));
  if(settimaneTrascorse < 5) return null;

  const dueSettimaneFa = new Date(); dueSettimaneFa.setDate(dueSettimaneFa.getDate()-14);
  const sessioniRecenti = cache.sessioni.filter(s=> s.schedaId===scheda.id && new Date(s.data) >= dueSettimaneFa);
  if(sessioniRecenti.length < 2) return null;

  const rpeValori = sessioniRecenti.flatMap(s=> (s.esercizi||[]).flatMap(e=> (e.sets||[]).map(x=>x.rpe))).filter(v=>v!=null && !isNaN(v));
  if(rpeValori.length < 4) return null;
  const rpeMedio = rpeValori.reduce((a,b)=>a+b,0)/rpeValori.length;

  if(rpeMedio >= 8.3 || settimaneTrascorse >= 8){
    return { settimaneTrascorse, rpeMedio: Math.round(rpeMedio*10)/10 };
  }
  return null;
}

function mapAuthError(e){
  const code = e.code || '';
  if(code.includes('invalid-credential') || code.includes('wrong-password') || code.includes('user-not-found')) return 'Email o password non corrette.';
  if(code.includes('too-many-requests')) return 'Troppi tentativi, riprova tra poco.';
  if(code.includes('invalid-email')) return 'Email non valida.';
  if(code.includes('email-already-in-use')) return 'Esiste già un account con questa email. Prova ad accedere invece di registrarti.';
  if(code.includes('weak-password')) return 'Password troppo debole: usa almeno 6 caratteri.';
  return 'Errore: ' + (e.message || code);
}

function todayKey(){
  const d = new Date();
  const pad = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

// Vero se c'è già una sessione di allenamento salvata con data di oggi: usato
// per il promemoria di timing nutrizionale (pasto post-workout) in Dieta.
function allenamentoFattoOggi(){
  const oggi = new Date().toDateString();
  return cache.sessioni.some(s=> new Date(s.data).toDateString()===oggi);
}

async function loadData(){
  const [sessioniSnap, misureSnap, dietaLogSnap, alimentiCustomSnap] = await Promise.all([
    userCollection('sessioni').orderBy('data','asc').get(),
    userCollection('misure').orderBy('data','asc').get(),
    userCollection('dietaLog').get().catch(()=>({docs:[]})),
    userCollection('alimentiPersonalizzati').get().catch(()=>({docs:[]}))
  ]);
  cache.sessioni = sessioniSnap.docs.map(d => ({ id:d.id, ...d.data() }));
  cache.misure = misureSnap.docs.map(d => ({ id:d.id, ...d.data() }));
  cache.alimentiPersonalizzati = alimentiCustomSnap.docs.map(d => ({ id:d.id, ...d.data() }));
  cache.dietaLog = dietaLogSnap.docs
    .map(d => ({ id:d.id, ...d.data() }))
    .sort((a,b)=> a.id.localeCompare(b.id));
  const oggi = cache.dietaLog.find(d=>d.id===todayKey());
  cache.dietaLogOggi = {
    pastiFatti: (oggi && oggi.pastiFatti) || {},
    acquaMl: (oggi && oggi.acquaMl) || 0,
    integratoriFatti: (oggi && oggi.integratoriFatti) || {},
    alimentiExtra: (oggi && oggi.alimentiExtra) || [],
    pastiSnapshot: (oggi && oggi.pastiSnapshot) || {},
    // pastiViaExtra: pasti segnati "fatti" perché è stato loggato un alimento
    // extra al posto dell'opzione del piano (vedi segnaPastoFattoDaExtra) —
    // servono a NON sommare anche le kcal dell'opzione del piano per quel
    // pasto, dato che l'alimento extra la sostituisce, non la integra.
    pastiViaExtra: (oggi && oggi.pastiViaExtra) || {},
    energia: (oggi && oggi.energia!=null) ? oggi.energia : null,
    dolori: (oggi && oggi.dolori!=null) ? oggi.dolori : null,
    // null = non ancora chiesto oggi ("Oggi ti alleni?" in Dieta); true/false una volta risposto.
    giornoAllenamento: (oggi && typeof oggi.giornoAllenamento === 'boolean') ? oggi.giornoAllenamento : null
  };
}

function salvaDietaLogOggi(){
  if(!currentUid) return;
  const key = todayKey();
  userCollection('dietaLog').doc(key).set(cache.dietaLogOggi, { merge:true }).catch(()=>{});
  const idx = cache.dietaLog.findIndex(d=>d.id===key);
  const entry = { id:key, ...cache.dietaLogOggi };
  if(idx>=0) cache.dietaLog[idx] = entry; else cache.dietaLog.push(entry);
}

function toggleMealDone(i){
  const nuovoStato = !cache.dietaLogOggi.pastiFatti[i];
  if(nuovoStato) hapticaLieve();
  cache.dietaLogOggi.pastiFatti[i] = nuovoStato;
  // Toccare la spunta a mano vuol sempre dire "ho seguito l'opzione del
  // piano": azzera un eventuale pastiViaExtra lasciato da un alimento extra
  // precedente, così le kcal dell'opzione tornano a contare normalmente.
  if(!cache.dietaLogOggi.pastiViaExtra) cache.dietaLogOggi.pastiViaExtra = {};
  delete cache.dietaLogOggi.pastiViaExtra[i];
  // Salviamo anche un'istantanea dell'opzione scelta in quel momento, così il
  // diario storico può mostrare cosa hai mangiato davvero quel giorno, non
  // solo "pasto segnato sì/no".
  if(!cache.dietaLogOggi.pastiSnapshot) cache.dietaLogOggi.pastiSnapshot = {};
  if(nuovoStato){
    const p = DIETA_PIANO.pasti[i];
    const opz = p.opzioni[dietaOpzioneSel[i] || 0];
    cache.dietaLogOggi.pastiSnapshot[i] = { titolo:opz.titolo, kcal:opz.kcal, prot:opz.prot, carb:opz.carb, grassi:opz.grassi };
  } else {
    delete cache.dietaLogOggi.pastiSnapshot[i];
  }
  salvaDietaLogOggi();
  renderAlimentazione();
}

function aggiungiAcqua(delta){
  cache.dietaLogOggi.acquaMl = Math.max(0, (cache.dietaLogOggi.acquaMl||0) + delta);
  salvaDietaLogOggi();
  renderAlimentazione();
}

function toggleIntegratoreFatto(nome){
  const nuovoStato = !cache.dietaLogOggi.integratoriFatti[nome];
  if(nuovoStato) hapticaLieve();
  cache.dietaLogOggi.integratoriFatti[nome] = nuovoStato;
  salvaDietaLogOggi();
  renderAlimentazione();
}

/* Alimenti "extra" di oggi: cercati per nome (Open Food Facts) e aggiunti con
   una grammatura scelta, si sommano ai macro/kcal acquisiti del giorno oltre
   ai pasti del piano fisso. */
function aggiungiAlimentoExtra(voce){
  if(!cache.dietaLogOggi.alimentiExtra) cache.dietaLogOggi.alimentiExtra = [];
  cache.dietaLogOggi.alimentiExtra.push(voce);
  salvaDietaLogOggi();
}

function rimuoviAlimentoExtra(id){
  const rimosso = (cache.dietaLogOggi.alimentiExtra||[]).find(a=>a.id===id);
  cache.dietaLogOggi.alimentiExtra = (cache.dietaLogOggi.alimentiExtra||[]).filter(a=>a.id!==id);

  // Se il pasto rimosso era quello che aveva fatto scattare l'auto-segna-fatto
  // (pastiViaExtra) e dopo la rimozione non resta più nessun alimento extra
  // agganciato a quel pasto, togliamo la spunta: altrimenti il pasto
  // resterebbe segnato come fatto senza che ci sia più nulla a giustificarlo.
  const pastoIdx = rimosso ? rimosso.pasto : null;
  if(pastoIdx!=null && pastoIdx>=0 && pastoIdx<DIETA_PIANO.pasti.length &&
     cache.dietaLogOggi.pastiViaExtra && cache.dietaLogOggi.pastiViaExtra[pastoIdx]){
    const restanoExtraSulPasto = cache.dietaLogOggi.alimentiExtra.some(a=>a.pasto===pastoIdx);
    if(!restanoExtraSulPasto){
      cache.dietaLogOggi.pastiFatti[pastoIdx] = false;
      delete cache.dietaLogOggi.pastiViaExtra[pastoIdx];
      if(cache.dietaLogOggi.pastiSnapshot) delete cache.dietaLogOggi.pastiSnapshot[pastoIdx];
    }
  }

  salvaDietaLogOggi();
  renderAlimentazione();
}

/* Modale di conferma coerente con il tema (sostituisce il confirm() nativo
   del browser, che stona con lo stile dell'app). variant:'danger' per azioni
   distruttive (bottone rosso), 'accent' per conferme neutre (bottone verde). */
/* Trascina l'elemento verso il basso per "buttarlo via": gesture più naturale
   su mobile del solo tocco fuori dalla finestra. Sotto una certa soglia torna
   elasticamente al suo posto invece di chiudersi, così uno scroll accidentale
   non chiude nulla per sbaglio. */
function attachSwipeDownToDismiss(dragEl, onDismiss){
  if(!dragEl) return;
  let startY = 0, dragging = false;
  dragEl.addEventListener('pointerdown', e=>{
    startY = e.clientY; dragging = true;
    dragEl.style.transition = 'none';
  });
  dragEl.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dy = e.clientY - startY;
    if(dy>0){
      dragEl.style.transform = `translateY(${dy}px)`;
      dragEl.style.opacity = String(Math.max(0.35, 1 - dy/300));
    }
  });
  const fine = e=>{
    if(!dragging) return;
    dragging = false;
    const dy = (e.clientY!=null ? e.clientY : startY) - startY;
    dragEl.style.transition = 'transform .2s ease, opacity .2s ease';
    if(dy > 80){ onDismiss(); }
    else { dragEl.style.transform = 'translateY(0)'; dragEl.style.opacity = '1'; }
  };
  dragEl.addEventListener('pointerup', fine);
  dragEl.addEventListener('pointercancel', fine);
}

function mostraConferma(messaggio, variant){
  variant = variant || 'danger';
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.innerHTML = `
      <div class="confirm-box">
        <p class="confirm-msg">${messaggio}</p>
        <div class="confirm-actions">
          <button class="btn secondary" id="confirmCancelBtn">Annulla</button>
          <button class="btn ${variant==='danger'?'danger':''}" id="confirmOkBtn">Conferma</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const chiudi = esito => { overlay.remove(); resolve(esito); };
    overlay.querySelector('#confirmCancelBtn').onclick = ()=>chiudi(false);
    overlay.querySelector('#confirmOkBtn').onclick = ()=>{ hapticaMedia(); chiudi(true); };
    overlay.addEventListener('click', e=>{ if(e.target===overlay) chiudi(false); });
    attachSwipeDownToDismiss(overlay.querySelector('.confirm-box'), ()=>chiudi(false));
  });
}

/* ============ TRANSIZIONE "APRI/CHIUDI" STILE IOS ============
   Quando si tocca una card (categoria, voce di lista) la schermata successiva
   si ingrandisce a partire dal punto toccato; tornando indietro, la schermata
   si rimpicciolisce verso quello stesso punto prima di mostrare quella precedente. */
let pendingOrigin = null;
let navOriginStack = [];

view.addEventListener('click', function(e){
  const cat = e.target.closest('.home-cat, .home-square');
  if(cat){
    e.preventDefault();
    e.stopPropagation();
    const r = cat.getBoundingClientRect();
    const origin = { x: r.left + r.width/2, y: r.top + r.height/2 };
    const onclickAttr = cat.getAttribute('onclick');
    cat.classList.add('tapped');
    setTimeout(()=>{
      cat.classList.remove('tapped');
      pendingOrigin = origin;
      setTimeout(()=>{ if(pendingOrigin === origin) pendingOrigin = null; }, 50);
      if(onclickAttr){ try{ new Function(onclickAttr)(); }catch(err){} }
    }, 190);
    return;
  }
  const card = e.target.closest('.list-item');
  if(card && !card.classList.contains('locked')){
    const r = card.getBoundingClientRect();
    const origin = { x: r.left + r.width/2, y: r.top + r.height/2 };
    pendingOrigin = origin;
    setTimeout(()=>{ if(pendingOrigin === origin) pendingOrigin = null; }, 50);
  }
}, true);

async function eseguiPullToRefresh(){
  if(!ptrEl) mostraPtrIndicator(70);
  ptrEl.style.top = '12px';
  ptrEl.classList.add('loading');
  hapticaLieve();
  try{
    await loadData();
    if(route.name==='home') renderHome();
  }catch(e){}
  rimuoviPtrIndicator();
}

view.addEventListener('pointerdown', e=>{
  if(route.name!=='home' || window.scrollY>0) return;
  ptrStartY = e.clientY; ptrDragging = true;
});
view.addEventListener('pointermove', e=>{
  if(!ptrDragging) return;
  if(window.scrollY>0){ ptrDragging=false; rimuoviPtrIndicator(); return; }
  const dy = e.clientY - ptrStartY;
  if(dy<=0){ rimuoviPtrIndicator(); return; }
  mostraPtrIndicator(Math.min(90, dy*0.5));
});
const ptrFine = e=>{
  if(!ptrDragging) return;
  ptrDragging = false;
  const dy = (e.clientY!=null ? e.clientY : ptrStartY) - ptrStartY;
  if(dy > 100) eseguiPullToRefresh();
  else rimuoviPtrIndicator();
};
view.addEventListener('pointerup', ptrFine);
view.addEventListener('pointercancel', ptrFine);

/* Micro-feedback coerente: lo stesso glow al tap delle card home
   si estende ai bottoni principali (senza toccare la logica di
   navigazione/animazione sopra: qui aggiungiamo solo una classe
   temporanea per l'effetto visivo, l'onclick del bottone parte normalmente). */
document.body.addEventListener('click', function(e){
  const b = e.target.closest('.btn');
  if(b){
    b.classList.add('tap-glow');

function setViewOrigin(origin){
  if(origin){
    const viewRect = view.getBoundingClientRect();
    view.style.transformOrigin = (origin.x - viewRect.left) + 'px ' + (origin.y - viewRect.top) + 'px';
  } else {
    view.style.transformOrigin = '50% 50%';
  }
}

function animateIn(origin){
  setViewOrigin(origin);
  view.classList.remove('view-anim-in','view-anim-out');
  void view.offsetWidth;
  view.classList.add('view-anim-in');
}

function animateOut(origin, callback){
  setViewOrigin(origin);
  view.classList.remove('view-anim-in','view-anim-out');
  void view.offsetWidth;
  view.classList.add('view-anim-out');
  setTimeout(callback, 230);
}

function setRoute(r){
  const isBack = BACK_MAP[route.name] === r.name;
  if(isBack){
    const origin = navOriginStack.pop() || null;
    animateOut(origin, ()=>{
      route = r;
      render();
      animateIn(null);
    });
  } else {
    const origin = pendingOrigin;
    pendingOrigin = null;
    navOriginStack.push(origin);
    route = r;
    render();
    animateIn(origin);
  }
}

function promemoriaCostanza(){
  const blocchiAttivi = schedeAssegnateUtente().filter(s=> blocchiIniziati[s.id] && !schedaScaduta(s));
  if(!blocchiAttivi.length) return '';
  let peggiore = null;
  blocchiAttivi.forEach(s=>{
    const sessioniScheda = cache.sessioni.filter(sess=>sess.schedaId===s.id);
    const ultima = sessioniScheda.length
      ? new Date(Math.max(...sessioniScheda.map(x=> new Date(x.data).getTime())))
      : new Date(blocchiIniziati[s.id]);
    const giorni = Math.floor((new Date() - ultima) / 86400000);
    const freqMatch = s.periodo && s.periodo.match(/(\d+)x\/settimana/);
    const freq = freqMatch ? Number(freqMatch[1]) : 3;
    const soglia = Math.max(4, Math.ceil((7/freq) * 1.8));
    if(giorni >= soglia && (!peggiore || giorni > peggiore.giorni)){
      peggiore = { nome: s.nome, giorni };
    }
  });
  if(!peggiore) return '';
  return `<div class="reminder-banner">⏰ Sono passati ${peggiore.giorni} giorni dal tuo ultimo allenamento (${peggiore.nome}). Quando puoi, rimettiti in moto 💪</div>`;
}

/* Pannello "oggi": i numeri chiave a colpo d'occhio in home, senza dover
   entrare in ogni sezione per saperli. */
/* Giorni consecutivi (a ritroso da oggi) in cui è stata registrata almeno
   un'attività nella dieta (pasto segnato, integratore preso, o acqua bevuta).
   Se oggi non hai ancora aperto l'app, non rompe lo streak: si parte da ieri. */
function calcolaStreakDieta(){
  const attivi = new Set(cache.dietaLog.filter(g=>{
    const pastiOk = Object.values(g.pastiFatti||{}).some(Boolean);
    const integrOk = Object.values(g.integratoriFatti||{}).some(Boolean);
    const acquaOk = (g.acquaMl||0) > 0;
    return pastiOk || integrOk || acquaOk;
  }).map(g=>g.id));
  if(!attivi.size) return 0;
  const pad = n=>String(n).padStart(2,'0');
  const chiave = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  let streak = 0;
  const cursor = new Date();
  if(!attivi.has(chiave(cursor))) cursor.setDate(cursor.getDate()-1);
  while(attivi.has(chiave(cursor))){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}

/* Settimane (lun-dom) consecutive e già concluse, a ritroso dalla scorsa,
   con almeno un allenamento registrato. */
function calcolaStreakSettimaneAllenamento(){
  if(!cache.sessioni.length) return 0;
  let streak = 0;
  const inizio = new Date();
  const giornoSett = (inizio.getDay()+6)%7; // 0=lunedì
  inizio.setDate(inizio.getDate()-giornoSett);
  inizio.setHours(0,0,0,0);
  inizio.setDate(inizio.getDate()-7); // la settimana corrente non è ancora conclusa, si parte dalla scorsa
  while(true){
    const fine = new Date(inizio); fine.setDate(fine.getDate()+7);
    const count = cache.sessioni.filter(s=>{ const d=new Date(s.data); return d>=inizio && d<fine; }).length;
    if(count>0){ streak++; inizio.setDate(inizio.getDate()-7); }
    else break;
  }
  return streak;
}

function renderOggiPanel(){
  if(!profiloUtente) return '';
  const pianoPersonale = profiloUtente.schedeAssegnate === null;

  const seiGiorniFa = new Date(); seiGiorniFa.setDate(seiGiorniFa.getDate()-6); seiGiorniFa.setHours(0,0,0,0);
  const sessioniSettimana = cache.sessioni.filter(s=> new Date(s.data) >= seiGiorniFa).length;

  let kcalRow = '', pastoRow = '';
  if(pianoPersonale){
    const t = obiettiviAttivi(!!cache.dietaLogOggi.giornoAllenamento);
    let kcalOggi = 0;
    DIETA_PIANO.pasti.forEach((p,i)=>{
      // Stesso criterio di renderAlimentazione: un pasto segnato "fatto" tramite
      // un alimento extra (pastiViaExtra) non aggiunge qui le kcal dell'opzione
      // del piano, altrimenti il residuo mostrato in Home sarebbe sbagliato.
      if(cache.dietaLogOggi.pastiFatti[i] && !(cache.dietaLogOggi.pastiViaExtra && cache.dietaLogOggi.pastiViaExtra[i])){
        kcalOggi += p.opzioni[dietaOpzioneSel[i] || 0].kcal;
      }
    });
    (cache.dietaLogOggi.alimentiExtra||[]).forEach(a=> kcalOggi += a.kcal);
    const residue = t.kcal - kcalOggi;
    kcalRow = `<div class="oggi-row"><span>🔥 Kcal ${residue>=0?'restanti':'oltre il target'} oggi</span><b>${Math.abs(residue)}</b></div>`;

    const idxProssimo = DIETA_PIANO.pasti.findIndex((p,i)=> !cache.dietaLogOggi.pastiFatti[i]);
    const prossimo = idxProssimo>=0 ? DIETA_PIANO.pasti[idxProssimo].nome : 'Tutto segnato ✅';
    pastoRow = `<div class="oggi-row"><span>🍽️ Prossimo da segnare</span><b>${prossimo}</b></div>`;
  }

  const streakDieta = pianoPersonale ? calcolaStreakDieta() : 0;
  const streakSettimane = calcolaStreakSettimaneAllenamento();
  let streakRow = '';
  if(streakSettimane>0) streakRow += `<div class="oggi-row"><span>🔥 Settimane di fila con allenamento</span><b>${streakSettimane}</b></div>`;
  if(streakDieta>1) streakRow += `<div class="oggi-row"><span>🔥 Giorni di fila con dieta tracciata</span><b>${streakDieta}</b></div>`;

  return `<div class="oggi-panel">
    <div class="oggi-row"><span>🏋️ Allenamenti questa settimana</span><b>${sessioniSettimana}</b></div>
    ${kcalRow}
    ${pastoRow}
    ${streakRow}
  </div>`;
}

function avviaSessione(schedaId){
  const scheda = SCHEDE.find(s=>s.id===schedaId);

    iniziata: new Date().toISOString(),
    warmDone: scheda.riscaldamento.map(()=>false),
    esercizi: scheda.esercizi.map(e=>({
      nome: e.nome,
      usaAlternativa: false,
      noteUtente: '',
      sets: Array.from({length:e.serieTarget}, ()=>({peso:'', rip:'', fatta:false, rpe:null}))

function toggleAlternativa(ei){
  const scheda = SCHEDE.find(s=>s.id===sessionDraft.schedaId);

  if(!e.alternativa || e.alternativa==='—') return;
  draft.usaAlternativa = !draft.usaAlternativa;
  draft.nome = draft.usaAlternativa ? e.alternativa : e.nome;

function esercizioCompletato(ei){
  const ex = sessionDraft.esercizi[ei];
  return !!ex && ex.sets.length>0 && ex.sets.every(s=>s.fatta && s.rpe!=null);
}

function refreshLocks(){
  const nuovi = sessionDraft.esercizi.map((_,i)=> i>0 && !esercizioCompletato(i-1));
  const precedenti = sessionDraft._locks || [];
  const cambiati = nuovi.length !== precedenti.length || nuovi.some((v,i)=>v!==precedenti[i]);
  sessionDraft._locks = nuovi;
  if(cambiati) renderSessione();
}

function updateNotaEsercizio(ei, val){

}

function setRPESet(ei, si, val){
  sessionDraft.esercizi[ei].sets[si].rpe = val ? Number(val) : null;

/* ============ SUGGERIMENTO PROGRESSIONE CARICO ============
   Se nelle ultime 2 sedute sono state completate tutte le ripetizioni/durata
   richieste, suggerisce di aumentare leggermente il carico (o la durata per
   esercizi a tempo come il plank). Solo un suggerimento: la decisione resta
   sempre dell'utente. */
function parseRipTarget(str){
  if(!str) return null;
  const isTime = str.includes('"');
  const nums = str.replace(/"/g,'').split('-').map(n=>parseInt(n)).filter(n=>!isNaN(n));
  if(!nums.length) return null;
  return { max: Math.max(...nums), isTime };
}

function suggerimentoProgressione(nomeEsercizio, ripTargetStr){
  const target = parseRipTarget(ripTargetStr);
  if(!target) return null;
  const ultime = cache.sessioni
    .slice().sort((a,b)=> new Date(b.data)-new Date(a.data))
    .map(s=> s.esercizi.find(e=>e.nome===nomeEsercizio))
    .filter(Boolean)
    .slice(0,2);
  if(ultime.length < 2) return null;

  const entrambeOk = ultime.every(es=>
    es.sets.length>0 && es.sets.every(set=>{
      const rip = parseInt(set.rip);
      return set.fatta && !isNaN(rip) && rip >= target.max;
    })
  );
  const entrambeFallite = ultime.every(es=>
    es.sets.length>0 && es.sets.some(set=>{
      const rip = parseInt(set.rip);
      return !set.fatta || isNaN(rip) || rip < target.max;
    })
  );

  if(entrambeOk){
    // Auto-regolazione: se hai completato le rip ma con RPE già molto alto,
    // meglio consolidare il carico un'altra seduta prima di alzarlo ancora.
    const tuttiRpe = ultime.flatMap(es=> es.sets.map(s=>s.rpe)).filter(v=>v!=null && !isNaN(v));
    const rpeMedio = tuttiRpe.length ? tuttiRpe.reduce((a,b)=>a+b,0)/tuttiRpe.length : null;
    if(rpeMedio!=null && rpeMedio>=9){
      return `Nelle ultime 2 sedute hai completato ${target.isTime?'tutta la durata richiesta':'tutte le ripetizioni richieste'}, ma con un RPE medio alto (${rpeMedio.toFixed(1)}/10): meglio mantenere questo carico un'altra seduta prima di aumentare.`;
    }
    return target.isTime
      ? 'Nelle ultime 2 sedute hai completato tutta la durata richiesta: prova ad aumentare di qualche secondo.'
      : 'Nelle ultime 2 sedute hai completato tutte le ripetizioni richieste: prova ad aumentare il peso di circa 2.5 kg.';
  }

  if(entrambeFallite){
    return target.isTime
      ? "Nelle ultime 2 sedute non hai completato la durata richiesta: valuta di scendere leggermente d'intensità o di recuperare un po' di più tra le serie."
      : 'Nelle ultime 2 sedute non hai completato le ripetizioni richieste: valuta di scendere leggermente di peso per tornare a muoverti con buona tecnica.';
  }

  return null;
}

  scheda.esercizi.forEach((e, ei)=>{
    const draft = sessionDraft.esercizi[ei];
    const locked = ei>0 && !esercizioCompletato(ei-1);

    if(locked){
      html += `<div class="exercise-card locked-ex">
        <div class="ex-head">
          ${e.immagine ? `<div class="ex-thumb"><img src="${e.immagine}" alt="${e.nome}" loading="lazy"></div>` : ''}
          <div class="ex-head-info">
            <h3>${e.nome}</h3>
            <div class="ex-meta" style="margin-bottom:0;">${e.serieTarget} x ${e.ripTarget} · recupero ${e.recupero}"</div>
          </div>
        </div>
        <div class="lock-banner">🔒 Completa tutte le serie (segnate e valutate con RPE) dell'esercizio precedente per sbloccarlo</div>
      </div>`;
      return;
    }

    const usaAlt = !!draft.usaAlternativa;
    const nomeAttivo = draft.nome || e.nome;
    const suggerimento = suggerimentoProgressione(nomeAttivo, e.ripTarget);
    html += `<div class="exercise-card">
      <div class="ex-head">
        ${(!usaAlt && e.immagine) ? `<div class="ex-thumb"><img src="${e.immagine}" alt="${e.nome}" loading="lazy"></div>` : ''}
        <div class="ex-head-info">
          <h3>${nomeAttivo}${usaAlt ? ' <span class="alt-tag">alternativa</span>' : ''}</h3>
          <div class="ex-meta" style="margin-bottom:0;">${e.serieTarget} x ${e.ripTarget} · recupero ${e.recupero}"</div>
        </div>
      </div>`;
    html += `<p class="rpe-legend">RPE per ogni serie: 6 = leggero · 8 = a 2 rip dal cedimento · 10 = cedimento totale</p>`;
    draft.sets.forEach((set,si)=>{
      html += `<div class="set-row">
        <span>${si+1}</span>
        <input type="number" min="0" max="500" placeholder="peso kg" value="${set.peso}" oninput="updateSet(${ei},${si},'peso',this.value)">
        <input type="text" placeholder="rip / sec" value="${set.rip}" oninput="updateSet(${ei},${si},'rip',this.value)">
        <select onchange="setRPESet(${ei},${si},this.value)">
          <option value="">RPE</option>
          ${[6,7,8,9,10].map(v=>`<option value="${v}" ${set.rpe===v?'selected':''}>${v}</option>`).join('')}
        </select>
        <input type="checkbox" ${set.fatta?'checked':''} onchange="markSetDone(${ei},${si},${e.recupero},this.checked,this)">
      </div>`;
    });
    html += `<div class="note-box">${usaAlt ? `Stai facendo l'alternativa al posto di <b>${e.nome}</b>. ${e.note}` : e.note}</div>`;
    if(e.alternativa && e.alternativa!=='—'){
      html += `<button class="btn small secondary" style="margin-top:10px;" onclick="toggleAlternativa(${ei})">${usaAlt ? '↺ Torna a '+e.nome : '🔁 Usa alternativa: '+e.alternativa}</button>`;
    }
    html += `<textarea class="note-user" placeholder="Le tue note su questo esercizio (sensazioni, dolori, aggiustamenti...)" oninput="updateNotaEsercizio(${ei}, this.value)">${draft.noteUtente||''}</textarea>`;
    if(suggerimento){
      html += `<div class="progress-tip">💡 ${suggerimento}</div>`;
    }
    if(!usaAlt){
      html += `<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:12px;">
          <button class="toggle-guide" onclick="toggleGuide(${ei})">Guida esercizio ▾</button>
          ${e.video ? `<a href="${e.video}" target="_blank" rel="noopener" class="video-link">▶ Guarda il video</a>` : ''}
        </div>
        <div class="guide-body" id="guide-${ei}">
          <b>Muscoli:</b> ${e.guida.muscoli}<br><br>
          <b>Esecuzione:</b> ${e.guida.esecuzione}<br><br>
          <b>Errori da evitare:</b> ${e.guida.errori}
        </div>`;
    }
    html += `</div>`;
  });

  html += `<div class="ex-attrib">Immagini illustrative degli esercizi: <a href="https://wger.de" target="_blank" rel="noopener">wger.de</a> (CC BY-SA)</div>`;
  html += `<button class="btn" id="finishBtn" onclick="terminaSessione()">Termina e salva allenamento</button>`;
  view.innerHTML = html;
}

function toggleGuide(ei){
