<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<title>Beat Yourself</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
<meta name="theme-color" content="#0b0d11">
<!-- Tag "Aggiungi a Home" per iOS: senza questi, il collegamento creato da
     Safari può aprirsi come una scheda normale invece che come app standalone
     — e una scheda normale è soggetta ai limiti di Safari sulla durata dei
     dati salvati (login incluso), motivo per cui l'accesso non veniva
     ricordato in modo affidabile. Con questi tag + manifest.json
     (display:standalone, già presente) l'icona in Home apre l'app come
     standalone vera, che mantiene il login tra un'apertura e l'altra. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Beat Yourself">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Bebas+Neue&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<style>
  :root{
    --bg:#08090c;
    --panel:#111319;
    --panel-2:#191c24;
    --border:#1c2029;
    --text:#f5f7fa;
    --text-dim:#949cb2;
    --accent:#39ff94;
    --accent-2:#ff9d4d;
    --accent-3:#8b6bff;
    --danger:#ff5470;
    --radius:22px;
    --radius-sm:18px;
    --shadow-card:0 4px 16px -10px rgba(0,0,0,.6);
    --shadow-btn:0 0 20px -4px #39ff9466;
    /* Font per i "numeri chiave" (kcal, timer di recupero, statistiche): un
       condensato tutto maiuscolo per i numeri più grandi (effetto "hero"),
       un mono per le cifre più piccole lette a colpo d'occhio (effetto
       "readout" stile scheda tecnica). Applicati solo a questi punti — il
       resto dell'app resta su Manrope, palette invariata. */
    --disp:'Bebas Neue', 'Manrope', sans-serif;
    --mono:'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
  }
  *{box-sizing:border-box;}
  /* Il viewport meta (maximum-scale/user-scalable=no) blocca lo zoom sulla
     maggior parte dei browser, ma Safari iOS lo ignora per accessibilità:
     touch-action qui blocca comunque il gesto di pinch-to-zoom. pan-y (non
     "pan-x pan-y") blocca anche lo scorrimento/trascinamento laterale
     dell'intera pagina: l'app deve muoversi solo su e giù, mai a destra o
     sinistra. overflow-x:hidden su html/body è una seconda rete di
     sicurezza nel caso qualche elemento sfori la larghezza per errore. */
  html{-webkit-tap-highlight-color:transparent;touch-action:pan-y;overflow-x:hidden;}
  body{
    margin:0;
    overflow-x:hidden;
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    /* Sfondo ambientale: due glow radiali molto tenui (verde in alto, viola
       più in basso a destra) sopra il fondo scuro piatto di prima, per dare
       profondità dietro header e contenuti senza spostare nessun colore di
       testo o bordo. Ancorati in alto: restano visibili all'apertura di ogni
       schermata (che parte sempre scrollata in cima). */
    background:
      radial-gradient(ellipse 820px 460px at 50% -10%, rgba(57,255,148,.10), transparent 60%),
      radial-gradient(ellipse 640px 420px at 100% 18%, rgba(139,107,255,.06), transparent 62%),
      var(--bg);
    color:var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:560px;margin:0 auto;padding:0 0 70px;min-height:100vh;}
  header{
    position:sticky;top:0;z-index:10;
    background:transparent;
    backdrop-filter:none;-webkit-backdrop-filter:none;
    border-bottom:1px solid transparent;
    padding:20px 18px 12px;
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
    transition:background-color .25s ease, border-color .25s ease, transform .3s ease;
    --section-accent:var(--accent);
  }
  header.scrolled{
    background:rgba(8,9,12,.97);
    border-bottom-color:var(--border);
  }
  /* Barra che si nasconde scorrendo verso il basso (più spazio per il
     contenuto mentre si legge) e ricompare scorrendo verso l'alto anche di
     poco (cosi' torna subito raggiungibile senza dover risalire tutto). */
  header.hidden-bar{ transform:translateY(-100%); }
  /* Barra sottile che cambia colore in base alla sezione (impostata via JS,
     vedi sectionAccentColor/render()): dà un orientamento immediato su dove
     ci si trova senza aggiungere altro testo o icone nell'header. */
  header::after{
    content:'';position:absolute;left:18px;right:18px;bottom:0;height:2px;border-radius:2px;
    background:var(--section-accent);opacity:.5;transition:background-color .3s ease;
  }
  .header-side{display:flex;align-items:center;gap:12px;}
  .header-side.right{justify-content:flex-end;}
  header h1{
    font-size:19px;margin:0;font-weight:800;letter-spacing:-.2px;
    text-align:center;white-space:nowrap;
    /* Un titolo lungo (es. "Blocco 2 — Giorno A (Upper)") con solo
       nowrap costringe la colonna "auto" del grid dell'header a sforare
       la larghezza disponibile: prima poteva scorrere lateralmente (mai
       notato), ma con lo scroll orizzontale ora disattivato quello
       sforo tagliava semplicemente il bottone profilo a destra. overflow
       hidden + ellipsis (e min-width:0, sotto) permettono alla colonna
       di restringersi troncando il titolo invece di sforare: header
       sempre centrato e simmetrico, niente più tagli. */
    overflow:hidden;text-overflow:ellipsis;min-width:0;
    background:linear-gradient(90deg,var(--text) 25%,var(--section-accent,var(--accent)) 110%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    transition:background .3s ease;
  }
  .back-btn{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    width:42px;height:42px;border-radius:50%;font-size:19px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .brand-mark{width:34px;height:34px;flex-shrink:0;display:block;}
  .back-btn:active{transform:scale(.92);}
  .avatar-btn{
    background:none;border:none;padding:0;cursor:pointer;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s ease;
  }
  .avatar-btn:active{transform:scale(.92);}
  main{padding:8px 18px 30px;transform-origin:50% 50%;}
  @keyframes viewGrowIn{
    from{ transform:scale(.4); opacity:0; }
    to{ transform:scale(1); opacity:1; }
  }
  @keyframes viewShrinkOut{
    from{ transform:scale(1); opacity:1; }
    to{ transform:scale(.4); opacity:0; }
  }
  .view-anim-in{ animation:viewGrowIn .32s cubic-bezier(.22,.9,.32,1); }
  .view-anim-out{ animation:viewShrinkOut .22s cubic-bezier(.4,0,.7,1) forwards; }
  .card{
    background:var(--panel);border:1px solid var(--border);
    box-shadow:var(--shadow-card);
    border-radius:var(--radius);padding:20px;margin-bottom:16px;
  }
  .home-cat{
    display:flex;align-items:center;gap:16px;position:relative;
    padding:18px 20px;margin-bottom:12px;border-radius:var(--radius);
    background:var(--panel);border:1px solid var(--border);
    box-shadow:var(--shadow-card);
    cursor:pointer;transition:transform .15s ease, box-shadow .22s ease, background .22s ease, border-color .22s ease;
  }
  .home-cat:active{transform:scale(.97);}
  .home-cat.tapped{
    transform:scale(.97);
    border-color:var(--accent);
    background:radial-gradient(circle at 50% 50%, #39ff9433 0%, var(--panel) 72%);
    box-shadow:0 0 0 1.5px var(--accent), 0 0 34px 6px #39ff9466, inset 0 0 26px -6px #39ff9455;
  }
  .home-cat .icon{
    width:52px;height:52px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:25px;
    background:var(--panel-2);border:1.5px solid var(--accent);
    box-shadow:0 0 16px -5px #39ff94aa;
  }
  /* Un colore diverso per Allenamento e Dieta (le due card più usate): dà
     un'identità visiva a colpo d'occhio già in Home, coerente con la barra
     sotto l'header (sectionAccentColor). Statistiche resta sul verde di
     base, che è anche il colore "neutro" di tutto il resto dell'app. */
  .home-cat.c-allenamento .icon{border-color:var(--accent-3);box-shadow:0 0 16px -5px #8b6bffaa;}
  .home-cat.c-allenamento.tapped{
    border-color:var(--accent-3);
    background:radial-gradient(circle at 50% 50%, #8b6bff33 0%, var(--panel) 72%);
    box-shadow:0 0 0 1.5px var(--accent-3), 0 0 34px 6px #8b6bff66, inset 0 0 26px -6px #8b6bff55;
  }
  .home-cat.c-dieta .icon{border-color:var(--accent-2);box-shadow:0 0 16px -5px #ff9d4daa;}
  .home-cat.c-dieta.tapped{
    border-color:var(--accent-2);
    background:radial-gradient(circle at 50% 50%, #ff9d4d33 0%, var(--panel) 72%);
    box-shadow:0 0 0 1.5px var(--accent-2), 0 0 34px 6px #ff9d4d66, inset 0 0 26px -6px #ff9d4d55;
  }
  .home-cat .label{font-size:17.5px;font-weight:800;letter-spacing:-.1px;}
  .home-cat .sub{font-size:13px;color:var(--text-dim);margin-top:3px;font-weight:600;}
  .profile-link{font-size:12.5px;color:var(--text-dim);font-weight:700;margin:0 0 16px;}
  .profile-link span{cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
  .diet-quicklinks{display:flex;gap:10px;margin:0 0 16px;}
  .diet-quicklinks .qlink{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    background:var(--panel-2);border:1px solid var(--border);border-radius:14px;
    padding:12px 4px;cursor:pointer;transition:transform .12s ease, background .12s ease;}
  .diet-quicklinks .qlink:active{transform:scale(.92);background:var(--panel);}
  .diet-quicklinks .qlink .qi{font-size:20px;}
  .diet-quicklinks .qlink .ql{font-size:10.5px;color:var(--text-dim);font-weight:700;text-align:center;line-height:1.2;}
  .app-credit{
    text-align:center;font-size:12px;color:var(--text-dim);font-weight:600;
    margin:26px 0 10px;letter-spacing:.2px;
  }
  .app-credit span{
    color:var(--accent);font-weight:800;
    text-shadow:0 0 12px #39ff9466;
  }
  .home-squares{display:flex;gap:12px;margin-bottom:12px;}
  .home-square{
    flex:1;padding:20px 10px;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);
    box-shadow:var(--shadow-card);cursor:pointer;transition:transform .15s ease, box-shadow .22s ease, background .22s ease, border-color .22s ease;
  }
  .home-square:active{transform:scale(.97);}
  .home-square.tapped{
    transform:scale(.97);
    border-color:var(--accent);
    background:radial-gradient(circle at 50% 50%, #39ff9433 0%, var(--panel) 72%);
    box-shadow:0 0 0 1.5px var(--accent), 0 0 30px 5px #39ff9466, inset 0 0 22px -6px #39ff9455;
  }
  .home-square .icon{
    width:46px;height:46px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:21px;
    background:var(--panel-2);border:1.5px solid var(--accent);
    box-shadow:0 0 14px -5px #39ff94aa;
  }
  .home-square .label{font-size:14px;font-weight:800;letter-spacing:-.1px;}
  .list-item{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);
    box-shadow:var(--shadow-card);
    padding:16px 18px;margin-bottom:10px;cursor:pointer;
    border-left:3px solid var(--accent);
  }
  .list-item:active{opacity:.8;}
  .list-item h3{margin:0 0 4px;font-size:16px;font-weight:700;}
  .list-item p{margin:0;font-size:12.5px;color:var(--text-dim);font-weight:600;}
  .list-item .scheda-desc{margin-top:8px;font-size:12.5px;line-height:1.55;color:var(--text-dim);font-weight:500;}
  .list-item .scheda-note{margin-top:8px;font-size:12.5px;line-height:1.55;color:var(--accent-2);font-weight:500;}
  .list-item.passato{border-left-color:var(--text-dim);opacity:.65;}
  .list-item.locked{border-left-color:var(--text-dim);opacity:.5;cursor:default;}
  .list-item.locked.anteprima{opacity:.9;cursor:pointer;}
  .anteprima-ex{padding:9px 0;border-top:1px solid var(--border,rgba(255,255,255,.08));}
  .anteprima-ex:first-of-type{border-top:0;}
  .anteprima-ex b{display:block;font-size:14px;}
  .anteprima-ex .am{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .anteprima-ex .an{font-size:12px;margin-top:4px;line-height:1.5;}
  .list-item.turno{border-left-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow-card);}
  .turn-badge{
    display:inline-block;font-size:11px;font-weight:800;letter-spacing:.3px;
    background:linear-gradient(90deg,var(--accent),#1fae63);color:#04140d;padding:3px 9px;border-radius:20px;
    margin-bottom:8px;box-shadow:0 0 12px -3px #39ff94aa;
  }
  .scheda-toggle{
    display:inline-flex;align-items:center;gap:4px;margin-top:9px;padding:0;border:none;background:none;
    color:var(--accent);font-size:12px;font-weight:800;cursor:pointer;letter-spacing:.1px;
  }
  .scheda-toggle:active{opacity:.7;}
  .blocco-progress{margin:2px 2px 10px;}
  .blocco-progress .bp-label{margin:0 0 5px;font-size:12px;color:var(--text-dim);font-weight:700;}
  .blocco-progress .bp-bar{height:6px;border-radius:4px;background:var(--panel-2);border:1px solid var(--border);overflow:hidden;}
  .blocco-progress .bp-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-3));border-radius:4px;transition:width .35s ease;box-shadow:0 0 10px -1px #39ff9488;}
  .cardio-card{
    position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--border);
    border-radius:var(--radius-sm);box-shadow:var(--shadow-card);padding:16px 18px;margin-bottom:10px;
  }
  .cardio-card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,#39d6ff,var(--accent-3));
  }
  .cardio-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .cardio-icon{
    font-size:22px;width:42px;height:42px;border-radius:50%;flex-shrink:0;
    background:var(--panel-2);border:1.5px solid #39d6ff55;
    display:flex;align-items:center;justify-content:center;
  }
  .cardio-head h3{margin:0 0 2px;font-size:15.5px;font-weight:800;}
  .cardio-freq{font-size:11.5px;font-weight:800;color:#39d6ff;letter-spacing:.2px;}
  .cardio-toggle{
    display:inline-flex;align-items:center;gap:4px;margin:0 0 2px;padding:0;border:none;background:none;
    color:#39d6ff;font-size:12px;font-weight:800;cursor:pointer;letter-spacing:.1px;
  }
  .cardio-toggle:active{opacity:.7;}
  .cardio-rows{display:flex;flex-direction:column;gap:9px;margin:12px 0 10px;}
  .cardio-row{font-size:12.5px;line-height:1.5;}
  .cardio-row b{display:block;color:var(--text);font-weight:800;margin-bottom:2px;}
  .cardio-row span{color:var(--text-dim);font-weight:500;}
  .cardio-nota{margin:0;font-size:12px;line-height:1.5;color:var(--text-dim);font-weight:500;padding-top:10px;border-top:1px solid var(--border);}
  .cardio-session-card{text-align:center;padding:26px 20px;}
  .cardio-session-tipo{margin:0 0 6px;font-size:14px;font-weight:800;color:#39d6ff;}
  .cardio-timer-display{
    font-size:52px;font-weight:800;letter-spacing:.5px;margin:6px 0 18px;font-variant-numeric:tabular-nums;
    background:linear-gradient(90deg,#39d6ff,var(--accent-3));-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .cardio-target-bar{height:8px;border-radius:5px;background:var(--panel-2);border:1px solid var(--border);overflow:hidden;margin-bottom:8px;}
  .cardio-target-fill{height:100%;background:linear-gradient(90deg,#39d6ff,var(--accent-3));border-radius:5px;transition:width .35s ease;box-shadow:0 0 10px -1px #39d6ff88;}
  .cardio-target-label{margin:0 0 14px;font-size:12px;color:var(--text-dim);font-weight:700;}
  .cardio-kcal-live{margin:0;font-size:22px;font-weight:800;color:var(--text);}
  .cardio-kcal-live span{color:var(--accent-2);}
  .section-label{
    font-size:12px;text-transform:uppercase;letter-spacing:.6px;
    color:var(--text-dim);font-weight:800;margin:20px 2px 10px;
  }
  .swipe-hint{font-size:12.5px;color:var(--text-dim);text-align:center;margin:0 0 12px;font-weight:600;}
  .swipe-row{position:relative;border-radius:var(--radius-sm);margin-bottom:10px;overflow:hidden;}
  .swipe-row .list-item{margin-bottom:0;position:relative;z-index:1;touch-action:pan-y;will-change:transform;}
  .swipe-delete{
    position:absolute;top:0;right:0;bottom:0;width:84px;z-index:0;
    background:linear-gradient(135deg,var(--danger),#c92548);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;
  }
  .pill{
    display:inline-block;font-size:11.5px;font-weight:800;padding:4px 11px;border-radius:20px;
    background:#39ff9422;
    color:var(--accent);margin-right:6px;letter-spacing:.2px;
    border:1px solid #39ff9440;
  }
  .btn{
    background:linear-gradient(135deg,var(--accent),#1fae63);color:#04140d;border:none;border-radius:18px;
    padding:15px 18px;font-size:15px;font-weight:800;cursor:pointer;width:100%;
    box-shadow:var(--shadow-btn);transition:transform .1s ease;
  }
  .btn:active{transform:scale(.98);}
  .btn.secondary{background:var(--panel-2);color:var(--text);box-shadow:none;border:1px solid var(--border);}
  .btn.small{width:auto;padding:9px 16px;font-size:13.5px;}
  .btn.tap-glow{animation:btnGlow .26s ease;}
  @keyframes btnGlow{
    0%{box-shadow:0 0 0 2px var(--accent), 0 0 26px 6px #39ff9466;}
    100%{box-shadow:var(--shadow-btn);}
  }
  .btn.secondary.tap-glow{animation:btnGlowSecondary .26s ease;}
  @keyframes btnGlowSecondary{
    0%{box-shadow:0 0 0 2px var(--accent), 0 0 20px 5px #39ff9440;}
    100%{box-shadow:none;}
  }
  .btn.danger.tap-glow{animation:btnGlowDanger .26s ease;}
  @keyframes btnGlowDanger{
    0%{box-shadow:0 0 0 2px var(--danger), 0 0 26px 6px #ff547066;}
    100%{box-shadow:0 10px 24px -8px #ff547055;}
  }
  .alt-tag{
    display:inline-block;font-size:10px;font-weight:800;color:var(--accent-2);
    background:#ff9d4d22;padding:3px 8px;border-radius:20px;vertical-align:middle;
    text-transform:uppercase;letter-spacing:.3px;margin-left:4px;
  }
  .btn.danger{background:linear-gradient(135deg,var(--danger),#c92548);color:#fff;box-shadow:0 10px 24px -8px #ff547055;}
  .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
  .exercise-card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow-card);
    padding:18px;margin-bottom:14px;position:relative;overflow:hidden;
  }
  .exercise-card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent-3));
  }
  .exercise-card.locked-ex::before{background:var(--text-dim);opacity:.4;}
  .exercise-card h3{margin:0 0 3px;font-size:16.5px;font-weight:800;}
  .ex-meta{font-size:12.5px;color:var(--text-dim);margin-bottom:12px;font-weight:700;}
  .ex-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .ex-head .ex-head-info{flex:1;min-width:0;}
  .ex-head .ex-head-info h3{margin:0 0 3px;}
  .ex-thumb{
    width:60px;height:60px;flex-shrink:0;border-radius:14px;
    background:#f4f4f4;border:1px solid var(--border);overflow:hidden;
  }
  .ex-thumb img{width:100%;height:100%;object-fit:contain;display:block;}
  .ex-attrib{font-size:10.5px;color:var(--text-dim);text-align:center;margin:6px 0 18px;font-weight:600;}

  .finish-bar-progress .bp-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-3));border-radius:4px;transition:width .35s ease;box-shadow:0 0 10px -1px #39ff9488;}

  .carico-partenza{font-size:13px;color:var(--text-dim);margin:2px 0 10px;font-weight:600;}

  .scheda-btn{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:12px;

  .skip-ex-link{

  .superset-group{

  .timer-bar{
    position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border-top:1px solid var(--border);
    box-shadow:0 -10px 30px -10px rgba(0,0,0,.7);
    padding:14px 18px 16px;

  }

  input, textarea{font-family:inherit;}

  .photo-thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;flex-shrink:0;}

  .misura-thumb-placeholder{
    width:56px;height:56px;border-radius:12px;flex-shrink:0;
