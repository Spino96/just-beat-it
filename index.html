}

function updateSet(ei,si,field,val){
  sessionDraft.esercizi[ei].sets[si][field] = val;
}

function markSetDone(ei,si,recupero,checked,el){
  const set = sessionDraft.esercizi[ei].sets[si];
  if(checked && set.peso!==''){
    const pesoNum = parseFloat(set.peso);
    if(isNaN(pesoNum) || pesoNum<0 || pesoNum>500){
      alert('Il peso inserito non sembra plausibile (0–500 kg). Controlla il valore prima di segnare la serie.');
      if(el) el.checked = false;
      return;
    }
  }
  set.fatta = checked;
  if(checked){ hapticaLieve(); startRestTimer(recupero); }
  refreshLocks();
}

let restState = null;

const REST_RING_CIRC = 2 * Math.PI * 52;

function startRestTimer(seconds){
  clearRestTimer();
  restState = { remaining: seconds, total: seconds, paused: false };
  const bar = document.createElement('div');
  bar.className = 'timer-bar';
  bar.id = 'restBar';
  bar.innerHTML = `
    <div class="timer-row">
      <button class="timer-adj" onclick="adjustRest(-15)">−15"</button>
      <div class="timer-ring-wrap">
        <svg class="timer-ring" viewBox="0 0 120 120">
          <circle class="timer-ring-bg" cx="60" cy="60" r="52"></circle>
          <circle class="timer-ring-fill" id="restRingFill" cx="60" cy="60" r="52"
            stroke-dasharray="${REST_RING_CIRC}" stroke-dashoffset="0"></circle>
        </svg>
        <div class="timer-ring-center">
          <div class="lbl">Recupero</div>
          <div class="t" id="restT">${seconds}"</div>
        </div>
      </div>
      <button class="timer-adj" onclick="adjustRest(15)">+15"</button>
    </div>
    <div class="timer-actions">
      <button class="btn small secondary" id="restPauseBtn" onclick="togglePauseRest()">⏸ Pausa</button>
      <button class="btn small secondary" onclick="clearRestTimer()">Salta</button>
    </div>`;
  document.body.appendChild(bar);
  updateRestDisplay();
  restTimerHandle = setInterval(()=>{
    if(!restState || restState.paused) return;
    restState.remaining--;
    if(restState.remaining<=0){
      updateRestDisplay();
      const t = document.getElementById('restT');
      if(t) t.textContent = "Via! 💪";
      timerFinishedFeedback();
      clearInterval(restTimerHandle);
      setTimeout(clearRestTimer, 2000);
      return;
    }
    updateRestDisplay();
  },1000);
}

function updateRestDisplay(){
  if(!restState) return;
  const t = document.getElementById('restT');
  const ring = document.getElementById('restRingFill');
  if(t) t.textContent = restState.remaining>0 ? restState.remaining+'"' : 'Via! 💪';
  if(ring){
    const pct = restState.total>0 ? Math.max(0, Math.min(1, restState.remaining/restState.total)) : 0;
    ring.style.strokeDashoffset = String(REST_RING_CIRC * (1 - pct));
  }
}

function timerFinishedFeedback(){
  beep();
  if(navigator.vibrate){
    try{ navigator.vibrate([200,100,200,100,300]); }catch(e){}
  }
  if(window.Notification && Notification.permission === 'granted'){
    try{ new Notification('Recupero terminato 💪', { body:'Riparti con la prossima serie.' }); }catch(e){}
  }
}

/* Feedback aptico breve per micro-azioni (segnare una serie/pasto, superare
   la soglia di uno swipe-to-delete...) e uno leggermente più marcato per le
   conferme. Nessun effetto su dispositivi/browser senza vibrazione (es. iOS
   Safari, che non la supporta): la chiamata fallisce silenziosamente. */
function hapticaLieve(){
  if(navigator.vibrate){ try{ navigator.vibrate(12); }catch(e){} }
}
function hapticaMedia(){
  if(navigator.vibrate){ try{ navigator.vibrate(25); }catch(e){} }
}

function richiediPermessoNotifiche(){
  if(window.Notification && Notification.permission === 'default'){
    Notification.requestPermission().catch(()=>{});
  }
}

function adjustRest(delta){
  if(!restState) return;
  restState.remaining = Math.max(0, restState.remaining + delta);
  if(restState.remaining > restState.total) restState.total = restState.remaining;
  updateRestDisplay();
}

function togglePauseRest(){
  if(!restState) return;
  restState.paused = !restState.paused;
  const btn = document.getElementById('restPauseBtn');
  if(btn) btn.textContent = restState.paused ? '▶ Riprendi' : '⏸ Pausa';
}

function clearRestTimer(){
  if(restTimerHandle){ clearInterval(restTimerHandle); restTimerHandle=null; }
  restState = null;
  const bar = document.getElementById('restBar');
  if(bar) bar.remove();
}

function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880;
    g.gain.value = 0.15;
    o.start();
    setTimeout(()=>{o.stop(); ctx.close();}, 350);
  }catch(e){}
}

async function terminaSessione(){
  if(!(await mostraConferma('Salvare questo allenamento in Progressi?', 'accent'))) return;
  const btn = document.getElementById('finishBtn');
  btn.disabled = true; btn.textContent = 'Salvataggio...';
  try{
    const payload = {
      schedaId: sessionDraft.schedaId,
      schedaNome: sessionDraft.schedaNome,
      data: new Date().toISOString(),
      esercizi: sessionDraft.esercizi
    };
    const ref = await userCollection('sessioni').add(payload);
    cache.sessioni.push({ id: ref.id, ...payload });
    sessionDraft = null;
    setRoute({name:'storico-allenamento', justSaved:true});
  }catch(e){
    alert('Errore nel salvataggio: '+e.message);
    btn.disabled = false; btn.textContent = 'Termina e salva allenamento';
  }
}

/* ============ SWIPE PER ELIMINARE (scorrimento verso sinistra) ============ */
function attachSwipeHandlers(container, deleteFn){
  const MAX = 84;
  container.querySelectorAll('.swipe-row').forEach(row=>{
    const card = row.querySelector('.list-item');
    const delBtn = row.querySelector('.swipe-delete');
    if(!card || !delBtn) return;
    row.dataset.x = '0';
    let startX=0, startY=0, baseX=0, dragging=false, swiped=false, axis=null;

    card.addEventListener('pointerdown', e=>{
      startX = e.clientX; startY = e.clientY;
      baseX = parseFloat(row.dataset.x || '0');
      dragging = true; axis = null; swiped = false;
      card.style.transition = 'none';
    });
    card.addEventListener('pointermove', e=>{
      if(!dragging) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if(axis===null){
        if(Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      }
      if(axis!=='x') return;
      const x = Math.max(-MAX, Math.min(0, baseX + dx));
      card.style.transform = `translateX(${x}px)`;
      row.dataset.x = String(x);
      if(Math.abs(dx) > 8) swiped = true;
    });
    function endDrag(){
      if(!dragging) return;
      dragging = false;
      card.style.transition = 'transform .2s ease';
      const x = parseFloat(row.dataset.x || '0');
      if(x < -MAX/2){
        card.style.transform = `translateX(-${MAX}px)`; row.dataset.x = String(-MAX);
      } else {
        card.style.transform = 'translateX(0)'; row.dataset.x = '0';
      }
    }
    card.addEventListener('pointerup', endDrag);
    card.addEventListener('pointercancel', endDrag);
    card.addEventListener('click', e=>{
      if(swiped){ e.preventDefault(); e.stopImmediatePropagation(); swiped=false; return; }
      const name = card.dataset.routeName;
      if(name){ const id = card.dataset.routeId; setRoute(id ? {name, id} : {name}); }
    });
    delBtn.addEventListener('click', ()=> deleteFn(row.dataset.id));
  });
}

function csvEscape(v){
  if(v===null || v===undefined) return '';
  const s = String(v).replace(/"/g,'""');
  return /[",\n]/.test(s) ? `"${s}"` : s;
}

function esportaCSV(){
  const righe = [];
  righe.push('=== ALLENAMENTI ===');
  righe.push(['Data','Scheda','Esercizio','Serie','Peso (kg)','Rip','Completata','RPE','Note'].join(','));
  cache.sessioni.slice().sort((a,b)=> new Date(a.data)-new Date(b.data)).forEach(s=>{
    const data = new Date(s.data).toLocaleDateString('it-IT');
    s.esercizi.forEach(e=>{
      e.sets.forEach((set,i)=>{
        const rpeVal = set.rpe!=null ? set.rpe : (e.rpe||'');
        righe.push([data, csvEscape(s.schedaNome), csvEscape(e.nome), i+1, set.peso||'', csvEscape(set.rip||''), set.fatta?'si':'no', rpeVal, csvEscape(e.noteUtente||'')].join(','));
      });
    });
  });
  righe.push('');
  righe.push('=== MISURE ===');
  righe.push(['Data','Peso','Vita','Petto','Fianchi','Collo','Braccio Dx','Braccio Sx','Coscia Dx','Coscia Sx','% Massa grassa stimata'].join(','));
  cache.misure.slice().sort((a,b)=> new Date(a.data)-new Date(b.data)).forEach(m=>{
    const bf = stimaMassaGrassa(m);
    righe.push([new Date(m.data).toLocaleDateString('it-IT'), m.peso||'', m.vita||'', m.petto||'', m.fianchi||'', m.collo||'', m.braccioDx||'', m.braccioSx||'', m.cosciaDx||'', m.cosciaSx||'', bf!=null?bf.toFixed(1):''].join(','));
  });
  const csv = '﻿' + righe.join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `beat-yourself-dati-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* ============ STATISTICHE ============ */
const METRICHE_ESERCIZIO = [
  {key:'pesoMax', label:'Peso max'},
  {key:'volume', label:'Volume totale'},
  {key:'rm', label:'1RM stimato'},
  {key:'rpeMedio', label:'RPE medio'}
];

/* Classificazione per gruppo muscolare basata sul nome dell'esercizio (non c'e'
   un campo dedicato nel catalogo schede). L'ordine conta: i pattern piu'
   specifici vanno controllati prima di quelli generici (es. "Leg Curl" deve
   finire in Gambe, non in Braccia solo perche' contiene "curl"). */
const GRUPPI_MUSCOLARI_PATTERN = [
  {gruppo:'Glutei', re:/hip thrust|glute/i},
  {gruppo:'Core', re:/plank|addom|crunch|\bcore\b/i},
  {gruppo:'Gambe', re:/leg press|leg curl|leg extension|squat|affond|quadricap|polpacc|calf|gamba/i},
  {gruppo:'Petto', re:/chest|petto|panca|croci/i},
  {gruppo:'Dorso', re:/lat machine|pulldown|rematore|\brow\b|trazioni|dorso|schiena/i},
  {gruppo:'Spalle', re:/spalla|shoulder|military|alzate|arnold/i},
  {gruppo:'Braccia', re:/curl|bicip|tricip|push.?down|french|braccio/i}
];
function gruppoMuscolareEsercizio(nome){
  const match = GRUPPI_MUSCOLARI_PATTERN.find(p=>p.re.test(nome||''));
  return match ? match.gruppo : 'Altro';
}

/* Serie completate per gruppo muscolare negli ultimi `giorni` giorni: metrica
   di volume piu' robusta della tonnellata (peso x rip), perche' funziona
   anche per esercizi a corpo libero o a tempo (es. Plank) dove non c'e' un
   peso numerico. 10-20 serie/settimana per gruppo e' un range spesso citato
   come riferimento generale per l'ipertrofia, non una prescrizione personale. */
function volumeSettimanalePerGruppo(giorni){
  giorni = giorni || 7;
  const daData = new Date(); daData.setDate(daData.getDate()-giorni+1); daData.setHours(0,0,0,0);
  const conteggio = {};
  cache.sessioni.filter(s=> new Date(s.data) >= daData).forEach(s=>{
    (s.esercizi||[]).forEach(e=>{
      const setFatte = (e.sets||[]).filter(x=>x.fatta).length;
      if(setFatte>0){
        const gruppo = gruppoMuscolareEsercizio(e.nome);
        conteggio[gruppo] = (conteggio[gruppo]||0) + setFatte;
      }
    });
  });
  return conteggio;
}

function renderVolumeGruppiCard(){
  const conteggio = volumeSettimanalePerGruppo(7);
  const gruppi = Object.keys(conteggio).sort((a,b)=> conteggio[b]-conteggio[a]);
  if(!gruppi.length) return '';
  const righe = gruppi.map(g=>{
    const n = conteggio[g];
    const pct = Math.min(100, Math.round((n/20)*100));
    const etichetta = n<10 ? 'basso' : (n<=20 ? 'nel range comune' : 'alto');
    return `<div style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px;">
        <span>${g}</span><span>${n} serie · ${etichetta}</span>
      </div>
      <div style="height:8px;border-radius:5px;background:var(--panel-2);overflow:hidden;">
        <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--accent),#1fae63);"></div>
      </div>
    </div>`;
  }).join('');
  return `<div class="card">
    <h3 style="margin-top:0;font-size:15px;">Volume settimanale per gruppo</h3>
    <p class="field-hint" style="margin:0 0 14px;">Serie completate negli ultimi 7 giorni per gruppo muscolare. 10-20 serie/settimana per gruppo è un range spesso citato come riferimento generale per l'ipertrofia — non una prescrizione, solo un punto di partenza.</p>
    ${righe}
  </div>`;
}

function calcolaValoreEsercizio(sessione, nomeEsercizio, metrica){
  const e = sessione.esercizi.find(x=>x.nome===nomeEsercizio);
  if(!e) return null;
  if(metrica==='rpeMedio'){
    const rpes = (e.sets||[]).map(s=>s.rpe).filter(v=>v!=null && !isNaN(v));
    if(rpes.length) return rpes.reduce((a,b)=>a+b,0)/rpes.length;
    return (e.rpe!=null) ? e.rpe : null; // sessioni salvate prima dell'RPE per serie
  }
  const validi = e.sets
    .map(x=>({peso:parseFloat(x.peso), rip:parseInt(x.rip)}))
    .filter(x=>!isNaN(x.peso) && !isNaN(x.rip) && x.rip>0);
  if(!validi.length) return null;
  if(metrica==='pesoMax') return Math.max(...validi.map(x=>x.peso));
  if(metrica==='volume') return validi.reduce((sum,x)=> sum + x.peso*x.rip, 0);
  if(metrica==='rm') return Math.max(...validi.map(x=> x.peso*(1+x.rip/30)));
  return null;
}

function renderAderenzaCard(){
  const blocchiAttivi = schedeAssegnateUtente().filter(s=> blocchiIniziati[s.id]);
  if(!blocchiAttivi.length) return '';
  let html = `<div class="card"><h3 style="margin-top:0;font-size:15px;">Costanza</h3>`;
  blocchiAttivi.forEach(s=>{
    const inizio = new Date(blocchiIniziati[s.id]);
    const oggi = new Date();
    const fineBlocco = s.durataSettimane ? new Date(new Date(inizio).setDate(inizio.getDate()+s.durataSettimane*7)) : null;
    const finePeriodo = (fineBlocco && fineBlocco < oggi) ? fineBlocco : oggi;
    const giorniTrascorsi = Math.max(1, Math.round((finePeriodo - inizio) / 86400000));
    const freqMatch = s.periodo && s.periodo.match(/(\d+)x\/settimana/);
    const freq = freqMatch ? Number(freqMatch[1]) : 3;
    const attese = Math.max(1, Math.round((giorniTrascorsi/7) * freq));
    const fatte = cache.sessioni.filter(sess=> sess.schedaId===s.id && new Date(sess.data) >= inizio).length;
    const pct = Math.min(100, Math.round((fatte/attese)*100));
    html += `<div style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px;">
        <span>${s.nome}</span><span>${fatte}/${attese} sedute</span>
      </div>
      <div style="height:8px;border-radius:5px;background:var(--panel-2);overflow:hidden;">
        <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--accent),#1fae63);"></div>
      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function renderRiepilogoSettimanale(){
  const pianoPersonale = profiloUtente && profiloUtente.schedeAssegnate === null;
  const seiGiorniFa = new Date(); seiGiorniFa.setDate(seiGiorniFa.getDate()-6); seiGiorniFa.setHours(0,0,0,0);
  const sessioniSettimana = cache.sessioni.filter(s=> new Date(s.data) >= seiGiorniFa);

  const rpeValori = sessioniSettimana.flatMap(s=> (s.esercizi||[]).flatMap(e=> (e.sets||[]).map(x=>x.rpe))).filter(v=>v!=null && !isNaN(v));
  const rpeMedio = rpeValori.length ? (rpeValori.reduce((a,b)=>a+b,0)/rpeValori.length).toFixed(1) : null;

  let aderenzaHtml = '';
  if(pianoPersonale){
    const giorniLog = cache.dietaLog.filter(d=> new Date(d.id) >= seiGiorniFa);
    const numPasti = DIETA_PIANO.pasti.length;
    const numIntegratori = INTEGRAZIONE_PIANO.integratori.length;
    if(giorniLog.length){
      const pastiPctTot = giorniLog.reduce((sum,g)=> sum + (Object.values(g.pastiFatti||{}).filter(Boolean).length/numPasti)*100, 0);
      const integrPctTot = giorniLog.reduce((sum,g)=> sum + (Object.values(g.integratoriFatti||{}).filter(Boolean).length/numIntegratori)*100, 0);
      aderenzaHtml = `
        <div class="week-stat"><span>Aderenza pasti</span><b>${Math.round(pastiPctTot/giorniLog.length)}%</b></div>
        <div class="week-stat"><span>Aderenza integratori</span><b>${Math.round(integrPctTot/giorniLog.length)}%</b></div>`;
    }
  }

  // Check-in energia/indolenzimento della settimana, incrociato con RPE/sonno.
  const giorniCheckIn = cache.dietaLog.filter(d=> new Date(d.id) >= seiGiorniFa);
  const energiaValori = giorniCheckIn.map(d=>d.energia).filter(v=>v!=null);
  const doloriValori = giorniCheckIn.map(d=>d.dolori).filter(v=>v!=null);
  const energiaMedia = energiaValori.length ? (energiaValori.reduce((a,b)=>a+b,0)/energiaValori.length).toFixed(1) : null;
  const doloriMedio = doloriValori.length ? (doloriValori.reduce((a,b)=>a+b,0)/doloriValori.length).toFixed(1) : null;
  const checkInHtml = `
    ${energiaMedia!=null ? `<div class="week-stat"><span>Energia media (check-in)</span><b>${energiaMedia}/5</b></div>` : ''}
    ${doloriMedio!=null ? `<div class="week-stat"><span>Indolenzimento medio (check-in)</span><b>${doloriMedio}/5</b></div>` : ''}`;

  if(!sessioniSettimana.length && !aderenzaHtml && energiaMedia==null && doloriMedio==null) return '';

  return `<div class="card">
    <h3 style="margin-top:0;font-size:15px;">Ultimi 7 giorni</h3>
    <div class="week-stat"><span>Allenamenti fatti</span><b>${sessioniSettimana.length}</b></div>
    ${rpeMedio!=null ? `<div class="week-stat"><span>RPE medio</span><b>${rpeMedio}/10</b></div>` : ''}
    ${aderenzaHtml}
    ${checkInHtml}
  </div>`;
}

// Media mobile su finestra di calendario (non su N punti): per ogni punto,
// media di tutti i valori con data entro gli ultimi `giorni` giorni da quel punto.
// Utile per il peso, che oscilla molto giorno su giorno per acqua/digestione.
function mediaMobileCalendario(punti, giorni){
  const ms = giorni * 86400000;
  return punti.map((p,i)=>{
    const finestra = punti.filter(q=> q.t <= p.t && (p.t - q.t) <= ms);
    const media = finestra.reduce((s,q)=>s+q.y,0) / finestra.length;
    return media;
  });
}

/* ============ MODIFICA SEDUTA PASSATA ============
   Riusa lo stile della riga di logging live (.set-row) ma opera su una copia
   di lavoro (modificaSessioneDraft) separata dal sessionDraft della seduta in
   corso, cosi' non si mescolano un allenamento attivo e una modifica storica. */
let modificaSessioneDraft = null;

function renderSessioneModifica(){
  const s = cache.sessioni.find(x=>x.id===route.id);
  if(!s){ setRoute({name:'storico-allenamento'}); return; }
  pageTitle.textContent = 'Modifica seduta';
  modificaSessioneDraft = JSON.parse(JSON.stringify(s));

  let html = `<div class="card">
    <div id="sessioneModError"></div>
    <div class="field"><label>Data</label><input type="date" id="smData" value="${new Date(s.data).toISOString().slice(0,10)}"></div>
  </div>`;
  modificaSessioneDraft.esercizi.forEach((e,ei)=>{
    html += `<div class="exercise-card">
      <h3>${e.nome}</h3>
      <p class="rpe-legend">RPE per ogni serie: 6 = leggero · 8 = a 2 rip dal cedimento · 10 = cedimento totale</p>`;
    e.sets.forEach((set,si)=>{
      html += `<div class="set-row">
        <span>${si+1}</span>
        <input type="number" min="0" max="500" placeholder="peso kg" value="${set.peso??''}" oninput="updateSetModifica(${ei},${si},'peso',this.value)">
        <input type="text" placeholder="rip / sec" value="${set.rip??''}" oninput="updateSetModifica(${ei},${si},'rip',this.value)">
        <select onchange="setRPESetModifica(${ei},${si},this.value)">
          <option value="">RPE</option>
          ${[6,7,8,9,10].map(v=>`<option value="${v}" ${Number(set.rpe)===v?'selected':''}>${v}</option>`).join('')}
        </select>
        <input type="checkbox" ${set.fatta?'checked':''} onchange="updateSetModifica(${ei},${si},'fatta',this.checked)">
      </div>`;
    });
    html += `<textarea class="note-user" placeholder="Le tue note su questo esercizio" oninput="updateNotaEsercizioModifica(${ei}, this.value)">${e.noteUtente||''}</textarea>`;
    html += `</div>`;
  });
  html += `<button class="btn" id="saveSessioneModBtn" onclick="salvaModificaSessione('${s.id}')">Salva modifiche</button>`;
  view.innerHTML = html;
}

function updateSetModifica(ei,si,field,val){
  modificaSessioneDraft.esercizi[ei].sets[si][field] = val;
}
function setRPESetModifica(ei,si,val){
  modificaSessioneDraft.esercizi[ei].sets[si].rpe = val ? Number(val) : null;
}
function updateNotaEsercizioModifica(ei,val){
  modificaSessioneDraft.esercizi[ei].noteUtente = val;
}

async function salvaModificaSessione(id){
  const data = document.getElementById('smData').value;
  const btn = document.getElementById('saveSessioneModBtn');
  const errBox = document.getElementById('sessioneModError');
  errBox.innerHTML = '';

  // Stessa soglia di plausibilita' usata al primo salvataggio della seduta dal vivo.
  for(const e of modificaSessioneDraft.esercizi){
    for(const set of e.sets){
      if(set.peso!=='' && set.peso!=null){
        const p = parseFloat(set.peso);
        if(isNaN(p) || p<0 || p>500){
          errBox.innerHTML = `<div class="error-banner">Il peso inserito per "${e.nome}" non sembra plausibile (0–500 kg). Controllalo prima di salvare.</div>`;
          return;
        }
        set.peso = p;
      }
    }
  }

  btn.disabled = true; btn.textContent = 'Salvataggio...';
  try{
    const payload = { data, esercizi: modificaSessioneDraft.esercizi };
    await userCollection('sessioni').doc(id).update(payload);
    const idx = cache.sessioni.findIndex(x=>x.id===id);
    if(idx>-1) cache.sessioni[idx] = { ...cache.sessioni[idx], ...payload };
    cache.sessioni.sort((a,b)=> new Date(a.data)-new Date(b.data));
    setRoute({name:'progressi-detail', id, justSaved:true});
  }catch(e){
    errBox.innerHTML = `<div class="error-banner">${e.message}</div>`;
    btn.disabled = false; btn.textContent = 'Salva modifiche';
  }
}

  return `<div class="card">

async function salvaObiettiviCorpo(){
  const pesoRaw = document.getElementById('ocPeso').value;
  const vitaRaw = document.getElementById('ocVita').value;
  const errBox = document.getElementById('obiettiviCorpoError');
  const btn = document.getElementById('salvaObiettiviCorpoBtn');
  errBox.innerHTML = '';
  const pesoTarget = pesoRaw ? Number(pesoRaw) : null;
  const vitaTarget = vitaRaw ? Number(vitaRaw) : null;
  if((pesoRaw && (isNaN(pesoTarget) || pesoTarget<20 || pesoTarget>400)) || (vitaRaw && (isNaN(vitaTarget) || vitaTarget<40 || vitaTarget>200))){
    errBox.innerHTML = '<div class="error-banner">Controlla i valori inseriti.</div>';
    return;
  }
  const obiettiviCorpo = { pesoTarget, vitaTarget };
  btn.disabled = true; btn.textContent = 'Salvataggio...';
  try{
    await db.collection('users').doc(currentUid).set({ obiettiviCorpo }, { merge:true });
    profiloUtente.obiettiviCorpo = obiettiviCorpo;
    btn.disabled = false; btn.textContent = 'Obiettivi salvati ✅';
    setTimeout(()=>{ if(document.getElementById('salvaObiettiviCorpoBtn')) { btn.textContent='Salva obiettivi corporei'; } }, 1800);
  }catch(e){
    errBox.innerHTML = `<div class="error-banner">${e.message}</div>`;
    btn.disabled = false; btn.textContent = 'Salva obiettivi corporei';
  }
}

async function salvaProfiloModifiche(){
  const nome = document.getElementById('pNome').value.trim();
  const cognome = document.getElementById('pCognome').value.trim();
  const eta = document.getElementById('pEta').value;
  const altezza = document.getElementById('pAltezza').value;
  const sesso = document.getElementById('pSesso').value || null;
  const attenzioni = document.getElementById('pAttenzioni').value.trim();
  const errBox = document.getElementById('profiloError');
  const btn = document.getElementById('salvaProfiloBtn');
  errBox.innerHTML = '';
  if(!nome || !cognome || !eta){
    errBox.innerHTML = '<div class="error-banner">Compila tutti i campi.</div>';
    return;
  }
  if(Number(eta) < 10 || Number(eta) > 100){
    errBox.innerHTML = '<div class="error-banner">Inserisci un\'età valida.</div>';
    return;
  }
  if(altezza && (Number(altezza) < 100 || Number(altezza) > 230)){
    errBox.innerHTML = '<div class="error-banner">L\'altezza inserita non sembra plausibile (100–230 cm).</div>';
    return;
  }
  btn.disabled = true; btn.textContent = 'Salvataggio...';
  try{
    const altezzaVal = altezza ? Number(altezza) : null;
    await db.collection('users').doc(currentUid).set({ nome, cognome, eta: Number(eta), altezza: altezzaVal, sesso, attenzioni }, { merge:true });
    profiloUtente = { ...profiloUtente, nome, cognome, eta: Number(eta), altezza: altezzaVal, sesso, attenzioni };
    setRoute({name:'home'});
  }catch(e){
    errBox.innerHTML = `<div class="error-banner">${e.message}</div>`;
    btn.disabled = false; btn.textContent = 'Salva modifiche';
  }
}

/* ============ PANNELLO TRAINER (visibile solo se isTrainer:true sul profilo) ============ */
function renderTrainerPanel(){
  pageTitle.textContent = 'Pannello trainer';
  if(!profiloUtente || !profiloUtente.isTrainer){
    view.innerHTML = `<p class="empty">Accesso riservato al trainer.</p>`;
    return;
  }
  view.innerHTML = `<div class="spinner-wrap">Caricamento utenti...</div>`;
  db.collection('users').get().then(snap=>{
    const utenti = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    if(!utenti.length){
      view.innerHTML = `<p class="empty">Nessun utente trovato.</p>`;
      return;
    }
    let html = `<p class="note-box" style="margin-top:0;">Tocca una scheda per assegnarla o rimuoverla dall'utente.</p>`;
    utenti.forEach(u=>{
      const assegnate = u.schedeAssegnate || [];
      html += `<div class="card">
        <h3 style="margin:0 0 4px;font-size:15px;">${u.nome||'—'} ${u.cognome||''}</h3>
        <p style="margin:0 0 10px;font-size:11.5px;color:var(--text-dim);word-break:break-all;">${u.id}</p>
        <div class="chip-select">
          ${SCHEDE.map(s=>`<div class="chip ${assegnate.includes(s.id)?'active':''}" onclick="toggleAssegnazione('${u.id}','${s.id}',this)">${s.nome}</div>`).join('')}
        </div>
      </div>`;
    });
    view.innerHTML = html;
  }).catch(e=>{
    view.innerHTML = `<div class="error-banner">Impossibile caricare gli utenti: ${e.message}</div>`;
  });
}

function toggleAssegnazione(uid, schedaId, chipEl){
  const ref = db.collection('users').doc(uid);
  const attivo = chipEl.classList.contains('active');
  const op = attivo ? firebase.firestore.FieldValue.arrayRemove(schedaId) : firebase.firestore.FieldValue.arrayUnion(schedaId);
  chipEl.style.opacity = '.5';
  ref.set({ schedeAssegnate: op }, { merge:true }).then(()=>{
    chipEl.classList.toggle('active');
    chipEl.style.opacity = '1';
  }).catch(e=>{
    chipEl.style.opacity = '1';
    alert('Errore: '+e.message);
  });
}

function microPer100(nome){
  return MICRO_DB[nome] || MICRO_DB[MICRO_ALIAS[nome]] || null;
}

function calcolaMicroOpzione(opz){
  const tot = { acqua:0 };
  MICRO_DEF.forEach(m=> tot[m.key]=0);
  opz.alimenti.forEach(a=>{
    const profilo = microPer100(a.n);
    if(!profilo) return;
    const match = String(a.q).match(/^(\d+(?:[.,]\d+)?)/);
    const grammi = match ? parseFloat(match[1].replace(',','.')) : 0;
    const fattore = grammi/100;
    tot.acqua += (profilo.acqua||0)*fattore;
    MICRO_DEF.forEach(m=> tot[m.key] += (profilo[m.key]||0)*fattore);
  });
  return tot;
}

   nutrienti "traccia" (vitamine, minerali) nel campo *_100g sono normalizzati
   in grammi (es. vitamin-c_100g:0.00006 = 60mg), a differenza dei macro
   (proteine/carboidrati/grassi) che sono già in grammi diretti: per questo
   qui vanno moltiplicati per riportarli in mg/mcg leggibili. Copertura non
   garantita: essendo un database collaborativo, molti prodotti non hanno
   tutti questi campi compilati. */
const OFF_MICRO_MAP = {
  fibre:{off:'fiber', factor:1}, // già in grammi su OFF, a differenza dei micronutrienti "traccia" sotto
  vitA:{off:'vitamin-a', factor:1e6}, vitC:{off:'vitamin-c', factor:1e3}, vitD:{off:'vitamin-d', factor:1e6},
  vitE:{off:'vitamin-e', factor:1e3}, vitB12:{off:'vitamin-b12', factor:1e6}, folati:{off:'vitamin-b9', factor:1e6},
  calcio:{off:'calcium', factor:1e3}, ferro:{off:'iron', factor:1e3}, magnesio:{off:'magnesium', factor:1e3},
  potassio:{off:'potassium', factor:1e3}, zinco:{off:'zinc', factor:1e3}, sodio:{off:'sodium', factor:1e3}
};
function estraiMicroOFF(nutrimenti){
  nutrimenti = nutrimenti || {};
  const micro100 = {};
  Object.keys(OFF_MICRO_MAP).forEach(key=>{
    const cfg = OFF_MICRO_MAP[key];
    const raw = nutrimenti[cfg.off+'_100g'];
    micro100[key] = (raw!=null && !isNaN(raw)) ? raw*cfg.factor : null;
  });
  const acquaRaw = nutrimenti['water_100g'];
  const acqua100 = (acquaRaw!=null && !isNaN(acquaRaw)) ? acquaRaw : null;
  return { micro100, acqua100 };
}

/* Genera l'HTML della griglia micronutrienti scalata alla grammatura scelta,
   riusato sia per il prodotto cercato/scansionato sia per il piano fisso. */
function microGridHtmlDaOFF(micro100, acqua100, fattore){
  const righe = MICRO_DEF.map(m=>{
    const v100 = micro100[m.key];
    if(v100==null) return '';
    const v = v100*fattore;
    if(!(v>0)) return '';
    const vArr = v<10 ? Math.round(v*10)/10 : Math.round(v);
    return `<div class="micro-row"><span>${m.label}</span><b>${vArr} ${m.unit}</b></div>`;
  }).join('');
  const acquaLine = acqua100!=null
    ? `<p style="margin:0 0 10px;">💧 Acqua stimata: <b style="color:var(--text);">${Math.round(acqua100*fattore)} ml circa</b></p>`
    : `<p style="margin:0 0 10px;color:var(--text-dim);">💧 Dato acqua non disponibile per questo prodotto.</p>`;
  return `${acquaLine}<div class="micro-grid">${righe || '<p style="margin:0;">Nessun dato su vitamine/minerali per questo prodotto su Open Food Facts.</p>'}</div>
    <p class="field-hint" style="margin-top:12px;">Dati Open Food Facts, database collaborativo: la copertura di vitamine e minerali varia da prodotto a prodotto.</p>`;
}

function renderAlimentazione(){
  pageTitle.textContent = 'Dieta';

  // Il piano alimentare e l'integrazione qui sotto sono personali, costruiti
  // sui dati e sulle analisi di Antonio: seguono la stessa logica delle schede
  // di allenamento (schedeAssegnate === null → account storico di Antonio).
  // Ai nuovi profili non viene mostrato nulla finché il trainer non assegnerà
  // un piano dedicato a ciascuno di loro.
  const pianoPersonale = profiloUtente && profiloUtente.schedeAssegnate === null;
  if(!pianoPersonale){
    view.innerHTML = `<div class="card">
      <p class="empty" style="padding:10px 0;">Il tuo trainer non ti ha ancora assegnato un piano alimentare personale. Questa sezione si popolerà con la tua dieta e la tua integrazione quando saranno pronte.</p>
    </div>`;
    return;
  }

  // La prima volta che si apre Dieta in giornata, chiede se oggi ci si allena:
  // determina il target del giorno e se mostrare l'extra su colazione/pranzo.
  // Il rendering prosegue comunque (di default sui valori di riposo) mentre
  // si attende la risposta: impostaGiornoAllenamento ri-renderizza da sola.
  impostaGiornoAllenamento();

  const t = obiettiviAttivi(!!cache.dietaLogOggi.giornoAllenamento);

  const macroDef = [
    {key:'prot', label:'Proteine', color:'var(--accent)'},
    {key:'carb', label:'Carboidrati', color:'var(--accent-2)'},
    {key:'grassi', label:'Grassi', color:'var(--accent-3)'},
  ];

  // Macro/kcal acquisiti oggi: somma delle opzioni dei pasti che hai spuntato
  // come "seguiti", usando l'opzione al momento selezionata per ciascun pasto.
  // Un pasto segnato "fatto" tramite un alimento extra (pastiViaExtra) non
  // aggiunge qui le kcal dell'opzione del piano: l'extra la sostituisce, non
  // la integra, e le sue kcal sono già contate nel giro su alimentiExtra
  // subito sotto — altrimenti risulterebbero sommate due volte.
  const acquisito = { kcal:0, prot:0, carb:0, grassi:0 };
  DIETA_PIANO.pasti.forEach((p,i)=>{
    if(cache.dietaLogOggi.pastiFatti[i] && !(cache.dietaLogOggi.pastiViaExtra && cache.dietaLogOggi.pastiViaExtra[i])){
      const opz = p.opzioni[dietaOpzioneSel[i] || 0];
      acquisito.kcal += opz.kcal;
      acquisito.prot += opz.prot;
      acquisito.carb += opz.carb;
      acquisito.grassi += opz.grassi;
    }
  });
  const alimentiExtra = cache.dietaLogOggi.alimentiExtra || [];
  alimentiExtra.forEach(a=>{
    acquisito.kcal += a.kcal;
    acquisito.prot += a.prot;
    acquisito.carb += a.carb;
    acquisito.grassi += a.grassi;
  });

  const kcalPct = t.kcal ? Math.min(100, Math.round((acquisito.kcal/t.kcal)*100)) : 0;
  const kcalOver = acquisito.kcal > t.kcal;
  const kcalColor = kcalOver ? 'var(--accent-2)' : 'var(--accent)';
  const RING_R = 52, RING_C = 2*Math.PI*RING_R;
  const ringOffset = RING_C * (1 - kcalPct/100);

  const macroBarsHtml = macroDef.map(m=>{
    const val = acquisito[m.key];
    const goal = t[m.key];
    const pct = goal ? Math.min(100, Math.round((val/goal)*100)) : 0;
    return `<div class="macro-bar-row">
      <div class="mbr-top"><span>${m.label}</span><span>${val}g / ${goal}g</span></div>
      <div class="mbr-track"><div class="mbr-fill" style="width:${pct}%;background:${m.color};"></div></div>
    </div>`;
  }).join('');

  const mealsHtml = DIETA_PIANO.pasti.map((p,i)=>{
    const selIdx = dietaOpzioneSel[i] || 0;
    const opz = p.opzioni[selIdx];
    const fatto = !!cache.dietaLogOggi.pastiFatti[i];
    const viaExtra = fatto && !!(cache.dietaLogOggi.pastiViaExtra && cache.dietaLogOggi.pastiViaExtra[i]);
    const haExtra = !!(cache.dietaLogOggi.giornoAllenamento && opz.extraAllenamento);
    // Se il pasto è stato segnato tramite un alimento extra (sostituisce
    // l'opzione del piano, vedi segnaPastoFattoDaExtra) mostriamo cosa hai
    // davvero mangiato — la somma degli extra loggati per questo pasto — 
    // invece del titolo/kcal dell'opzione del piano che non hai seguito.
    const extraDiQuestoPasto = viaExtra ? (cache.dietaLogOggi.alimentiExtra||[]).filter(a=>a.pasto===i) : [];
    const kcalExtraPasto = extraDiQuestoPasto.reduce((s,a)=>s+a.kcal,0);
    const sottotitolo = viaExtra
      ? (extraDiQuestoPasto.length===1 ? extraDiQuestoPasto[0].nome : `${extraDiQuestoPasto.length} alimenti extra`)

  // funzionalità non hanno "pasto": finiscono nel gruppo "Altro" invece di

    const voci = alimentiExtra.filter(a=> a.pasto===pi);

            <div class="efi-m">${a.grammi}g · ${a.kcal} kcal · P ${a.prot}g · C ${a.carb}g · G ${a.grassi}g</div>

  const extraSenzaPasto = alimentiExtra.filter(a=> a.pasto==null || a.pasto<0 || a.pasto>=DIETA_PIANO.pasti.length);
  const extraSenzaPastoHtml = extraSenzaPasto.length ? `<div class="extra-food-group">

/* Apre il foglio a comparsa con le 5 opzioni del pasto i, per sceglierne una
   o consultarne i dettagli. Il foglio vive fuori da #view (appeso a
   document.body, come le altre modali dell'app) così sopravvive ai
   ri-render della pagina sottostante quando si segna un pasto come fatto. */
function apriSelettoreOpzione(i){
  selettorePastoIdx = i;
  selettoreDettaglioOi = null;
  hapticaLieve();
  mostraSelettoreOpzioneOverlay();
}

function mostraSelettoreOpzioneOverlay(){
  let overlay = document.getElementById('opzSheetOverlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'opzSheetOverlay';
    overlay.className = 'sheet-overlay';
    overlay.addEventListener('click', e=>{ if(e.target===overlay) chiudiSelettoreOpzione(); });
    document.body.appendChild(overlay);
  }
  overlay.innerHTML = `<div class="sheet-box" id="opzSheetBox"><div class="sheet-handle"></div>${renderSelettoreOpzioneBody()}</div>`;
  attachSwipeDownToDismiss(overlay.querySelector('#opzSheetBox'), chiudiSelettoreOpzione);
}

function toggleSelettoreDettaglio(oi){
  selettoreDettaglioOi = selettoreDettaglioOi===oi ? null : oi;
  mostraSelettoreOpzioneOverlay();
}

function sceglieOpzioneSheet(i, oi){
  hapticaMedia();
  selectDietaOpzione(i, oi);
  chiudiSelettoreOpzione();
}

function chiudiSelettoreOpzione(){
  const overlay = document.getElementById('opzSheetOverlay');
  if(overlay) overlay.remove();
  selettorePastoIdx = null;
  selettoreDettaglioOi = null;
}

/* ============ DIARIO ALIMENTARE STORICO ============
   Ripercorre i giorni passati usando cache.dietaLog. Per i pasti segnati da
   quando esiste "pastiSnapshot" mostriamo anche titolo e kcal/macro reali;
   per quelli segnati prima (o se manca lo snapshot per qualsiasi motivo)
   contano comunque come "fatti" ma senza dettaglio nutrizionale nel totale. */
let diarioOpenSet = new Set();

function toggleDiarioGiorno(id){
  if(diarioOpenSet.has(id)) diarioOpenSet.delete(id); else diarioOpenSet.add(id);
  renderDiario();
}

function renderDiario(){
  pageTitle.textContent = 'Diario';
  const pianoPersonale = profiloUtente && profiloUtente.schedeAssegnate === null;
  if(!pianoPersonale){
    view.innerHTML = `<p class="empty">Questa sezione si popolerà quando avrai un piano alimentare personale.</p>`;
    return;
  }
  const giorni = cache.dietaLog.slice().sort((a,b)=> b.id.localeCompare(a.id));
  if(!giorni.length){
    view.innerHTML = `<p class="empty"><span class="empty-icon">📖</span>Nessun giorno tracciato ancora.<br>Segna un pasto, un integratore o dell'acqua in Dieta per iniziare il diario.</p>`;
    return;
  }
  const oggiK = todayKey();

  const html = giorni.map(g=>{
    const open = diarioOpenSet.has(g.id);
    const pastiFatti = g.pastiFatti || {};
    const pastiSnapshot = g.pastiSnapshot || {};
    const integratoriFatti = g.integratoriFatti || {};
    const alimentiExtra = g.alimentiExtra || [];

    let kcalTot = 0, protTot = 0, carbTot = 0, grassiTot = 0, dettagliNonDisponibili = false;
    Object.keys(pastiFatti).forEach(i=>{
      if(!pastiFatti[i]) return;
      const snap = pastiSnapshot[i];
      if(snap){ kcalTot+=snap.kcal; protTot+=snap.prot; carbTot+=snap.carb; grassiTot+=snap.grassi; }
      else dettagliNonDisponibili = true;
    });
    alimentiExtra.forEach(a=>{ kcalTot+=a.kcal; protTot+=a.prot; carbTot+=a.carb; grassiTot+=a.grassi; });

    const numPastiFatti = Object.values(pastiFatti).filter(Boolean).length;
    const numIntegrFatti = Object.values(integratoriFatti).filter(Boolean).length;
    const dataLabel = g.id===oggiK ? 'Oggi' : new Date(g.id).toLocaleDateString('it-IT',{weekday:'long', day:'numeric', month:'long'});
    const tipoGiornoLabel = g.giornoAllenamento===true ? ' · 🏋️ allenamento' : g.giornoAllenamento===false ? ' · 🛋️ riposo' : '';

    const pastiRighe = DIETA_PIANO.pasti.map((p,i)=>{
      if(!pastiFatti[i]) return '';
      const snap = pastiSnapshot[i];
      // Un pasto "sostituito con alimento extra" ha kcal:0 nello snapshot per
      // costruzione (le kcal reali sono contate una sola volta, tra gli
      // alimenti extra qui sotto): mostriamo "vedi extra" invece di "0 kcal",
      // che sembrerebbe un errore.
      const valoreKcal = snap ? (snap.viaExtra ? 'vedi extra ↓' : snap.kcal+' kcal') : 'segnato';
      return `<div class="micro-row"><span>${p.icona} ${p.nome}${snap?` — ${snap.titolo}`:''}</span><b>${valoreKcal}</b></div>`;
    }).join('');

    const integrRighe = INTEGRAZIONE_PIANO.integratori
      .filter(s=> integratoriFatti[s.nome])
      .map(s=>`<div class="micro-row"><span>${s.icona} ${s.nome}</span><b>✅</b></div>`).join('');

    const extraRighe = alimentiExtra.map(a=>`<div class="micro-row"><span>${a.nome}${a.marca?` · ${a.marca}`:''} (${a.grammi}g)</span><b>${a.kcal} kcal</b></div>`).join('');

    return `<div class="meal-card${open?' open':''}">
      <div class="meal-head" onclick="toggleDiarioGiorno('${g.id}')">
        <div class="icon">📅</div>
        <div class="mh-info">
          <div class="mh-name">${dataLabel}</div>
          <div class="mh-time">${numPastiFatti}/${DIETA_PIANO.pasti.length} pasti · ${numIntegrFatti} integratori · ${((g.acquaMl||0)/1000).toFixed(1).replace('.',',')} L${tipoGiornoLabel}</div>
        </div>
        <div class="mh-kcal">${kcalTot} kcal</div>
        <div class="mh-chev">▾</div>
      </div>
      <div class="meal-body"><div class="meal-body-in">
        ${pastiRighe || '<p style="margin:0 0 8px;color:var(--text-dim);font-size:12.5px;">Nessun pasto segnato.</p>'}
        ${integrRighe}
        ${extraRighe}
        ${dettagliNonDisponibili ? '<p class="field-hint" style="margin-top:10px;">Alcuni pasti di questo giorno sono stati segnati prima che il diario registrasse i dettagli: contano come "fatti" ma senza kcal/macro nel totale qui sopra.</p>' : ''}
      </div></div>
    </div>`;
  }).join('');

  view.innerHTML = html;
}

/* ============ LISTA DELLA SPESA ============
   Somma le quantità degli ingredienti delle opzioni attualmente selezionate
   per ciascun pasto (le stesse che vedi nella scheda "Piano"), moltiplicate
   per un numero di giorni scelto — utile se ripeti la stessa combinazione di
   opzioni più giorni di fila, com'è già il modo in cui il piano è pensato
   ("componi la settimana ripetendo o mescolando le opzioni"). */
let listaSpesaGiorni = 7;
let listaSpesaSpuntati = new Set();

function calcolaListaSpesa(giorni){
  const totali = {};
  DIETA_PIANO.pasti.forEach((p,i)=>{
    const opz = p.opzioni[dietaOpzioneSel[i] || 0];
    opz.alimenti.forEach(a=>{
      const match = String(a.q).match(/^(\d+(?:[.,]\d+)?)/);
      const grammi = match ? parseFloat(match[1].replace(',','.')) : 0;
      totali[a.n] = (totali[a.n]||0) + grammi;
    });
  });
  return Object.keys(totali)
    .map(nome=>({ nome, grammiTot: Math.round(totali[nome]*giorni) }))
    .sort((a,b)=> a.nome.localeCompare(b.nome));
}

function formattaQuantitaSpesa(g){
  if(g>=1000) return (g/1000).toFixed(g%1000===0?0:1).replace('.',',')+' kg';
  return g+' g';
}

function renderListaSpesa(){
  pageTitle.textContent = 'Lista della spesa';
  const pianoPersonale = profiloUtente && profiloUtente.schedeAssegnate === null;
  if(!pianoPersonale){
    view.innerHTML = `<p class="empty">Questa sezione si popolerà quando avrai un piano alimentare personale.</p>`;
    return;
  }
  const lista = calcolaListaSpesa(listaSpesaGiorni);
  const righe = lista.map(item=>{
    const spuntato = listaSpesaSpuntati.has(item.nome);
    return `<div class="extra-food-item" onclick="toggleSpesaSpuntato('${item.nome.replace(/'/g,"\\'")}')" style="cursor:pointer;">
      <div class="efi-info">
        <div class="efi-n" style="${spuntato?'text-decoration:line-through;color:var(--text-dim);':''}">${item.nome}</div>
      </div>
      <b style="${spuntato?'color:var(--text-dim);text-decoration:line-through;':'color:var(--text);'}">${formattaQuantitaSpesa(item.grammiTot)}</b>
    </div>`;
  }).join('');

  view.innerHTML = `
    <div class="card">
      <div class="dic-t" style="font-size:13.5px;font-weight:800;margin-bottom:10px;">🛒 Quanti giorni vuoi coprire?</div>
      <div class="water-btns" style="margin-top:0;">
        <button class="btn small secondary" onclick="cambiaGiorniSpesa(-1)">−1 giorno</button>
        <span style="align-self:center;font-weight:800;font-size:15px;min-width:70px;text-align:center;">${listaSpesaGiorni} giorni</span>
        <button class="btn small secondary" onclick="cambiaGiorniSpesa(1)">+1 giorno</button>
      </div>
      <p class="field-hint" style="margin:12px 0 0;">Calcolata sulle opzioni al momento selezionate per ogni pasto in "Piano" — se cambi opzione lì, torna qui per ricalcolare.</p>
    </div>
    <div class="card">
      ${righe || '<p class="empty" style="padding:10px 0;">Nessun ingrediente da mostrare.</p>'}
    </div>
    <button class="btn secondary" style="width:100%;" onclick="condividiListaSpesa()">📋 Copia lista</button>
  `;
}

function cambiaGiorniSpesa(delta){
  listaSpesaGiorni = Math.max(1, Math.min(30, listaSpesaGiorni+delta));
  renderListaSpesa();
}

function toggleSpesaSpuntato(nome){
  if(listaSpesaSpuntati.has(nome)) listaSpesaSpuntati.delete(nome); else listaSpesaSpuntati.add(nome);
  renderListaSpesa();
}

function condividiListaSpesa(){
  const lista = calcolaListaSpesa(listaSpesaGiorni);
  const testo = 'Lista della spesa (' + listaSpesaGiorni + ' giorni):\n' +
    lista.map(item=> '- ' + item.nome + ': ' + formattaQuantitaSpesa(item.grammiTot)).join('\n');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(testo)
      .then(()=> alert('Lista copiata negli appunti ✅'))
      .catch(()=> alert(testo));
  } else {
    alert(testo);
  }
}

/* ============ CERCA ALIMENTO (database Open Food Facts) ============

let ricercaAlimentoState = { query:'', loading:false, risultati:[], errore:null, selezionato:null, grammi:100, pastoIdx:null };

/* ============ RICERCA ALIMENTI: due fonti in parallelo ============
   1) Open Food Facts, tramite il motore di ricerca "search-a-licious"
      (quello usato dal sito ufficiale OFF dal 2024: tollerante a errori di
      battitura, ranking per rilevanza+popolarità). Se non risponde come
      previsto degrada da sola sul vecchio endpoint cgi/search.pl invece di
      perdere i risultati OFF, dato che qui non possiamo testare l'endpoint
      dal vivo — meglio degradare che rompersi.
   2) USDA FoodData Central, il database ufficiale statunitense: molto
      accurato per alimenti generici (frutta, verdura, carne) oltre che per
      prodotti confezionati USA. Capisce solo nomi in inglese, quindi aiuta
      soprattutto sulle ricerche generiche o quando OFF non basta.
   I risultati delle due fonti si sommano e vengono deduplicati per nome+marca. */
const USDA_API_KEY = 'DEMO_KEY'; // gratuita, senza approvazione: https://fdc.nal.usda.gov/api-key-signup.html — DEMO_KEY funziona ma ha un limite di 30 richieste/ora, una chiave personale no
const USDA_MICRO_MAP = {
  fibre:'Fiber, total dietary', vitA:'Vitamin A, RAE', vitC:'Vitamin C, total ascorbic acid',
  vitD:'Vitamin D (D2 + D3)', vitE:'Vitamin E (alpha-tocopherol)', vitB12:'Vitamin B-12',
  folati:'Folate, total', calcio:'Calcium, Ca', ferro:'Iron, Fe', magnesio:'Magnesium, Mg',
  potassio:'Potassium, K', zinco:'Zinc, Zn', sodio:'Sodium, Na'
};

function mappaProdottiOFF(lista){
  return (lista||[])
    .filter(p=>p.product_name && p.nutriments && p.nutriments['energy-kcal_100g']!=null)
    .map(p=>{
      const { micro100, acqua100 } = estraiMicroOFF(p.nutriments);
      return {
        fonte:'off',
        nome: p.product_name,
        marca: p.brands ? p.brands.split(',')[0].trim() : '',
        kcal100: Math.round(p.nutriments['energy-kcal_100g']||0),
        prot100: Math.round((p.nutriments['proteins_100g']||0)*10)/10,
        carb100: Math.round((p.nutriments['carbohydrates_100g']||0)*10)/10,
        grassi100: Math.round((p.nutriments['fat_100g']||0)*10)/10,
        micro100, acqua100
      };
    });
}

async function cercaSuOpenFoodFactsLegacy(query){
  const url = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=24&sort_by=unique_scans_n&fields=product_name,brands,nutriments`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('OFF legacy http '+res.status);
  const data = await res.json();
  return mappaProdottiOFF(data.products);
}

async function cercaSuOpenFoodFacts(query){
  try{
    const url = `https://search.openfoodfacts.org/search?q=${encodeURIComponent(query)}&page_size=24&fields=product_name,brands,nutriments&sort_by=-unique_scans_n`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('search-a-licious http '+res.status);
    const data = await res.json();
    const hits = data.hits || data.products;
    if(!Array.isArray(hits)) throw new Error('formato di risposta inatteso');
    return mappaProdottiOFF(hits);
  }catch(e){
    // Degrado silenzioso sul vecchio endpoint: se anche questo fallisce,
    // l'errore risale al chiamante (Promise.allSettled in eseguiRicercaAlimento).
    return cercaSuOpenFoodFactsLegacy(query);
  }
}

// "MELE,CRUDE,CON BUCCIA" (tipico di Foundation/SR Legacy, tutto maiuscolo)
// -> "Mele,Crude,Con Buccia": più leggibile, senza toccare le voci "Branded"
// che di solito arrivano già con la capitalizzazione corretta.
function titleCaseSeTuttoMaiuscolo(s){
  if(!s) return s;
  const lettere = s.replace(/[^A-Za-zÀ-ÖØ-öø-ÿ]/g,'');
  const maiuscole = s.replace(/[^A-ZÀ-Ö]/g,'');
  if(lettere.length>3 && maiuscole.length/lettere.length>0.8){
    return s.toLowerCase().replace(/(^|[\s,\/])([a-zà-ÿ])/g, (m,p1,p2)=>p1+p2.toUpperCase());
  }
  return s;
}

async function cercaSuUSDA(query){
  if(!USDA_API_KEY) return [];
  const url = `https://api.nal.usda.gov/fdc/v1/foods/search?api_key=${USDA_API_KEY}&query=${encodeURIComponent(query)}&pageSize=15&dataType=Foundation,SR%20Legacy,Branded`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('USDA http '+res.status);
  const data = await res.json();
  return (data.foods||[]).map(f=>{
    const trovaValore = (nome, unitaAttesa) => {
      const n = (f.foodNutrients||[]).find(x=> x.nutrientName===nome && (!unitaAttesa || x.unitName===unitaAttesa));
      return (n && n.value!=null) ? n.value : null;
    };
    const kcal100 = trovaValore('Energy','KCAL');
    if(kcal100==null) return null; // scarta voci senza kcal, come già facciamo per OFF
    const micro100 = {};
    Object.keys(USDA_MICRO_MAP).forEach(k=>{ micro100[k] = trovaValore(USDA_MICRO_MAP[k]); });
    return {
      fonte:'usda',
      nome: titleCaseSeTuttoMaiuscolo(f.description),
      marca: f.brandOwner || '',
      kcal100: Math.round(kcal100),
      prot100: Math.round((trovaValore('Protein')||0)*10)/10,
      carb100: Math.round((trovaValore('Carbohydrate, by difference')||0)*10)/10,
      grassi100: Math.round((trovaValore('Total lipid (fat)')||0)*10)/10,
      micro100, acqua100: trovaValore('Water')
    };
  }).filter(Boolean);
}

// Unisce i risultati delle due fonti evitando doppioni ovvi (stesso nome+marca).
function dedupRisultatiAlimenti(lista){
  const visti = new Set();
  return lista.filter(p=>{
    const chiave = (p.nome+'|'+(p.marca||'')).toLowerCase().trim();
    if(visti.has(chiave)) return false;
    visti.add(chiave);
    return true;
  });
}

async function eseguiRicercaAlimento(){
  const input = document.getElementById('foodSearchInput');
  const query = input ? input.value.trim() : '';
  if(!query) return;
  ricercaAlimentoState.query = query;
  ricercaAlimentoState.loading = true;
  ricercaAlimentoState.errore = null;
  ricercaAlimentoState.risultati = [];
  renderCercaAlimento();

  const [off, usda] = await Promise.allSettled([
    cercaSuOpenFoodFacts(query),
    cercaSuUSDA(query)
  ]);

  if(off.status==='rejected' && usda.status==='rejected'){
    ricercaAlimentoState.errore = 'Ricerca non riuscita: controlla la connessione e riprova.';
  } else {
    const risultatiOFF = off.status==='fulfilled' ? off.value : [];
    const risultatiUSDA = usda.status==='fulfilled' ? usda.value : [];
    ricercaAlimentoState.risultati = dedupRisultatiAlimenti([...risultatiOFF, ...risultatiUSDA]).slice(0,40);
  }
  ricercaAlimentoState.loading = false;
  renderCercaAlimento();
}

/* Indovina in quale pasto della giornata si sta probabilmente per inserire
   l'alimento extra, in base all'ora attuale — così la domanda "che pasto è?"
   parte quasi sempre già sul valore giusto e basta confermare, invece di
   dover scegliere ogni volta da zero (come i pre-set orari di MyFitnessPal/
   Yazio). Resta comunque modificabile con un tap prima di salvare. */
function pastoSuggeritoOra(){
  const FASCE = [7.5, 11, 14, 20.5, 22.5]; // ora indicativa di colazione/spuntino/pranzo/cena/spuntino serale
  const ora = new Date();
  const h = ora.getHours() + ora.getMinutes()/60;
  let best = 0, bestDist = Infinity;
  FASCE.forEach((r,i)=>{
    const d = Math.abs(h-r);
    if(d < bestDist){ bestDist = d; best = i; }
  });
  return best;
}

async function salvaAlimentoCustom(){
  const nome = document.getElementById('caNome').value.trim();
  const errBox = document.getElementById('caError');
  const btn = document.getElementById('salvaAlimentoCustomBtn');
  errBox.innerHTML = '';

  const kcal = Number(document.getElementById('caKcal').value);
  const prot = Number(document.getElementById('caProt').value);
  const carb = Number(document.getElementById('caCarb').value);
  const grassi = Number(document.getElementById('caGrassi').value);
  const fibreRaw = document.getElementById('caFibre').value;
  const fibre = fibreRaw ? Number(fibreRaw) : null;

  if(!nome){ errBox.innerHTML = '<div class="error-banner">Dai un nome all\'alimento.</div>'; return; }
  if([kcal,prot,carb,grassi].some(v=> isNaN(v) || v<0)){
    errBox.innerHTML = '<div class="error-banner">Controlla i valori numerici inseriti.</div>';
    return;
  }

  let kcal100, prot100, carb100, grassi100, fibre100;
  if(creaAlimentoModalita==='porzione'){
    const peso = Number(document.getElementById('caPeso').value);
    if(isNaN(peso) || peso<=0){
      errBox.innerHTML = '<div class="error-banner">Inserisci il peso totale della porzione (in grammi).</div>';
      return;
    }
    const fattore = 100/peso;
    kcal100 = Math.round(kcal*fattore);
    prot100 = Math.round(prot*fattore*10)/10;
    carb100 = Math.round(carb*fattore*10)/10;
    grassi100 = Math.round(grassi*fattore*10)/10;
    fibre100 = fibre!=null ? Math.round(fibre*fattore*10)/10 : null;
  } else {
    kcal100 = kcal; prot100 = prot; carb100 = carb; grassi100 = grassi; fibre100 = fibre;
  }

  btn.disabled = true; btn.textContent = 'Salvataggio...';
  try{
    const payload = { nome, kcal100, prot100, carb100, grassi100, fibre100, creato: new Date().toISOString() };
    const ref = await userCollection('alimentiPersonalizzati').add(payload);
    cache.alimentiPersonalizzati.push({ id: ref.id, ...payload });
    setRoute({name:'cerca-alimento'});
  }catch(e){
    errBox.innerHTML = `<div class="error-banner">${e.message}</div>`;
    btn.disabled = false; btn.textContent = 'Salva';
  }
}

function confermaAggiungiAlimento(){
  const p = ricercaAlimentoState.selezionato;
  const g = ricercaAlimentoState.grammi;
  const fattore = g/100;
  // pastoIdx dovrebbe sempre avere un valore (suggerito in base all'ora quando
  // si seleziona l'alimento), ma per sicurezza degrada su "Colazione" invece
  // di bloccare il salvataggio se per qualche motivo manca.
  const pastoIdx = ricercaAlimentoState.pastoIdx!=null ? ricercaAlimentoState.pastoIdx : 0;
  aggiungiAlimentoExtra({
    id: 'extra-'+Date.now(),
    nome: p.nome,
    marca: p.marca,
    grammi: g,
    kcal: Math.round(p.kcal100*fattore),
    prot: Math.round(p.prot100*fattore*10)/10,
    carb: Math.round(p.carb100*fattore*10)/10,
    grassi: Math.round(p.grassi100*fattore*10)/10,
    pasto: pastoIdx
  });
  // Aggiungere un alimento extra a un pasto conta come "aver fatto" quel
  // pasto: se non era già segnato lo spuntiamo qui, con lo stesso snapshot
  // (opzione del piano attualmente selezionata) che userebbe la spunta
  // manuale — coerente col diario storico. Se il pasto era già segnato non
  // tocchiamo lo snapshot esistente.
  segnaPastoFattoDaExtra(pastoIdx);
  registraAlimentoRecente(p);
  ricercaAlimentoState = { query:'', loading:false, risultati:[], errore:null, selezionato:null, grammi:100, pastoIdx:null };
  setRoute({name:'alimentazione'});
}

function segnaPastoFattoDaExtra(pastoIdx){
  if(pastoIdx==null || pastoIdx<0 || pastoIdx>=DIETA_PIANO.pasti.length) return;
  if(cache.dietaLogOggi.pastiFatti[pastoIdx]) return; // già segnato (piano o extra precedente): non toccare nulla
  // Il pasto non era ancora segnato: l'alimento extra SOSTITUISCE l'opzione
  // del piano per questo pasto (non si somma ad essa). Segniamo "fatto" e
  // marchiamo pastiViaExtra così il calcolo di oggi (renderAlimentazione)
  // non aggiunge anche le kcal dell'opzione del piano — le kcal reali sono
  // già contate tramite l'alimento extra stesso.
  cache.dietaLogOggi.pastiFatti[pastoIdx] = true;
  if(!cache.dietaLogOggi.pastiViaExtra) cache.dietaLogOggi.pastiViaExtra = {};
  cache.dietaLogOggi.pastiViaExtra[pastoIdx] = true;
  if(!cache.dietaLogOggi.pastiSnapshot) cache.dietaLogOggi.pastiSnapshot = {};
  cache.dietaLogOggi.pastiSnapshot[pastoIdx] = { titolo:'Sostituito con alimento extra', kcal:0, prot:0, carb:0, grassi:0, viaExtra:true };
  salvaDietaLogOggi();
}

/* Scorciatoia per i cibi che si ripetono spesso: tiene gli ultimi 8 alimenti
   aggiunti (per valore/100g, non per grammatura specifica) sul profilo, così
   la prossima volta non serve ricercarli da capo. */
function registraAlimentoRecente(p){
  if(!profiloUtente) return;
  const chiave = a => (a.nome+'|'+(a.marca||'')).toLowerCase();
  const voce = { nome:p.nome, marca:p.marca||'', kcal100:p.kcal100, prot100:p.prot100, carb100:p.carb100, grassi100:p.grassi100, micro100:p.micro100||{}, acqua100:(p.acqua100!=null?p.acqua100:null) };
  let lista = (profiloUtente.alimentiRecenti || []).filter(a=> chiave(a)!==chiave(voce));
  lista.unshift(voce);
  lista = lista.slice(0,8);
  profiloUtente.alimentiRecenti = lista;
  db.collection('users').doc(currentUid).set({ alimentiRecenti: lista }, { merge:true }).catch(()=>{});
}

/* ============ SCANNER CODICE A BARRE ============
   Libreria "html5-qrcode" caricata solo quando serve (non appesantisce il
   caricamento iniziale dell'app), usa la fotocamera per leggere il codice
   e poi cerca il prodotto per barcode su Open Food Facts. Funziona sia su
   Android che su iOS/Safari (a differenza della BarcodeDetector nativa, non
   supportata da Safari). */
let barcodeScanner = null;
let barcodeLibCaricata = false;

function caricaLibreriaBarcode(){
  return new Promise((resolve, reject)=>{
    if(barcodeLibCaricata && window.Html5Qrcode){ resolve(); return; }
    const script = document.createElement('script');
    script.src = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
    script.onload = ()=>{ barcodeLibCaricata = true; resolve(); };
    script.onerror = ()=> reject(new Error('lib non caricata'));
    document.head.appendChild(script);
  });
}

function renderScansionaBarcode(){
  pageTitle.textContent = 'Scansiona codice a barre';
  view.innerHTML = `
    <div class="card" style="text-align:center;">
      <p class="field-hint" style="margin:0 0 14px;">Inquadra il codice a barre del prodotto, tienilo fermo e ben illuminato.</p>
      <div id="barcodeReader" class="barcode-reader"></div>
      <p id="barcodeStatus" class="field-hint" style="margin-top:14px;min-height:18px;"></p>
      <button class="btn secondary" style="width:100%;margin-top:6px;" onclick="setRoute({name:'cerca-alimento'})">Annulla</button>
    </div>`;
  avviaScannerBarcode();
}

async function avviaScannerBarcode(){
  const stato = document.getElementById('barcodeStatus');
  try{
    if(stato) stato.innerHTML = '<span class="spinner-inline"></span>Avvio fotocamera...';
    await caricaLibreriaBarcode();
    if(route.name!=='scansiona-barcode') return; // l'utente ha già cambiato pagina
    barcodeScanner = new Html5Qrcode('barcodeReader', {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.CODE_128
      ],
      verbose:false
    });
    await barcodeScanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 260, height: 150 } },
      onBarcodeRilevato,
      ()=>{} // "errore" per singolo frame non decodificato: normale mentre cerca il codice, si ignora
    );
    const stato2 = document.getElementById('barcodeStatus');
    if(stato2) stato2.textContent = '';
  }catch(e){
    const stato3 = document.getElementById('barcodeStatus');
    if(stato3) stato3.textContent = 'Non riesco ad accedere alla fotocamera: controlla di aver dato il permesso al browser, oppure usa la ricerca per nome.';
  }
}

function fermaScannerBarcode(){
  if(barcodeScanner){
    const s = barcodeScanner;
    barcodeScanner = null;
    s.stop().then(()=> s.clear()).catch(()=>{});
  }
}

async function onBarcodeRilevato(codice){
  if(!barcodeScanner) return; // già gestito o pagina cambiata, evita doppio trigger
  fermaScannerBarcode();
  const stato = document.getElementById('barcodeStatus');
  if(stato) stato.innerHTML = `<span class="spinner-inline"></span>Codice ${codice} trovato: cerco il prodotto...`;
  try{
    const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${codice}.json`);
    const data = await res.json();
    const nutr = data.product && data.product.nutriments;
    if(data.status !== 1 || !nutr || nutr['energy-kcal_100g']==null){
      if(stato) stato.textContent = `Nessun dato nutrizionale trovato per il codice ${codice}. Prova con la ricerca per nome.`;
      return;
    }
    const p = data.product;
    const { micro100, acqua100 } = estraiMicroOFF(nutr);
    ricercaAlimentoState.selezionato = {
      nome: p.product_name || 'Prodotto senza nome',
      marca: p.brands ? p.brands.split(',')[0].trim() : '',
      kcal100: Math.round(nutr['energy-kcal_100g']||0),
      prot100: Math.round((nutr['proteins_100g']||0)*10)/10,
      carb100: Math.round((nutr['carbohydrates_100g']||0)*10)/10,
      grassi100: Math.round((nutr['fat_100g']||0)*10)/10,
      micro100, acqua100
    };
    ricercaAlimentoState.grammi = 100;
    ricercaAlimentoState.pastoIdx = pastoSuggeritoOra();
    setRoute({name:'cerca-alimento'});
  }catch(e){
    if(stato) stato.textContent = 'Errore nella ricerca del prodotto. Riprova o usa la ricerca per nome.';
  }
}

// Stima % massa grassa col metodo US Navy: serve altezza+sesso dal profilo,
// vita+collo dalla rilevazione (fianchi in più per le donne). Torna null se
// manca anche un solo dato necessario: e' una stima indicativa per seguire
// il trend nel tempo, non un valore clinico preciso.
function stimaMassaGrassa(m){
  if(!profiloUtente || !profiloUtente.altezza || !profiloUtente.sesso) return null;
  if(m.vita==null || m.collo==null) return null;
  const altezza = profiloUtente.altezza;
  if(profiloUtente.sesso==='F'){
    if(m.fianchi==null) return null;
    const base = m.vita + m.fianchi - m.collo;
    if(base<=0) return null;
    const bf = 495/(1.29579 - 0.35004*Math.log10(base) + 0.22100*Math.log10(altezza)) - 450;
    return isFinite(bf) ? bf : null;
  }
  const base = m.vita - m.collo;
  if(base<=0) return null;
  const bf = 495/(1.0324 - 0.19077*Math.log10(base) + 0.15456*Math.log10(altezza)) - 450;
  return isFinite(bf) ? bf : null;
}

// Valore di una metrica misure per un punto dato: gestisce sia i campi diretti
// sia quelli "calcolati" (per ora solo bfStimata) in modo uniforme per i grafici.
function valoreMetricaMisura(key, m){
  if(key==='bfStimata') return stimaMassaGrassa(m);
  return (m[key]!=null && m[key]!=='') ? Number(m[key]) : null;
}

/* Segnala differenze Dx/Sx sopra una soglia (5% sulla media dei due lati) tra
   le coppie di misure già raccolte. E' solo un campanello d'allarme da tenere
   d'occhio nel tempo, non una diagnosi: piccole differenze di lato dominante
   sono normali, quello che conta è se la differenza cresce nel tempo. */
function rilevaAsimmetrie(m){
  const SOGLIA_PCT = 5;
  const coppie = [['braccioDx','braccioSx','Braccia'], ['cosciaDx','cosciaSx','Cosce']];
  const risultati = [];
  coppie.forEach(([dx,sx,label])=>{
    if(m[dx]==null || m[sx]==null) return;
    const media = (m[dx]+m[sx])/2;
    if(media<=0) return;
    const diff = m[dx]-m[sx];
    const pct = Math.abs(diff)/media*100;
    if(pct >= SOGLIA_PCT){
      risultati.push({ label, dx:m[dx], sx:m[sx], pct: Math.round(pct*10)/10, lato: diff>0?'destro':'sinistro' });
    }
  });
  return risultati;
}

// Ridimensiona/comprime l'immagine lato client cosi' il base64 resta ben sotto il limite di 1MB per documento Firestore
function resizeImage(file, maxSize, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if(width > height && width > maxSize){ height = height * (maxSize/width); width = maxSize; }
        else if(height > maxSize){ width = width * (maxSize/height); height = maxSize; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality || 0.7));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Come resizeImage, ma parte gia' da un data URL (usato per ricalcolare la
// miniatura in fase di modifica senza dover riscaricare/riconvertire un File).
function resizeDataUrl(dataUrl, maxSize, quality){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      let { width, height } = img;
      if(width > height && width > maxSize){ height = height * (maxSize/width); width = maxSize; }
      else if(height > maxSize){ width = width * (maxSize/height); height = maxSize; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', quality || 0.7));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

async function salvaMisura(){
  const data = document.getElementById('mData').value || new Date().toISOString().slice(0,10);
  const peso = document.getElementById('mPeso').value;
  const vita = document.getElementById('mVita').value;
  const petto = document.getElementById('mPetto').value;
  const fianchi = document.getElementById('mFianchi').value;
  const collo = document.getElementById('mCollo').value;
  const braccioDx = document.getElementById('mBraccioDx').value;
  const braccioSx = document.getElementById('mBraccioSx').value;
  const cosciaDx = document.getElementById('mCosciaDx').value;
  const cosciaSx = document.getElementById('mCosciaSx').value;
  const sonno = document.getElementById('mSonno').value;
  // Ci sono due pulsanti di salvataggio (peso rapido in cima e misurazione
  // completa in fondo alla sezione a comparsa): li gestiamo entrambi qui,
  // qualunque sia stato quello cliccato, cosi' l'utente vede lo stato di
  // salvataggio sul pulsante giusto.
  const btns = [document.getElementById('saveMisuraBtnRapido'), document.getElementById('saveMisuraBtnCompleta')].filter(Boolean);
  const errBox = document.getElementById('misuraError');
  errBox.innerHTML = '';

  const RANGE_PLAUSIBILI = {
    'Peso':[peso,20,400], 'Vita':[vita,40,200], 'Petto':[petto,40,200], 'Fianchi':[fianchi,40,200],
    'Collo':[collo,20,60],
    'Braccio Dx':[braccioDx,10,80], 'Braccio Sx':[braccioSx,10,80],
    'Coscia Dx':[cosciaDx,20,100], 'Coscia Sx':[cosciaSx,20,100],
    'Ore di sonno':[sonno,0,16]
  };
  for(const label in RANGE_PLAUSIBILI){
    const [valore, min, max] = RANGE_PLAUSIBILI[label];
    if(valore!==''){
      const n = Number(valore);
      if(isNaN(n) || n < min || n > max){
        errBox.innerHTML = `<div class="error-banner">Il valore inserito per "${label}" non sembra plausibile (${min}–${max}). Controllalo prima di salvare.</div>`;
        return;
      }
    }
  }

  btns.forEach(b=>{ b.dataset.origText = b.textContent; b.disabled = true; b.textContent = 'Salvataggio...'; });
  try{
    // Le foto a piena qualita' vanno ognuna nel proprio documento (collezione
    // "misureFoto"), cosi' ognuna puo' restare ben leggibile senza rischiare
    // di sforare il limite di 1MB per documento Firestore mettendole tutte
    // insieme nella rilevazione. Sulla rilevazione teniamo solo una miniatura
    // piccola (fotoThumb) della prima foto disponibile, per l'anteprima nello storico.
    const slotOccupati = misuraFotoFiles
      .map((file,i)=> file ? {i, file} : null)
      .filter(Boolean);

    let fotoThumb = null;
    if(slotOccupati.length){
      fotoThumb = await resizeImage(slotOccupati[0].file, 160, 0.55);
    }

    const payload = {
      data,
      peso: peso ? Number(peso) : null,
      vita: vita ? Number(vita) : null,
      petto: petto ? Number(petto) : null,
      fianchi: fianchi ? Number(fianchi) : null,
      collo: collo ? Number(collo) : null,
      braccioDx: braccioDx ? Number(braccioDx) : null,
      braccioSx: braccioSx ? Number(braccioSx) : null,
      cosciaDx: cosciaDx ? Number(cosciaDx) : null,
      cosciaSx: cosciaSx ? Number(cosciaSx) : null,
      sonno: sonno ? Number(sonno) : null,
      fotoThumb
    };
    const ref = await userCollection('misure').add(payload);

    for(const {i, file} of slotOccupati){
      const fotoDataUrl = await resizeImage(file, 900, 0.72);
      await userCollection('misureFoto').add({ misuraId: ref.id, ordine: i, foto: fotoDataUrl });
    }

    cache.misure.push({ id: ref.id, ...payload });
    cache.misure.sort((a,b)=> new Date(a.data)-new Date(b.data));
    setRoute({name:'storico-misure', justSaved:true});
  }catch(e){
    errBox.innerHTML = `<div class="error-banner">${e.message}</div>`;
    btns.forEach(b=>{ b.disabled = false; b.textContent = b.dataset.origText || 'Salva'; });
  }
}

async function eliminaMisura(id){
  if(!(await mostraConferma('Eliminare questa rilevazione?'))) return;
  try{
    const fotoSnap = await userCollection('misureFoto').where('misuraId','==',id).get();
    await Promise.all(fotoSnap.docs.map(d=> d.ref.delete()));
    await userCollection('misure').doc(id).delete();
    cache.misure = cache.misure.filter(m=>m.id!==id);
    setRoute({name:'storico-misure'});
  }catch(e){ alert('Errore: '+e.message); }
}

async function caricaFotoMisura(m){
  const grid = document.getElementById('misuraFotoGrid');
  try{
    const snap = await userCollection('misureFoto').where('misuraId','==',m.id).get();
    // Se la sessione e' cambiata pagina nel frattempo, non tocchiamo un DOM che non esiste piu'.
    if(!document.getElementById('misuraFotoGrid') || route.name!=='misura-detail' || route.id!==m.id) return;

    let foto = snap.docs.map(d=>d.data()).sort((a,b)=> (a.ordine||0)-(b.ordine||0));
    if(!foto.length && m.foto){ foto = [{ordine:0, foto:m.foto}]; } // compatibilita' con rilevazioni salvate prima di questa funzione

    if(!foto.length){
      grid.innerHTML = `<p class="empty" style="padding:10px 0;">Nessuna foto per questa rilevazione.</p>`;
      return;
    }
    grid.innerHTML = renderCaroselloFoto(foto, 'misuraFoto');
    initCarosello('misuraFoto', foto.length);
  }catch(e){
    if(document.getElementById('misuraFotoGrid')) grid.innerHTML = `<div class="error-banner">Errore nel caricamento delle foto: ${e.message}</div>`;
  }
}
