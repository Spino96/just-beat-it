<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just Beat It</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#14161a;
    --panel:#1d2026;
    --panel-2:#252932;
    --border:#33384333;
    --text:#eef0f3;
    --text-dim:#9aa1ad;
    --accent:#5ee6c8;
    --accent-2:#ff8a5c;
    --danger:#ff6b6b;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  #app{max-width:560px;margin:0 auto;padding:0 0 60px;min-height:100vh;}
  header{
    position:sticky;top:0;z-index:10;
    background:linear-gradient(180deg,var(--bg) 80%,transparent);
    padding:18px 18px 10px;
    display:flex;align-items:center;gap:10px;
  }
  header h1{font-size:18px;margin:0;font-weight:700;flex:1;}
  .back-btn{
    background:var(--panel-2);border:none;color:var(--text);
    width:34px;height:34px;border-radius:10px;font-size:16px;cursor:pointer;
  }
  .logout-btn{
    background:none;border:none;color:var(--text-dim);font-size:12.5px;cursor:pointer;
    text-decoration:underline;
  }
  main{padding:6px 18px 30px;}
  .card{
    background:var(--panel);border:1px solid var(--border);
    border-radius:var(--radius);padding:18px;margin-bottom:14px;
  }
  .home-cat{
    display:flex;align-items:center;gap:14px;
    padding:20px;margin-bottom:14px;border-radius:var(--radius);
    background:var(--panel);border:1px solid var(--border);
    cursor:pointer;transition:transform .15s ease;
  }
  .home-cat:active{transform:scale(.98);}
  .home-cat .icon{
    width:46px;height:46px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;font-size:22px;
    background:var(--panel-2);
  }
  .home-cat .label{font-size:17px;font-weight:700;}
  .home-cat .sub{font-size:12.5px;color:var(--text-dim);margin-top:2px;}
  .list-item{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:16px;margin-bottom:10px;cursor:pointer;
  }
  .list-item:active{opacity:.8;}
  .list-item h3{margin:0 0 4px;font-size:15.5px;}
  .list-item p{margin:0;font-size:12.5px;color:var(--text-dim);}
  .pill{
    display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;
    background:var(--panel-2);color:var(--accent);margin-right:6px;
  }
  .btn{
    background:var(--accent);color:#0a0f0d;border:none;border-radius:12px;
    padding:13px 18px;font-size:14.5px;font-weight:700;cursor:pointer;width:100%;
  }
  .btn.secondary{background:var(--panel-2);color:var(--text);}
  .btn.small{width:auto;padding:8px 14px;font-size:13px;}
  .btn.danger{background:var(--danger);color:#1a0000;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .exercise-card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;margin-bottom:12px;
  }
  .exercise-card h3{margin:0 0 2px;font-size:16px;}
  .ex-meta{font-size:12.5px;color:var(--text-dim);margin-bottom:10px;}
  .set-row{
    display:grid;grid-template-columns:28px 1fr 1fr 34px;gap:8px;align-items:center;
    margin-bottom:8px;
  }
  .set-row span{font-size:13px;color:var(--text-dim);}
  .set-row input[type=number], .set-row input[type=text]{
    width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:9px 8px;font-size:14px;
  }
  .set-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);}
  .note-box{
    font-size:12.5px;color:var(--text-dim);background:var(--panel-2);
    border-radius:10px;padding:10px 12px;margin-top:8px;line-height:1.5;
  }
  .toggle-guide{
    background:none;border:none;color:var(--accent);font-size:12.5px;
    padding:6px 0 0;cursor:pointer;font-weight:600;
  }
  .guide-body{display:none;margin-top:8px;font-size:13px;line-height:1.55;color:var(--text-dim);}
  .guide-body.open{display:block;}
  .guide-body b{color:var(--text);}
  .warm-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid var(--border);
  }
  .warm-item:last-child{border-bottom:none;}
  .warm-item .l{font-size:14px;}
  .warm-item .r{font-size:12px;color:var(--text-dim);}
  .timer-bar{
    position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:var(--panel-2);border-top:1px solid var(--border);
    padding:14px 18px;display:flex;align-items:center;gap:14px;
    max-width:560px;margin:0 auto;
  }
  .timer-bar .t{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent);}
  .timer-bar .lbl{flex:1;font-size:13px;color:var(--text-dim);}
  input, textarea{font-family:inherit;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:5px;}
  .field input, .field textarea{
    width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:11px 12px;font-size:14.5px;
  }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .empty{text-align:center;color:var(--text-dim);font-size:13.5px;padding:30px 10px;}
  .photo-thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;}
  canvas.chart-canvas{max-width:100%;}
  .chip-select{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{
    padding:8px 14px;border-radius:20px;background:var(--panel-2);color:var(--text-dim);
    font-size:12.5px;cursor:pointer;border:1px solid var(--border);
  }
  .chip.active{background:var(--accent);color:#0a0f0d;border-color:var(--accent);}
  .success-banner{
    background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#0a0f0d;
    padding:20px;border-radius:var(--radius);text-align:center;font-weight:700;margin-bottom:14px;
  }
  .error-banner{
    background:var(--danger);color:#1a0000;padding:12px 16px;border-radius:12px;
    font-size:13.5px;margin-bottom:12px;font-weight:600;
  }
  #loginScreen, #onboardingScreen{
    max-width:360px;margin:18vh auto 0;padding:0 24px;text-align:center;
  }
  #loginScreen h1, #onboardingScreen h1{font-size:22px;margin-bottom:6px;}
  #loginScreen p, #onboardingScreen p{color:var(--text-dim);font-size:13.5px;margin-bottom:24px;}
  #loginScreen .card, #onboardingScreen .card{text-align:left;}
  .spinner-wrap{display:flex;justify-content:center;padding:60px 0;color:var(--text-dim);font-size:13.5px;}
</style>
</head>
<body>

<div id="loginScreen">
  <h1>🏋️ Just Beat It</h1>
  <p>Accedi con il tuo profilo per vedere la scheda e i tuoi progressi.</p>
  <div class="card">
    <div id="loginError"></div>
    <div class="field"><label>Email</label><input type="email" id="loginUser" autocomplete="username"></div>
    <div class="field"><label>Password</label><input type="password" id="loginPass" autocomplete="current-password"></div>
    <button class="btn" id="loginBtn" onclick="doLogin()">Accedi</button>
  </div>
</div>

<div id="onboardingScreen" style="display:none;">
  <h1>🏋️ Just Beat It</h1>
  <p>Prima di iniziare, dicci qualcosa su di te.</p>
  <div class="card">
    <div id="onboardingError"></div>
    <div class="field"><label>Nome</label><input type="text" id="obNome" autocomplete="given-name"></div>
    <div class="field"><label>Cognome</label><input type="text" id="obCognome" autocomplete="family-name"></div>
    <div class="field"><label>Età</label><input type="number" id="obEta" min="10" max="100"></div>
    <button class="btn" id="onboardingBtn" onclick="salvaProfilo()">Continua</button>
  </div>
</div>

<div id="app" style="display:none;">
  <header>
    <button class="back-btn" id="backBtn" style="visibility:hidden">‹</button>
    <h1 id="pageTitle">Just Beat It</h1>
    <button class="logout-btn" onclick="logout()">Esci</button>
  </header>
  <main id="view"></main>
</div>

<script>
/* ============ CONFIGURAZIONE FIREBASE ============ */
const firebaseConfig = {
  apiKey: "AIzaSyAmuJZebX_JI87JltjigBxG5jGHQJmjcxk",
  authDomain: "just-beat-it-76154.firebaseapp.com",
  projectId: "just-beat-it-76154",
  storageBucket: "just-beat-it-76154.firebasestorage.app",
  messagingSenderId: "528385840519",
  appId: "1:528385840519:web:f27dd04596a0c432f4af22",
  measurementId: "G-7XKHZW21MK"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* ============ DATI SCHEDA (aggiornabile in futuro: aggiungere nuovi blocchi qui) ============ */
const SCHEDE = [
  {
    id: 'blocco1',
    nome: 'Blocco 1 — Risveglio muscolare',
    periodo: '2 settimane · 3x/settimana · Full body',
    note: 'Tecnica e mobilità, carichi leggeri. Attenzione spalla sinistra: niente lento avanti/military press né alzate laterali pesanti in questo blocco.',
    riscaldamento: [
      {nome:'Cat-cow', serie:'8-10 ripetizioni', note:'Mobilizza la colonna dopo ore in piedi/curvo al bancone'},
      {nome:'Affondo con rotazione toracica', serie:'5-6 per lato', note:'Apre anca e torace insieme'},
      {nome:'Leg swings', serie:'10 per lato', note:'Sblocca l\'anca prima di leg press/squat'},
      {nome:'Band pull-apart / rotazioni spalle', serie:'10-15 ripetizioni', note:'Riattiva i muscoli posteriori della spalla — utile per la spalla sinistra'},
      {nome:'Caviglia contro muro', serie:'5-6 per lato', note:'Migliora la profondità in leg press/squat'}
    ],
    esercizi: [
      {
        nome:'Leg Press 45°', serieTarget:3, ripTarget:'12', recupero:90,
        note:'Spinta controllata, non bloccare le ginocchia in alto, talloni sempre a contatto con la pedana',
        alternativa:'Squat a corpo libero',
        guida:{
          muscoli:'Quadricipiti, glutei, femorali (secondari).',
          esecuzione:'Siediti con schiena e bacino aderenti allo schienale. Piedi sulla pedana all\'altezza delle spalle. Scendi controllato fino a circa 90° di flessione senza staccare i talloni, poi spingi senza bloccare le ginocchia a fine corsa.',
          errori:'Non staccare i talloni, non avvicinare troppo le ginocchia, non bloccare le ginocchia in estensione completa. Espira spingendo, inspira scendendo.'
        }
      },
      {
        nome:'Chest Press (macchina)', serieTarget:3, ripTarget:'10-12', recupero:90,
        note:'Scapole leggermente indietro, il gomito non si blocca in fondo alla spinta',
        alternativa:'Push-up sulle ginocchia',
        guida:{
          muscoli:'Pettorali, spalle anteriori e tricipiti (secondari).',
          esecuzione:'Sedile regolato con maniglie all\'altezza del petto. Scapole leggermente retratte. Spingi in avanti senza bloccare i gomiti, torna con controllo senza far cadere le spalle in avanti.',
          errori:'Preferita alla panca per la spalla sinistra: più stabile. Evita di far collassare le spalle in avanti e non spingere a scatti.'
        }
      },
      {
        nome:'Lat Machine presa neutra', serieTarget:3, ripTarget:'10-12', recupero:90,
        note:'Tira con la schiena, non con le braccia; mai dietro la nuca',
        alternativa:'Pulldown con la corda',
        guida:{
          muscoli:'Gran dorsale, bicipiti (secondari).',
          esecuzione:'Cosce bloccate sotto il supporto, presa neutra poco più larga delle spalle. Tira verso l\'alto del petto portando i gomiti in basso/indietro, busto quasi verticale. Torna su con controllo.',
          errori:'Non tirare dietro la nuca, non usare lo slancio della schiena, non tirare solo con le braccia.'
        }
      },
      {
        nome:'Leg Curl', serieTarget:3, ripTarget:'12-15', recupero:90,
        note:'Eccentrica lenta (circa 3 secondi in fase di ritorno)',
        alternativa:'—',
        guida:{
          muscoli:'Femorali (parte posteriore della coscia).',
          esecuzione:'Cuscinetto superiore sopra le ginocchia, inferiore dietro le caviglie. Fletti portando il cuscinetto verso i glutei, torna con eccentrica lenta di circa 3 secondi.',
          errori:'Non inarcare la schiena sollevando il bacino, non lasciare che il ritorno sia incontrollato.'
        }
      },
      {
        nome:'Hip Thrust (multipower)', serieTarget:3, ripTarget:'12', recupero:90,
        note:'Utile anche per chi sta tante ore in piedi: rinforza glutei e bacino',
        alternativa:'Ponte glutei a corpo libero',
        guida:{
          muscoli:'Glutei principalmente, femorali e core di supporto.',
          esecuzione:'Scapole appoggiate al bordo di una panca, ginocchia piegate. Bilanciere sopra le anche (con cuscinetto). Spingi le anche in alto fino ad allineare ginocchia-bacino-spalle, scendi con controllo.',
          errori:'Non iperestendere la schiena in cima: fermati quando bacino e spalle sono allineati.'
        }
      },
      {
        nome:'Plank', serieTarget:3, ripTarget:'20-30"', recupero:60,
        note:'Pancia in tensione, non inarcare la parte bassa della schiena',
        alternativa:'Plank sulle ginocchia',
        guida:{
          muscoli:'Addome nel complesso, spalle e glutei per la stabilità.',
          esecuzione:'Appoggio su avambracci e punte dei piedi, gomiti sotto le spalle. Corpo in linea retta da spalle a caviglie. Respira regolarmente.',
          errori:'Meglio 15" ben fatti che 30" con la schiena che cede. Non far cadere i fianchi.'
        }
      }
    ]
  }
];

/* ============ AUTH + FIRESTORE ============ */
const cache = { sessioni: [], misure: [] };
let currentUid = null;
let profiloUtente = null;

function userCollection(name){
  return db.collection('users').doc(currentUid).collection(name);
}

/* Controlla se esiste gia' un profilo (nome/cognome/eta) per l'utente loggato.
   Ritorna true se completo, false se manca (e in quel caso mostra il form di onboarding). */
async function checkProfilo(){
  const snap = await db.collection('users').doc(currentUid).get();
  const data = snap.exists ? snap.data() : {};
  if(data.nome && data.cognome && data.eta){
    profiloUtente = { nome:data.nome, cognome:data.cognome, eta:data.eta };
    return true;
  }
  document.getElementById('obNome').value = data.nome || '';
  document.getElementById('obCognome').value = data.cognome || '';
  document.getElementById('obEta').value = data.eta || '';
  return false;
}

async function salvaProfilo(){
  const nome = document.getElementById('obNome').value.trim();
  const cognome = document.getElementById('obCognome').value.trim();
  const eta = document.getElementById('obEta').value;
  const errBox = document.getElementById('onboardingError');
  const btn = document.getElementById('onboardingBtn');
  errBox.innerHTML = '';
  if(!nome || !cognome || !eta){
    errBox.innerHTML = '<div class="error-banner">Compila tutti i campi.</div>';
    return;
  }
  btn.disabled = true; btn.textContent = 'Salvataggio...';
  try{
    await db.collection('users').doc(currentUid).set({ nome, cognome, eta: Number(eta) }, { merge:true });
    profiloUtente = { nome, cognome, eta: Number(eta) };
    document.getElementById('onboardingScreen').style.display = 'none';
    await avviaApp();
  }catch(e){
    errBox.innerHTML = `<div class="error-banner">${e.message}</div>`;
    btn.disabled = false; btn.textContent = 'Continua';
  }
}

async function doLogin(){
  const email = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const errBox = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  errBox.innerHTML = '';
  if(!email || !password){
    errBox.innerHTML = '<div class="error-banner">Inserisci email e password.</div>';
    return;
  }
  btn.disabled = true; btn.textContent = 'Accesso...';
  try{
    await auth.signInWithEmailAndPassword(email, password);
    // onAuthStateChanged si occupa del resto
  }catch(e){
    errBox.innerHTML = `<div class="error-banner">${mapAuthError(e)}</div>`;
    btn.disabled = false; btn.textContent = 'Accedi';
  }
}

function mapAuthError(e){
  const code = e.code || '';
  if(code.includes('invalid-credential') || code.includes('wrong-password') || code.includes('user-not-found')) return 'Email o password non corrette.';
  if(code.includes('too-many-requests')) return 'Troppi tentativi, riprova tra poco.';
  if(code.includes('invalid-email')) return 'Email non valida.';
  return 'Errore di accesso: ' + (e.message || code);
}

function logout(){
  auth.signOut();
}

async function loadData(){
  const [sessioniSnap, misureSnap] = await Promise.all([
    userCollection('sessioni').orderBy('data','asc').get(),
    userCollection('misure').orderBy('data','asc').get()
  ]);
  cache.sessioni = sessioniSnap.docs.map(d => ({ id:d.id, ...d.data() }));
  cache.misure = misureSnap.docs.map(d => ({ id:d.id, ...d.data() }));
}

/* ============ STATO / NAVIGAZIONE ============ */
let route = {name:'home'};
let sessionDraft = null;
let restTimerHandle = null;

const view = document.getElementById('view');
const pageTitle = document.getElementById('pageTitle');
const backBtn = document.getElementById('backBtn');

backBtn.addEventListener('click', ()=>{
  if(route.name==='sessione'){
    if(!confirm('Uscire? Il progresso di questa sessione andrà perso se non la salvi.')) return;
  }
  goHome();
});

function goHome(){ route={name:'home'}; render(); }
function setRoute(r){ route=r; render(); }

function render(){
  clearRestTimer();
  backBtn.style.visibility = route.name==='home' ? 'hidden':'visible';
  if(route.name==='home') renderHome();
  else if(route.name==='allenamento-list') renderAllenamentoList();
  else if(route.name==='sessione') renderSessione();
  else if(route.name==='progressi') renderProgressi();
  else if(route.name==='progressi-detail') renderProgressiDetail();
  else if(route.name==='misure') renderMisure();
}

/* ============ HOME ============ */
function renderHome(){
  pageTitle.textContent = 'Just Beat It';
  const saluto = profiloUtente ? `<p style="color:var(--text-dim);font-size:13.5px;margin:0 0 14px;">Ciao, ${profiloUtente.nome} 👋</p>` : '';
  view.innerHTML = `
    ${saluto}
    <div class="home-cat" onclick="setRoute({name:'allenamento-list'})">
      <div class="icon">🏋️</div>
      <div><div class="label">Allenamento</div><div class="sub">Scegli una scheda e inizia la seduta</div></div>
    </div>
    <div class="home-cat" onclick="setRoute({name:'progressi'})">
      <div class="icon">📈</div>
      <div><div class="label">Progressi</div><div class="sub">Storico sedute e andamento carichi</div></div>
    </div>
    <div class="home-cat" onclick="setRoute({name:'misure'})">
      <div class="icon">📏</div>
      <div><div class="label">Misure</div><div class="sub">Peso, circonferenze e foto nel tempo</div></div>
    </div>
  `;
}

/* ============ ALLENAMENTO: lista schede ============ */
function renderAllenamentoList(){
  pageTitle.textContent = 'Allenamento';
  view.innerHTML = SCHEDE.map(s=>`
    <div class="list-item" onclick='avviaSessione("${s.id}")'>
      <h3>${s.nome}</h3>
      <p>${s.periodo}</p>
    </div>
  `).join('') + `<p class="empty">Nuovi blocchi verranno aggiunti qui man mano che li carichi.</p>`;
}

function avviaSessione(schedaId){
  const scheda = SCHEDE.find(s=>s.id===schedaId);
  sessionDraft = {
    schedaId,
    schedaNome: scheda.nome,
    iniziata: new Date().toISOString(),
    warmDone: scheda.riscaldamento.map(()=>false),
    esercizi: scheda.esercizi.map(e=>({
      nome: e.nome,
      sets: Array.from({length:e.serieTarget}, ()=>({peso:'', rip:'', fatta:false}))
    }))
  };
  setRoute({name:'sessione'});
}

/* ============ SESSIONE (logbook + timer) ============ */
function renderSessione(){
  const scheda = SCHEDE.find(s=>s.id===sessionDraft.schedaId);
  pageTitle.textContent = scheda.nome;

  let html = `<div class="card">
    <div class="pill">Riscaldamento</div>
    <p style="font-size:12.5px;color:var(--text-dim);margin:8px 0 0;">Da fare prima di iniziare, 5-8 minuti totali.</p>`;
  scheda.riscaldamento.forEach((w,i)=>{
    html += `<div class="warm-item">
      <div>
        <div class="l">
          <label style="display:flex;align-items:center;gap:10px;cursor:pointer;">
            <input type="checkbox" ${sessionDraft.warmDone[i]?'checked':''} onchange="toggleWarm(${i})" style="width:18px;height:18px;accent-color:var(--accent);">
            ${w.nome}
          </label>
        </div>
        <div class="r" style="margin-left:28px;">${w.note}</div>
      </div>
      <div class="r">${w.serie}</div>
    </div>`;
  });
  html += `</div>`;

  scheda.esercizi.forEach((e, ei)=>{
    const draft = sessionDraft.esercizi[ei];
    html += `<div class="exercise-card">
      <h3>${e.nome}</h3>
      <div class="ex-meta">${e.serieTarget} x ${e.ripTarget} · recupero ${e.recupero}"</div>`;
    draft.sets.forEach((set,si)=>{
      html += `<div class="set-row">
        <span>${si+1}</span>
        <input type="number" placeholder="peso kg" value="${set.peso}" oninput="updateSet(${ei},${si},'peso',this.value)">
        <input type="text" placeholder="rip / sec" value="${set.rip}" oninput="updateSet(${ei},${si},'rip',this.value)">
        <input type="checkbox" ${set.fatta?'checked':''} onchange="markSetDone(${ei},${si},${e.recupero},this.checked)">
      </div>`;
    });
    html += `<div class="note-box">${e.note}${e.alternativa && e.alternativa!=='—' ? ' · Alternativa: '+e.alternativa : ''}</div>
      <button class="toggle-guide" onclick="toggleGuide(${ei})">Guida esercizio ▾</button>
      <div class="guide-body" id="guide-${ei}">
        <b>Muscoli:</b> ${e.guida.muscoli}<br><br>
        <b>Esecuzione:</b> ${e.guida.esecuzione}<br><br>
        <b>Errori da evitare:</b> ${e.guida.errori}
      </div>
    </div>`;
  });

  html += `<button class="btn" id="finishBtn" onclick="terminaSessione()">Termina e salva allenamento</button>`;
  view.innerHTML = html;
}

function toggleWarm(i){ sessionDraft.warmDone[i] = !sessionDraft.warmDone[i]; }

function toggleGuide(ei){
  document.getElementById('guide-'+ei).classList.toggle('open');
}

function updateSet(ei,si,field,val){
  sessionDraft.esercizi[ei].sets[si][field] = val;
}

function markSetDone(ei,si,recupero,checked){
  sessionDraft.esercizi[ei].sets[si].fatta = checked;
  if(checked){ startRestTimer(recupero); }
}

function startRestTimer(seconds){
  clearRestTimer();
  let remaining = seconds;
  const bar = document.createElement('div');
  bar.className = 'timer-bar';
  bar.id = 'restBar';
  bar.innerHTML = `<div class="lbl">Recupero</div><div class="t" id="restT">${remaining}"</div>
    <button class="btn small secondary" onclick="clearRestTimer()">Salta</button>`;
  document.body.appendChild(bar);
  restTimerHandle = setInterval(()=>{
    remaining--;
    const t = document.getElementById('restT');
    if(!t){ clearInterval(restTimerHandle); return; }
    if(remaining<=0){
      t.textContent = "Via! 💪";
      beep();
      clearInterval(restTimerHandle);
      setTimeout(clearRestTimer, 2000);
    } else {
      t.textContent = remaining+'"';
    }
  },1000);
}

function clearRestTimer(){
  if(restTimerHandle){ clearInterval(restTimerHandle); restTimerHandle=null; }
  const bar = document.getElementById('restBar');
  if(bar) bar.remove();
}

function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880;
    g.gain.value = 0.15;
    o.start();
    setTimeout(()=>{o.stop(); ctx.close();}, 350);
  }catch(e){}
}

async function terminaSessione(){
  if(!confirm('Salvare questo allenamento in Progressi?')) return;
  const btn = document.getElementById('finishBtn');
  btn.disabled = true; btn.textContent = 'Salvataggio...';
  try{
    const payload = {
      schedaId: sessionDraft.schedaId,
      schedaNome: sessionDraft.schedaNome,
      data: new Date().toISOString(),
      esercizi: sessionDraft.esercizi
    };
    const ref = await userCollection('sessioni').add(payload);
    cache.sessioni.push({ id: ref.id, ...payload });
    sessionDraft = null;
    setRoute({name:'progressi', justSaved:true});
  }catch(e){
    alert('Errore nel salvataggio: '+e.message);
    btn.disabled = false; btn.textContent = 'Termina e salva allenamento';
  }
}

/* ============ PROGRESSI ============ */
function renderProgressi(){
  pageTitle.textContent = 'Progressi';
  const sessioni = cache.sessioni.slice().reverse();
  let html = '';
  if(route.justSaved){
    html += `<div class="success-banner">Allenamento salvato ✅</div>`;
  }

  if(sessioni.length===0){
    html += `<p class="empty">Nessun allenamento salvato ancora. Completa una seduta in "Allenamento" per vederla qui.</p>`;
    view.innerHTML = html;
    return;
  }

  html += `<div class="card"><h3 style="margin-top:0;font-size:15px;">Andamento carichi per esercizio</h3>
    <div class="chip-select" id="exChips"></div>
    <canvas class="chart-canvas" id="progChart" height="180"></canvas>
  </div>`;

  html += `<h3 style="font-size:14px;color:var(--text-dim);margin:18px 0 8px;">Sedute salvate</h3>`;
  sessioni.forEach((s)=>{
    const d = new Date(s.data);
    html += `<div class="list-item" onclick="setRoute({name:'progressi-detail', id:'${s.id}'})">
      <h3>${s.schedaNome}</h3>
      <p>${d.toLocaleDateString('it-IT',{weekday:'long', day:'numeric', month:'long'})}</p>
    </div>`;
  });

  view.innerHTML = html;

  const exNames = [...new Set(cache.sessioni.flatMap(s=>s.esercizi.map(e=>e.nome)))];
  const chipWrap = document.getElementById('exChips');
  let selected = exNames[0];
  function drawChart(name){
    const points = cache.sessioni
      .filter(s=>s.esercizi.some(e=>e.nome===name))
      .map(s=>{
        const e = s.esercizi.find(e=>e.nome===name);
        const pesi = e.sets.map(x=>parseFloat(x.peso)).filter(v=>!isNaN(v));
        const maxPeso = pesi.length ? Math.max(...pesi) : null;
        return {data: new Date(s.data).toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'}), peso: maxPeso};
      })
      .filter(p=>p.peso!==null);
    const ctx = document.getElementById('progChart');
    if(window._chart) window._chart.destroy();
    if(points.length===0){
      ctx.getContext('2d').clearRect(0,0,ctx.width,ctx.height);
      return;
    }
    window._chart = new Chart(ctx, {
      type:'line',
      data:{ labels: points.map(p=>p.data), datasets:[{
        label: name+' (kg max)', data: points.map(p=>p.peso),
        borderColor:'#5ee6c8', backgroundColor:'#5ee6c833', tension:.3, fill:true, pointRadius:4
      }]},
      options:{ plugins:{legend:{labels:{color:'#eef0f3'}}}, scales:{
        x:{ticks:{color:'#9aa1ad'}, grid:{color:'#33384333'}},
        y:{ticks:{color:'#9aa1ad'}, grid:{color:'#33384333'}}
      }}
    });
  }
  chipWrap.innerHTML = exNames.map(n=>`<div class="chip ${n===selected?'active':''}" data-n="${n}">${n}</div>`).join('');
  chipWrap.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      chipWrap.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      drawChart(chip.dataset.n);
    });
  });
  if(selected) drawChart(selected);
}

// Ridimensiona/comprime l'immagine lato client cosi' il base64 resta ben sotto il limite di 1MB per documento Firestore
function resizeImage(file, maxSize){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if(width > height && width > maxSize){ height = height * (maxSize/width); width = maxSize; }
        else if(height > maxSize){ width = width * (maxSize/height); height = maxSize; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function salvaMisura(){
  const data = document.getElementById('mData').value || new Date().toISOString().slice(0,10);
  const peso = document.getElementById('mPeso').value;
  const vita = document.getElementById('mVita').value;
  const petto = document.getElementById('mPetto').value;
  const fianchi = document.getElementById('mFianchi').value;
  const braccio = document.getElementById('mBraccio').value;
  const coscia = document.getElementById('mCoscia').value;
  const fotoInput = document.getElementById('mFoto');
  const btn = document.getElementById('saveMisuraBtn');
  const errBox = document.getElementById('misuraError');

  btn.disabled = true; btn.textContent = 'Salvataggio...';
  try{
    let fotoDataUrl = null;
    if(fotoInput.files && fotoInput.files[0]){
      fotoDataUrl = await resizeImage(fotoInput.files[0], 700);
    }
    const payload = {
      data,
      peso: peso ? Number(peso) : null,
      vita: vita ? Number(vita) : null,
      petto: petto ? Number(petto) : null,
      fianchi: fianchi ? Number(fianchi) : null,
      braccio: braccio ? Number(braccio) : null,
      coscia: coscia ? Number(coscia) : null,
      foto: fotoDataUrl
    };
    const ref = await userCollection('misure').add(payload);
    cache.misure.push({ id: ref.id, ...payload });
    cache.misure.sort((a,b)=> new Date(a.data)-new Date(b.data));
    setRoute({name:'misure'});
  }catch(e){
    errBox.innerHTML = `<div class="error-banner">${e.message}</div>`;
    btn.disabled = false; btn.textContent = 'Salva rilevazione';
  }
}

async function eliminaMisura(id){
  if(!confirm('Eliminare questa rilevazione?')) return;
  try{
    await userCollection('misure').doc(id).delete();
    cache.misure = cache.misure.filter(m=>m.id!==id);
    setRoute({name:'misure'});
  }catch(e){ alert('Errore: '+e.message); }
}

async function boot(){
  const profiloCompleto = await checkProfilo();
  if(!profiloCompleto){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'none';
    document.getElementById('onboardingScreen').style.display = 'block';
    return;
  }
  await avviaApp();
}

async function avviaApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('onboardingScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  view.innerHTML = '<div class="spinner-wrap">Caricamento dati...</div>';
  try{
    await loadData();
    goHome();
  }catch(e){
    view.innerHTML = `<div class="error-banner">Errore nel caricamento dei dati: ${e.message}</div>`;
  }
}

auth.onAuthStateChanged(user=>{
  if(user){

    btn.disabled = false; btn.textContent = 'Accedi';
  }
});
