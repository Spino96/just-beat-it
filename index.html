        <input type="number" inputmode="numeric" min="0" max="3000" placeholder="es. 300" value="${cardioDraft.kcalAttrezzo||''}" oninput="aggiornaDatiAttrezzo('kcalAttrezzo',this.value)"></div>
      <div class="field" style="margin-bottom:0;"><label>Velocità (km/h)</label>
        <input type="number" inputmode="decimal" step="0.1" min="0" max="30" placeholder="es. 9" value="${cardioDraft.velocita||''}" oninput="aggiornaDatiAttrezzo('velocita',this.value)"></div>
    </div>
    <p class="field-hint" style="margin:10px 0 0;">Puoi inserirli anche a fine sessione, prima di premere Termina.</p>
  </div>`;
}

function renderAddomeCardio(){
  if(!cardioDraft || !cardioDraft.addome) return '';
  const esercizi = cardioDraft.addome.map((d,ei)=>{
    const def = ADDOME_BLOCCO3[ei];
    const righe = d.sets.map((set,si)=>`<div class="abs-row${def.conPeso?' abs-peso':''}">
      <span>${si+1}</span>
      ${def.conPeso ? `<input type="number" inputmode="decimal" min="0" max="500" placeholder="kg" value="${set.peso}" oninput="aggiornaAddome(${ei},${si},'peso',this.value)">` : ''}
      <input type="number" inputmode="numeric" min="0" placeholder="${def.unita==='sec'?'secondi':'ripetizioni'}" value="${set.val}" oninput="aggiornaAddome(${ei},${si},'val',this.value)">
      <input type="checkbox" ${set.fatta?'checked':''} onchange="aggiornaAddome(${ei},${si},'fatta',this.checked)">
    </div>`).join('');
    return `<div style="margin-top:${ei?18:8}px;">
      <div style="font-weight:800;font-size:14px;">${def.nome}</div>
      <div class="ex-meta" style="margin:2px 0 10px;">${def.serie} x ${def.rip} · ${def.nota}</div>
      ${righe}
    </div>`;
  }).join('');
  return `<div class="card"><h3 style="margin-top:0;font-size:15px;">💪 Addome — dopo il cardio</h3>${esercizi}</div>`;
}

function avviaSessioneCardio(){
  cardioDraft = { tipo:null, avviata:false,
    addome: cardioBlocco3() ? ADDOME_BLOCCO3.map(e=>({ nome:e.nome, unita:e.unita, sets:Array.from({length:e.serie},()=>({peso:'', val:'', fatta:false})) })) : null };
  setRoute({name:'sessione-cardio'});
}

function scegliTipoCardio(tipo){
  if(!cardioDraft) return;
  cardioDraft.tipo = tipo;
  renderSessioneCardio();
}

function iniziaCronometroCardio(){
  if(!cardioDraft || !cardioDraft.tipo) return;
  cardioDraft.avviata = true;
  cardioDraft.startAt = Date.now();
  cardioDraft.pausedAccumMs = 0;
  cardioDraft.paused = false;
  cardioDraft.pausedAt = null;
  richiediRestWakeLock();
  renderSessioneCardio();
}

function cardioElapsedMs(){
  if(!cardioDraft || !cardioDraft.startAt) return 0;
  if(cardioDraft.paused) return cardioDraft.pausedAt - cardioDraft.startAt - cardioDraft.pausedAccumMs;
  return Date.now() - cardioDraft.startAt - cardioDraft.pausedAccumMs;
}

function togglePausaCardio(){
  if(!cardioDraft) return;
  if(cardioDraft.paused){
    cardioDraft.pausedAccumMs += Date.now() - cardioDraft.pausedAt;
    cardioDraft.pausedAt = null;
    cardioDraft.paused = false;
    richiediRestWakeLock();
  } else {
    cardioDraft.paused = true;
    cardioDraft.pausedAt = Date.now();
    rilasciaRestWakeLock();
  }
  renderSessioneCardio();
}

// Chiamata ogni secondo mentre il cronometro è attivo: aggiorna solo i due
// elementi che cambiano, senza un renderSessioneCardio() completo — stesso
// motivo per cui il timer di recupero fa così: un re-render intero ogni
// secondo scatterebbe animazioni CSS e potrebbe far perdere lo scroll.
function aggiornaDisplayCardio(){
  if(!cardioDraft || !cardioDraft.avviata) return;
  const t = document.getElementById('cardioT');
  if(!t) return; // schermata cambiata: verrà fermato dal prossimo render()
  const ms = cardioElapsedMs();
  t.textContent = formatMMSS(ms);
  const kcalEl = document.getElementById('cardioKcalLive');
  if(kcalEl) kcalEl.textContent = Math.round(kcalStimateCardio(cardioDraft.tipo, ms));
  const fill = document.getElementById('cardioTargetFill');
  const label = document.getElementById('cardioTargetLabel');
  if(fill && label){
    const ob = cardioObiettivo();
    const pct = Math.min(100, Math.round(ms/ob.ms*100));
    fill.style.width = pct+'%';
    label.textContent = pct>=100 ? `Obiettivo ${ob.etichetta} raggiunto 💪` : `${pct}% dell'obiettivo (${ob.etichetta})`;
  }
}

async function terminaSessioneCardio(){
  if(!cardioDraft || !cardioDraft.avviata) return;
  const elapsedMs = cardioElapsedMs();
  if(!(await mostraConferma('Terminare e salvare questa sessione cardio?', 'accent'))) return;
  if(cardioTimerHandle){ clearInterval(cardioTimerHandle); cardioTimerHandle=null; }
  rilasciaRestWakeLock();
  const kcal = Math.round(kcalStimateCardio(cardioDraft.tipo, elapsedMs));
  const payload = {
    tipo: cardioDraft.tipo,
    durataSec: Math.round(elapsedMs/1000),
    kcalStimate: kcal,
    data: new Date().toISOString()
  };
  // Serie di addome segnate (solo quelle spuntate o con un valore).
  const addome = (cardioDraft.addome||[]).map(e=>({
    nome: e.nome,
    unita: e.unita,
    sets: e.sets.filter(x=>x.fatta || x.val!=='').map(x=>({ val:Number(x.val)||0, peso: x.peso!=='' ? Number(x.peso) : null, fatta: !!x.fatta }))
  })).filter(e=>e.sets.length);
  if(addome.length) payload.addome = addome;
  const kcalAttr = Number(cardioDraft.kcalAttrezzo), vel = Number(cardioDraft.velocita);
  if(kcalAttr>0) payload.kcalAttrezzo = Math.round(kcalAttr);
  if(vel>0) payload.velocita = Math.round(vel*10)/10;
  try{
    const ref = await aggiungiDocRapido(userCollection('cardioSessioni'), payload);
    cache.cardioSessioni.push({ id: ref.id, ...payload });
  }catch(e){
    alert('Errore nel salvataggio: '+e.message);
  }
  cardioDraft = null;
  setRoute({name:'allenamento-list'});
}

async function annullaSessioneCardio(){
  if(cardioDraft && cardioDraft.avviata){
    if(!(await mostraConferma('Interrompere senza salvare questa sessione cardio?', 'danger'))) return;
    if(cardioTimerHandle){ clearInterval(cardioTimerHandle); cardioTimerHandle=null; }
    rilasciaRestWakeLock();
  }
  cardioDraft = null;
  setRoute({name:'allenamento-list'});
}

function renderSessioneCardio(){
  pageTitle.textContent = 'Sessione cardio';
  if(!cardioDraft){ setRoute({name:'allenamento-list'}); return; }

  if(!cardioDraft.avviata){
    const peso = pesoUtenteStimato();
    const chipsHtml = CARDIO_ATTIVITA.map(a=>`
      <div class="chip${cardioDraft.tipo===a.key?' active':''}" onclick="scegliTipoCardio('${a.key}')">${a.icona} ${a.label}</div>
    `).join('');
    view.innerHTML = `
      <div class="card">
        <h3 style="margin-top:0;">🫁 Nuova sessione cardio</h3>
        <p style="color:var(--text-dim);font-size:12.5px;line-height:1.6;margin:0 0 16px;">Scegli l'attività, poi avvia il cronometro. ${cardioObiettivo().intro}</p>
        <div class="field">
          <label>Attività</label>
          <div class="chip-select">${chipsHtml}</div>
        </div>
        <p class="field-hint" style="margin:0 0 18px;">Le kcal si stimano dal tuo peso più recente (${peso} kg, da Registra progressi) — è una stima orientativa, non una misura precisa.</p>
        <button class="btn" ${cardioDraft.tipo ? '' : 'disabled'} onclick="iniziaCronometroCardio()">▶ Avvia cronometro</button>
        <button class="btn secondary" style="margin-top:10px;" onclick="annullaSessioneCardio()">Annulla</button>
      </div>
    `;
    return;
  }

  const elapsedMs = cardioElapsedMs();
  const att = CARDIO_ATTIVITA.find(a=>a.key===cardioDraft.tipo);
  const kcal = Math.round(kcalStimateCardio(cardioDraft.tipo, elapsedMs));
  const ob = cardioObiettivo();
  const pct = Math.min(100, Math.round(elapsedMs/ob.ms*100));
  view.innerHTML = `
    <div class="card cardio-session-card">
      <p class="cardio-session-tipo">${att.icona} ${att.label}</p>
      <div class="cardio-timer-display" id="cardioT">${formatMMSS(elapsedMs)}</div>
      <div class="cardio-target-bar"><div class="cardio-target-fill" id="cardioTargetFill" style="width:${pct}%;"></div></div>
      <p class="cardio-target-label" id="cardioTargetLabel">${pct>=100 ? `Obiettivo ${ob.etichetta} raggiunto 💪` : `${pct}% dell'obiettivo (${ob.etichetta})`}</p>
      <p class="cardio-kcal-live"><span id="cardioKcalLive">${kcal}</span> kcal stimate</p>
      <p class="field-hint" style="margin:14px 0 0;">${ob.hint}</p>
    </div>
    ${renderDatiAttrezzoCardio()}
    ${renderAddomeCardio()}
    <div style="display:flex;gap:10px;margin-top:14px;">
      <button class="btn secondary" style="flex:1;" onclick="togglePausaCardio()">${cardioDraft.paused ? '▶ Riprendi' : '⏸ Pausa'}</button>
      <button class="btn" style="flex:1;" onclick="terminaSessioneCardio()">⏹ Termina</button>
    </div>
  `;
  if(!cardioDraft.paused){
    if(cardioTimerHandle) clearInterval(cardioTimerHandle);
    cardioTimerHandle = setInterval(aggiornaDisplayCardio, 1000);
  }
}


/* ============ AGGIUNGERE E SPOSTARE ESERCIZI NELLA SEDUTA ============
   La scheda resta quella del piano; la seduta ha la sua lista di esercizi
   (sessionDraft.defs) che si può allungare e riordinare senza toccare la
   scheda. Gli esercizi aggiunti valgono solo per questa seduta. */
function schedaSessione(){
  const base = SCHEDE.find(s=>s.id===sessionDraft.schedaId);
  if(!sessionDraft.defs) sessionDraft.defs = base.esercizi.slice();
  return Object.assign({}, base, { esercizi: sessionDraft.defs });
}
let layoutSchede = {};
function salvaLayoutSchede(){
  attendiScrittura(db.collection('users').doc(currentUid).set({ layoutSchede }, { mergeFields:['layoutSchede'] })).catch(()=>{});
}
function creaDefAggiunto(nome, serie, rip, recupero, base){
  const def = base ? Object.assign({}, base) : {
    nome, note:'Esercizio aggiunto da te.', alternativa:'—', video:'', immagine:'',
    guida:{ muscoli:'—', esecuzione:'Esercizio aggiunto da te.', errori:'—' }
  };
  delete def.superset; delete def.jump; delete def.tecnicaUltima;
  def.nome = nome; def.serieTarget = serie; def.ripTarget = rip; def.recupero = recupero; def.aggiunto = true;
  return def;
}
/* Ordine e esercizi aggiunti restano salvati per la scheda (sul tuo profilo)
   e valgono per tutte le sedute future, finché non li cambi o li ripristini. */
function layoutDaDefs(defs){
  return defs.map(d=> d.aggiunto
    ? { nome:d.nome, aggiunto:true, serieTarget:d.serieTarget, ripTarget:d.ripTarget, recupero:d.recupero }
    : { nome:d.nome });
}
function memorizzaLayoutSeduta(){
  const base = SCHEDE.find(s=>s.id===sessionDraft.schedaId);
  const lay = layoutDaDefs(sessionDraft.defs);
  const identico = lay.length===base.esercizi.length && lay.every((x,i)=> !x.aggiunto && x.nome===base.esercizi[i].nome);
  if(identico) delete layoutSchede[base.id]; else layoutSchede[base.id] = lay;
  salvaLayoutSchede();
}
function defsConLayout(base, layOverride, strict){
  const lay = layOverride || layoutSchede[base.id];
  if(!Array.isArray(lay) || !lay.length) return strict ? null : base.esercizi.slice();
  const noti = eserciziNoti();
  const usati = new Set();
  const out = [];
  lay.forEach(x=>{
    if(x.aggiunto){ out.push(creaDefAggiunto(x.nome, x.serieTarget||3, x.ripTarget||'8-12', x.recupero||90, noti[String(x.nome).trim().toLowerCase()])); return; }
    const idx = base.esercizi.findIndex((e,i)=> e.nome===x.nome && !usati.has(i));
    if(idx>-1){ usati.add(idx); out.push(base.esercizi[idx]); }
  });
  if(strict) return out;
  // Esercizi nuovi della scheda (non presenti nel tuo ordine salvato): li inserisco
  // dopo quello che li precede nella scheda, così restano al loro posto naturale.
  base.esercizi.forEach((e,i)=>{
    if(usati.has(i)) return;
    let at = 0;
    for(let j=i-1;j>=0;j--){ const k = out.indexOf(base.esercizi[j]); if(k>-1){ at = k+1; break; } }
    out.splice(at, 0, e);
  });
  return out;
}
function ripristinaOrdineScheda(){
  const base = SCHEDE.find(s=>s.id===sessionDraft.schedaId);
  mostraConferma('Ripristinare l\'ordine originale della scheda? Gli esercizi che hai aggiunto verranno tolti da questa e dalle prossime sedute.').then(ok=>{
    if(!ok) return;
    const vecchi = sessionDraft.esercizi;
    const nuovi = base.esercizi.map(d=> vecchi.find(x=>x.nome===d.nome && !x.aggiunto) || nuovoDraftEsercizio(d));
    sessionDraft.defs = base.esercizi.slice();
    sessionDraft.esercizi = nuovi;
    delete layoutSchede[base.id]; salvaLayoutSchede();
    hapticaLieve(); renderSessionePreservandoScroll();
  });
}
function nuovoDraftEsercizio(def){
  const n = serieEsercizio(def);
  return {
    nome: def.nome, usaAlternativa:false, noteUtente:'', unilaterale: unilateraleEsercizio(def),
    aggiunto: !!def.aggiunto,
    sets: Array.from({length:n}, ()=>({peso:'', rip:'', fatta:false, rpe:null, saltata:false, tecnica:''}))
  };
}
function eserciziNoti(){
  const mappa = {};
  SCHEDE.forEach(sc=> sc.esercizi.forEach(e=>{ const k = e.nome.trim().toLowerCase(); if(!mappa[k]) mappa[k] = e; }));
  return mappa;
}
function posizioniInserimento(){
  // Indici dopo i quali si può inserire. Dentro a un superset/jump set non si
  // inserisce: si va prima o dopo il gruppo.
  const defs = sessionDraft.defs;
  const out = [{ pos:0, label:"All'inizio (prima di tutto)" }];
  defs.forEach((e,i)=>{
    const prossimo = defs[i+1];
    if(e.superset && prossimo && prossimo.superset===e.superset) return;
    out.push({ pos:i+1, label:'Dopo: '+(sessionDraft.esercizi[i].nome || e.nome) });
  });
  return out;
}
function apriAggiungiEsercizio(dopoEi, modo){
  if(document.getElementById('addExOverlay')) return;
  const storico = modo==='storico';
  const noti = eserciziNoti();
  const posizioni = storico
    ? [{pos:0,label:"All'inizio (prima di tutto)"}].concat(modificaSessioneDraft.esercizi.map((e,i)=>({pos:i+1,label:'Dopo: '+e.nome})))
    : posizioniInserimento();
  let selPos = storico ? ((dopoEi==null) ? modificaSessioneDraft.esercizi.length : dopoEi+1) : (dopoEi==null) ? posizioni[posizioni.length-1].pos : (()=>{
    // dopo l'esercizio indicato (o dopo la fine del suo gruppo)
    let i = dopoEi; const d = sessionDraft.defs;
    while(d[i] && d[i].superset && d[i+1] && d[i+1].superset===d[i].superset) i++;
    return i+1;
  })();
  let n = 3;
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.id = 'addExOverlay';
  overlay.innerHTML = `<div class="confirm-box" style="max-height:88vh;overflow:auto;">
    <p class="confirm-msg" style="margin-bottom:4px;">➕ Aggiungi esercizio</p>
    <p class="field-hint" style="text-align:center;margin:0 0 12px;">${storico ? 'Lo aggiungi a questa seduta salvata.' : 'Resta salvato nella scheda anche per le prossime sedute.'}</p>
    <div class="field" style="margin-bottom:12px;"><label>Nome (scegli dall'elenco o scrivi il tuo)</label>
      <input type="text" id="addExNome" list="addExLista" maxlength="60" autocomplete="off" placeholder="Es. Alzate laterali ai cavi">
      <datalist id="addExLista">${Object.values(noti).map(e=>`<option value="${escHtml(e.nome)}"></option>`).join('')}</datalist>
    </div>
    <div class="field" style="margin-bottom:12px;"><label>Numero di serie</label>
      <div class="peso-stepper" style="justify-content:center;gap:14px;">
        <button type="button" class="stepper-btn" id="addExMeno" style="width:44px;height:44px;font-size:22px;">–</button>
        <span id="addExN" style="font-size:26px;font-weight:900;min-width:40px;text-align:center;">${n}</span>
        <button type="button" class="stepper-btn" id="addExPiu" style="width:44px;height:44px;font-size:22px;">+</button>
      </div>
    </div>
    <div class="grid2">
      <div class="field"><label>Ripetizioni</label><input type="text" id="addExRip" maxlength="12" value="8-12" style="text-align:center;"></div>
      <div class="field" style="${storico?'display:none;':''}"><label>Recupero</label>
        <select id="addExRec">${[30,45,60,90,120,150,180,240].map(v=>`<option value="${v}" ${v===90?'selected':''}>${fmtRecupero(v)}</option>`).join('')}</select>
      </div>
    </div>
    <div class="field" style="margin-bottom:14px;"><label>Posizione</label>
      <select id="addExPos">${posizioni.map(o=>`<option value="${o.pos}" ${o.pos===selPos?'selected':''}>${escHtml(o.label)}</option>`).join('')}</select>
    </div>
    <div id="addExErr" class="field-hint" style="color:var(--danger);text-align:center;"></div>
    <div class="confirm-actions" style="flex-wrap:wrap;">
      <button class="btn secondary" id="addExAnnulla">Annulla</button>
      <button class="btn" id="addExOk">Aggiungi</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  const $ = id=> overlay.querySelector(id);
  const nomeIn = $('#addExNome');
  // Scegliendo un esercizio noto si precompilano serie, ripetizioni e recupero della scheda.
  nomeIn.addEventListener('input', ()=>{
    const e = noti[nomeIn.value.trim().toLowerCase()];
    if(e){ n = serieEsercizio(e); $('#addExN').textContent = n; $('#addExRip').value = ripEsercizio(e); $('#addExRec').value = String(recuperoEsercizio(e)); 
      if(!Array.from($('#addExRec').options).some(o=>o.value===String(recuperoEsercizio(e)))){ const o = document.createElement('option'); o.value = String(recuperoEsercizio(e)); o.textContent = fmtRecupero(recuperoEsercizio(e)); $('#addExRec').appendChild(o); $('#addExRec').value = o.value; } }
  });
  $('#addExMeno').onclick = ()=>{ if(n>1){ n--; $('#addExN').textContent = n; } };
  $('#addExPiu').onclick = ()=>{ if(n<12){ n++; $('#addExN').textContent = n; } };
  const chiudi = ()=> overlay.remove();
  $('#addExAnnulla').onclick = chiudi;
  overlay.addEventListener('click', ev=>{ if(ev.target===overlay) chiudi(); });
  $('#addExOk').onclick = ()=>{
    const nome = nomeIn.value.trim();
    if(!nome){ $('#addExErr').textContent = 'Scrivi o scegli il nome dell\'esercizio.'; return; }
    const rip = $('#addExRip').value.trim() || '8-12';
    const rec = parseInt($('#addExRec').value,10) || 90;
    const pos = parseInt($('#addExPos').value,10);
    chiudi();
    if(storico) inserisciEsercizioStorico(nome, n, pos, noti[nome.toLowerCase()]);
    else inserisciEsercizio(nome, n, rip, rec, pos, noti[nome.toLowerCase()]);
  };
}
function inserisciEsercizio(nome, serie, rip, recupero, pos, base){
  const def = creaDefAggiunto(nome, serie, rip, recupero, base);
  const draft = nuovoDraftEsercizio(def);
  // Le serie scelte qui contano, anche se in passato avevi personalizzato questo esercizio.
  draft.sets = Array.from({length:serie}, ()=>({peso:'', rip:'', fatta:false, rpe:null, saltata:false, tecnica:''}));
  sessionDraft.defs.splice(pos, 0, def);
  sessionDraft.esercizi.splice(pos, 0, draft);
  memorizzaLayoutSeduta();
  hapticaMedia();
  renderSessionePreservandoScroll();
  scrollAEsercizio(pos);
}
function scrollAEsercizio(ei, block){
  setTimeout(()=>{ const el = document.getElementById('excard-'+ei); if(el) el.scrollIntoView({behavior:'smooth', block: block||'center'}); }, 80);
}
function spostaEsercizio(ei, dir){
  const un = unitaSessione(schedaSessione());
  const ui = un.findIndex(u=>u.indici.includes(ei));
  const uj = ui + dir;
  if(ui<0 || uj<0 || uj>=un.length) return;
  const tgt = un[uj].indici;
  let pos = dir<0 ? Math.min.apply(null,tgt) : Math.max.apply(null,tgt)+1;
  const def = sessionDraft.defs.splice(ei,1)[0];
  const ex = sessionDraft.esercizi.splice(ei,1)[0];
  if(ei<pos) pos--;
  sessionDraft.defs.splice(pos,0,def);
  sessionDraft.esercizi.splice(pos,0,ex);
  memorizzaLayoutSeduta();
  hapticaLieve();
  renderSessionePreservandoScroll();
  scrollAEsercizio(pos);
}
async function rimuoviEsercizioAggiunto(ei){
  const ex = sessionDraft.esercizi[ei];
  const fatte = ex.sets.some(x=>x.fatta);
  if(!(await mostraConferma(fatte ? 'Questo esercizio ha serie già segnate: rimuoverlo le cancella. Procedere?' : 'Rimuovere questo esercizio dalla seduta?'))) return;
  sessionDraft.defs.splice(ei,1);
  sessionDraft.esercizi.splice(ei,1);
  memorizzaLayoutSeduta();
  renderSessionePreservandoScroll();
}

function unilateraleEsercizio(e){
  const v = unilateraliPersonalizzati[e.nome];
  return typeof v==='boolean' ? v : !!e.unilaterale;
}
function salvaUnilateraliPersonalizzati(){
  attendiScrittura(db.collection('users').doc(currentUid).set({ unilateraliPersonalizzati }, { mergeFields:['unilateraliPersonalizzati'] }));
}
function toggleUnilaterale(ei){
  const scheda = schedaSessione();
  const e = scheda.esercizi[ei];
  const draft = sessionDraft.esercizi[ei];
  draft.unilaterale = !draft.unilaterale;
  if(draft.unilaterale === !!e.unilaterale) delete unilateraliPersonalizzati[e.nome];
  else unilateraliPersonalizzati[e.nome] = draft.unilaterale;
  salvaUnilateraliPersonalizzati();
  hapticaLieve();
  renderSessionePreservandoScroll();
}

/* ============ TECNICHE D'INTENSITÀ ============
   Si applicano a una singola serie (di solito l'ultima di un isolamento) e la
   sostituiscono, non si aggiungono. Piano: massimo 2 per seduta, mai su hack,
   leg press, stacco rumeno, panca e lento (qui sono avvisi, non blocchi). */
const TECNICHE = {
  drop:     { label:'Drop set',               icona:'⬇️', hint:'A cedimento, riduci il carico del 20-30% e vai di nuovo a cedimento senza pausa. Una sola riduzione.' },
  restpause:{ label:'Rest-pause',             icona:'⏸', hint:'A cedimento, 15-20 secondi di pausa, poi altre 3-5 ripetizioni.' },
  parziali: { label:'Parziali in allungamento', icona:'↕️', hint:'A cedimento, continua 4-6 ripetizioni solo nella metà del movimento in cui il muscolo è allungato.' }
};
const TECNICHE_MAX_SEDUTA = 2;
function maxTecnicheSeduta(){ try{ return (sessionDraft && schedaSessione().tecnicheMax) || TECNICHE_MAX_SEDUTA; }catch(e){ return TECNICHE_MAX_SEDUTA; } }
const TECNICHE_SCONSIGLIATE_RE = /hack|leg press|rumeno|lento avanti|panca 15|^panca/i;
function contaTecnicheSessione(){
  if(!sessionDraft) return 0;
  return sessionDraft.esercizi.reduce((n,e)=> n + e.sets.filter(s=>s.tecnica && !s.saltata).length, 0);
}
/* Drop set: il peso dopo la riduzione si calcola da solo dal peso della serie
   (riduzione 20/25/30%, default 25%, arrotondata a 0,5 kg). Si aggiorna finché
   non lo correggi a mano; la percentuale scelta viene ricordata. */
function dropPctPreferita(){
  try{ const v = parseInt(localStorage.getItem('dropPct'),10); if([20,25,30].includes(v)) return v; }catch(e){}
  return 25;
}
function calcolaPesoDrop(set){
  const base = parseFloat(String(set.peso).replace(',','.'));
  if(!base || isNaN(base) || base<=0) return '';
  const pct = set.dropPct || dropPctPreferita();
  return Math.max(0.5, Math.round(base*(1-pct/100)*2)/2);
}
function aggiornaDropAuto(ei, si){
  const set = sessionDraft.esercizi[ei].sets[si];
  if(set.tecnica!=='drop') return;
  // Quando cambia il peso della serie il drop si ricalcola SEMPRE, anche se
  // lo avevi corretto a mano prima: la correzione vale solo finché il peso
  // della serie resta quello.
  set.pesoDropManuale = false;
  const c = calcolaPesoDrop(set);
  if(c==='') return;
  set.pesoDrop = c;
  const inp = document.getElementById(`drop-${ei}-${si}`);
  if(inp) inp.value = set.pesoDrop;
  const h = document.getElementById(`drophint-${ei}-${si}`);
  if(h) h.textContent = `Calcolato in automatico: ${set.peso} kg −${set.dropPct || dropPctPreferita()}%.`;
}
function setDropPct(ei, si, pct){
  const set = sessionDraft.esercizi[ei].sets[si];
  set.dropPct = pct;
  set.pesoDropManuale = false;
  try{ localStorage.setItem('dropPct', String(pct)); }catch(e){}
  hapticaLieve();
  set.pesoDrop = calcolaPesoDrop(set);
  renderSessionePreservandoScroll();
}
function setTecnica(ei, si, val){
  sessionDraft.esercizi[ei].sets[si].tecnica = val || '';
  if(val==='drop'){ const st = sessionDraft.esercizi[ei].sets[si]; if(!st.pesoDropManuale) st.pesoDrop = calcolaPesoDrop(st); }
  hapticaLieve();
  aggiornaProgressoSessione();
  renderSessionePreservandoScroll();
}
function avviaPausaRestPause(){ startRestTimer(20); }
/* Riga di riepilogo di una serie (storico, "ultima volta"): include lato destro e tecnica. */
function descriviSerie(s, uni){
  const base = uni
    ? `SX ${s.peso||'—'}kg×${s.rip||'—'} · DX ${s.pesoDx||'—'}kg×${s.ripDx||'—'}`
    : `${s.peso}kg${s.rip?` × ${s.rip}`:''}`;
  let tec = '';
  if(s.tecnica==='drop') tec = ` ⚡Drop${s.pesoDrop?` ${s.pesoDrop}kg`:''}${s.ripDrop?`×${s.ripDrop}`:''}`;
  else if(s.tecnica==='restpause') tec = ` ⚡Rest-pause${s.ripRP?` +${s.ripRP}`:''}`;
  else if(s.tecnica==='parziali') tec = ` ⚡Parziali${s.ripParz?` +${s.ripParz}`:''}`;
  return base + tec;
}
function tecnicaPanelHtml(ei, si, set, nome){
  const t = TECNICHE[set.tecnica]; if(!t) return '';
  const sconsigliata = TECNICHE_SCONSIGLIATE_RE.test(nome||'');
  const troppe = contaTecnicheSessione() > maxTecnicheSeduta();
  const campo = (field, ph, w)=>`<input type="${field==='pesoDrop'?'number':'text'}" inputmode="${field==='pesoDrop'?'decimal':'numeric'}" ${field==='pesoDrop'?'min="0" max="500" step="0.5"':'pattern="[0-9]*"'} placeholder="${ph}" value="${set[field]??''}" style="width:${w}px;text-align:center;" oninput="updateSet(${ei},${si},'${field}',this.value)">`;
  let corpo = '';
  if(set.tecnica==='drop'){
    if(!set.pesoDropManuale){ const c = calcolaPesoDrop(set); if(c!=='') set.pesoDrop = c; }
    const pct = set.dropPct || dropPctPreferita();
    const chips = [20,25,30].map(v=>`<button type="button" class="set-mini-btn${v===pct?' on':''}" style="${v===pct?'background:var(--accent);color:#fff;':''}" onclick="setDropPct(${ei},${si},${v})">−${v}%</button>`).join(' ');
    const campoDrop = `<input type="number" inputmode="decimal" min="0" max="500" step="0.5" id="drop-${ei}-${si}" placeholder="kg" value="${set.pesoDrop??''}" style="width:70px;text-align:center;" oninput="updateSet(${ei},${si},'pesoDrop',this.value)">`;
    corpo = `<div style="width:100%;margin-bottom:6px;">${chips}</div><span class="tec-l">Dopo la riduzione:</span> ${campoDrop} <span class="tec-l">kg ×</span> ${campo('ripDrop','rip',56)}
      <div class="tec-h" id="drophint-${ei}-${si}" style="margin-top:6px;">${set.pesoDropManuale ? 'Peso modificato a mano. Se cambi il peso della serie o tocchi una percentuale, si ricalcola.' : (set.peso ? `Calcolato in automatico: ${set.peso} kg −${pct}%.` : 'Inserisci il peso della serie: il drop si calcola da solo.')}</div>`;
  } else if(set.tecnica==='restpause'){
    corpo = `<span class="tec-l">Rip dopo la pausa:</span> ${campo('ripRP','3-5',56)} <button type="button" class="set-mini-btn" onclick="avviaPausaRestPause()">⏱ Pausa 20"</button>`;
  } else {
    corpo = `<span class="tec-l">Rip parziali:</span> ${campo('ripParz','4-6',56)}`;
  }
  return `<div class="tec-panel" id="tecp-${ei}-${si}">
    <div class="tec-t">${t.icona} ${t.label} <span class="tec-sost">sostituisce questa serie</span></div>
    <div class="tec-h">${t.hint}</div>
    <div class="tec-f">${corpo}</div>
    ${sconsigliata ? `<div class="tec-w">⚠️ Il piano sconsiglia le tecniche d'intensità su questo esercizio.</div>` : ''}
    ${troppe ? `<div class="tec-w">⚠️ Hai già ${contaTecnicheSessione()} tecniche in questa seduta: il piano ne prevede al massimo ${maxTecnicheSeduta()}.</div>` : ''}
  </div>`;
}

/* ============ ALLENAMENTO IN CORSO: SALVATAGGIO AUTOMATICO ============
   Ogni modifica alla seduta viene copiata sul telefono (localStorage) e, con
   qualche secondo di ritardo, sul tuo profilo online: se l'app si chiude o il
   telefono si riavvia, alla riapertura puoi riprendere da dove eri. */
const SESS_MAX_ORE = 20;
let sessioneInCorsoRemota = null;
let sessSalvaTimer = null, sessRemotoTimer = null;
function chiaveSessioneLocale(){ return 'by_sessione_in_corso_' + currentUid; }
function serializzaSessione(){
  if(!sessionDraft) return null;
  return JSON.parse(JSON.stringify({
    v:1, salvato: Date.now(),
    schedaId: sessionDraft.schedaId, schedaNome: sessionDraft.schedaNome,
    iniziata: sessionDraft.iniziata, warmDone: sessionDraft.warmDone,
    layout: layoutDaDefs(sessionDraft.defs),
    esercizi: sessionDraft.esercizi
  }));
}
function salvaSessioneLocale(){
  if(!sessionDraft || !currentUid) return;
  try{ localStorage.setItem(chiaveSessioneLocale(), JSON.stringify(serializzaSessione())); }catch(e){}
}
function salvaSessioneRemota(){
  if(!sessionDraft || !currentUid) return;
  try{
    attendiScrittura(db.collection('users').doc(currentUid).set({ sessioneInCorso: serializzaSessione() }, { mergeFields:['sessioneInCorso'] })).catch(()=>{});
  }catch(e){}
}
function pianificaSalvataggioSessione(){
  clearTimeout(sessSalvaTimer);
  sessSalvaTimer = setTimeout(salvaSessioneLocale, 250);
  clearTimeout(sessRemotoTimer);
  sessRemotoTimer = setTimeout(salvaSessioneRemota, 6000);
}
function salvaSessioneOra(){
  if(!sessionDraft) return;
  clearTimeout(sessSalvaTimer); clearTimeout(sessRemotoTimer);
  salvaSessioneLocale(); salvaSessioneRemota();
}
function cancellaSessioneSalvata(){
  clearTimeout(sessSalvaTimer); clearTimeout(sessRemotoTimer);
  try{ localStorage.removeItem(chiaveSessioneLocale()); }catch(e){}
  sessioneInCorsoRemota = null;
  try{ if(currentUid) db.collection('users').doc(currentUid).set({ sessioneInCorso: null }, { mergeFields:['sessioneInCorso'] }).catch(()=>{}); }catch(e){}
}
['input','change','click'].forEach(ev=> document.addEventListener(ev, ()=>{ if(sessionDraft) pianificaSalvataggioSessione(); }));
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') salvaSessioneOra(); });
window.addEventListener('pagehide', salvaSessioneOra);

function ricostruisciSessione(s){
  try{
    if(!s || !Array.isArray(s.esercizi) || !s.esercizi.length) return null;
    const base = SCHEDE.find(x=>x.id===s.schedaId);
    if(!base) return null;
    const defs = defsConLayout(base, s.layout, true);
    if(!defs || defs.length !== s.esercizi.length) return null;
    return {
      defs, schedaId:s.schedaId, schedaNome:s.schedaNome || base.nome, iniziata:s.iniziata,
      warmDone: Array.isArray(s.warmDone) ? s.warmDone : base.riscaldamento.map(()=>false),
      esercizi: s.esercizi
    };
  }catch(e){ return null; }
}
function sessioneSalvataCandidata(){
  let loc = null;
  try{ loc = JSON.parse(localStorage.getItem(chiaveSessioneLocale()) || 'null'); }catch(e){}
  const cand = [loc, sessioneInCorsoRemota].filter(x=> x && x.salvato && (Date.now()-x.salvato) < SESS_MAX_ORE*3600*1000);
  if(!cand.length) return null;
  cand.sort((a,b)=> b.salvato - a.salvato);
  return cand[0];
}
function chiediRiprendiAllenamento(s){
  return new Promise(resolve=>{
    const fatte = (s.esercizi||[]).reduce((n,e)=> n + (e.sets||[]).filter(x=>x.fatta).length, 0);
    const minuti = Math.max(0, Math.round((Date.now() - new Date(s.iniziata).getTime())/60000));
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.innerHTML = `<div class="confirm-box">
      <p class="confirm-msg" style="margin-bottom:6px;">🏋️ Allenamento in corso</p>
      <p class="field-hint" style="text-align:center;margin:0 0 16px;line-height:1.6;"><b>${escHtml(s.schedaNome||'')}</b><br>iniziato ${minuti<60 ? minuti+' min' : Math.floor(minuti/60)+' h '+(minuti%60)+' min'} fa · ${fatte} ${fatte===1?'serie segnata':'serie segnate'}</p>
      <div class="confirm-actions">
        <button class="btn secondary" id="rsScarta">Scarta</button>
        <button class="btn" id="rsRiprendi">Riprendi</button>
      </div></div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#rsRiprendi').onclick = ()=>{ overlay.remove(); resolve(true); };
    overlay.querySelector('#rsScarta').onclick = ()=>{ overlay.remove(); resolve(false); };
  });
}
async function controllaSessioneInCorso(){
  const s = sessioneSalvataCandidata();
  if(!s){ cancellaSessioneSalvata(); return false; }
  const ric = ricostruisciSessione(s);
  if(!ric){ cancellaSessioneSalvata(); return false; }
  const riprendi = await chiediRiprendiAllenamento(s);
  if(!riprendi){ cancellaSessioneSalvata(); return false; }
  sessionDraft = ric;
  return true;
}
async function scartaAllenamento(){
  if(!(await mostraConferma('Scartare questo allenamento? I dati segnati finora andranno persi.', 'danger'))) return;
  sessionDraft = null;
  cancellaSessioneSalvata();
  setRoute({name:'allenamento-list'});
}

async function avviaSessione(schedaId){
  if(sessionDraft){
    if(sessionDraft.schedaId===schedaId){ setRoute({name:'sessione'}); return; }
    if(!(await mostraConferma(`Hai già un allenamento in corso (${escHtml(sessionDraft.schedaNome)}). Iniziarne uno nuovo cancella i dati di quello. Procedere?`,'danger'))) return;
  }
  const scheda = SCHEDE.find(s=>s.id===schedaId);
  if(!blocchiIniziati[schedaId]){
    blocchiIniziati[schedaId] = new Date().toISOString();
    db.collection('users').doc(currentUid).set({ blocchiIniziati }, { merge:true }).catch(()=>{});
  }
  const defsSeduta = defsConLayout(scheda);
  sessionDraft = {
    defs: defsSeduta,
    schedaId,
    schedaNome: scheda.nome,
    iniziata: new Date().toISOString(),
    warmDone: scheda.riscaldamento.map(()=>false),
    esercizi: defsSeduta.map(e=>{
      const n = serieEsercizio(e);
      return {
        nome: e.nome,
        aggiunto: !!e.aggiunto,
        usaAlternativa: false,
        noteUtente: '',
        unilaterale: unilateraleEsercizio(e),
        sets: Array.from({length:n}, (_,i)=>({peso:'', rip:'', fatta:false, rpe:null, saltata:false,
          tecnica: (e.tecnicaUltima && i===n-1) ? e.tecnicaUltima : ''}))
      };
    })
  };
  salvaSessioneLocale();
  setRoute({name:'sessione'});
}

/* Lista di tutte le alternative note per un esercizio: quelle create e
   salvate dall'utente nel tempo, più quella predefinita dalla scheda (se
   presente e non già duplicata). Possono essere più di una — l'utente può
   continuare a crearne di nuove quando gli serve (es. attrezzi diversi
   occupati in momenti diversi) e sceglie ogni volta quale usare. */
function candidatiAlternativa(e){
  const salvate = alternativeSalvate[e.nome] || [];
  const predefinita = (e.alternativa && e.alternativa!=='—') ? e.alternativa : null;
  const lista = [...salvate];
  if(predefinita && !lista.includes(predefinita)) lista.unshift(predefinita);
  return lista;
}

/* Foglio a comparsa per scegliere/creare/eliminare le alternative di un
   esercizio della sessione in corso. Vive fuori da #view (appeso a
   document.body, come gli altri fogli dell'app) e si aggiorna in-place
   senza richiudersi ogni volta che si aggiunge o elimina una voce. */
let alternativaSheetEi = null;

function apriAlternativeSheet(ei){
  alternativaSheetEi = ei;
  hapticaLieve();
  mostraAlternativeSheetOverlay();
}

function mostraAlternativeSheetOverlay(){
  let overlay = document.getElementById('altSheetOverlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'altSheetOverlay';
    overlay.className = 'sheet-overlay';
    overlay.addEventListener('click', e=>{ if(e.target===overlay) chiudiAlternativeSheet(); });
    document.body.appendChild(overlay);
  }
  overlay.innerHTML = `<div class="sheet-box" id="altSheetBox"><div class="sheet-handle"></div>${renderAlternativeSheetBody()}</div>`;
  attachSwipeDownToDismiss(overlay.querySelector('#altSheetBox'), chiudiAlternativeSheet);
}

function escHtml(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escapeAttr(s){
  // Il nome finisce sia dentro un attributo onclick="...('qui')" sia dentro
  // markup HTML: oltre a proteggere l'apice per JS, va anche neutralizzato
  // l'eventuale doppio apice, che altrimenti chiuderebbe in anticipo
  // l'attributo onclick="..." (racchiuso tra doppi apici) e romperebbe il pulsante.
  return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
}

function renderAlternativeSheetBody(){
  const ei = alternativaSheetEi;
  const scheda = schedaSessione();
  const e = scheda.esercizi[ei];
  const draft = sessionDraft.esercizi[ei];
  const salvate = alternativeSalvate[e.nome] || [];
  const lista = candidatiAlternativa(e);

  const righeHtml = lista.map(nome=>{
    const attiva = draft.usaAlternativa && draft.nome===nome;
    const isCustom = salvate.includes(nome);
    return `
    <div class="opt-card${attiva?' active':''}">
      <div class="opt-card-top" onclick="scegliAlternativaSheet('${escapeAttr(nome)}')">
        <div class="opt-card-main">
          <div class="opt-card-title">${nome}${attiva?' <span class="opt-card-badge">In uso</span>':''}</div>
        </div>
      </div>
      ${isCustom ? `<button class="btn small secondary" style="margin-top:8px;width:100%;" onclick="event.stopPropagation();eliminaAlternativaSalvata('${escapeAttr(nome)}')">✕ Rimuovi questa alternativa</button>` : ''}
    </div>`;
  }).join('');

  return `
    <div class="sheet-header">
      <div class="sheet-title">Alternative a ${e.nome}</div>
      <button class="sheet-close" onclick="chiudiAlternativeSheet()">✕</button>
    </div>
    ${draft.usaAlternativa ? `<button class="btn small secondary" style="width:100%;margin:6px 0 14px;" onclick="tornaAOriginaleSheet()">↺ Torna a ${e.nome}</button>` : ''}
    <div class="opt-card-list">${righeHtml || '<p class="field-hint" style="margin:0 0 14px;">Nessuna alternativa ancora creata per questo esercizio.</p>'}</div>
    <button class="btn small secondary" style="width:100%;margin-top:14px;" onclick="aggiungiNuovaAlternativa()">+ Crea una nuova alternativa</button>
  `;
}

function scegliAlternativaSheet(nome){
  const ei = alternativaSheetEi;
  const draft = sessionDraft.esercizi[ei];
  draft.usaAlternativa = true;
  draft.nome = nome;
  hapticaMedia();
  chiudiAlternativeSheet();
  renderSessionePreservandoScroll();
}

function tornaAOriginaleSheet(){
  const ei = alternativaSheetEi;
  const draft = sessionDraft.esercizi[ei];
  draft.usaAlternativa = false;
  draft.nome = null;
  hapticaLieve();
  chiudiAlternativeSheet();
  renderSessionePreservandoScroll();
}

async function aggiungiNuovaAlternativa(){
  const ei = alternativaSheetEi;
  const scheda = schedaSessione();
  const e = scheda.esercizi[ei];
  const testo = await mostraModificaAlternativaOverlay(e.nome, '');
  if(testo===null) return;
  if(!alternativeSalvate[e.nome]) alternativeSalvate[e.nome] = [];
  if(!alternativeSalvate[e.nome].includes(testo)) alternativeSalvate[e.nome].push(testo);
  db.collection('users').doc(currentUid).set({ alternativeSalvate }, { merge:true }).catch(()=>{});
  mostraAlternativeSheetOverlay();
}

function eliminaAlternativaSalvata(nome){
  const ei = alternativaSheetEi;
  const scheda = schedaSessione();
  const e = scheda.esercizi[ei];
  const draft = sessionDraft.esercizi[ei];
  if(alternativeSalvate[e.nome]){
    alternativeSalvate[e.nome] = alternativeSalvate[e.nome].filter(n=>n!==nome);
  }
  db.collection('users').doc(currentUid).set({ alternativeSalvate }, { merge:true }).catch(()=>{});
  if(draft.usaAlternativa && draft.nome===nome){
    draft.usaAlternativa = false;
    draft.nome = null;
    renderSessionePreservandoScroll();
  }
  mostraAlternativeSheetOverlay();
}

function chiudiAlternativeSheet(){
  const overlay = document.getElementById('altSheetOverlay');
  if(overlay) overlay.remove();
  alternativaSheetEi = null;
}

function aggiungiSet(ei){
  const draft = sessionDraft.esercizi[ei];
  draft.sets.push({peso:'', rip:'', fatta:false, rpe:null, saltata:false});
  renderSessionePreservandoScroll();
}

/* Rimuove una serie SOLO se è una serie extra aggiunta a mano oltre a
   quelle previste dalla scheda (si >= serieTarget): le serie "ufficiali"
   della scheda non si tolgono da qui, al massimo si saltano (vedi sotto). */
function rimuoviSet(ei, si){
  const scheda = schedaSessione();
  const target = serieEsercizio(scheda.esercizi[ei]);
  if(si < target) return;
  sessionDraft.esercizi[ei].sets.splice(si, 1);
  renderSessionePreservandoScroll();
}

/* Salta una singola serie (es. per un fastidio improvviso, o perché quel
   giorno non serve): la serie conta come "risolta" ai fini dello sblocco
   dell'esercizio successivo senza dover per forza segnare peso/rip/RPE. */
function saltaSet(ei, si){
  const set = sessionDraft.esercizi[ei].sets[si];
  set.saltata = true;
  set.fatta = false;
  hapticaLieve();
  renderSessionePreservandoScroll();
}
function annullaSaltoSet(ei, si){
  sessionDraft.esercizi[ei].sets[si].saltata = false;
  renderSessionePreservandoScroll();
}

/* Salta l'intero esercizio (es. attrezzo occupato, infortunio, tempo
   scaduto): marca come saltate tutte le serie non ancora fatte, cosi'
   l'esercizio risulta completato e il successivo si sblocca. Le serie già
   segnate come fatte restano intatte. */
async function saltaEsercizioConferma(ei){
  const scheda = schedaSessione();
  const nome = sessionDraft.esercizi[ei].nome || scheda.esercizi[ei].nome;
  if(!(await mostraConferma(`Saltare del tutto "${nome}"? Le serie non ancora segnate verranno marcate come saltate.`, 'danger'))) return;
  sessionDraft.esercizi[ei].sets.forEach(s=>{ if(!s.fatta) s.saltata = true; });
  renderSessionePreservandoScroll();
}

/* Precompila peso e ripetizioni di ogni serie con i valori dell'ultima
   volta che hai fatto questo esercizio: risparmia la digitazione quando
   vuoi ripartire dallo stesso carico. Non tocca fatta/RPE: li confermi tu
   serie per serie, come sempre. */
function usaValoriUltimaVolta(ei){
  const draft = sessionDraft.esercizi[ei];
  const scheda = schedaSessione();
  const nomeAttivo = draft.nome || scheda.esercizi[ei].nome;
  const ultima = datiUltimaSessione(nomeAttivo);
  if(!ultima) return;
  ultima.sets.forEach((s,si)=>{
    if(!draft.sets[si]) return;
    if(s.peso!=='' && s.peso!=null) draft.sets[si].peso = s.peso;
    if(s.rip!=='' && s.rip!=null) draft.sets[si].rip = s.rip;
    if(draft.unilaterale){
      if(s.pesoDx!=='' && s.pesoDx!=null) draft.sets[si].pesoDx = s.pesoDx;
      if(s.ripDx!=='' && s.ripDx!=null) draft.sets[si].ripDx = s.ripDx;
    }
  });
  hapticaLieve();
  renderSessionePreservandoScroll();
}

/* Una serie è "risolta" (non blocca il completamento dell'esercizio) se è
   stata fatta e valutata con RPE, oppure se è stata esplicitamente
   saltata: in quel caso non serve RPE, non l'hai eseguita. */
function setRisolto(s){
  return s.saltata || (s.fatta && s.rpe!=null);
}

function esercizioCompletato(ei){
  const ex = sessionDraft.esercizi[ei];
  return !!ex && ex.sets.length>0 && ex.sets.every(setRisolto);
}

/* ============ SUPERSET (esercizi eseguiti in coppia/gruppo) ============
   Una scheda può opzionalmente taggare più esercizi con lo stesso valore
   in `superset`: quegli esercizi vengono raggruppati in un'unica "unità"
   che si sblocca e si esegue insieme (alternando liberamente tra loro),
   invece che uno strettamente dopo l'altro. Il blocco sequenziale resta
   invece tra un'unità (gruppo o esercizio singolo) e la successiva.
   Nessuna scheda attuale dell'utente usa questo tag: finché `superset` non
   è impostato su un esercizio, ogni unità contiene un solo esercizio e il
   comportamento è identico a prima, serie sequenziale come sempre. */
function unitaSessione(scheda){
  const unita = [];
  const visti = new Set();
  scheda.esercizi.forEach((e, ei)=>{
    if(visti.has(ei)) return;
    if(e.superset){
      const indici = [];
      scheda.esercizi.forEach((e2, ei2)=>{
        if(e2.superset === e.superset){ indici.push(ei2); visti.add(ei2); }
      });
      unita.push({ tipo:'superset', tag:e.superset, indici });
    } else {
      visti.add(ei);
      unita.push({ tipo:'singolo', indici:[ei] });
    }
  });
  return unita;
}
function unitaCompletata(u){
  return u.indici.every(ei=>esercizioCompletato(ei));
}

function refreshLocks(){
  const scheda = schedaSessione();
  const sig = scheda.esercizi.map((_,i)=> esercizioCompletato(i)?'1':'0').join('');
  const prec = sessionDraft._sig;
  sessionDraft._sig = sig;
  if(prec!==undefined && prec!==sig && prec.length===sig.length){
    // Un esercizio è stato completato (o riaperto): chi si è appena chiuso torna
    // in modalità automatica, così si richiude e si apre il prossimo da fare.
    sessionDraft.esercizi.forEach((d,i)=>{ if(sig[i]==='1' && prec[i]!=='1') delete uiDi(d).open; });
    renderSessionePreservandoScroll();
    const nuovi = (sig.match(/1/g)||[]).length > (prec.match(/1/g)||[]).length;
    if(nuovi){
      const k = indiceUnitaCorrente(scheda);
      if(k>=0) scrollAEsercizio(unitaSessione(scheda)[k].indici[0], 'start');
    }
    return;
  }
  aggiornaProgressoSessione();
}

/* Aggiorna in-place (senza ridisegnare la pagina) il contatore degli esercizi
   completati e la barra di avanzamento. */
function aggiornaProgressoSessione(){
  if(!sessionDraft) return;
  const scheda = schedaSessione();
  if(!scheda) return;
  const tot = scheda.esercizi.length;
  const ok = scheda.esercizi.reduce((n,_,i)=> n + (esercizioCompletato(i) ? 1 : 0), 0);
  const box = document.getElementById('sessionProgress');
  if(!box) return;
  const lbl = box.querySelector('#sessionCount');
  const fill = box.querySelector('.bp-fill');
  const nt = contaTecnicheSessione();
  if(lbl) lbl.textContent = `${ok} di ${tot} esercizi${nt?` · ⚡ ${nt}/${maxTecnicheSeduta()}`:''}`;
  if(fill) fill.style.width = (tot ? Math.round(ok/tot*100) : 0) + '%';
}

/* Aggiorna in-place l'avviso "Segna l'RPE" di una singola serie dopo che è
   stata spuntata o le è stato dato l'RPE, senza ridisegnare tutta la sessione. */
function aggiornaAvvisoRPE(ei, si){
  const set = sessionDraft.esercizi[ei] && sessionDraft.esercizi[ei].sets[si];
  const row = document.getElementById(`setrow-${ei}-${si}`);
  if(!set || !row) return;
  const manca = set.fatta && set.rpe==null && !set.saltata;
  row.classList.toggle('rpe-missing', manca);
  row.classList.toggle('s2-done', !!set.fatta && !manca);
}

/* renderSessione() sostituisce tutto view.innerHTML: senza precauzioni il
   browser perde la posizione di scroll e "salta" in cima alla pagina ogni
   volta che si sblocca un esercizio o si cambia alternativa — proprio
   mentre si sta compilando una serie, il momento peggiore per un salto
   visivo. Qui salviamo la posizione di scroll prima del re-render e la
   ripristiniamo subito dopo: gli esercizi già sbloccati sopra il punto in
   cui ti trovi non cambiano altezza tra un render e l'altro, quindi la
   vista resta stabile invece di "sminchiarsi". */
function renderSessionePreservandoScroll(){
  const scrollY = window.scrollY;
  renderSessione();
  window.scrollTo(0, scrollY);
}

function updateNotaEsercizio(ei, val){
  sessionDraft.esercizi[ei].noteUtente = val;
}

function setRPESet(ei, si, val){
  sessionDraft.esercizi[ei].sets[si].rpe = val ? Number(val) : null;
  aggiornaAvvisoRPE(ei, si);
  refreshLocks();
}

/* ============ SUGGERIMENTO PROGRESSIONE CARICO ============
   Se nelle ultime 2 sedute sono state completate tutte le ripetizioni/durata
   richieste, suggerisce di aumentare leggermente il carico (o la durata per
   esercizi a tempo come il plank). Solo un suggerimento: la decisione resta
   sempre dell'utente. */
function parseRipTarget(str){
  if(!str) return null;
  const isTime = str.includes('"');
  const nums = str.replace(/"/g,'').split('-').map(n=>parseInt(n)).filter(n=>!isNaN(n));
  if(!nums.length) return null;
  return { max: Math.max(...nums), isTime };
}

function datiUltimaSessione(nomeEsercizio){
  const trovata = cache.sessioni
    .slice().sort((a,b)=> new Date(b.data)-new Date(a.data))
    .map(s=>({ data: s.data, es: trovaEsInSessione(s, nomeEsercizio) }))
    .find(x=>x.es);
  if(!trovata){
    const base = ULTIMA_VOLTA_BASE[String(nomeEsercizio||'').trim().toLowerCase()];
    return base ? { data: base.data, sets: base.sets, noteUtente:'' } : null;
  }
  return { data: trovata.data, sets: trovata.es.sets || [], noteUtente: trovata.es.noteUtente || '' };
}

function suggerimentoProgressione(nomeEsercizio, ripTargetStr){
  const target = parseRipTarget(ripTargetStr);
  if(!target) return null;
  const ultime = cache.sessioni
    .slice().sort((a,b)=> new Date(b.data)-new Date(a.data))
    .map(s=> trovaEsInSessione(s, nomeEsercizio))
    .filter(Boolean)
    .slice(0,2);
  if(ultime.length < 2) return null;

  const entrambeOk = ultime.every(es=>
    es.sets.length>0 && es.sets.every(set=>{
      const rip = parseInt(set.rip);
      return set.fatta && !isNaN(rip) && rip >= target.max;
    })
  );
  const entrambeFallite = ultime.every(es=>
    es.sets.length>0 && es.sets.some(set=>{
      const rip = parseInt(set.rip);
      return !set.fatta || isNaN(rip) || rip < target.max;
    })
  );

  if(entrambeOk){
    // Auto-regolazione: se hai completato le rip ma con RPE già molto alto,
    // meglio consolidare il carico un'altra seduta prima di alzarlo ancora.
    const tuttiRpe = ultime.flatMap(es=> es.sets.map(s=>s.rpe)).filter(v=>v!=null && !isNaN(v));
    const rpeMedio = tuttiRpe.length ? tuttiRpe.reduce((a,b)=>a+b,0)/tuttiRpe.length : null;
    if(rpeMedio!=null && rpeMedio>=9){
      return `Nelle ultime 2 sedute hai completato ${target.isTime?'tutta la durata richiesta':'tutte le ripetizioni richieste'}, ma con un RPE medio alto (${rpeMedio.toFixed(1)}/10): meglio mantenere questo carico un'altra seduta prima di aumentare.`;
    }
    return target.isTime
      ? 'Nelle ultime 2 sedute hai completato tutta la durata richiesta: prova ad aumentare di qualche secondo.'
      : 'Nelle ultime 2 sedute hai completato tutte le ripetizioni richieste: prova ad aumentare il peso di circa 2.5 kg.';
  }

  if(entrambeFallite){
    return target.isTime
      ? "Nelle ultime 2 sedute non hai completato la durata richiesta: valuta di scendere leggermente d'intensità o di recuperare un po' di più tra le serie."
      : 'Nelle ultime 2 sedute non hai completato le ripetizioni richieste: valuta di scendere leggermente di peso per tornare a muoverti con buona tecnica.';
  }

  return null;
}

/* ============ CRONOMETRO SESSIONE (tempo trascorso totale) ============
   Semplice display in cima alla pagina, non un vero timer con notifiche
   come quello di recupero: si limita ad aggiornare ogni secondo il testo
   "tempo trascorso" da quando è iniziata la sessione (sessionDraft.iniziata).
   L'interval viene avviato una sola volta (guardia in renderSessione) e
   fermato da render() quando si esce dalla route 'sessione'. */
function formatElapsed(ms){
  const totalSec = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  const mm = String(m).padStart(2,'0');
  const ss = String(s).padStart(2,'0');
  return h>0 ? `${h}:${mm}:${ss}` : `${m}:${ss}`;
}
function updateSessionElapsedDisplay(){
  if(!sessionDraft) return;
  const el = document.getElementById('sessionElapsed');
  if(!el) return;
  el.textContent = formatElapsed(Date.now() - new Date(sessionDraft.iniziata).getTime());
}

/* Card di un esercizio sbloccato e utilizzabile, con logbook completo:
   estratta a funzione perché ora va richiamata sia per un esercizio
   singolo sia per ciascun membro di un gruppo superset. supersetTag: se
   valorizzato, mostra un'etichetta "🔗 Superset" sulla card. */
/* ============ SCHERMATA ALLENAMENTO (v2) ============
   Esercizi a scheda apribile (di default aperto solo quello da fare ora, i
   completati si richiudono da soli), serie su una riga sola, extra e
   strumenti nascosti sotto "Altro". Lo stato aperto/chiuso vive in una
   WeakMap legata all'esercizio, così non finisce nei dati salvati. */
const uiEs = new WeakMap();
function uiDi(draft){ let u = uiEs.get(draft); if(!u){ u = { menu:{} }; uiEs.set(draft,u); } return u; }
function indiceUnitaCorrente(scheda){
  return unitaSessione(scheda).findIndex(u=>!unitaCompletata(u));
}
function esercizioAperto(ei, scheda){
  const u = uiDi(sessionDraft.esercizi[ei]);
  if(typeof u.open==='boolean') return u.open;
  const un = unitaSessione(scheda); const k = indiceUnitaCorrente(scheda);
  return k>=0 && un[k].indici.includes(ei);
}
function toggleEsercizio(ei){
  const scheda = schedaSessione();
  const u = uiDi(sessionDraft.esercizi[ei]);
  u.open = !esercizioAperto(ei, scheda);
  renderSessionePreservandoScroll();
}
function toggleAltroEsercizio(ei){
  const u = uiDi(sessionDraft.esercizi[ei]);
  u.more = !u.more;
  renderSessionePreservandoScroll();
}
function toggleMenuSerie(ei, si){
  const u = uiDi(sessionDraft.esercizi[ei]);
  u.menu[si] = !u.menu[si];
  renderSessionePreservandoScroll();
}
function formattaNoteScheda(txt){
  let h = escHtml(txt || '');
  h = h.replace(/\s([A-ZÀ-Ü][A-ZÀ-Ü' ]{5,}:)/g, '<br><br><b>$1</b>');
  ['Drop set:','Rest-pause:','Parziali in allungamento:','Jump set:','Esercizi unilaterali:','Progressione:','Esecuzione:','Dopo 4-6 settimane:','Sono linee guida generali'].forEach(l=>{
    h = h.split(' '+l).join('<br><br><b>'+l+'</b>');
  });
  return h.replace(/^(<br>)+/,'');
}

      <button type="button" class="s2-chip${uni?' on':''}" onclick="toggleUnilaterale(${ei})">↔ Unilaterale${uni?' ✓':''}</button>
      ${usaAlt
        ? `<button type="button" class="s2-chip" onclick="apriAlternativeSheet(${ei})">🔁 Cambia alternativa</button>`
        : `<button type="button" class="s2-chip" onclick="apriAlternativeSheet(${ei})">🔁 Alternativa${(()=>{const n=candidatiAlternativa(e).length; return n?` (${n})`:'';})()}</button>`}
      ${mobile ? `<button type="button" class="s2-chip" ${uIdx<=0?'disabled':''} onclick="spostaEsercizio(${ei},-1)">▲ Su</button>
      <button type="button" class="s2-chip" ${uIdx>=nUn-1?'disabled':''} onclick="spostaEsercizio(${ei},1)">▼ Giù</button>` : ''}
      <button type="button" class="s2-chip" onclick="apriAggiungiEsercizio(${ei})">➕ Aggiungi sotto</button>
      ${draft.aggiunto ? `<button type="button" class="s2-chip" onclick="rimuoviEsercizioAggiunto(${ei})">🗑 Rimuovi esercizio</button>` : ''}
      <button type="button" class="s2-chip s2-danger" onclick="saltaEsercizioConferma(${ei})">⏭ Salta esercizio</button>
    </div>`;
    if(e.note) html += `<div class="note-box">${usaAlt ? `Stai facendo l'alternativa al posto di <b>${escHtml(e.nome)}</b>. ` : ''}${escHtml(e.note)}</div>`;
    const suggerimento = suggerimentoProgressione(nomeAttivo, e.ripTarget);
    if(suggerimento) html += `<div class="progress-tip">💡 ${suggerimento}</div>`;
    html += `<p class="rpe-legend">RPE: 6 = leggero · 8 = a 2 rip dal cedimento · 10 = cedimento totale</p>`;
    html += `<textarea class="note-user" placeholder="Le tue note su questo esercizio (sensazioni, dolori, aggiustamenti...)" oninput="updateNotaEsercizio(${ei}, this.value)">${escHtml(draft.noteUtente||'')}</textarea>`;
    if(!usaAlt && infoEs) html += schedaEsercizioHtml(ei, e.nome, infoEs);
    else if(!usaAlt) html += `<button class="toggle-guide" onclick="toggleGuide(${ei})">Guida esercizio ▾</button>
      <div class="guide-body" id="guide-${ei}"><b>Muscoli:</b> ${e.guida.muscoli}<br><br><b>Esecuzione:</b> ${e.guida.esecuzione}<br><br><b>Errori da evitare:</b> ${e.guida.errori}</div>`;
    if(!usaAlt && e.video) html += `<a href="${e.video}" target="_blank" rel="noopener" class="video-link">▶ Guarda il video</a>`;
    html += `</div>`;
  }
  html += `</div></div>`;
  return html;
}

function riscaldamentoCompletati(){ return (sessionDraft.warmDone||[]).filter(Boolean).length; }

function renderSessione(){
  const scheda = schedaSessione();
  pageTitle.textContent = scheda.nome;
  if(!sessionTimerHandle){
    sessionTimerHandle = setInterval(updateSessionElapsedDisplay, 1000);
  }
  const totaleEsercizi = scheda.esercizi.length;
  const completatiEsercizi = scheda.esercizi.reduce((n,_,i)=> n + (esercizioCompletato(i) ? 1 : 0), 0);
  const pctSessione = totaleEsercizi ? Math.round(completatiEsercizi/totaleEsercizi*100) : 0;
  sessionDraft._sig = scheda.esercizi.map((_,i)=> esercizioCompletato(i)?'1':'0').join('');

  const apertaSez = k=> !!sezioniSchedaAperte['__sess|'+sessionDraft.schedaId+'|'+k];
  const tog = k=> `ontoggle="memSezioneScheda('__sess|${sessionDraft.schedaId}|${k}', this.open)"`;

  let html = '';
  if(profiloUtente && profiloUtente.attenzioni){
    html += `<div class="card" style="border-left:3px solid var(--accent-2);"><p style="margin:0;font-size:13px;line-height:1.6;"><b>Attenzione:</b> ${profiloUtente.attenzioni}</p></div>`;
  }
  // Da tenere a mente: a scomparsa, chiuso di default
  if(scheda.note || scheda.descrizione){
    html += `<details class="sess-info"${apertaSez('dtm')?' open':''} ${tog('dtm')}>
      <summary><span>📌 Da tenere a mente</span></summary>
      <div class="sess-info-body">
        ${scheda.descrizione ? `<p>${escHtml(scheda.descrizione)}</p>` : ''}
        ${scheda.note ? `<p>${formattaNoteScheda(scheda.note)}</p>` : ''}
      </div>
    </details>`;
  }
  // Riscaldamento: a scomparsa, con contatore
  html += `<details class="sess-info"${apertaSez('warm')?' open':''} ${tog('warm')}>
    <summary><span>🔥 Riscaldamento</span><em id="warmCount">${riscaldamentoCompletati()}/${scheda.riscaldamento.length}</em></summary>
    <div class="sess-info-body">
      <p class="field-hint" style="margin:0 0 8px;">Da fare prima di iniziare, 5-8 minuti totali.</p>`;
  scheda.riscaldamento.forEach((w,i)=>{
    html += `<div class="warm-item">
      <div>
        <div class="l"><label style="display:flex;align-items:center;gap:10px;cursor:pointer;">
          <input type="checkbox" ${sessionDraft.warmDone[i]?'checked':''} onchange="toggleWarm(${i})" style="width:18px;height:18px;accent-color:var(--accent);">
          ${escHtml(w.nome)}</label></div>
        <div class="r" style="margin-left:28px;">${escHtml(w.note||'')}${w.video ? ` · <a href="${w.video}" target="_blank" rel="noopener" class="video-link" style="padding:0;">▶ Video</a>` : ''}</div>
      </div>
      <div class="r">${escHtml(w.serie||'')}</div>
    </div>`;
  });
  html += `</div></details>`;

  const unita = unitaSessione(scheda);
  unita.forEach(u=>{
    if(u.tipo==='superset'){
      const jump = scheda.esercizi[u.indici[0]].jump;
      html += `<div class="superset-group">
        <div class="superset-label">${jump ? '🔁 Jump set · alterna una serie per esercizio' : '🔗 Superset · alterna liberamente questi esercizi'}</div>`;
      u.indici.forEach(ei=> html += renderEsercizioCard(scheda, ei, scheda.esercizi[ei].jump ? 'Jump set' : 'Superset'));
      html += `</div>`;
    } else {
      html += renderEsercizioCard(scheda, u.indici[0], null);
    }
  });

  html += `<button type="button" class="btn secondary" style="width:100%;margin-top:6px;" onclick="apriAggiungiEsercizio()">➕ Aggiungi un esercizio</button>`;
  if(layoutSchede[sessionDraft.schedaId]) html += `<button type="button" class="btn small secondary" style="width:100%;margin-top:8px;" onclick="ripristinaOrdineScheda()">↺ Ripristina ordine originale della scheda</button>`;
  html += `<button type="button" class="skip-ex-link" style="display:block;margin:18px auto 0;" onclick="scartaAllenamento()">Scarta questo allenamento</button>`;
  html += `<div class="ex-attrib">Immagini illustrative degli esercizi: <a href="https://wger.de" target="_blank" rel="noopener">wger.de</a> (CC BY-SA)</div>`;
  html += `<div style="height:130px;"></div>`;
  html += `<div class="finish-bar">
    <div class="finish-bar-progress" id="sessionProgress">
      <p class="bp-label"><span class="se-dot"></span><span id="sessionElapsed">${formatElapsed(Date.now() - new Date(sessionDraft.iniziata).getTime())}</span><span id="sessionCount">${completatiEsercizi} di ${totaleEsercizi} esercizi${contaTecnicheSessione()?` · ⚡ ${contaTecnicheSessione()}/${maxTecnicheSeduta()}`:''}</span></p>
      <div class="bp-bar"><div class="bp-fill" style="width:${pctSessione}%"></div></div>
    </div>
    <button class="btn" id="finishBtn" onclick="terminaSessione()">Termina e salva allenamento</button>
  </div>`;
  view.innerHTML = html;
}

function toggleWarm(i){ sessionDraft.warmDone[i] = !sessionDraft.warmDone[i]; const c = document.getElementById('warmCount'); if(c) c.textContent = riscaldamentoCompletati()+'/'+schedaSessione().riscaldamento.length; }

function toggleGuide(ei){
  document.getElementById('guide-'+ei).classList.toggle('open');
}

function updateSet(ei,si,field,val){
  const st = sessionDraft.esercizi[ei].sets[si];
  st[field] = val;
  if(field==='peso') aggiornaDropAuto(ei, si);
  else if(field==='pesoDrop'){ st.pesoDropManuale = String(val).trim()!==''; if(!st.pesoDropManuale){ st.pesoDrop = calcolaPesoDrop(st); } }
}

/* Stepper +/- sul peso: incrementi di 1.25kg, il taglio dischi piu' comune in
   sala pesi, per evitare la tastiera numerica del telefono a meta' serie. */
function adjustPeso(ei, si, delta, campo){
  const f = campo || 'peso';
  const set = sessionDraft.esercizi[ei].sets[si];
  const attuale = parseFloat(set[f]) || 0;
  let nuovo = Math.round((attuale + delta) * 4) / 4;
  if(nuovo < 0) nuovo = 0;
  set[f] = nuovo;
  const input = document.getElementById(`${f==='peso'?'peso':'pesodx'}-${ei}-${si}`);
  if(input) input.value = nuovo;
  if(f==='peso') aggiornaDropAuto(ei, si);
}

/* Foglio per cambiare il recupero di un esercizio: preset rapidi + secondi
   liberi, "Ripristina" torna al valore della scheda. Il valore resta salvato
   per le sedute future (recuperiPersonalizzati sul profilo). */
function apriModificaRecupero(ei){
  const scheda = schedaSessione();
  const e = scheda.esercizi[ei];
  const attuale = recuperoEsercizio(e);
  const presets = [30,45,60,75,90,120,150,180,240];
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.id = 'recOverlay';
  overlay.innerHTML = `<div class="confirm-box">
    <p class="confirm-msg" style="margin-bottom:4px;">⏱ Recupero tra le serie</p>
    <p class="field-hint" style="text-align:center;margin:0 0 14px;">${escHtml(e.nome)}<br>Previsto dalla scheda: ${fmtRecupero(e.recupero)}</p>
    <div class="rec-presets">${presets.map(p=>`<div class="chip${p===attuale?' active':''}" data-p="${p}">${fmtRecupero(p)}</div>`).join('')}</div>
    <div class="field" style="margin-bottom:14px;"><label>Oppure scegli i secondi</label>
      <input type="number" id="recSecInput" min="0" max="900" step="5" inputmode="numeric" value="${attuale}" style="text-align:center;font-size:20px;font-weight:900;">
    </div>
    <div class="confirm-actions" style="flex-wrap:wrap;">
      <button class="btn secondary" id="recResetBtn">Ripristina</button>
      <button class="btn" id="recSaveBtn">Salva</button>
    </div>
    <button class="btn small secondary" id="recCancelBtn" style="width:100%;margin-top:10px;">Annulla</button>
  </div>`;
  document.body.appendChild(overlay);
  const input = overlay.querySelector('#recSecInput');
  overlay.querySelectorAll('.chip').forEach(c=> c.onclick = ()=>{
    input.value = c.dataset.p;
    overlay.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active', x===c));
  });
  const chiudi = ()=> overlay.remove();
  overlay.querySelector('#recCancelBtn').onclick = chiudi;
  overlay.addEventListener('click', ev=>{ if(ev.target===overlay) chiudi(); });
  overlay.querySelector('#recResetBtn').onclick = ()=>{
    delete recuperiPersonalizzati[e.nome];
    salvaRecuperiPersonalizzati(); chiudi(); hapticaLieve(); renderSessionePreservandoScroll();
  };
  overlay.querySelector('#recSaveBtn').onclick = ()=>{
    const v = Math.round(Number(input.value));
    if(isNaN(v) || v<0 || v>900){ input.style.borderColor = 'var(--danger)'; return; }
    if(v===e.recupero) delete recuperiPersonalizzati[e.nome]; else recuperiPersonalizzati[e.nome] = v;
    salvaRecuperiPersonalizzati(); chiudi(); hapticaLieve(); renderSessionePreservandoScroll();
  };
}

  const e = scheda.esercizi[ei];
  let n = serieEsercizio(e);
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';

    </div>
    <div class="confirm-actions" style="flex-wrap:wrap;">
      <button class="btn secondary" id="serieResetBtn">Ripristina</button>
      <button class="btn" id="serieSaveBtn">Salva</button>
    </div>
    <button class="btn small secondary" id="serieCancelBtn" style="width:100%;margin-top:10px;">Annulla</button>

    while(draft.sets.length < t) draft.sets.push({peso:'', rip:'', fatta:false, rpe:null, saltata:false});
    while(draft.sets.length > t){
      const l = draft.sets[draft.sets.length-1];
      if(l.fatta || l.saltata || l.peso!=='' || l.rip!=='') break;
      draft.sets.pop();

    chiudi(); hapticaLieve(); refreshLocks(); renderSessionePreservandoScroll();

    else serieRipPersonalizzate[e.nome] = { serie:n, rip };
    salvaSerieRipPersonalizzate(); applicaAllaSessione();
  };
}

function markSetDone(ei,si,recupero,checked,el){
  const set = sessionDraft.esercizi[ei].sets[si];
  if(checked && set.peso!==''){
    const pesoNum = parseFloat(set.peso);
    if(isNaN(pesoNum) || pesoNum<0 || pesoNum>500){
      alert('Il peso inserito non sembra plausibile (0–500 kg). Controlla il valore prima di segnare la serie.');
      if(el) el.checked = false;
      return;
    }
  }
  set.fatta = checked;
  if(checked){ hapticaLieve(); startRestTimer(recupero); }
  aggiornaAvvisoRPE(ei, si);
  refreshLocks();
}

let restState = null;

const REST_RING_CIRC = 2 * Math.PI * 52;

/* Il timer di recupero è basato su un istante di fine assoluto (endAt),
   non su un contatore decrementato a ogni tick: se il telefono va in
   stand-by (schermo spento) i browser sospendono/rallentano i setInterval
   in background, quindi un semplice "remaining--" ogni tick andrebbe
   fuori sincrono o si fermerebbe del tutto. Calcolando invece il tempo
   restante come "endAt - adesso" ogni volta che serve, il timer torna
   sempre corretto non appena il telefono si riaccende, anche se i tick
   di mezzo sono stati persi. La Wake Lock API (dove supportata) prova
   inoltre a impedire che lo schermo si spenga da solo per inattività
   durante il recupero — non può nulla contro uno spegnimento manuale
   (tasto laterale), che resta una limitazione del sistema operativo, non
   dell'app. */
async function richiediRestWakeLock(){
  if(!('wakeLock' in navigator)) return;
  try{
    restWakeLock = await navigator.wakeLock.request('screen');
    restWakeLock.addEventListener('release', ()=>{ restWakeLock = null; });
  }catch(e){ restWakeLock = null; }
}
function rilasciaRestWakeLock(){
  if(restWakeLock){ restWakeLock.release().catch(()=>{}); restWakeLock = null; }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && restState){
    if(!restState.paused) richiediRestWakeLock();
    verificaFineRestTimer();
  }
});

function startRestTimer(seconds){
  clearRestTimer();
  const timerId = nuovoTimerId();
  restState = { endAt: Date.now()+seconds*1000, total: seconds, paused: false, pausedRemainingMs: 0, finalizzato: false, timerId };
  richiediRestWakeLock();
  pianificaNotificaTimerRemoto(seconds, timerId);
  const bar = document.createElement('div');
  bar.className = 'timer-bar';
  bar.id = 'restBar';
  bar.innerHTML = `
    <div class="timer-row">
      <button class="timer-adj" onclick="adjustRest(-15)">−15"</button>
      <div class="timer-ring-wrap">
        <svg class="timer-ring" viewBox="0 0 120 120">
          <circle class="timer-ring-bg" cx="60" cy="60" r="52"></circle>
          <circle class="timer-ring-fill" id="restRingFill" cx="60" cy="60" r="52"
            stroke-dasharray="${REST_RING_CIRC}" stroke-dashoffset="0"></circle>
        </svg>
        <div class="timer-ring-center">
          <div class="lbl">Recupero</div>
          <div class="t" id="restT">${seconds}"</div>
        </div>
      </div>
      <button class="timer-adj" onclick="adjustRest(15)">+15"</button>
    </div>
    <div class="timer-actions">
      <button class="btn small secondary" id="restPauseBtn" onclick="togglePauseRest()">⏸ Pausa</button>
      <button class="btn small secondary" onclick="clearRestTimer()">Salta</button>
    </div>`;
  document.body.appendChild(bar);
  updateRestDisplay();
  restTimerHandle = setInterval(()=>{
    if(!restState || restState.paused) return;
    updateRestDisplay();
    verificaFineRestTimer();
  },1000);
}

// Secondi rimanenti "veri", ricalcolati da endAt: sorgente di verità unica,
// sia per il tick normale sia per il resync dopo uno stand-by.
function restRemainingSec(){
  if(!restState) return 0;
  if(restState.paused) return Math.max(0, Math.ceil(restState.pausedRemainingMs/1000));
  return Math.max(0, Math.ceil((restState.endAt - Date.now())/1000));
}

function updateRestDisplay(){
  if(!restState) return;
  const remaining = restRemainingSec();
  const t = document.getElementById('restT');
  const ring = document.getElementById('restRingFill');
  if(t) t.textContent = remaining>0 ? remaining+'"' : 'Via! 💪';
  if(ring){
    const pct = restState.total>0 ? Math.max(0, Math.min(1, remaining/restState.total)) : 0;
    ring.style.strokeDashoffset = String(REST_RING_CIRC * (1 - pct));
  }
}

// Chiamata sia dal tick regolare sia al ritorno in foreground (visibilitychange):
// se il tempo è scaduto e non l'abbiamo ancora segnalato, scatta ora il feedback,
// anche se i tick del setInterval sono stati persi mentre il telefono era in stand-by.
function verificaFineRestTimer(){
  if(!restState || restState.finalizzato) return;
  if(restRemainingSec()<=0){
    restState.finalizzato = true;
    updateRestDisplay();
    timerFinishedFeedback();
    rilasciaRestWakeLock();
    if(restTimerHandle){ clearInterval(restTimerHandle); restTimerHandle=null; }
    setTimeout(clearRestTimer, 2000);
  }
}

function timerFinishedFeedback(){
  beep();
  if(navigator.vibrate){
    try{ navigator.vibrate([200,100,200,100,300]); }catch(e){}
  }
  if(window.Notification && Notification.permission === 'granted'){
    try{ new Notification('Recupero terminato 💪', { body:'Riparti con la prossima serie.', tag:'recupero-timer' }); }catch(e){}
  }
}

/* Feedback aptico breve per micro-azioni (segnare una serie/pasto, superare
   la soglia di uno swipe-to-delete...) e uno leggermente più marcato per le
   conferme. Nessun effetto su dispositivi/browser senza vibrazione (es. iOS
   Safari, che non la supporta): la chiamata fallisce silenziosamente. */
function hapticaLieve(){
  if(navigator.vibrate){ try{ navigator.vibrate(12); }catch(e){} }
}
function hapticaMedia(){
  if(navigator.vibrate){ try{ navigator.vibrate(25); }catch(e){} }
}

function richiediPermessoNotifiche(){
  if(window.Notification && Notification.permission === 'default'){
    Notification.requestPermission().catch(()=>{});
  }
}

function adjustRest(delta){
  if(!restState) return;
  if(restState.paused){
    restState.pausedRemainingMs = Math.max(0, restState.pausedRemainingMs + delta*1000);
  } else {
    restState.endAt = Date.now() + Math.max(0, restRemainingSec()*1000 + delta*1000);
    // Il tempo di fine è cambiato: la notifica remota già pianificata partirebbe
    // al momento sbagliato, quindi ne pianifichiamo una nuova con un nuovo id
    // (quella vecchia, quando scatterà, si accorgerà di essere superata e non
    // manderà nulla — vedi il controllo lato server su timerRecuperoAttivoId).
    restState.timerId = nuovoTimerId();
    pianificaNotificaTimerRemoto(restRemainingSec(), restState.timerId);
  }
  const nuovoRemaining = restRemainingSec();
  if(nuovoRemaining > restState.total) restState.total = nuovoRemaining;
  updateRestDisplay();
}

function togglePauseRest(){
  if(!restState) return;
  if(restState.paused){
    // Riprendi: il tempo restante salvato in pausa diventa il nuovo endAt,
    // e ripianifichiamo la notifica remota su questo nuovo orario di fine.
    restState.endAt = Date.now() + restState.pausedRemainingMs;
    restState.paused = false;
    richiediRestWakeLock();
    restState.timerId = nuovoTimerId();
    pianificaNotificaTimerRemoto(restRemainingSec(), restState.timerId);
  } else {
    restState.pausedRemainingMs = Math.max(0, restState.endAt - Date.now());
    restState.paused = true;
    rilasciaRestWakeLock();
    // In pausa il tempo è congelato: annulliamo la notifica remota pianificata
    // sul vecchio orario di fine, altrimenti arriverebbe troppo presto.
    annullaNotificaTimerRemoto();
  }
  const btn = document.getElementById('restPauseBtn');
  if(btn) btn.textContent = restState.paused ? '▶ Riprendi' : '⏸ Pausa';
}

function clearRestTimer(){
  if(restTimerHandle){ clearInterval(restTimerHandle); restTimerHandle=null; }
  rilasciaRestWakeLock();
  if(restState) annullaNotificaTimerRemoto();
  restState = null;
  const bar = document.getElementById('restBar');
  if(bar) bar.remove();
}

function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880;
    g.gain.value = 0.15;
    o.start();
    setTimeout(()=>{o.stop(); ctx.close();}, 350);
  }catch(e){}
}

/* ============ SWIPE PER ELIMINARE (scorrimento verso sinistra) ============ */
function attachSwipeHandlers(container, deleteFn){
  const MAX = 84;
  container.querySelectorAll('.swipe-row').forEach(row=>{
    const card = row.querySelector('.list-item');
    const delBtn = row.querySelector('.swipe-delete');
    if(!card || !delBtn) return;
    row.dataset.x = '0';
    let startX=0, startY=0, baseX=0, dragging=false, swiped=false, axis=null;

    card.addEventListener('pointerdown', e=>{
      startX = e.clientX; startY = e.clientY;
      baseX = parseFloat(row.dataset.x || '0');
      dragging = true; axis = null; swiped = false;
      card.style.transition = 'none';
    });
    card.addEventListener('pointermove', e=>{
      if(!dragging) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if(axis===null){
        if(Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      }
      if(axis!=='x') return;
      const x = Math.max(-MAX, Math.min(0, baseX + dx));
      card.style.transform = `translateX(${x}px)`;
      row.dataset.x = String(x);
      if(Math.abs(dx) > 8) swiped = true;
    });
    function endDrag(){
      if(!dragging) return;
      dragging = false;
      card.style.transition = 'transform .2s ease';
      const x = parseFloat(row.dataset.x || '0');
      if(x < -MAX/2){
        card.style.transform = `translateX(-${MAX}px)`; row.dataset.x = String(-MAX);
      } else {
        card.style.transform = 'translateX(0)'; row.dataset.x = '0';
      }
    }
    card.addEventListener('pointerup', endDrag);
    card.addEventListener('pointercancel', endDrag);
    card.addEventListener('click', e=>{
      if(swiped){ e.preventDefault(); e.stopImmediatePropagation(); swiped=false; return; }
      const name = card.dataset.routeName;
      if(name){ const id = card.dataset.routeId; setRoute(id ? {name, id} : {name}); }
    });
    delBtn.addEventListener('click', ()=> deleteFn(row.dataset.id));
  });
}
