let dietaOpenSet = new Set();
let suppOpenSet = new Set();

function toggleMicro(i){
  const el = document.getElementById('micro-'+i);
  if(el) el.classList.toggle('open');
}

function toggleIntegratore(idx){
  if(suppOpenSet.has(idx)) suppOpenSet.delete(idx); else suppOpenSet.add(idx);
  renderAlimentazione();
}
let dietaOpzioneSel = {};
let dietaTab = 'piano';
function setDietaTab(tab){ dietaTab = tab; renderAlimentazione(); }

function renderAlimentazione(){
  pageTitle.textContent = 'Dieta';

  // Il piano alimentare e l'integrazione qui sotto sono personali, costruiti
  // sui dati e sulle analisi di Antonio: seguono la stessa logica delle schede
  // di allenamento (schedeAssegnate === null → account storico di Antonio).
  // Ai nuovi profili non viene mostrato nulla finché il trainer non assegnerà
  // un piano dedicato a ciascuno di loro.
  const pianoPersonale = profiloUtente && profiloUtente.schedeAssegnate === null;
  if(!pianoPersonale){
    view.innerHTML = `<div class="card">
      <p class="empty" style="padding:10px 0;">Il tuo trainer non ti ha ancora assegnato un piano alimentare personale. Questa sezione si popolerà con la tua dieta e la tua integrazione quando saranno pronte.</p>
    </div>`;
    return;
  }

  const t = obiettiviAttivi();

  const macroDef = [
    {key:'prot', label:'Proteine', color:'var(--accent)'},
    {key:'carb', label:'Carboidrati', color:'var(--accent-2)'},
    {key:'grassi', label:'Grassi', color:'var(--accent-3)'},
  ];

  // Macro/kcal acquisiti oggi: somma delle opzioni dei pasti che hai spuntato
  // come "seguiti", usando l'opzione al momento selezionata per ciascun pasto.
  const acquisito = { kcal:0, prot:0, carb:0, grassi:0 };
  DIETA_PIANO.pasti.forEach((p,i)=>{
    if(cache.dietaLogOggi.pastiFatti[i]){
      const opz = p.opzioni[dietaOpzioneSel[i] || 0];
      acquisito.kcal += opz.kcal;
      acquisito.prot += opz.prot;
      acquisito.carb += opz.carb;
      acquisito.grassi += opz.grassi;
    }
  });
  const alimentiExtra = cache.dietaLogOggi.alimentiExtra || [];
  alimentiExtra.forEach(a=>{
    acquisito.kcal += a.kcal;
    acquisito.prot += a.prot;
    acquisito.carb += a.carb;
    acquisito.grassi += a.grassi;
  });

  const kcalPct = t.kcal ? Math.min(100, Math.round((acquisito.kcal/t.kcal)*100)) : 0;
  const kcalOver = acquisito.kcal > t.kcal;
  const kcalColor = kcalOver ? 'var(--accent-2)' : 'var(--accent)';
  const RING_R = 52, RING_C = 2*Math.PI*RING_R;
  const ringOffset = RING_C * (1 - kcalPct/100);

  const macroBarsHtml = macroDef.map(m=>{
    const val = acquisito[m.key];
    const goal = t[m.key];
    const pct = goal ? Math.min(100, Math.round((val/goal)*100)) : 0;
    return `<div class="macro-bar-row">
      <div class="mbr-top"><span>${m.label}</span><span>${val}g / ${goal}g</span></div>
      <div class="mbr-track"><div class="mbr-fill" style="width:${pct}%;background:${m.color};"></div></div>
    </div>`;
  }).join('');

  const mealsHtml = DIETA_PIANO.pasti.map((p,i)=>{
    const open = dietaOpenSet.has(i);
    const selIdx = dietaOpzioneSel[i] || 0;
    const opz = p.opzioni[selIdx];
    const foodRows = opz.alimenti.map(a=>`
      <tr>
        <td>${a.n}<div class="qty" style="font-size:11px;color:var(--text-dim);font-weight:600;">${a.q}</div></td>
        <td>${a.kcal}</td>
        <td>${a.prot}g</td>
        <td>${a.carb}g</td>
        <td>${a.grassi}g</td>
      </tr>`).join('');
    const chipsHtml = p.opzioni.map((o,oi)=>
      `<div class="chip${oi===selIdx?' active':''}" onclick="event.stopPropagation();selectDietaOpzione(${i},${oi})">${o.titolo}</div>`
    ).join('');
    const fatto = !!cache.dietaLogOggi.pastiFatti[i];
    const micro = calcolaMicroOpzione(opz);
    const microRows = MICRO_DEF.map(m=>{
      const v = micro[m.key];
      if(!(v>0)) return '';
      const vArr = v<10 ? Math.round(v*10)/10 : Math.round(v);
      return `<div class="micro-row"><span>${m.label}</span><b>${vArr} ${m.unit}</b></div>`;
    }).join('');
    return `
    <div class="meal-card${open?' open':''}">
      <div class="meal-head" onclick="toggleDietaPasto(${i})">
        <div class="icon">${p.icona}</div>
        <div class="mh-info">
          <div class="mh-name">${p.nome}${fatto ? ' <span class="done-tick">✅</span>' : ''}</div>
          <div class="mh-time">${p.orario} · ${p.opzioni.length} opzioni</div>
        </div>
        <div class="mh-kcal">${opz.kcal} kcal</div>
        <div class="mh-chev">▾</div>
      </div>
      <div class="meal-body"><div class="meal-body-in">
        <div class="chip-select">${chipsHtml}</div>
        <div class="meal-macro-mini">
          <span><span class="mb-dot" style="background:var(--accent);"></span>Prot. <b>${opz.prot}g</b></span>
          <span><span class="mb-dot" style="background:var(--accent-2);"></span>Carb. <b>${opz.carb}g</b></span>
          <span><span class="mb-dot" style="background:var(--accent-3);"></span>Grassi <b>${opz.grassi}g</b></span>
        </div>
        <table class="food-table">
          <thead><tr><th>Alimento</th><th>Kcal</th><th>Prot.</th><th>Carb.</th><th>Grassi</th></tr></thead>
          <tbody>${foodRows}</tbody>
        </table>
        <div class="meal-prep"><b>Preparazione:</b> ${opz.preparazione}</div>
        <button class="toggle-guide" onclick="event.stopPropagation();toggleMicro(${i})">💧🧪 Vitamine, minerali e acqua (stima) ▾</button>
        <div class="guide-body" id="micro-${i}">
          <p style="margin:0 0 10px;">💧 Acqua fornita da questi alimenti: <b style="color:var(--text);">${Math.round(micro.acqua)} ml circa</b></p>
          <div class="micro-grid">${microRows || '<p style="margin:0;">Dati non disponibili per questi alimenti.</p>'}</div>
          <p class="field-hint" style="margin-top:12px;">Valori indicativi da tabelle nutrizionali standard per 100g, non misurati sul prodotto/marca specifica che usi tu.</p>
        </div>
        <label class="done-toggle">
          <input type="checkbox" ${fatto?'checked':''} onchange="event.stopPropagation();toggleMealDone(${i})">
          Ho seguito questo pasto oggi
        </label>
      </div></div>
    </div>`;
  }).join('');

  const suppHtml = INTEGRAZIONE_PIANO.integratori.map((s,i)=>{
    const open = suppOpenSet.has(i);
    const preso = !!cache.dietaLogOggi.integratoriFatti[s.nome];
    return `
    <div class="meal-card${open?' open':''}">
      <div class="meal-head" onclick="toggleIntegratore(${i})">
        <div class="icon">${s.icona}</div>
        <div class="mh-info">
          <div class="mh-name">${s.nome}${preso ? ' <span class="done-tick">✅</span>' : ''}</div>
          <div class="mh-time">${s.dose}</div>
        </div>
        <div class="mh-chev">▾</div>
      </div>
      <div class="meal-body"><div class="meal-body-in">
        <div class="meal-prep" style="margin-top:0;"><b>Indicazioni d'uso:</b> ${s.indicazioni}</div>
        ${s.particolarita ? `<div class="meal-prep"><b>Particolarità:</b> ${s.particolarita}</div>` : ''}
        <label class="done-toggle">
          <input type="checkbox" ${preso?'checked':''} onchange="event.stopPropagation();toggleIntegratoreFatto('${s.nome.replace(/'/g,"\\'")}')">
          Preso oggi
        </label>
      </div></div>
    </div>`;
  }).join('');

  const acquaMl = cache.dietaLogOggi.acquaMl || 0;
  const acquaTargetMl = t.acquaMl;
  const acquaPct = Math.min(100, Math.round((acquaMl/acquaTargetMl)*100));
  const acquaL = (acquaMl/1000).toFixed(2).replace('.', ',');

  const pianoTabHtml = `
    ${mealsHtml}
    <div class="diet-info-card">
      <div class="dic-t">📝 Note pratiche</div>
      <div class="dic-b">Ogni opzione di un pasto è intercambiabile con le altre dello stesso pasto (macro equivalenti, tolleranza ±10%): componi la settimana come preferisci, anche ripetendo o mescolando le opzioni. Grassi da condimento (olio EVO) sempre a crudo o a fine cottura. Verdura non pesata in modo ossessivo: 150-200g corrispondono a circa 1 piatto abbondante o 2 pugni chiusi. Birra (~130 kcal/die media) e pasto libero nel weekend restano gestiti come da nota generale del piano — non compresi nelle tabelle sopra.</div>
    </div>`;

  const extraTabHtml = `
    <div class="diet-info-card">
      <div class="dic-t">🔍 Alimenti extra di oggi</div>
      <div class="dic-b" style="margin-bottom:${alimentiExtra.length?'10px':'14px'};">Qualcosa fuori dal piano? Cercalo e aggiungilo con la grammatura giusta: si somma ai macro qui sopra.</div>
      ${alimentiExtra.length ? `<div class="extra-food-list">${alimentiExtra.map(a=>`
        <div class="extra-food-item">
          <div class="efi-info">
            <div class="efi-n">${a.nome}${a.marca?` <span class="efi-brand">· ${a.marca}</span>`:''}</div>
            <div class="efi-m">${a.grammi}g · ${a.kcal} kcal · P ${a.prot}g · C ${a.carb}g · G ${a.grassi}g</div>
          </div>
          <button class="efi-remove" onclick="rimuoviAlimentoExtra('${a.id}')" aria-label="Rimuovi">✕</button>
        </div>`).join('')}</div>` : ''}
      <button class="btn small secondary" style="width:100%;margin-top:2px;" onclick="setRoute({name:'cerca-alimento'})">+ Cerca e aggiungi alimento</button>
    </div>

    <div class="diet-info-card">
      <div class="dic-t">💧 Idratazione di oggi</div>
      <div class="dic-b" style="margin-bottom:10px;">Obiettivo ${(acquaTargetMl/1000).toFixed(2).replace('.', ',')} L/die (modificabile in Profilo).</div>
      <div class="water-row">
        <div class="water-bar"><div class="water-fill" style="width:${acquaPct}%;"></div></div>
        <span class="water-val">${acquaL} L</span>
      </div>
      <div class="water-btns">
        <button class="btn small secondary" onclick="aggiungiAcqua(-250)">−250 ml</button>
        <button class="btn small secondary" onclick="aggiungiAcqua(250)">+250 ml</button>
      </div>
    </div>`;

  const integratoriTabHtml = `
    <div class="diet-summary" style="margin-bottom:12px;">
      <div class="tlt">Integrazione</div>
      <div class="supp-intro" style="margin-bottom:0;">${INTEGRAZIONE_PIANO.intro}</div>
    </div>

    ${suppHtml}

    <div class="diet-info-card warn">
      <div class="dic-t">⚠️ Integrazione e farmaci</div>
      <div class="dic-b">${INTEGRAZIONE_PIANO.noteImportanti}</div>
    </div>
    <div class="diet-info-card warn">
      <div class="dic-t">⚠️ Note importanti</div>
      <div class="dic-b">Questo piano non sostituisce una valutazione medica. Farmaci in corso (Lyrica, Zarelis) e ADHD sono stati considerati nel quadro generale ma non modificano direttamente il calcolo calorico. AST lievemente elevato nell'ultimo esame (06/09/2025), verosimilmente legato all'allenamento pre-prelievo: da ricontrollare. In caso di sintomi digestivi persistenti o variazioni cliniche, consulta il medico curante.</div>
    </div>
    <div class="diet-info-card">
      <div class="dic-t">📅 Prossima rivalutazione</div>
      <div class="dic-b">Tra 2-3 settimane (peso, circonferenza vita, foto), oppure al ricevimento del Blocco 2 della scheda di allenamento o di nuove analisi del sangue.</div>
    </div>`;

  const tabContentHtml = dietaTab==='extra' ? extraTabHtml : dietaTab==='integratori' ? integratoriTabHtml : pianoTabHtml;

  view.innerHTML = `
    <div class="diet-summary">
      <div class="tlt">Piano nutrizionale</div>
      <div class="tsb">${DIETA_PIANO.fase}<br>3 pasti principali + 2 spuntini · più opzioni intercambiabili per ogni pasto</div>
      <div class="kcal-ring-wrap">
        <svg viewBox="0 0 120 120" class="kcal-ring">
          <circle cx="60" cy="60" r="${RING_R}" class="kr-bg"></circle>
          <circle cx="60" cy="60" r="${RING_R}" class="kr-fill" style="stroke:${kcalColor};stroke-dasharray:${RING_C};stroke-dashoffset:${ringOffset};"></circle>
        </svg>
        <div class="kr-center">
          <span class="kr-n" style="color:${kcalColor};">${acquisito.kcal}</span>
          <span class="kr-u">/ ${t.kcal} kcal oggi</span>
        </div>
      </div>
      <div class="macro-bars">${macroBarsHtml}</div>
    </div>

    <div class="tab-bar">
      <div class="tab-btn${dietaTab==='piano'?' active':''}" onclick="setDietaTab('piano')">🍽️ Piano</div>
      <div class="tab-btn${dietaTab==='extra'?' active':''}" onclick="setDietaTab('extra')">🔍 Extra</div>
      <div class="tab-btn${dietaTab==='integratori'?' active':''}" onclick="setDietaTab('integratori')">💊 Integratori</div>
    </div>

    <p class="profile-link" style="text-align:center;">
      <span onclick="setRoute({name:'diario'})">📖 Diario dei giorni passati</span>
      &nbsp;·&nbsp;
      <span onclick="setRoute({name:'lista-spesa'})">🛒 Lista della spesa</span>
    </p>

    ${tabContentHtml}
  `;
}

function toggleDietaPasto(i){
  if(dietaOpenSet.has(i)) dietaOpenSet.delete(i); else dietaOpenSet.add(i);
  renderAlimentazione();
}

function selectDietaOpzione(i, oi){
  dietaOpzioneSel[i] = oi;
  if(!dietaOpenSet.has(i)) dietaOpenSet.add(i);
  renderAlimentazione();
}

/* ============ DIARIO ALIMENTARE STORICO ============
   Ripercorre i giorni passati usando cache.dietaLog. Per i pasti segnati da
   quando esiste "pastiSnapshot" mostriamo anche titolo e kcal/macro reali;
   per quelli segnati prima (o se manca lo snapshot per qualsiasi motivo)
   contano comunque come "fatti" ma senza dettaglio nutrizionale nel totale. */
let diarioOpenSet = new Set();

function toggleDiarioGiorno(id){
  if(diarioOpenSet.has(id)) diarioOpenSet.delete(id); else diarioOpenSet.add(id);
  renderDiario();
}

function renderDiario(){
  pageTitle.textContent = 'Diario';
  const pianoPersonale = profiloUtente && profiloUtente.schedeAssegnate === null;
  if(!pianoPersonale){
    view.innerHTML = `<p class="empty">Questa sezione si popolerà quando avrai un piano alimentare personale.</p>`;
    return;
  }
  const giorni = cache.dietaLog.slice().sort((a,b)=> b.id.localeCompare(a.id));
  if(!giorni.length){
    view.innerHTML = `<p class="empty"><span class="empty-icon">📖</span>Nessun giorno tracciato ancora.<br>Segna un pasto, un integratore o dell'acqua in Dieta per iniziare il diario.</p>`;
    return;
  }
  const oggiK = todayKey();

  const html = giorni.map(g=>{
    const open = diarioOpenSet.has(g.id);
    const pastiFatti = g.pastiFatti || {};
    const pastiSnapshot = g.pastiSnapshot || {};
    const integratoriFatti = g.integratoriFatti || {};
    const alimentiExtra = g.alimentiExtra || [];

    let kcalTot = 0, protTot = 0, carbTot = 0, grassiTot = 0, dettagliNonDisponibili = false;
    Object.keys(pastiFatti).forEach(i=>{
      if(!pastiFatti[i]) return;
      const snap = pastiSnapshot[i];
      if(snap){ kcalTot+=snap.kcal; protTot+=snap.prot; carbTot+=snap.carb; grassiTot+=snap.grassi; }
      else dettagliNonDisponibili = true;
    });
    alimentiExtra.forEach(a=>{ kcalTot+=a.kcal; protTot+=a.prot; carbTot+=a.carb; grassiTot+=a.grassi; });

    const numPastiFatti = Object.values(pastiFatti).filter(Boolean).length;
    const numIntegrFatti = Object.values(integratoriFatti).filter(Boolean).length;
    const dataLabel = g.id===oggiK ? 'Oggi' : new Date(g.id).toLocaleDateString('it-IT',{weekday:'long', day:'numeric', month:'long'});

    const pastiRighe = DIETA_PIANO.pasti.map((p,i)=>{
      if(!pastiFatti[i]) return '';
      const snap = pastiSnapshot[i];
      return `<div class="micro-row"><span>${p.icona} ${p.nome}${snap?` — ${snap.titolo}`:''}</span><b>${snap?snap.kcal+' kcal':'segnato'}</b></div>`;
    }).join('');

    const integrRighe = INTEGRAZIONE_PIANO.integratori
      .filter(s=> integratoriFatti[s.nome])
      .map(s=>`<div class="micro-row"><span>${s.icona} ${s.nome}</span><b>✅</b></div>`).join('');

    const extraRighe = alimentiExtra.map(a=>`<div class="micro-row"><span>${a.nome}${a.marca?` · ${a.marca}`:''} (${a.grammi}g)</span><b>${a.kcal} kcal</b></div>`).join('');

    return `<div class="meal-card${open?' open':''}">
      <div class="meal-head" onclick="toggleDiarioGiorno('${g.id}')">
        <div class="icon">📅</div>
        <div class="mh-info">
          <div class="mh-name">${dataLabel}</div>
          <div class="mh-time">${numPastiFatti}/${DIETA_PIANO.pasti.length} pasti · ${numIntegrFatti} integratori · ${((g.acquaMl||0)/1000).toFixed(1).replace('.',',')} L</div>
        </div>
        <div class="mh-kcal">${kcalTot} kcal</div>
        <div class="mh-chev">▾</div>
      </div>
      <div class="meal-body"><div class="meal-body-in">
        ${pastiRighe || '<p style="margin:0 0 8px;color:var(--text-dim);font-size:12.5px;">Nessun pasto segnato.</p>'}
        ${integrRighe}
        ${extraRighe}
        ${dettagliNonDisponibili ? '<p class="field-hint" style="margin-top:10px;">Alcuni pasti di questo giorno sono stati segnati prima che il diario registrasse i dettagli: contano come "fatti" ma senza kcal/macro nel totale qui sopra.</p>' : ''}
      </div></div>
    </div>`;
  }).join('');

  view.innerHTML = html;
}

/* ============ LISTA DELLA SPESA ============
   Somma le quantità degli ingredienti delle opzioni attualmente selezionate
   per ciascun pasto (le stesse che vedi nella scheda "Piano"), moltiplicate
   per un numero di giorni scelto — utile se ripeti la stessa combinazione di
   opzioni più giorni di fila, com'è già il modo in cui il piano è pensato
   ("componi la settimana ripetendo o mescolando le opzioni"). */
let listaSpesaGiorni = 7;
let listaSpesaSpuntati = new Set();

function calcolaListaSpesa(giorni){
  const totali = {};
  DIETA_PIANO.pasti.forEach((p,i)=>{
    const opz = p.opzioni[dietaOpzioneSel[i] || 0];
    opz.alimenti.forEach(a=>{
      const match = String(a.q).match(/^(\d+(?:[.,]\d+)?)/);
      const grammi = match ? parseFloat(match[1].replace(',','.')) : 0;
      totali[a.n] = (totali[a.n]||0) + grammi;
    });
  });
  return Object.keys(totali)
    .map(nome=>({ nome, grammiTot: Math.round(totali[nome]*giorni) }))
    .sort((a,b)=> a.nome.localeCompare(b.nome));
}

function formattaQuantitaSpesa(g){
  if(g>=1000) return (g/1000).toFixed(g%1000===0?0:1).replace('.',',')+' kg';
  return g+' g';
}

function renderListaSpesa(){
  pageTitle.textContent = 'Lista della spesa';
  const pianoPersonale = profiloUtente && profiloUtente.schedeAssegnate === null;
  if(!pianoPersonale){
    view.innerHTML = `<p class="empty">Questa sezione si popolerà quando avrai un piano alimentare personale.</p>`;
    return;
  }
  const lista = calcolaListaSpesa(listaSpesaGiorni);
  const righe = lista.map(item=>{
    const spuntato = listaSpesaSpuntati.has(item.nome);
    return `<div class="extra-food-item" onclick="toggleSpesaSpuntato('${item.nome.replace(/'/g,"\\'")}')" style="cursor:pointer;">
      <div class="efi-info">
        <div class="efi-n" style="${spuntato?'text-decoration:line-through;color:var(--text-dim);':''}">${item.nome}</div>
      </div>
      <b style="${spuntato?'color:var(--text-dim);text-decoration:line-through;':'color:var(--text);'}">${formattaQuantitaSpesa(item.grammiTot)}</b>
    </div>`;
  }).join('');

  view.innerHTML = `
    <div class="card">
      <div class="dic-t" style="font-size:13.5px;font-weight:800;margin-bottom:10px;">🛒 Quanti giorni vuoi coprire?</div>
      <div class="water-btns" style="margin-top:0;">
        <button class="btn small secondary" onclick="cambiaGiorniSpesa(-1)">−1 giorno</button>
        <span style="align-self:center;font-weight:800;font-size:15px;min-width:70px;text-align:center;">${listaSpesaGiorni} giorni</span>
        <button class="btn small secondary" onclick="cambiaGiorniSpesa(1)">+1 giorno</button>
      </div>
      <p class="field-hint" style="margin:12px 0 0;">Calcolata sulle opzioni al momento selezionate per ogni pasto in "Piano" — se cambi opzione lì, torna qui per ricalcolare.</p>
    </div>
    <div class="card">
      ${righe || '<p class="empty" style="padding:10px 0;">Nessun ingrediente da mostrare.</p>'}
    </div>
    <button class="btn secondary" style="width:100%;" onclick="condividiListaSpesa()">📋 Copia lista</button>
  `;
}

function cambiaGiorniSpesa(delta){
  listaSpesaGiorni = Math.max(1, Math.min(30, listaSpesaGiorni+delta));
  renderListaSpesa();
}

function toggleSpesaSpuntato(nome){
  if(listaSpesaSpuntati.has(nome)) listaSpesaSpuntati.delete(nome); else listaSpesaSpuntati.add(nome);
  renderListaSpesa();
}

function condividiListaSpesa(){
  const lista = calcolaListaSpesa(listaSpesaGiorni);
  const testo = 'Lista della spesa (' + listaSpesaGiorni + ' giorni):\n' +
    lista.map(item=> '- ' + item.nome + ': ' + formattaQuantitaSpesa(item.grammiTot)).join('\n');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(testo)
      .then(()=> alert('Lista copiata negli appunti ✅'))
      .catch(()=> alert(testo));
  } else {
    alert(testo);
  }
}

/* ============ CERCA ALIMENTO (database Open Food Facts) ============
   Ricerca testuale per aggiungere alla giornata un alimento che non fa parte
   del piano fisso, con grammatura scelta liberamente. Nessuna chiave API:
   Open Food Facts è un database aperto e gratuito, pensato per essere
   interrogato direttamente dal browser. */
let ricercaAlimentoState = { query:'', loading:false, risultati:[], errore:null, selezionato:null, grammi:100 };

function renderCercaAlimento(){
  pageTitle.textContent = 'Cerca alimento';
  const s = ricercaAlimentoState;

  if(s.selezionato){
    const p = s.selezionato;
    const g = s.grammi || 0;
    const fattore = g/100;
    const kcal = Math.round(p.kcal100*fattore);
    const prot = Math.round(p.prot100*fattore*10)/10;
    const carb = Math.round(p.carb100*fattore*10)/10;
    const grassi = Math.round(p.grassi100*fattore*10)/10;
    view.innerHTML = `
      <div class="card">
        <h3 style="margin-top:0;">${p.nome}</h3>
        ${p.marca?`<p style="color:var(--text-dim);font-size:12.5px;margin:0 0 14px;">${p.marca}</p>`:''}
        <div class="field">
          <label>Quantità (grammi)</label>
          <input type="number" min="1" id="foodGrammiInput" value="${g}" oninput="aggiornaAnteprimaGrammi()">
        </div>
        <div class="meal-macro-mini" style="margin-bottom:16px;">
          <span><span class="mb-dot" style="background:var(--accent);"></span>Prot. <b id="fpProt">${prot}g</b></span>
          <span><span class="mb-dot" style="background:var(--accent-2);"></span>Carb. <b id="fpCarb">${carb}g</b></span>
          <span><span class="mb-dot" style="background:var(--accent-3);"></span>Grassi <b id="fpGrassi">${grassi}g</b></span>
        </div>
        <p style="font-size:13px;color:var(--text-dim);font-weight:700;margin:0 0 16px;" id="fpKcalLine">${kcal} kcal totali per ${g}g</p>
        <button class="toggle-guide" onclick="toggleMicroSearch()">💧🧪 Vitamine, minerali e acqua ▾</button>
        <div class="guide-body" id="micro-search-box">${microGridHtmlDaOFF(p.micro100||{}, p.acqua100, fattore)}</div>
        <button class="btn" style="margin-top:16px;" onclick="confermaAggiungiAlimento()">Aggiungi a oggi</button>
        <button class="btn small secondary" style="width:100%;margin-top:10px;" onclick="ricercaAlimentoState.selezionato=null;renderCercaAlimento()">← Torna alla ricerca</button>
      </div>`;
    return;
  }

  let risultatiHtml = '';
  if(s.loading){
    risultatiHtml = spinnerHtml('Cerco...');
  } else if(s.errore){
    risultatiHtml = `<p class="empty">${s.errore}</p>`;
  } else if(s.risultati.length){
    risultatiHtml = s.risultati.map((p,i)=>`
      <div class="food-search-item" onclick="selezionaAlimentoRicerca(${i})">
        <div class="fsi-info">
          <div class="fsi-n">${p.nome}</div>
          ${p.marca?`<div class="fsi-brand">${p.marca}</div>`:''}
        </div>
        <div class="fsi-kcal">${p.kcal100} kcal<br><span style="color:var(--text-dim);font-weight:600;">/100g</span></div>
      </div>`).join('');
  } else if(s.query){
    risultatiHtml = `<p class="empty">Nessun risultato per "${s.query}". Prova con un nome più semplice o generico.</p>`;
  }

  const recenti = (profiloUtente && profiloUtente.alimentiRecenti) || [];
  const recentiHtml = (!s.query && recenti.length) ? `
    <p class="section-label" style="margin-top:0;">Aggiunti di recente</p>
    ${recenti.map((p,i)=>`
      <div class="food-search-item" onclick="selezionaAlimentoRecente(${i})">
        <div class="fsi-info">
          <div class="fsi-n">${p.nome}</div>
          ${p.marca?`<div class="fsi-brand">${p.marca}</div>`:''}
        </div>
        <div class="fsi-kcal">${p.kcal100} kcal<br><span style="color:var(--text-dim);font-weight:600;">/100g</span></div>
      </div>`).join('')}
  ` : '';

    <div class="field">
      <label>Cerca un alimento</label>
      <input type="text" id="foodSearchInput" placeholder="Es. yogurt greco, pasta, mela..." value="${s.query}" onkeydown="if(event.key==='Enter')eseguiRicercaAlimento()">

async function eseguiRicercaAlimento(){
  const input = document.getElementById('foodSearchInput');
  const query = input ? input.value.trim() : '';
  if(!query) return;
  ricercaAlimentoState.query = query;
  ricercaAlimentoState.loading = true;
  ricercaAlimentoState.errore = null;
  ricercaAlimentoState.risultati = [];
  renderCercaAlimento();
  try{
    const url = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=20&fields=product_name,brands,nutriments`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('network');
    const data = await res.json();
    ricercaAlimentoState.risultati = (data.products||[])
      .filter(p=>p.product_name && p.nutriments && p.nutriments['energy-kcal_100g']!=null)
      .map(p=>{
        const { micro100, acqua100 } = estraiMicroOFF(p.nutriments);
        return {
          nome: p.product_name,
          marca: p.brands ? p.brands.split(',')[0].trim() : '',
          kcal100: Math.round(p.nutriments['energy-kcal_100g']||0),
          prot100: Math.round((p.nutriments['proteins_100g']||0)*10)/10,
          carb100: Math.round((p.nutriments['carbohydrates_100g']||0)*10)/10,
          grassi100: Math.round((p.nutriments['fat_100g']||0)*10)/10,
          micro100, acqua100
        };
      })
      .slice(0,20);
  }catch(e){
    ricercaAlimentoState.errore = 'Ricerca non riuscita: controlla la connessione e riprova.';
  }
  ricercaAlimentoState.loading = false;
  renderCercaAlimento();
}

function selezionaAlimentoRicerca(i){
  ricercaAlimentoState.selezionato = ricercaAlimentoState.risultati[i];
  ricercaAlimentoState.grammi = 100;
  renderCercaAlimento();
}

function aggiornaAnteprimaGrammi(){
  const input = document.getElementById('foodGrammiInput');
  const g = Math.max(0, Number(input.value)||0);
  ricercaAlimentoState.grammi = g;
  const p = ricercaAlimentoState.selezionato;
  const fattore = g/100;
  const kcal = Math.round(p.kcal100*fattore);
  const prot = Math.round(p.prot100*fattore*10)/10;
  const carb = Math.round(p.carb100*fattore*10)/10;
  const grassi = Math.round(p.grassi100*fattore*10)/10;
  document.getElementById('fpProt').textContent = prot+'g';

function toggleMicroSearch(){
  const el = document.getElementById('micro-search-box');

function confermaAggiungiAlimento(){
  const p = ricercaAlimentoState.selezionato;

  aggiungiAlimentoExtra({
    id: 'extra-'+Date.now(),

  });

/* Scorciatoia per i cibi che si ripetono spesso: tiene gli ultimi 8 alimenti
   aggiunti (per valore/100g, non per grammatura specifica) sul profilo, così
   la prossima volta non serve ricercarli da capo. */
function registraAlimentoRecente(p){
  if(!profiloUtente) return;
  const chiave = a => (a.nome+'|'+(a.marca||'')).toLowerCase();
  const voce = { nome:p.nome, marca:p.marca||'', kcal100:p.kcal100, prot100:p.prot100, carb100:p.carb100, grassi100:p.grassi100, micro100:p.micro100||{}, acqua100:(p.acqua100!=null?p.acqua100:null) };
  let lista = (profiloUtente.alimentiRecenti || []).filter(a=> chiave(a)!==chiave(voce));
  lista.unshift(voce);
  lista = lista.slice(0,8);
  profiloUtente.alimentiRecenti = lista;
  db.collection('users').doc(currentUid).set({ alimentiRecenti: lista }, { merge:true }).catch(()=>{});
}

function selezionaAlimentoRecente(i){
  const p = (profiloUtente && profiloUtente.alimentiRecenti || [])[i];
  if(!p) return;
  ricercaAlimentoState.selezionato = p;
  ricercaAlimentoState.grammi = 100;
  renderCercaAlimento();
}

/* ============ SCANNER CODICE A BARRE ============
   Libreria "html5-qrcode" caricata solo quando serve (non appesantisce il
   caricamento iniziale dell'app), usa la fotocamera per leggere il codice
   e poi cerca il prodotto per barcode su Open Food Facts. Funziona sia su
   Android che su iOS/Safari (a differenza della BarcodeDetector nativa, non
   supportata da Safari). */
let barcodeScanner = null;
let barcodeLibCaricata = false;

function caricaLibreriaBarcode(){
  return new Promise((resolve, reject)=>{
    if(barcodeLibCaricata && window.Html5Qrcode){ resolve(); return; }
    const script = document.createElement('script');
    script.src = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
    script.onload = ()=>{ barcodeLibCaricata = true; resolve(); };
    script.onerror = ()=> reject(new Error('lib non caricata'));
    document.head.appendChild(script);
  });
}

function renderScansionaBarcode(){
  pageTitle.textContent = 'Scansiona codice a barre';
  view.innerHTML = `
    <div class="card" style="text-align:center;">
      <p class="field-hint" style="margin:0 0 14px;">Inquadra il codice a barre del prodotto, tienilo fermo e ben illuminato.</p>
      <div id="barcodeReader" class="barcode-reader"></div>
      <p id="barcodeStatus" class="field-hint" style="margin-top:14px;min-height:18px;"></p>
      <button class="btn secondary" style="width:100%;margin-top:6px;" onclick="setRoute({name:'cerca-alimento'})">Annulla</button>
    </div>`;
  avviaScannerBarcode();
}

async function avviaScannerBarcode(){
  const stato = document.getElementById('barcodeStatus');
  try{
    if(stato) stato.innerHTML = '<span class="spinner-inline"></span>Avvio fotocamera...';
    await caricaLibreriaBarcode();
    if(route.name!=='scansiona-barcode') return; // l'utente ha già cambiato pagina
    barcodeScanner = new Html5Qrcode('barcodeReader', {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.CODE_128
      ],
      verbose:false
    });
    await barcodeScanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 260, height: 150 } },
      onBarcodeRilevato,
      ()=>{} // "errore" per singolo frame non decodificato: normale mentre cerca il codice, si ignora
    );
    const stato2 = document.getElementById('barcodeStatus');
    if(stato2) stato2.textContent = '';
  }catch(e){
    const stato3 = document.getElementById('barcodeStatus');
    if(stato3) stato3.textContent = 'Non riesco ad accedere alla fotocamera: controlla di aver dato il permesso al browser, oppure usa la ricerca per nome.';
  }
}

function fermaScannerBarcode(){
  if(barcodeScanner){
    const s = barcodeScanner;
    barcodeScanner = null;
    s.stop().then(()=> s.clear()).catch(()=>{});
  }
}

async function onBarcodeRilevato(codice){
  if(!barcodeScanner) return; // già gestito o pagina cambiata, evita doppio trigger
  fermaScannerBarcode();
  const stato = document.getElementById('barcodeStatus');
  if(stato) stato.innerHTML = `<span class="spinner-inline"></span>Codice ${codice} trovato: cerco il prodotto...`;
  try{
    const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${codice}.json`);
    const data = await res.json();
    const nutr = data.product && data.product.nutriments;
    if(data.status !== 1 || !nutr || nutr['energy-kcal_100g']==null){
      if(stato) stato.textContent = `Nessun dato nutrizionale trovato per il codice ${codice}. Prova con la ricerca per nome.`;
      return;
    }
    const p = data.product;
    const { micro100, acqua100 } = estraiMicroOFF(nutr);
    ricercaAlimentoState.selezionato = {
      nome: p.product_name || 'Prodotto senza nome',
      marca: p.brands ? p.brands.split(',')[0].trim() : '',
      kcal100: Math.round(nutr['energy-kcal_100g']||0),
      prot100: Math.round((nutr['proteins_100g']||0)*10)/10,
      carb100: Math.round((nutr['carbohydrates_100g']||0)*10)/10,
      grassi100: Math.round((nutr['fat_100g']||0)*10)/10,
      micro100, acqua100
    };
    ricercaAlimentoState.grammi = 100;
    setRoute({name:'cerca-alimento'});
  }catch(e){
    if(stato) stato.textContent = 'Errore nella ricerca del prodotto. Riprova o usa la ricerca per nome.';
  }
}

// Ridimensiona/comprime l'immagine lato client cosi' il base64 resta ben sotto il limite di 1MB per documento Firestore
function resizeImage(file, maxSize){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if(width > height && width > maxSize){ height = height * (maxSize/width); width = maxSize; }
        else if(height > maxSize){ width = width * (maxSize/height); height = maxSize; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

  const fianchi = document.getElementById('mFianchi').value;
  const braccioDx = document.getElementById('mBraccioDx').value;
  const braccioSx = document.getElementById('mBraccioSx').value;
  const cosciaDx = document.getElementById('mCosciaDx').value;
  const cosciaSx = document.getElementById('mCosciaSx').value;
  const sonno = document.getElementById('mSonno').value;
  const fotoInput = document.getElementById('mFoto');
  const btn = document.getElementById('saveMisuraBtn');
  const errBox = document.getElementById('misuraError');
  errBox.innerHTML = '';

  const RANGE_PLAUSIBILI = {
    'Peso':[peso,20,400], 'Vita':[vita,40,200], 'Petto':[petto,40,200], 'Fianchi':[fianchi,40,200],
    'Braccio Dx':[braccioDx,10,80], 'Braccio Sx':[braccioSx,10,80],
    'Coscia Dx':[cosciaDx,20,100], 'Coscia Sx':[cosciaSx,20,100],
    'Ore di sonno':[sonno,0,16]
  };
  for(const label in RANGE_PLAUSIBILI){
    const [valore, min, max] = RANGE_PLAUSIBILI[label];
    if(valore!==''){
      const n = Number(valore);
      if(isNaN(n) || n < min || n > max){
        errBox.innerHTML = `<div class="error-banner">Il valore inserito per "${label}" non sembra plausibile (${min}–${max}). Controllalo prima di salvare.</div>`;
        return;
      }
    }
  }

  btn.disabled = true; btn.textContent = 'Salvataggio...';
  try{
    let fotoDataUrl = null;
    if(fotoInput.files && fotoInput.files[0]){
      fotoDataUrl = await resizeImage(fotoInput.files[0], 700);
    }
    const payload = {
      data,
      peso: peso ? Number(peso) : null,
      vita: vita ? Number(vita) : null,
      petto: petto ? Number(petto) : null,
      fianchi: fianchi ? Number(fianchi) : null,
      braccioDx: braccioDx ? Number(braccioDx) : null,
      braccioSx: braccioSx ? Number(braccioSx) : null,
      cosciaDx: cosciaDx ? Number(cosciaDx) : null,
      cosciaSx: cosciaSx ? Number(cosciaSx) : null,
      sonno: sonno ? Number(sonno) : null,
      foto: fotoDataUrl
    };
    const ref = await userCollection('misure').add(payload);
    cache.misure.push({ id: ref.id, ...payload });
    cache.misure.sort((a,b)=> new Date(a.data)-new Date(b.data));
    setRoute({name:'storico-misure', justSaved:true});
  }catch(e){
    errBox.innerHTML = `<div class="error-banner">${e.message}</div>`;
    btn.disabled = false; btn.textContent = 'Salva rilevazione';
  }
}

async function eliminaMisura(id){
  if(!(await mostraConferma('Eliminare questa rilevazione?'))) return;
  try{
    await userCollection('misure').doc(id).delete();
    cache.misure = cache.misure.filter(m=>m.id!==id);
    setRoute({name:'storico-misure'});
  }catch(e){ alert('Errore: '+e.message); }
}

/* ============ AVVIO ============ */
async function boot(){
  await caricaCatalogoSchede();
  const profiloCompleto = await checkProfilo();
  if(!profiloCompleto){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'none';
    document.getElementById('onboardingScreen').style.display = 'block';
    return;
  }
  await avviaApp();
}

async function avviaApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('onboardingScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  richiediPermessoNotifiche();
  view.innerHTML = '<div class="spinner-wrap">Caricamento dati...</div>';
  try{
    await loadData();
    goHome();
  }catch(e){
    view.innerHTML = `<div class="error-banner">Errore nel caricamento dei dati: ${e.message}</div>`;
  }
}

/* ============ LOGIN TEMPORANEAMENTE DISATTIVATO ============
   Per riattivare il login: rimetti LOGIN_ENABLED a true.
   Il codice di autenticazione sopra resta invariato, viene solo bypassato qui sotto. */
const LOGIN_ENABLED = true;
const DEV_UID = 'dev-local-user';

if(LOGIN_ENABLED){
  auth.onAuthStateChanged(user=>{
    if(registrazioneInCorso) return; // durante la registrazione ci pensa già registrati() a gestire il flusso
    if(user){
      currentUid = user.uid;
      boot();
    } else {
      currentUid = null;
      profiloUtente = null;
      document.getElementById('loginScreen').style.display = 'block';
      document.getElementById('registerScreen').style.display = 'none';
      document.getElementById('onboardingScreen').style.display = 'none';
      document.getElementById('app').style.display = 'none';
      const btn = document.getElementById('loginBtn');
      btn.disabled = false; btn.textContent = 'Accedi';
    }
  });

  document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  document.getElementById('regPass').addEventListener('keydown', e=>{ if(e.key==='Enter') registrati(); });
} else {
  document.getElementById('loginScreen').style.display = 'none';
  const logoutBtn = document.querySelector('.logout-btn');
  if(logoutBtn) logoutBtn.style.display = 'none';
  currentUid = DEV_UID;
  boot();
}

/* ============ PWA: registrazione service worker ============
   Permette di installare l'app sul telefono e di riaprirla anche con poco
   o nessun segnale in palestra (l'app shell viene servita dalla cache). */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
