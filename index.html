  .photo-slot-tag{
    position:absolute;left:6px;bottom:6px;background:#00000099;color:var(--text);
    font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;
  }
  .photo-slot-remove{
    position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:none;
    background:#00000099;color:var(--text);font-size:13px;font-weight:800;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .photo-grid-item{position:relative;aspect-ratio:3/4;border-radius:var(--radius-sm);overflow:hidden;cursor:pointer;background:var(--panel-2);border:1px solid var(--border);transition:transform .12s ease;}
  .photo-grid-item:active{transform:scale(.97);}
  .photo-grid-item img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-grid-tag{
    position:absolute;left:6px;bottom:6px;background:#00000099;color:var(--text);
    font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;
  }
  .photo-zoom-badge{
    position:absolute;right:6px;bottom:6px;width:26px;height:26px;border-radius:50%;
    background:#00000099;display:flex;align-items:center;justify-content:center;font-size:13px;
    backdrop-filter:blur(2px);
  }
  .lightbox-overlay{padding:16px;}
  .lightbox-img{max-width:100%;max-height:100%;border-radius:14px;object-fit:contain;touch-action:pan-x;}

  /* ===== Confronta foto: header con selettori data + swap ===== */
  .compare-head{padding:16px 16px 14px;}
  .compare-dates{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end;}
  .compare-field{margin-bottom:0;}
  .compare-field label{text-align:center;}
  .compare-field select{
    width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    border-radius:14px;padding:12px 8px;font-size:12.5px;font-weight:700;text-align:center;
  }
  .compare-field select:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  .compare-swap-btn{
    width:38px;height:38px;border-radius:50%;background:var(--panel-2);border:1px solid var(--border);
    color:var(--accent);font-size:16px;font-weight:800;cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;margin-bottom:1px;transition:transform .12s ease;
  }
  .compare-swap-btn:active{background:var(--accent);color:#04140d;border-color:transparent;transform:scale(.9) rotate(180deg);}
  .compare-distanza{margin:12px 2px 0;text-align:center;font-size:12px;color:var(--text-dim);font-weight:700;}
  .compare-zoom-hint{margin:10px 2px 0;text-align:center;}

  /* ===== Confronta foto: righe differenze modernizzate ===== */
  .diff-row{
    display:grid;grid-template-columns:24px 1fr auto;grid-template-rows:auto auto;
    column-gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);
  }
  .diff-row:last-child{border-bottom:none;}
  .diff-icon{font-size:16px;text-align:center;grid-row:1/3;}
  .diff-label{font-size:13px;font-weight:700;grid-column:2;grid-row:1;}
  .diff-vals{font-size:11.5px;color:var(--text-dim);font-weight:600;grid-column:2;grid-row:2;}
  .diff-delta{
    font-size:12px;font-weight:800;grid-column:3;grid-row:1/3;white-space:nowrap;
    padding:5px 10px;border-radius:20px;background:var(--panel-2);color:var(--text-dim);
  }
  .diff-delta.up{color:var(--accent-2);}
  .diff-delta.down{color:var(--accent-3);}

  /* ===== Confronto foto a schermo intero con slider prima/dopo ===== */
  .compare-lightbox{
    position:fixed;inset:0;background:#000;z-index:999;
    display:flex;flex-direction:column;animation:confirmFadeIn .18s ease;
  }
  .cl-imgs{position:relative;flex:1;overflow:hidden;touch-action:none;background:#000;}
  .cl-img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;user-select:none;pointer-events:none;-webkit-user-drag:none;}
  .cl-b-wrap{position:absolute;top:0;left:0;height:100%;overflow:hidden;}
  .cl-divider{
    position:absolute;top:0;bottom:0;width:0;transform:translateX(-50%);
    border-left:2px solid #fff;pointer-events:none;
  }
  .cl-handle{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:40px;height:40px;border-radius:50%;background:#fff;color:#111;
    display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;
    box-shadow:0 2px 10px rgba(0,0,0,.5);
  }
  .cl-labels{position:absolute;top:14px;left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;pointer-events:none;}
  .cl-label{
    background:#000000b3;color:#fff;font-size:12px;font-weight:800;padding:5px 12px;border-radius:20px;
    transition:background-color .18s ease,color .18s ease,opacity .18s ease,transform .18s ease;
  }
  .cl-label.active{background:var(--accent);color:#04140d;box-shadow:0 2px 12px -2px #39ff9488;transform:scale(1.07);}
  .cl-label.dim{opacity:.4;transform:scale(.94);}
  .cl-close{
    position:absolute;top:14px;right:14px;z-index:2;width:38px;height:38px;border-radius:50%;
    background:#000000b3;color:#fff;border:none;font-size:16px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .cl-hint{
    text-align:center;color:#ffffffcc;font-size:12px;font-weight:600;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));margin:0;background:#000;
  }
  .carousel{position:relative;overflow:hidden;border-radius:var(--radius-sm);aspect-ratio:3/4;background:var(--panel-2);}
  .carousel-track{display:flex;height:100%;width:100%;touch-action:pan-y;}
  .carousel-slide{position:relative;flex:0 0 100%;height:100%;cursor:pointer;}
  .carousel-slide img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
  .carousel-dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:6px;}
  .carousel-dots .dot{width:6px;height:6px;border-radius:50%;background:#ffffff55;transition:all .2s ease;}
  .carousel-dots .dot.active{background:#fff;width:16px;border-radius:4px;}
  canvas.chart-canvas{max-width:100%;}
  .chip-select{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{
    padding:9px 15px;border-radius:20px;background:var(--panel-2);color:var(--text-dim);
    font-size:12.5px;font-weight:700;cursor:pointer;border:1px solid var(--border);
  }
  .chip.active{background:var(--accent);color:#04140d;border-color:transparent;box-shadow:0 0 16px -5px #39ff9488;}

  /* ===== Checklist "a riga piatta" riusata da Integratori (spunta subito
     dalla lista). Era nata per i pasti del Piano (ora rimosso dalla UI, la
     usava mealsHtml) — vedi renderAlimentazione() in JS. ===== */
  .meal-row{
    display:flex;align-items:center;gap:10px;
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow-card);margin-bottom:10px;padding:8px 14px 8px 8px;
  }
  .meal-check{
    flex-shrink:0;width:26px;height:26px;border-radius:50%;
    border:1.5px solid var(--border);background:var(--panel-2);color:#04140d;
    font-size:13px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .15s ease,border-color .15s ease,transform .15s ease;
  }
  .meal-check.checked{background:var(--accent);border-color:var(--accent);box-shadow:0 0 12px -4px #39ff9488;}
  .meal-check:active{transform:scale(.9);}
  .meal-row-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;cursor:pointer;}
  .meal-row-icon{
    width:38px;height:38px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:17px;
    background:var(--panel-2);border:1.5px solid var(--accent);box-shadow:0 0 12px -5px #39ff94aa;
  }
  .meal-row-info{flex:1;min-width:0;}
  .meal-row-name{font-size:14px;font-weight:800;display:flex;align-items:baseline;gap:6px;}
  .meal-row-time{font-size:11px;color:var(--text-dim);font-weight:600;}
  .meal-row-opt{font-size:12px;color:var(--text-dim);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .meal-row-extra{font-size:11px;}
  .meal-row-kcal{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;}
  .meal-row-kcal span{font-size:9.5px;color:var(--text-dim);font-weight:700;text-transform:uppercase;}
  .meal-row-chev{color:var(--text-dim);font-size:17px;flex-shrink:0;}
  .meal-row.done{opacity:.7;}
  .meal-row.done .meal-row-name{text-decoration:line-through;text-decoration-color:var(--text-dim);}

  /* ===== DIETA ===== */
  .diet-summary{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow-card);padding:20px;margin-bottom:16px;
    position:relative;overflow:hidden;
  }
  /* Barra sfumata in cima alla card principale della Dieta, sullo stesso
     linguaggio visivo dell'accento colorato sotto l'header: dà subito un
     tocco "premium" senza aggiungere altro testo o icone. */
  .diet-summary-glow::before{
    content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent-3));
  }
  .diet-summary .tlt{font-size:15px;font-weight:800;margin-bottom:2px;}
  .diet-summary .tsb{font-size:12px;color:var(--text-dim);font-weight:600;line-height:1.5;margin-bottom:16px;}
  /* Pillola "Oggi riposo/allenamento": prima un bottone secondario piatto,
     ora un badge con bordo sfumato e icona ben visibile — invita al tocco
     invece di sembrare testo informativo. */
  /* Due bottoni distinti invece di un pill "tocca per cambiare" che apriva
     un dialog: la scelta riposo/allenamento è diretta, un tap e basta, col
     bottone attivo evidenziato — uno switch, non una domanda. */
  .day-mode-toggle{display:flex;gap:8px;width:100%;margin-top:10px;margin-bottom:4px;}
  .dmt-btn{
    flex:1;padding:11px 10px;border-radius:14px;cursor:pointer;text-align:center;
    background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);
    font-size:13px;font-weight:800;transition:transform .12s ease, background .2s ease, border-color .2s ease, color .2s ease;
  }
  .dmt-btn:active{transform:scale(.96);}
  .dmt-btn.active{
    color:var(--text);
    background:linear-gradient(135deg,#39ff9422,#8b6bff18);
    border-color:#39ff9455;
    box-shadow:0 0 0 1px #39ff9433 inset;
  }
  .kcal-ring-wrap{position:relative;width:164px;height:164px;margin:14px auto 22px;}
  /* Alone sfumato dietro l'anello: verde/viola quando sei nell'obiettivo,
     rosso quando lo superi — visibile subito anche con lo sguardo di
     sfuggita, non solo leggendo i numeri. */
  .kcal-ring-glow{
    position:absolute;inset:6px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(57,255,148,.22),transparent 72%);
    filter:blur(1px);transition:background .4s ease;
  }
  .kcal-ring-glow.over{background:radial-gradient(circle,rgba(255,84,112,.28),transparent 72%);}
  .kcal-ring{width:100%;height:100%;transform:rotate(-90deg);position:relative;}
  .kr-bg{fill:none;stroke:#ffffff14;stroke-width:10;}
  .kr-fill{
    fill:none;stroke-width:11;stroke-linecap:round;
    transition:stroke-dashoffset .6s ease;
    filter:drop-shadow(0 0 6px rgba(57,255,148,.5));
  }
  .kr-center{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
  }
  .kr-n{font-family:var(--disp);font-size:38px;letter-spacing:.02em;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;transition:color .3s ease;}
  .kr-u{font-size:11px;color:var(--text-dim);font-weight:700;margin-top:6px;}
  .kr-diff{display:block;font-size:11px;font-weight:700;color:var(--text-dim);margin-top:3px;}
  .kr-diff.over{color:var(--danger);font-weight:800;}
  /* Le tre macro come mini-card affiancate (icona, valore, barretta,
     differenza) invece della vecchia lista di righe piatte: più aria,
     più a colpo d'occhio, in linea con l'estetica "dashboard" del resto
     dell'app (macro-chip, stat-tile). */
  .macro-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:2px;}
  .macro-tile{
    --tile-color:var(--accent);
    background:var(--panel-2);border:1px solid var(--border);border-radius:16px;
    padding:12px 8px 10px;text-align:center;position:relative;overflow:hidden;
    transition:border-color .3s ease;
  }
  .macro-tile::before{
    content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:var(--tile-color);opacity:.85;
  }
  .macro-tile.over{border-color:#ff547055;}
  .macro-tile .mt-icon{font-size:17px;display:block;margin-bottom:3px;}
  .macro-tile .mt-label{
    font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.25px;
    color:var(--text-dim);margin-bottom:7px;
  }
  .macro-tile .mt-val{font-family:var(--mono);font-size:15px;font-weight:800;color:var(--text);}
  .macro-tile.over .mt-val{color:var(--danger);}
  .macro-tile .mt-val .mt-goal{font-size:10.5px;color:var(--text-dim);font-weight:600;}
  .macro-tile .mt-track{height:6px;border-radius:20px;background:#ffffff10;overflow:hidden;margin:8px 0 6px;}
  .macro-tile .mt-fill{height:100%;border-radius:20px;background:var(--tile-color);transition:width .6s ease;}
  .macro-tile .mt-diff{font-size:9.5px;font-weight:700;color:var(--text-dim);}
  .macro-tile.over .mt-diff{color:var(--danger);font-weight:800;}
  .meal-card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow-card);margin-bottom:12px;overflow:hidden;
  }
  .meal-head{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;}
  .meal-head .icon{
    width:44px;height:44px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:20px;
    background:var(--panel-2);border:1.5px solid var(--accent);box-shadow:0 0 14px -5px #39ff94aa;
  }
  .meal-head .mh-info{flex:1;min-width:0;}
  .meal-head .mh-name{font-size:15px;font-weight:800;}
  .meal-head .mh-time{font-size:12px;color:var(--text-dim);font-weight:600;margin-top:1px;}
  .meal-head .mh-kcal{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--accent);white-space:nowrap;}
  .meal-head .mh-chev{color:var(--text-dim);font-size:13px;margin-left:2px;transition:transform .25s ease;flex-shrink:0;}
  .meal-head .diario-del-giorno{flex-shrink:0;}
  .meal-card.open .mh-chev{transform:rotate(180deg);}
  .meal-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
  .meal-card.open .meal-body{max-height:2000px;}
  .meal-body-in{padding:0 18px 18px;}
  .meal-macro-mini{display:flex;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
  .meal-macro-mini span{font-size:11.5px;font-weight:700;color:var(--text-dim);display:flex;align-items:center;gap:5px;}
  .meal-macro-mini span b{color:var(--text);font-weight:800;}
  .meal-macro-mini .mb-dot{width:8px;height:8px;border-radius:50%;}
  .mh-macro-preview{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap;}
  .mh-macro-preview span{font-size:10.5px;font-weight:700;color:var(--text-dim);display:flex;align-items:center;gap:4px;}
  .mh-macro-preview span b{color:var(--text);font-weight:800;}
  .mh-macro-preview .mb-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .diario-manuale-note{margin:0 0 10px;color:var(--text-dim);font-size:12.5px;}
  .food-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .food-table th{text-align:left;color:var(--text-dim);font-weight:700;font-size:11px;padding:0 6px 8px;text-transform:uppercase;letter-spacing:.3px;}
  .food-table td{padding:8px 6px;border-top:1px solid var(--border);color:var(--text);font-weight:600;}
  .food-table td.qty{color:var(--text-dim);font-weight:600;}
  .food-table th:not(:first-child),.food-table td:not(:first-child){text-align:right;}
  .meal-prep{font-size:12.5px;color:var(--text-dim);line-height:1.6;margin-top:12px;font-weight:600;}
  .meal-prep b{color:var(--text);}
  .meal-body-in .chip-select{margin-bottom:12px;}
  .meal-body-in .chip{padding:7px 13px;font-size:11.5px;}
  .diet-info-card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);
    box-shadow:var(--shadow-card);padding:16px 18px;margin-bottom:12px;
  }
  .diet-info-card .dic-t{font-size:13.5px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:7px;}
  .diet-info-card .dic-b{font-size:12.5px;color:var(--text-dim);line-height:1.65;font-weight:600;}
  .diet-info-card.warn{border-color:#ff547055;}
  .diet-info-card.warn .dic-t{color:var(--danger);}
  .supp-intro{font-size:12.5px;color:var(--text-dim);line-height:1.6;margin:2px 0 16px;font-weight:600;}
  .extra-food-group{margin-bottom:16px;}
  .extra-food-group:last-of-type{margin-bottom:2px;}
  .efg-head{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:12px;font-weight:800;color:var(--text-dim);text-transform:uppercase;letter-spacing:.3px;
    margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--border);
  }
  .efg-head span:last-child{color:var(--accent);font-weight:800;}
  .extra-food-list{margin-bottom:12px;}
  .extra-food-item{
    display:flex;align-items:center;gap:10px;padding:10px 0;
    border-bottom:1px solid var(--border);
  }
  .extra-food-list .extra-food-item:last-child{border-bottom:none;}
  .efi-info{flex:1;min-width:0;}
  .efi-n{font-size:13.5px;font-weight:700;color:var(--text);}
  .efi-brand{color:var(--text-dim);font-weight:600;}
  .efi-m{font-size:11.5px;color:var(--text-dim);font-weight:600;margin-top:3px;}
  .efi-remove, .efi-edit{
    flex-shrink:0;width:28px;height:28px;border-radius:50%;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text-dim);font-size:13px;cursor:pointer;
  }
  .efi-actions{display:flex;gap:6px;flex-shrink:0;}
  .food-search-item{
    display:flex;align-items:center;gap:12px;padding:14px 16px;
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);
    margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow-card);
  }
  .food-search-item:active{transform:scale(.98);}
  .fsi-info{flex:1;min-width:0;}
  .fsi-n{font-size:14px;font-weight:700;color:var(--text);}
  .fsi-brand{font-size:11.5px;color:var(--text-dim);font-weight:600;margin-top:2px;}
  .fsi-kcal{font-size:12.5px;color:var(--accent);font-weight:800;white-space:nowrap;}
  /* Lista compatta di alimenti/ricette salvati per riuso rapido: righe con
     separatore sottile invece di una card con bordo e ombra per ogni
     alimento, per restare leggibile anche con liste lunghe. */
  .qa-row{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--border);}
  .qa-row:last-child{border-bottom:none;}
  .qa-info{flex:1;min-width:0;cursor:pointer;padding:2px 0;}
  .qa-name{font-size:13.5px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .qa-sub{font-size:11px;color:var(--text-dim);font-weight:600;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .qa-kcal{font-size:12.5px;color:var(--accent);font-weight:800;white-space:nowrap;flex-shrink:0;cursor:pointer;}
  .qa-kcal .u{color:var(--text-dim);font-weight:600;font-size:10.5px;}
  .qa-remove{
    flex-shrink:0;width:26px;height:26px;border-radius:50%;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text-dim);font-size:12px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .qa-remove:active{background:var(--border);}
  .qa-row{border-radius:10px;transition:background-color .15s ease;}
  .qa-row:active{background:#ff9d4d14;}
  /* ============ CERCA ALIMENTO — hero di ricerca ============
     Card in evidenza con badge circolare "a glow" (stesso linguaggio delle
     icone di Home/Cardio) e campo di ricerca in stile pillola con icona
     incorporata: rende la schermata più invitante e riconoscibile come
     sezione Dieta (arancione, --accent-2) al primo sguardo, invece del
     semplice field generico usato per i form. */
  .food-hero{
    position:relative;padding:20px 18px 18px;margin:2px 0 16px;
    border-radius:var(--radius);border:1px solid var(--border);
    background:
      radial-gradient(ellipse 280px 150px at 12% -10%, #ff9d4d29, transparent 65%),
      var(--panel);
    box-shadow:var(--shadow-card);overflow:hidden;
  }
  .food-hero-top{display:flex;align-items:center;gap:13px;margin-bottom:15px;}
  .food-hero-icon{
    width:46px;height:46px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:21px;
    background:var(--panel-2);border:1.5px solid var(--accent-2);
    box-shadow:0 0 16px -5px #ff9d4daa;
  }
  .food-hero-title{font-size:15.5px;font-weight:800;letter-spacing:-.1px;}
  .food-hero-sub{font-size:11.5px;color:var(--text-dim);font-weight:600;margin-top:2px;}
  .food-hero-searchbar{position:relative;}
  .food-hero-searchbar input{
    width:100%;background:var(--panel-2);border:1.5px solid var(--border);color:var(--text);
    border-radius:16px;padding:14px 16px 14px 42px;font-size:15px;font-weight:600;
    transition:border-color .18s ease, box-shadow .18s ease;
  }
  .food-hero-searchbar input:focus{
    outline:none;border-color:var(--accent-2);
    box-shadow:0 0 0 3px #ff9d4d2e, 0 0 20px -4px #ff9d4d66;
  }
  .food-hero-searchbar .fhs-icon{
    position:absolute;left:15px;top:50%;transform:translateY(-50%);
    font-size:15px;opacity:.5;pointer-events:none;
  }
  .food-hero-cta{
    background:linear-gradient(135deg,var(--accent-2),#e0722a);color:#2a1204;border:none;border-radius:16px;
    padding:14px 18px;font-size:14.5px;font-weight:800;cursor:pointer;width:100%;margin-top:10px;
    box-shadow:0 8px 22px -8px #ff9d4d88;transition:transform .1s ease;
  }
  .food-hero-cta:active{transform:scale(.98);}
  /* Badge circolare accanto ai titoli delle card "Già segnato da te" /
     "Le mie ricette": stesso stile a glow delle icone di Home, così le due
     scorciatoie si riconoscono subito come parte della stessa famiglia
     visiva invece di semplice testo con emoji. */
  .dic-t-badge{
    display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
    width:24px;height:24px;border-radius:50%;font-size:12px;
    background:var(--panel-2);border:1px solid var(--accent-2);
    box-shadow:0 0 10px -3px #ff9d4d99;
  }
  /* Ingresso "a scalare" dei risultati/righe: ogni riga sale leggermente
     con un fade mentre appare, con un piccolo ritardo crescente applicato
     via style inline (vedi renderCercaAlimento) — dà un effetto vivo alla
     lista appena arriva una ricerca, senza animare nulla in loop. */
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(9px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .food-result-anim{ animation:riseIn .36s cubic-bezier(.22,.9,.32,1) both; }
  .food-search-item{position:relative;}
  .food-search-item::before{
    content:'';position:absolute;top:10px;bottom:10px;left:0;width:3px;border-radius:3px;
    background:linear-gradient(180deg,var(--accent-2),var(--accent-3));
  }
  .tab-bar{
    display:flex;gap:6px;background:var(--panel-2);border:1px solid var(--border);
    padding:5px;border-radius:16px;margin-bottom:16px;
  }
  .tab-btn{
    flex:1;text-align:center;padding:10px 6px;border-radius:12px;
    font-size:12.5px;font-weight:800;color:var(--text-dim);cursor:pointer;
    transition:background .2s ease,color .2s ease;white-space:nowrap;
  }
  .tab-btn.active{background:var(--accent);color:#04140d;box-shadow:0 6px 16px -6px #39ff9466;}
  .confirm-overlay{
    position:fixed;inset:0;background:#00000099;backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:999;padding:24px;
    animation:confirmFadeIn .18s ease;
  }
  @keyframes confirmFadeIn{ from{opacity:0;} to{opacity:1;} }
  .confirm-box{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow-card);padding:22px;max-width:340px;width:100%;
    animation:confirmPopIn .18s ease;
  }
  @keyframes confirmPopIn{ from{transform:scale(.94);opacity:0;} to{transform:scale(1);opacity:1;} }
  .confirm-msg{font-size:14px;font-weight:600;color:var(--text);line-height:1.55;margin:0 0 20px;}
  .confirm-actions{display:flex;gap:10px;}
  .confirm-actions .btn{flex:1;}
  /* ===== Foglio a comparsa "scegli opzione" (selettore pasto in Dieta) ===== */
  .sheet-overlay{
    position:fixed;inset:0;background:#00000099;backdrop-filter:blur(3px);
    display:flex;align-items:flex-end;justify-content:center;z-index:999;
    animation:confirmFadeIn .18s ease;
  }
  .sheet-box{
    background:var(--panel);border:1px solid var(--border);border-bottom:none;
    border-radius:22px 22px 0 0;box-shadow:var(--shadow-card);
    width:100%;max-width:560px;max-height:86vh;overflow-y:auto;
    padding:8px 18px 26px;animation:sheetSlideUp .22s ease;
  }
  @keyframes sheetSlideUp{ from{transform:translateY(30px);opacity:.4;} to{transform:translateY(0);opacity:1;} }
  .sheet-handle{width:38px;height:4px;border-radius:3px;background:var(--border);margin:2px auto 14px;}
  .sheet-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px;}
  .sheet-title{font-size:16px;font-weight:900;}
  .ex-tools{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 10px;}
  .ex-tools .set-mini-btn[disabled]{opacity:.35;pointer-events:none;}
  .sheet-close{
    flex-shrink:0;width:30px;height:30px;border-radius:50%;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text-dim);font-size:13px;cursor:pointer;
  }
  .opt-card-list{display:flex;flex-direction:column;gap:10px;}
  .opt-card{
    background:var(--panel-2);border:1.5px solid var(--border);border-radius:16px;
    padding:14px 16px;transition:border-color .15s ease;
  }
  .opt-card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
  .opt-card-top{display:flex;align-items:center;gap:12px;cursor:pointer;}
  .opt-card-main{flex:1;min-width:0;}
  .opt-card-title{font-size:14px;font-weight:800;line-height:1.4;}
  .opt-card-badge{
    display:inline-block;font-size:10px;font-weight:800;color:#04140d;background:var(--accent);
    border-radius:8px;padding:2px 7px;margin-left:4px;vertical-align:middle;text-transform:uppercase;
  }
  .opt-card-macros{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap;}
  .opt-card-macros span{font-size:11px;font-weight:700;color:var(--text-dim);display:flex;align-items:center;gap:4px;}
  .opt-card-macros span b{color:var(--text);font-weight:800;}
  .opt-card-kcal{font-size:15px;font-weight:900;color:var(--accent);white-space:nowrap;flex-shrink:0;text-align:right;line-height:1.15;}
  .opt-card-kcal span{display:block;font-size:9.5px;color:var(--text-dim);font-weight:700;text-transform:uppercase;}
  .spinner{
    width:32px;height:32px;border-radius:50%;margin:0 auto 14px;
    border:3px solid #ffffff1a;border-top-color:var(--accent);
    animation:spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading-block{text-align:center;padding:34px 10px;color:var(--text-dim);font-size:13px;font-weight:600;}
  .ptr-indicator{
    position:fixed;top:-50px;left:50%;margin-left:-19px;z-index:60;
    width:38px;height:38px;border-radius:50%;
    background:var(--panel);border:1px solid var(--border);box-shadow:var(--shadow-card);
    display:flex;align-items:center;justify-content:center;
  }
  .ptr-indicator .spinner{ margin:0;width:18px;height:18px;border-width:2.5px;animation:none; }
  .ptr-indicator.loading .spinner{ animation:spin .7s linear infinite; }
  .micro-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;}
  .micro-row{
    display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:600;
    color:var(--text-dim);padding:6px 0;border-bottom:1px solid var(--border);
  }
  .micro-row b{color:var(--text);font-weight:800;white-space:nowrap;}
  .diario-item-actions{display:inline-flex;gap:5px;margin-left:8px;vertical-align:middle;}
  .diario-mini-btn{
    background:var(--panel-2);border:1px solid var(--border);border-radius:7px;
    width:21px;height:21px;font-size:10.5px;line-height:1;padding:0;
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .diario-mini-btn:active{transform:scale(.9);background:var(--panel);}
  .spinner-inline{
    display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:middle;margin-right:7px;
    border:2px solid #ffffff22;border-top-color:var(--accent);
    animation:spin .7s linear infinite;
  }
  .done-tick{font-size:12px;vertical-align:middle;}
  .done-toggle{
    display:flex;align-items:center;gap:9px;margin-top:14px;padding-top:12px;
    border-top:1px solid var(--border);font-size:12.5px;color:var(--text-dim);font-weight:700;cursor:pointer;
  }
  .done-toggle input{width:19px;height:19px;accent-color:var(--accent);flex-shrink:0;}
  .water-row{display:flex;align-items:center;gap:10px;}
  .water-bar{flex:1;height:10px;border-radius:20px;background:#ffffff10;overflow:hidden;}
  .water-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,#2ac7ff,#5be0ff);transition:width .5s ease;}
  .water-val{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;}
  .water-btns{display:flex;gap:10px;margin-top:12px;}
  .water-btns .btn{flex:1;}
  .week-stat{
    display:flex;align-items:center;justify-content:space-between;
    padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;
  }
  .week-stat:last-child{border-bottom:none;}
  .week-stat span{color:var(--text-dim);}
  .week-stat b{color:var(--text);font-size:14px;font-family:var(--mono);letter-spacing:.01em;}
  .success-banner{
    background:linear-gradient(135deg,var(--accent),#1fae63);color:#04140d;
    padding:22px;border-radius:var(--radius);text-align:center;font-weight:800;margin-bottom:16px;
    box-shadow:var(--shadow-btn);font-size:15px;
  }
  .error-banner{
    background:linear-gradient(135deg,var(--danger),#c92548);color:#fff;padding:13px 16px;border-radius:12px;
    font-size:13.5px;margin-bottom:12px;font-weight:700;
  }
  #loginScreen, #registerScreen, #onboardingScreen{
    max-width:380px;margin:10vh auto 0;padding:0 24px;text-align:center;
  }
  #loginScreen h1, #registerScreen h1, #onboardingScreen h1{font-size:26px;margin-bottom:8px;font-weight:900;letter-spacing:-.3px;}
  #loginScreen p, #registerScreen p, #onboardingScreen p{color:var(--text-dim);font-size:14px;margin-bottom:26px;font-weight:600;}
  #loginScreen .card, #registerScreen .card, #onboardingScreen .card{text-align:left;}
  .auth-switch{font-size:13px;color:var(--text-dim);font-weight:600;text-align:center;margin-top:18px;}
  .auth-switch span{color:var(--accent);font-weight:800;cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
  .spinner-wrap{display:flex;justify-content:center;padding:70px 0;color:var(--text-dim);font-size:14px;font-weight:600;}

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }

  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* ==================================================================
     TEMA SPORT v2 — restyling grafico (colori per sezione, card piu'
     ricche, numeri grandi, progress a gradiente). Sta in fondo al CSS e
     sovrascrive solo l'aspetto: nessuna modifica a struttura o logica.
     Ogni sezione imposta --sa / --sb / --sfg su <body> (vedi
     temaSezione() in JS): colore principale, secondario e testo sui
     bottoni pieni.
     ================================================================== */
  :root{
    --bg:#06070c;
    --panel:#10131c;
    --panel-2:#171b28;
    --border:#242a3d;
    --text:#f6f8fc;
    --text-dim:#98a1b9;
    --accent:#3dffa0;
    --accent-2:#ff8a3d;
    --accent-3:#a06bff;
    --danger:#ff4f72;
    --radius:24px;
    --radius-sm:20px;
    --shadow-card:0 10px 26px -16px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.045);
    --shadow-btn:0 10px 24px -10px #3dffa099;
    --sa:#3dffa0; --sb:#19c27a; --sfg:#04140d;
  }
  body{
    background:
      radial-gradient(ellipse 900px 520px at 50% -14%, color-mix(in srgb, var(--sa) 20%, transparent), transparent 62%),
      radial-gradient(ellipse 700px 460px at 108% 20%, rgba(160,107,255,.11), transparent 62%),
      radial-gradient(ellipse 620px 420px at -12% 72%, rgba(255,138,61,.08), transparent 60%),
      var(--bg);
  }

  /* --- Header --- */
  header{padding:18px 18px 12px;}
  header h1{font-size:20px;font-weight:900;letter-spacing:-.3px;
    background:linear-gradient(90deg,#fff 20%,var(--sa) 120%);-webkit-background-clip:text;background-clip:text;color:transparent;}
  header::after{height:3px;opacity:1;background:linear-gradient(90deg,var(--sa),var(--sb),transparent);}
  .back-btn{background:linear-gradient(145deg,var(--panel-2),var(--panel));border-color:#2c3350;}
  .avatar-btn{filter:drop-shadow(0 4px 10px color-mix(in srgb, var(--sa) 45%, transparent));}

  /* --- Card generiche --- */
  .card,.oggi-panel,.meal-card,.diet-summary,.diet-info-card,.exercise-card,.cardio-card{
    background:linear-gradient(180deg,#151927 0%,var(--panel) 62%);
    border:1px solid #252b42;
    border-radius:var(--radius);
  }
  .card{position:relative;overflow:hidden;}
  .card::before{content:'';position:absolute;left:0;top:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--sa),var(--sb));opacity:.9;pointer-events:none;}
  .exercise-card::before,.diet-summary-glow::before,.oggi-panel::before{
    height:4px;background:linear-gradient(90deg,var(--sa),var(--sb));}
  .section-label{color:var(--text-dim);font-size:11.5px;font-weight:900;letter-spacing:.14em;
    display:flex;align-items:center;gap:10px;margin:22px 2px 12px;}
  .section-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent);}

  /* --- Bottoni --- */
  .btn{
    background:linear-gradient(135deg,var(--sa),var(--sb));color:var(--sfg);
    border-radius:20px;padding:16px 18px;font-size:15.5px;font-weight:900;letter-spacing:.1px;
    box-shadow:0 12px 26px -12px color-mix(in srgb, var(--sa) 80%, transparent), inset 0 1px 0 rgba(255,255,255,.28);
  }
  .btn:active{transform:scale(.97);}
  .btn.secondary{background:linear-gradient(145deg,var(--panel-2),var(--panel));color:var(--text);border:1px solid #2c3350;box-shadow:none;}
  .btn.small{border-radius:16px;padding:10px 16px;}
  .chip{background:linear-gradient(145deg,var(--panel-2),var(--panel));border:1px solid #2a3149;font-weight:800;padding:10px 16px;}
  .chip.active{background:linear-gradient(135deg,var(--sa),var(--sb));color:var(--sfg);border-color:transparent;
    box-shadow:0 8px 18px -8px color-mix(in srgb, var(--sa) 80%, transparent);}
  .pill{background:linear-gradient(135deg,var(--sa),var(--sb));color:var(--sfg);border-radius:20px;font-weight:900;}
  .turn-badge{background:linear-gradient(90deg,var(--sa),var(--sb));color:var(--sfg);
    box-shadow:0 6px 16px -6px color-mix(in srgb, var(--sa) 80%, transparent);}

  /* --- Home: pannello Oggi --- */
  .oggi-panel{padding:18px;box-shadow:0 18px 40px -22px color-mix(in srgb, var(--sa) 55%, transparent), var(--shadow-card);}
  .oggi-stats{gap:12px;margin-bottom:6px;}
  .oggi-stat{
    background:linear-gradient(160deg,#1b2033,#12151f);border:1px solid #2a3149;border-radius:20px;
    padding:16px 12px 14px;position:relative;overflow:hidden;
  }
  .oggi-stat:nth-child(1)::after,.oggi-stat:nth-child(2)::after{content:'';position:absolute;right:-22px;top:-22px;width:70px;height:70px;border-radius:50%;opacity:.22;}
  .oggi-stat:nth-child(1)::after{background:#5b8cff;}
  .oggi-stat:nth-child(2)::after{background:var(--c-dieta,#ff8a3d);}
  .oggi-stat .v{font-family:var(--disp);font-size:42px;letter-spacing:.02em;font-weight:400;line-height:1;
    background:linear-gradient(90deg,#fff,var(--sa));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .oggi-stat:nth-child(1) .v{background:linear-gradient(90deg,#fff,#a9c2ff);-webkit-background-clip:text;background-clip:text;}
  .oggi-stat:nth-child(2) .v{background:linear-gradient(90deg,#fff,#ffc58f);-webkit-background-clip:text;background-clip:text;}
  .oggi-stat .l{font-size:10px;letter-spacing:.06em;}
  .os-bar{height:6px;border-radius:6px;background:#ffffff14;margin-top:10px;overflow:hidden;}
  .os-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#5b8cff,#3a4fe0);}
  .oggi-stat:nth-child(2) .os-bar i{background:linear-gradient(90deg,#ff7a2f,#ffc83d);}
  .oggi-row{padding:11px 0;}
  .oggi-row b{font-size:14px;color:#fff;}
  .oggi-water-btn{background:linear-gradient(135deg,#2ac7ff33,#4f7bff22);border-color:#2ac7ff66;font-weight:800;}
  .water-fill{background:linear-gradient(90deg,#2ac7ff,#4f7bff)!important;}

  /* --- Home: saluto --- */
  .home-hello{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:2px 2px 16px;}
  .home-hello .hh-name{font-size:26px;font-weight:900;letter-spacing:-.6px;line-height:1.05;margin:0;}
  .home-hello .hh-name span{background:linear-gradient(90deg,var(--sa),#fff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .home-hello .hh-date{font-size:11.5px;color:var(--text-dim);font-weight:800;text-transform:capitalize;margin:0;white-space:nowrap;
    background:#ffffff0d;border:1px solid var(--border);border-radius:20px;padding:6px 12px;}

  /* --- Home: tessere colorate --- */
  .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
  .h-tile{
    --t1:#3dffa0;--t2:#19c27a;--tfg:#fff;
    position:relative;overflow:hidden;border-radius:26px;padding:18px 16px 16px;min-height:128px;
    display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;color:var(--tfg);
    background:linear-gradient(135deg,var(--t1),var(--t2));
    box-shadow:0 18px 34px -18px var(--t1), inset 0 1px 0 rgba(255,255,255,.3);
    transition:transform .15s ease, box-shadow .2s ease, filter .2s ease;
  }
  .h-tile::before{content:'';position:absolute;right:-34px;top:-34px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.16);}
  .h-tile::after{content:'';position:absolute;left:-30px;bottom:-50px;width:120px;height:120px;border-radius:50%;background:rgba(0,0,0,.10);}
  .h-tile:active{transform:scale(.97);}
  .h-tile.tapped{transform:scale(.96);filter:brightness(1.12);box-shadow:0 0 0 2px #fff6, 0 0 36px 6px var(--t1);}
  .h-tile.wide{grid-column:1 / -1;min-height:150px;}
  .h-tile .h-emoji{font-size:36px;line-height:1;position:relative;z-index:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.28));}
  .h-tile .h-label{font-size:19px;font-weight:900;letter-spacing:-.3px;position:relative;z-index:1;margin-top:14px;}
  .h-tile .h-sub{font-size:12px;font-weight:700;opacity:.9;margin-top:3px;line-height:1.35;position:relative;z-index:1;}
  .h-tile .h-go{position:absolute;right:14px;bottom:14px;z-index:1;width:34px;height:34px;border-radius:50%;
    background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;}
  .h-tile.t-allen{--t1:#4f7dff;--t2:#2a3bd0;}
  .h-tile.t-dieta{--t1:#ff7a2f;--t2:#ffc83d;--tfg:#2b1500;}
  .h-tile.t-stats{--t1:#22e0d0;--t2:#12a89c;--tfg:#03160f;}
  .h-tile.t-storico{--t1:#ff4f7d;--t2:#ff8a4d;}
  .h-tile.t-misure{--t1:#a6f23a;--t2:#2fe39a;--tfg:#0b1a05;}

  /* --- Righe-categoria (Storico, Misure...) --- */
  .home-cat{
    background:linear-gradient(160deg,#171b2a,#10131c);border:1px solid #262c44;border-radius:24px;
    padding:16px 18px;position:relative;overflow:hidden;
  }
  .home-cat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--sa),var(--sb));}
  .home-cat .icon{
    width:54px;height:54px;border:none;font-size:26px;
    background:linear-gradient(135deg,var(--sa),var(--sb));box-shadow:0 10px 20px -10px var(--sa);
  }
  .home-cat .label{font-size:18px;font-weight:900;}
  .home-cat.tapped{border-color:var(--sa);box-shadow:0 0 0 1.5px var(--sa),0 0 30px 4px color-mix(in srgb, var(--sa) 45%, transparent);}
  .home-square .icon{background:linear-gradient(135deg,var(--sa),var(--sb));border:none;}
  .diet-quicklinks .qlink{background:linear-gradient(160deg,#1a1f31,#12151f);border-color:#2a3149;border-radius:18px;}
  .diet-quicklinks .qlink .ql{color:var(--text);}

  /* --- Liste schede / voci --- */
  .list-item{
    background:linear-gradient(160deg,#171b2a,#10131c);border:1px solid #262c44;
    border-left:5px solid var(--sa);border-radius:22px;padding:18px 18px;
  }
  .list-item h3{font-size:17px;font-weight:900;letter-spacing:-.2px;}
  .list-item.turno{border-left-color:var(--sa);box-shadow:0 0 0 1.5px var(--sa), 0 18px 34px -20px var(--sa);
    background:linear-gradient(160deg,color-mix(in srgb, var(--sa) 14%, #171b2a),#10131c);}
  .scheda-toggle{color:var(--sa);font-weight:900;}
  .blocco-progress .bp-bar,.finish-bar-progress .bp-bar,.session-progress .bp-bar{height:9px;border-radius:9px;background:#ffffff12;border:none;}
  .blocco-progress .bp-fill,.finish-bar-progress .bp-fill,.session-progress .bp-fill{
    background:linear-gradient(90deg,var(--sa),var(--sb));border-radius:9px;box-shadow:0 0 14px -2px var(--sa);}
  .sessione-card-icon{background:linear-gradient(135deg,var(--sa),var(--sb))!important;border:none!important;}
  .misura-pill{background:#ffffff0f;border:1px solid #2a3149;font-weight:800;}

  /* --- Sessione allenamento --- */
  .exercise-card{padding:20px 18px;box-shadow:0 14px 30px -20px #000, var(--shadow-card);}
  .exercise-card h3{font-size:18px;font-weight:900;letter-spacing:-.2px;}
  .ex-meta{color:var(--sa);font-weight:900;font-family:var(--mono);font-size:12.5px;}
  .set-row{grid-template-columns:28px minmax(0,1.5fr) minmax(0,1fr) 52px 30px;gap:6px;margin-bottom:10px;}
  .set-row>span:first-child{
    width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--sa),var(--sb));color:var(--sfg);font-weight:900;font-size:12.5px;
  }
  .set-row input[type=number],.set-row input[type=text],.set-row select{
    background:#0c0e15;border:1px solid #2a3149;border-radius:14px;font-weight:800;
  }
  .set-row input[type=checkbox]{
    -webkit-appearance:none;appearance:none;width:30px;height:30px;border-radius:50%;
    background:#0c0e15;border:2px solid #3a4262;cursor:pointer;position:relative;transition:all .15s ease;
  }
  .set-row input[type=checkbox]:checked{background:linear-gradient(135deg,var(--sa),var(--sb));border-color:transparent;
    box-shadow:0 0 16px -2px var(--sa);}
  .set-row input[type=checkbox]:checked::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--sfg);font-weight:900;font-size:17px;}
  .set-row.rpe-missing select{border-color:var(--accent-2);box-shadow:0 0 0 2px #ff8a3d44;}
  .stepper-btn{background:linear-gradient(145deg,var(--panel-2),#0c0e15);border:1px solid #2a3149;border-radius:12px;font-weight:900;}
  .peso-stepper{gap:2px;}
  .peso-stepper input[type=number]{border-radius:12px;padding:10px 0;}
  .stepper-btn{width:22px;border-radius:9px;}
  .stepper-btn:active{background:var(--sa);color:var(--sfg);}
  .prev-session-tip{background:linear-gradient(160deg,#1c2036,#12151f);border:1px solid #2f3658;border-radius:18px;}
  .pst-set{background:#ffffff10;border-radius:10px;font-weight:800;}
  .finish-bar{background:linear-gradient(180deg,#141828f2,#0c0e16);border-top:1px solid #2a3149;border-radius:26px 26px 0 0;
    box-shadow:0 -16px 40px -12px rgba(0,0,0,.85);}
  .session-elapsed{background:linear-gradient(135deg,#1b2033,#12151f);border:1px solid #2a3149;border-radius:20px;font-weight:800;}
  .timer-bar{background:linear-gradient(180deg,#171c30,#0d1019);border-top:1px solid #2f3658;border-radius:26px 26px 0 0;}
  .timer-ring-fill{stroke:var(--sa)!important;}
  .superset-group{border-color:var(--sa);}
  .superset-label,.superset-tag{color:var(--sa);font-weight:900;}
  .cardio-card::before{background:linear-gradient(90deg,var(--sa),var(--sb))!important;height:4px!important;}

  /* --- Dieta --- */
  .diet-summary{padding:22px 20px;}
  .day-mode-toggle .dmt-btn{background:linear-gradient(145deg,var(--panel-2),var(--panel));border-radius:16px;font-weight:900;}
  .dmt-btn.active{background:linear-gradient(135deg,var(--sa),var(--sb));color:var(--sfg);border-color:transparent;
    box-shadow:0 10px 20px -10px var(--sa);}
  .kcal-ring-wrap{width:180px;height:180px;}
  .kr-n{font-size:46px;font-weight:400;}
  .kr-fill{stroke-width:12;filter:drop-shadow(0 0 8px var(--sa));}
  .kr-bg{stroke:#ffffff12;stroke-width:12;}
  .kcal-ring-glow{background:radial-gradient(circle,color-mix(in srgb, var(--sa) 30%, transparent),transparent 72%);}
  .macro-tile{background:linear-gradient(170deg,#1b2033,#12151f);border:1px solid #2a3149;border-radius:20px;}
  .macro-tile::before{height:4px;}
  .macro-tile .mt-track{height:8px;background:#ffffff12;}
  .macro-tile .mt-fill{box-shadow:0 0 10px -1px var(--tile-color);}
  .tab-bar{background:linear-gradient(145deg,var(--panel-2),var(--panel));border:1px solid #2a3149;border-radius:22px;}
  .tab-btn.active{background:linear-gradient(135deg,var(--sa),var(--sb))!important;color:var(--sfg)!important;font-weight:900;
    box-shadow:0 8px 18px -8px var(--sa);}
  .meal-card{box-shadow:var(--shadow-card);}
  .meal-head .icon,.meal-row-icon{background:linear-gradient(135deg,#ffffff14,#ffffff08);border-radius:16px;}
  .meal-head .mh-kcal,.meal-row-kcal{font-family:var(--mono);font-weight:800;}
  .meal-check.checked{background:linear-gradient(135deg,var(--sa),var(--sb))!important;border-color:transparent!important;box-shadow:0 0 14px -2px var(--sa);}
  .meal-row.done{border-color:color-mix(in srgb, var(--sa) 45%, transparent);}
  .food-hero{background:linear-gradient(135deg,color-mix(in srgb, var(--sa) 28%, #151927),#10131c 70%);border:1px solid #2f3658;border-radius:26px;}
  .food-hero-cta{background:linear-gradient(135deg,var(--sa),var(--sb));color:var(--sfg);font-weight:900;}
  .qa-row,.extra-food-item{border-radius:16px;}

  /* --- Misure / Statistiche --- */
  .stat-highlight{background:linear-gradient(135deg,color-mix(in srgb, var(--sa) 20%, #1b2033),#12151f);border:1px solid #2f3658;border-radius:22px;}
  .stat-highlight-value{font-family:var(--disp);font-weight:400;font-size:52px;
    background:linear-gradient(90deg,#fff,var(--sa));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .misura-card,.sessione-card{border-radius:22px;}
  .misura-delta.up{color:var(--accent-2);}
  .misura-delta.down{color:var(--accent);}
  .week-stat b{font-family:var(--mono);}
  .diff-row{border-radius:14px;}
  .rec-chip{display:inline-flex;align-items:center;gap:5px;margin-left:2px;padding:5px 11px;border-radius:20px;font-family:var(--mono);font-size:12px;font-weight:900;cursor:pointer;
    color:var(--sa);background:color-mix(in srgb, var(--sa) 14%, transparent);border:1px solid color-mix(in srgb, var(--sa) 45%, transparent);}
  .rec-chip.custom{background:linear-gradient(135deg,var(--sa),var(--sb));color:var(--sfg);border-color:transparent;}
  .rec-chip:active{transform:scale(.95);}
  .rec-presets{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:4px 0 14px;}

  /* --- Form --- */
  .field input,.field textarea,.field select,input,textarea{border-radius:16px;}
  .field input:focus,.field textarea:focus{outline:2px solid var(--sa);outline-offset:-1px;}
  .success-banner{background:linear-gradient(135deg,#3dffa022,#19c27a11);border:1px solid #3dffa055;border-radius:18px;}
  .confirm-box,.sheet-box{background:linear-gradient(180deg,#171b2a,#10131c);border:1px solid #2f3658;border-radius:28px;}
  .app-credit span{color:var(--sa);}

  /* ===== Unilaterale + tecniche d'intensità ===== */
  .side-lbl{display:block;font-size:9px;font-weight:900;letter-spacing:.5px;color:var(--text-dim);margin-top:1px;}
  .set-row-dx{margin-top:-4px;}
  .tec-sel{max-width:150px;font-size:12px;font-weight:800;padding:6px 8px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text-dim);}
  .tec-sel.on{background:linear-gradient(135deg,#ff9d4d,#ff6b3d);color:#1a0d00;border-color:transparent;}
  .tec-panel{margin:2px 0 12px 28px;padding:10px 12px;border-radius:12px;border:1px solid #ff9d4d;background:rgba(255,157,77,.08);}
  .tec-t{font-weight:900;font-size:13px;color:#ffb066;}
  .tec-sost{font-weight:600;font-size:11px;color:var(--text-dim);margin-left:4px;}
  .tec-h{font-size:12px;color:var(--text-dim);margin:4px 0 8px;line-height:1.5;}
  .tec-f{display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
  .tec-l{font-size:12px;font-weight:700;}
  .tec-w{font-size:12px;color:var(--danger);margin-top:8px;font-weight:700;}
  .tec-f input{background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px 4px;font-size:14px;font-weight:700;}
  .set-row > span .side-lbl{display:inline;font-size:8px;margin-left:1px;}
  /* ===== Dettaglio seduta (storico) ===== */
  .sd-hero{padding:18px 16px 16px;border-radius:22px;margin-bottom:14px;color:var(--sfg,#fff);
    background:linear-gradient(135deg,var(--sa,#5b8cff),var(--sb,#3a4fe0));box-shadow:0 10px 28px -12px var(--sa,#5b8cff);}
  .sd-date{font-size:12px;font-weight:700;opacity:.85;text-transform:capitalize;}
  .sd-title{font-size:22px;font-weight:900;line-height:1.15;margin:4px 0 14px;}
  .sd-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .sd-stat{background:rgba(0,0,0,.2);border-radius:14px;padding:9px 4px;text-align:center;}
  .sd-stat b{display:block;font-size:16px;font-weight:900;line-height:1.1;}
  .sd-stat b small{font-size:11px;font-weight:700;opacity:.7;}
  .sd-stat span{display:block;font-size:9.5px;font-weight:700;opacity:.8;margin-top:3px;text-transform:uppercase;letter-spacing:.4px;}
  .sd-tag-row{margin-top:10px;}
  .sd-diet{margin-top:10px;font-size:12px;opacity:.92;line-height:1.5;}
  .sd-ex{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:14px;margin-bottom:12px;}
  .sd-ex-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;}
  .sd-ex-n{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:14px;
    background:linear-gradient(135deg,var(--sa,#5b8cff),var(--sb,#3a4fe0));color:var(--sfg,#fff);}
  .sd-ex-info{min-width:0;flex:1;}
  .sd-ex-name{font-size:16px;font-weight:800;line-height:1.25;}
  .sd-ex-sub{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;}
  .sd-pill{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;background:var(--panel-2);color:var(--text-dim);border:1px solid var(--border);}
  .sd-pill.uni{color:var(--sa,#5b8cff);}
  .sd-pill.tec{background:rgba(255,157,77,.16);color:#ffb066;border-color:rgba(255,157,77,.4);}
  .sd-count{font-size:11px;font-weight:700;color:var(--text-dim);}
  .sd-delta{font-size:11px;font-weight:800;}
  .sd-delta.up{color:#39ff94;} .sd-delta.down{color:#ff8a8a;} .sd-delta.eq{color:var(--text-dim);}
  .sd-sets{display:flex;flex-direction:column;gap:6px;}
  .sd-set{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;background:var(--panel-2);border:1px solid transparent;}
  .sd-set.done{border-color:color-mix(in srgb,var(--sa,#5b8cff) 30%,transparent);}
  .sd-set.top{background:color-mix(in srgb,var(--sa,#5b8cff) 14%,var(--panel-2));border-color:var(--sa,#5b8cff);}
  .sd-set.empty{opacity:.45;}
  .sd-set.skip{opacity:.5;}
  .sd-skip{font-size:12.5px;font-style:italic;color:var(--text-dim);}
  .sd-sn{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900;background:var(--panel);color:var(--text-dim);}
  .sd-vals{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .sd-side{display:flex;align-items:baseline;gap:6px;}
  .sd-lato{width:18px;font-size:9px;font-weight:900;color:var(--text-dim);letter-spacing:.4px;}
  .sd-w{font-size:17px;font-weight:900;font-family:var(--mono);}
  .sd-w small{font-size:11px;font-weight:700;color:var(--text-dim);margin-left:2px;}
  .sd-x{font-size:12px;color:var(--text-dim);}
  .sd-r{font-size:17px;font-weight:900;font-family:var(--mono);}
  .sd-end{display:flex;align-items:center;gap:8px;flex:none;}
  .sd-rpe{font-size:11px;font-weight:900;padding:4px 8px;border-radius:10px;}
  .sd-rpe.r7{background:rgba(57,255,148,.16);color:#39ff94;}
  .sd-rpe.r8{background:rgba(255,214,10,.16);color:#ffd60a;}
  .sd-rpe.r9{background:rgba(255,157,77,.18);color:#ffa14d;}
  .sd-rpe.r10{background:rgba(255,84,112,.18);color:#ff6b86;}
  .sd-ok{width:20px;text-align:center;font-weight:900;color:#39ff94;}
  .sd-tec{margin:-2px 0 2px 42px;font-size:12px;font-weight:700;color:#ffb066;}
  .sd-note{margin-top:10px;font-size:12.5px;color:var(--text-dim);line-height:1.5;}
  /* ===== Modifica ingredienti ricetta nel pasto ===== */
  .rp-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);}
  .rp-n{flex:1;min-width:0;font-size:14px;font-weight:700;}
  .rp-m{font-size:11px;font-weight:600;color:var(--text-dim);margin-top:2px;}
  .rp-row input{width:78px;text-align:center;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 4px;font-size:15px;font-weight:800;}
  .rp-g{font-size:12px;color:var(--text-dim);}

  /* ===== Allenamento v2: schede esercizio apribili, serie compatte ===== */
  .ex2{background:var(--panel);border:1px solid var(--border);border-radius:20px;margin-bottom:10px;overflow:hidden;scroll-margin-top:84px;box-shadow:var(--shadow-card);}
  .ex2.open{border-color:var(--sa,var(--accent));box-shadow:0 14px 30px -22px #000, 0 0 0 1px #39ff9422;}
  .ex2.done:not(.open){opacity:.72;}
  .ex2-head{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:14px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .ex2-badge{flex:0 0 30px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);font-size:13px;font-weight:900;}
  .ex2.open .ex2-badge{background:linear-gradient(135deg,var(--sa,var(--accent)),var(--sb,var(--accent-3)));color:var(--sfg,#04140d);border-color:transparent;}
  .ex2.done .ex2-badge{background:var(--accent);color:#04140d;border-color:transparent;}
  .ex2-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .ex2-title b{font-size:15.5px;font-weight:800;line-height:1.25;color:var(--text);}
  .ex2-title small{font-size:12px;color:var(--text-dim);font-weight:700;font-family:var(--mono);}
  .ex2-prog{font-size:12.5px;font-weight:800;color:var(--text-dim);font-family:var(--mono);}
  .ex2.done .ex2-prog{color:var(--accent);}
  .ex2-chev{color:var(--accent);font-size:14px;transition:transform .2s;}
  .ex2.open .ex2-chev{transform:rotate(180deg);}
  .ex2-body{padding:0 12px 14px;border-top:1px solid var(--border);padding-top:12px;}
  .ex2-chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:10px;}
  .ex2-cp{font-size:12px;font-weight:700;color:var(--text-dim);background:var(--panel-2);border-radius:10px;padding:5px 9px;}
  .ex2-last{background:var(--panel-2);border-radius:14px;padding:10px 12px;margin-bottom:12px;}
  .ex2-last-t{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:800;color:#8b6bff;}
  .ex2-last .pst-sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;}
  .ex2-last .pst-set{background:#ffffff10;border-radius:9px;padding:4px 8px;font-size:12px;font-weight:800;}
  .ex2-last-n{font-size:12px;color:var(--text-dim);margin-top:6px;}
  .s2-head,.s2-row{display:grid;grid-template-columns:26px minmax(0,1.7fr) minmax(0,1fr) 50px 34px 22px;gap:6px;align-items:center;}
  .s2-head{font-size:10.5px;font-weight:800;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;text-align:center;margin:0 0 6px;}
  .s2-row{margin-bottom:8px;}
  .s2-row.s2-dx{grid-template-columns:26px minmax(0,1.7fr) minmax(0,1fr) 50px 34px 22px;margin-top:-3px;}
  .s2-n{width:26px;height:26px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:var(--text-dim);background:var(--panel-2);line-height:1;}
  .s2-n small{font-size:7.5px;font-weight:900;color:var(--accent);margin-top:1px;}
  .s2-row.s2-done .s2-n{background:var(--accent);color:#04140d;}
  .s2-row.s2-done .s2-n small{color:#04140d;}
  .s2-kg{min-width:0;}
  .s2-kg input[type=number]{width:100%;min-width:0;text-align:center;padding:10px 0;font-size:15px;font-weight:800;background:#0c0e15;border:1px solid #2a3149;border-radius:12px;color:var(--text);}
  .s2-kg .stepper-btn{width:22px;height:34px;border-radius:9px;}
  .s2-row input.s2-rip{width:100%;min-width:0;text-align:center;padding:10px 0;font-size:15px;font-weight:800;background:#0c0e15;border:1px solid #2a3149;border-radius:12px;color:var(--text);}
  .s2-row select.s2-rpe{width:100%;padding:10px 0;font-size:12.5px;font-weight:800;text-align:center;background:#0c0e15;border:1px solid #2a3149;border-radius:12px;color:var(--text);}
  .s2-row.rpe-missing select.s2-rpe{border-color:var(--accent-2);box-shadow:0 0 0 2px #ff8a3d33;}
  .s2-row input:focus,.s2-row select:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  .s2-ok{-webkit-appearance:none;appearance:none;width:34px;height:34px;border-radius:50%;background:#0c0e15;border:2px solid #3a4262;cursor:pointer;position:relative;transition:all .15s;justify-self:center;}
  .s2-ok:checked{background:linear-gradient(135deg,var(--sa,var(--accent)),var(--sb,var(--accent-3)));border-color:transparent;box-shadow:0 0 14px -2px var(--sa,var(--accent));}
  .s2-ok:checked::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--sfg,#04140d);font-weight:900;font-size:16px;}
  .s2-more{all:unset;box-sizing:border-box;width:22px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:18px;font-weight:900;cursor:pointer;border-radius:8px;}
  .s2-more.on{color:var(--accent);}
  .s2-skipped{grid-template-columns:26px 1fr auto;opacity:.65;}
  .s2-skl{font-size:13px;color:var(--text-dim);font-style:italic;font-weight:600;}
  .s2-opts{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:-2px 0 10px 32px;}
  .s2-chip{background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:8px 12px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit;}
  .s2-chip.on{border-color:var(--accent);color:var(--accent);}
  .s2-chip:active{background:var(--accent);color:#04140d;}
  .s2-chip[disabled]{opacity:.35;pointer-events:none;}
  .s2-chip.s2-danger{color:var(--danger);}
  .s2-link{background:none;border:none;color:var(--accent);font-size:12px;font-weight:800;cursor:pointer;padding:2px 0;font-family:inherit;}
  .ex2-actions{display:flex;gap:8px;margin-top:4px;}
  .ex2-more{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);}

<script>
/* ============ CONFIGURAZIONE FIREBASE ============ */
const firebaseConfig = {
  apiKey: "AIzaSyAmuJZebX_JI87JltjigBxG5jGHQJmjcxk",
  authDomain: "just-beat-it-76154.firebaseapp.com",
  projectId: "just-beat-it-76154",
  storageBucket: "just-beat-it-76154.firebasestorage.app",
  messagingSenderId: "528385840519",
  appId: "1:528385840519:web:f27dd04596a0c432f4af22",
  measurementId: "G-7XKHZW21MK"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// LOCAL è già il default per il SDK web di Firebase Auth (login ricordato tra
// una riapertura e l'altra, non solo per la sessione corrente), ma lo
// impostiamo qui in modo esplicito invece di affidarci solo al default:
// così, se in futuro cambia qualcosa nella pagina prima del primo login, il
// comportamento resta garantito. Va impostato prima di qualunque signIn.
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{
  // Se il browser non supporta la persistenza richiesta (raro, es. modalità
  // privata estrema) il login resta comunque valido per la sessione in corso.
});

/* Persistenza offline: le letture vengono servite dalla cache locale (IndexedDB)
   quando manca rete, e le scritture (es. segnare una serie o un pasto in palestra
   con poco segnale) vengono messe in coda e sincronizzate da sole appena torna
   la connessione, invece di fallire silenziosamente. synchronizeTabs:true evita
   l'errore "failed-precondition" se l'app è aperta in più schede/finestre. */
db.enablePersistence({ synchronizeTabs: true }).catch(err=>{
  if(err.code === 'failed-precondition'){
    console.warn('Persistenza offline non attivata (altre schede aperte in conflitto).');
  } else if(err.code === 'unimplemented'){
    console.warn('Persistenza offline non supportata da questo browser.');
  }
});

/* ============ NOTIFICHE PUSH (promemoria pasti/integratori/idratazione) ============
   Richiede una chiave VAPID generata nella console Firebase del progetto:
   Impostazioni progetto → Cloud Messaging → Certificati web push → Genera coppia
   di chiavi. Finché questa costante resta vuota, il pulsante "Attiva notifiche"
   in Profilo mostra un avviso invece di provare ad attivarle. */
const VAPID_KEY = 'BFyZgctC9kbrYwO9UAtezX2lNg8kTBPjV05rFnqSVEw98o2XS6GaHt63mg5zCuT3lHc9fxTi5Nk_IspK8TeDTqQ';

function messagingSupportata(){
  return !!(firebase.messaging && firebase.messaging.isSupported && firebase.messaging.isSupported() && 'Notification' in window);
}

async function attivaNotifichePush(){
  const stato = document.getElementById('notificheStato');
  if(!VAPID_KEY){
    if(stato) stato.innerHTML = `<div class="error-banner">Manca ancora la chiave VAPID nel codice (va generata nella console Firebase e incollata in VAPID_KEY). Finché non c'è, le notifiche non possono attivarsi.</div>`;
    return;
  }
  if(!messagingSupportata()){
    if(stato) stato.innerHTML = `<div class="error-banner">Il tuo browser non supporta le notifiche push, o l'app non è installata sulla schermata Home (richiesto su iPhone).</div>`;
    return;
  }
  try{
    const permesso = await Notification.requestPermission();
    if(permesso !== 'granted'){
      if(stato) stato.innerHTML = `<div class="error-banner">Permesso non concesso. Puoi riattivarlo dalle impostazioni di notifica del browser/telefono.</div>`;
      return;
    }
    // Senza specificare quale service worker usare, Firebase Messaging
    // proverebbe da solo a registrarne uno con nome fisso
    // "firebase-messaging-sw.js" che in questo progetto non esiste (usiamo
    // "sw.js" per l'offline/cache) — fallendo con
    // "messaging/failed-service-worker-registration". Gli passiamo invece
    // esplicitamente il nostro service worker già attivo, che gestisce
    // anche l'evento "push" (vedi sw.js).
    const registrazioneSW = await navigator.serviceWorker.ready;
    const messaging = firebase.messaging();
    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: registrazioneSW });
    if(!token) throw new Error('Nessun token ottenuto');
    await attendiScrittura(db.collection('users').doc(currentUid).set({ fcmToken: token }, { merge:true }));
    if(profiloUtente) profiloUtente.fcmToken = token;
    if(stato) stato.innerHTML = `<div class="success-banner" style="margin:0;padding:14px;">Notifiche attivate ✅</div>`;
  }catch(e){
    if(stato) stato.innerHTML = `<div class="error-banner">Non sono riuscito ad attivare le notifiche: ${e.message}</div>`;
  }
}

/* Le notifiche in primo piano (app aperta) non vengono mostrate in automatico
   dal sistema come quelle in background: le intercettiamo e le mostriamo noi.
   Il "tag" (quando presente) fa sì che una notifica di fine timer arrivata
   dal server non si accumuli sopra a quella già mostrata in locale se l'app
   era ancora aperta al momento — la sostituisce invece di raddoppiarla. */
if(messagingSupportata()){
  try{
    firebase.messaging().onMessage(payload=>{
      const titolo = (payload.notification && payload.notification.title) || 'Beat Yourself';
      const corpo = (payload.notification && payload.notification.body) || '';
      const tag = (payload.data && payload.data.tag) || undefined;
      if(Notification.permission==='granted') new Notification(titolo, { body: corpo, icon:'icon-192.png', tag });
    });
  }catch(e){}
}

/* ============ NOTIFICA PUSH DI FINE TIMER DI RECUPERO ============
   I timer di recupero in Sessione restano precisi anche dopo uno stand-by
   (vedi startRestTimer/restRemainingSec più sotto), ma se il telefono va
   in stand-by o l'app viene chiusa del tutto, il beep/vibrazione/notifica
   locale a fine recupero non può scattare: il sistema operativo sospende
   l'esecuzione JS. Per questo, se le notifiche push sono attive, chiediamo
   al server (funzione pianificaNotificaTimer, coda Cloud Tasks) di mandarci
   una push esattamente tra N secondi — arriva anche a schermo spento/app
   chiusa, come le altre notifiche push dell'app.
   Richiede che l'utente abbia già completato l'attivazione delle notifiche
   (Profilo → Attiva notifiche): se non l'ha fatto, semplicemente non
   proviamo a chiamare la funzione, senza errori visibili — il timer resta
   comunque corretto localmente, solo senza l'avviso a schermo spento. */
async function pianificaNotificaTimerRemoto(secondi, timerId){
  if(!(profiloUtente && profiloUtente.fcmToken)) return;
  if(!(window.firebase && firebase.functions)) return;
  try{
    const chiamata = firebase.functions().httpsCallable('pianificaNotificaTimer');
    await chiamata({ secondi, timerId });
  }catch(e){
    // Non blocchiamo mai l'allenamento per un problema di rete/funzione:
    // il timer locale resta comunque corretto, si perde solo l'avviso remoto.
  }
}
function annullaNotificaTimerRemoto(){
  if(!currentUid) return;
  db.collection('users').doc(currentUid).set({ timerRecuperoAttivoId: null }, { merge:true }).catch(()=>{});
}
function nuovoTimerId(){
  return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}

    note: 'Ordine fisso: Torso Meccanico, Arti Meccanico, Torso Metabolico, Arti Metabolico — se salti un giorno riprendi da quella che segue, senza recuperi doppi. Le due sedute Meccaniche nei giorni in cui sei più fresco; tra due sedute Arti almeno un giorno. Blocco da lunedì 5 ottobre al 29 novembre, poi una settimana di scarico. Ripetizioni: il range è una bussola. Sedute Meccaniche (lunedì e martedì): 5-8 ripetizioni sui multiarticolari, 10-15 sugli isolamenti, con carichi più alti. Sedute Metaboliche (giovedì e venerdì): 12-15 su presse e rematori, 15-20 sugli isolamenti, con carichi più leggeri. Se le serie sono vicine al cedimento la crescita muscolare è simile in tutti questi range: alternarli serve a variare lo stimolo e a scaricare le articolazioni. Scegli il carico che ti tiene nel range con tecnica pulita. RPE: cedimento tecnico su macchine, cavi, isolamenti e lat machine; sui multiarticolari (multipower, hack squat, stacco rumeno, hip thrust) fermati una ripetizione prima. Segna 10 solo se non ne avevi un\'altra. Macchine: tieni sempre le stesse; se cambi macchina guarda l\'RPE, non i chili. Leg curl sempre seduto. Carico: stesso peso su tutte le serie; le ripetizioni calano, è normale. Quando la prima serie supera il tetto del range, sali di peso alla seduta dopo. Tempo: discesa in 3" e 1" di pausa nel punto di massima contrazione (o di massimo allungamento su croci e pullover); dal 2 novembre su lat machine, rematori, pec fly, leg curl, leg extension, alzate laterali e spider curl. Recuperi: multiarticolari 2-2,5 minuti, isolamenti 60-90", superset 90" dopo la coppia. Drop set (a fine serie togli circa il 20% del carico e continui subito fino al cedimento, conta come una serie): dal 2 novembre solo sull\'ultima serie di pec fly (lunedì), leg extension (martedì) e alzate laterali ai cavi (giovedì); se il recupero peggiora, si sospendono. Braccia: bicipiti e tricipiti a 6 serie ciascuno a settimana (3 martedì, 3 venerdì), uno di allungamento e uno di accorciamento per muscolo. Segna a ogni seduta carichi, ripetizioni, RPE e una riga sul sonno. Versione ridotta (turno lungo o meno di 5 ore di sonno): non saltare, mantieni gli esercizi principali e togli una serie agli isolamenti; se sei a pezzi fai solo gli esercizi 1 e 2. Niente scarico a metà blocco: checkpoint lunedì 2 novembre (carichi, costanza, sonno; calorie ora in mantenimento a step). Se i carichi calano per due sedute di fila, il sonno va sotto le 6 ore, compaiono dolori articolari o cala la motivazione: prima si riduce il cedimento, poi si toglie volume o si anticipa lo scarico.',

/* Blocchi futuri (non ancora attivabili): anteprima informativa fedele al piano PDF.
   L'ex voce "Impostazione" è stata rimossa da qui perché ora è una scheda vera
   (Blocco 2 — Giorno A/B) e comparirebbe due volte, come testo statico e come
   scheda reale caricata da Firestore. Stesso discorso ora per il Blocco 3: è
   diventato una scheda vera (in stand-by, vedi BLOCCO3_SCHEDA_IDS), quindi
   l'anteprima generica "Progressione" è stata rimossa per non duplicarla —
   la card di stand-by in Allenamento mostra già l'avanzamento reale. */
const PROSSIMI_BLOCCHI = [];

/* ============ STAND-BY BLOCCO 3 ============
   Il Blocco 3 è già presente nel catalogo schede (per i dettagli degli
   esercizi, vedi SCHEDE_DEFAULT) ma resta bloccato finché non si completa la
   12ª seduta del Blocco 2: lo sblocco è legato alle sedute fatte, non al
   calendario. Il cambio del piano alimentare è un secondo trigger, distinto
   e successivo: scatta solo quando l'utente avvia davvero il primo
   allenamento del Blocco 3 (non quando il Blocco 3 si sblocca). */
const BLOCCO3_SCHEDA_IDS = ['blocco3a','blocco3b','blocco3c','blocco3d'];
const BLOCCO3_SEDUTE_SBLOCCO = 12;
/* Piano di massa (dal 03/11/2026): sostituisce il Blocco 3. Sempre disponibile. */
const MASSA_SCHEDA_IDS = ['massa1','massa2','massa3','massa4'];

/* Gruppi di schede chiusi a mano (blocco concluso senza aspettare la scadenza
   a calendario): trattati da schedaScaduta() come "passati", non più
   avviabili. Chiudere il Blocco 2 sblocca anche il Blocco 3. */
const BLOCCHI_CHIUSI = ['blocco2','blocco3'];

function blocco3Sbloccato(){
  return BLOCCHI_CHIUSI.includes('blocco2') || sessioniGruppo('blocco2').length >= BLOCCO3_SEDUTE_SBLOCCO;
}

/* Vero dal momento in cui l'utente avvia la prima sessione su una scheda del
   Blocco 3 (avviaSessione imposta blocchiIniziati[schedaId]): è questo,
   esplicitamente, "il primo giorno del Blocco 3" che fa scattare il nuovo
   piano alimentare — non lo sblocco in sé, non una data di calendario. */
function blocco3Attivo(){
  return BLOCCO3_SCHEDA_IDS.concat(MASSA_SCHEDA_IDS).some(id => !!blocchiIniziati[id]);
}

/* Catalogo schede reale, caricato da Firestore (collection "schede").
   Al primissimo avvio in assoluto, se la collection è vuota, viene popolata
   con SCHEDE_DEFAULT: da quel momento in poi le schede vivono su Firestore,
   non più hardcoded qui, cosi' un trainer puo' modificarle/assegnarle per utente. */
let SCHEDE = [];

async function caricaCatalogoSchede(){
  try{
    const snap = await db.collection('schede').get();
    if(snap.empty){
      const batch = db.batch();
      SCHEDE_DEFAULT.forEach(s=>{
        const ref = db.collection('schede').doc(s.id);
        batch.set(ref, s);
      });
      await batch.commit();
      SCHEDE = SCHEDE_DEFAULT.slice();
    } else {
      SCHEDE = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    }
  }catch(e){
    // Se Firestore non è raggiungibile (es. offline in palestra) usa il catalogo di default in memoria
    SCHEDE = SCHEDE_DEFAULT.slice();
  }
  // Il Blocco 3 vive nel codice (SCHEDE_DEFAULT) e prevale sempre su quanto
  // eventualmente salvato su Firestore: così ogni aggiornamento della scheda
  // arriva con l'app, senza dover rilanciare script dalla console.
  BLOCCO3_SCHEDA_IDS.concat(MASSA_SCHEDA_IDS).forEach(id=>{
    const def = SCHEDE_DEFAULT.find(x=>x.id===id);
    if(!def) return;
    const idx = SCHEDE.findIndex(x=>x.id===id);
    if(idx>=0) SCHEDE[idx] = def; else SCHEDE.push(def);
  });
}
